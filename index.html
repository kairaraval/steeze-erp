/* Pull all known attachments for a sampling job and let the user pick which ones to forward to Printing. */
function SendSampleToPrintingModal({ sample, lead, onClose, onSent }){
  const [available,setAvailable]=useState([]);
  const [picked,setPicked]=useState(new Set());
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [note,setNote]=useState('');

  useEffect(()=>{
    let on=true;
    (async()=>{
      try{
        const all=[];
        // 1) Lead-level attachments
        if(lead && Array.isArray(lead.attachments)){
          lead.attachments.forEach((a,i)=>{ if(a) all.push({ ...a, _src:'Lead', _key:'lead-'+i }); });
        }
        // 2) Sample's own attachments column (in case it gets added later)
        if(Array.isArray(sample.attachments)){
          sample.attachments.forEach((a,i)=>{ if(a) all.push({ ...a, _src:'Sample', _key:'sample-'+i }); });
        }
        // 3) Activity-thread attachments on this sample
        const { data:acts, error:aerr } = await sb.from('dept_job_activity')
          .select('id,text,attachments,attachment,created_at')
          .eq('job_id', sample.id).eq('job_type','sampling')
          .order('created_at',{ ascending:true });
        if(aerr) throw aerr;
        (acts||[]).forEach(a=>{
          const list = Array.isArray(a.attachments)&&a.attachments.length ? a.attachments : (a.attachment?[a.attachment]:[]);
          list.forEach((att,j)=>{ if(att) all.push({ ...att, _src:'Activity', _key:'act-'+a.id+'-'+j }); });
        });
        // Dedupe by url/path
        const seen=new Set(); const out=[];
        all.forEach(a=>{ const k=String(a.url||a.path||a.name||''); if(!k){ out.push(a); return; } if(!seen.has(k)){ seen.add(k); out.push(a); } });
        if(on){ setAvailable(out); setLoading(false); }
      }catch(e){ if(on){ setErr('Could not load attachments: '+(e.message||e)); setLoading(false); } }
    })();
    return ()=>{on=false;};
  },[sample.id]);

  function toggle(k){ setPicked(p=>{ const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n; }); }
  function pickAll(){ setPicked(new Set(available.map(a=>a._key))); }
  function pickNone(){ setPicked(new Set()); }

  async function send(){
    if(picked.size===0 && !confirm('No files selected. Send to Printing anyway?')) return;
    setBusy(true); setErr('');
    try{
      const atts = available.filter(a=>picked.has(a._key)).map(({ _src, _key, ...rest })=>rest);
      const payload = {
        number: 'PR-P-'+Date.now().toString().slice(-5),
        source_job_id: sample.id,
        lead_id: sample.lead_id||null,
        client_name: sample.client_name||'',
        item: sample.item||'',
        items: sample.items||[],
        quantity: sample.quantity||0,
        attachments: atts,
        status: 'to do',
        due_date: sample.due_date||null,
        notes: (note? note+'\n\n':'')+'Sent from Sampling '+(sample.number||'')
      };
      const { error } = await sb.from('printing_jobs').insert(payload);
      if(error) throw error;
      setBusy(false);
      onSent(atts.length);
    }catch(e){ setBusy(false); setErr(e.message||String(e)); }
  }

  return (
    <Modal title="🖨 Send to Printing" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="rounded-lg bg-slate-50 border p-3 text-sm">
          <div className="font-semibold">{sample.item||'—'} · {sample.client_name||'—'}</div>
          <div className="text-xs text-slate-500 mt-0.5">Sample {sample.number||''}{sample.quantity?` · ${sample.quantity} pcs`:''}{sample.due_date?` · due ${fmtDate(sample.due_date)}`:''}</div>
        </div>
        <div>
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
            <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
              Attachments to send {available.length>0 && <span className="text-slate-400">({picked.size}/{available.length} selected)</span>}
            </div>
            {available.length>0 && (
              <div className="flex gap-2 text-xs">
                <button type="button" onClick={pickAll} className="text-indigo-600 hover:underline">Select all</button>
                <span className="text-slate-300">·</span>
                <button type="button" onClick={pickNone} className="text-slate-500 hover:underline">Clear</button>
              </div>
            )}
          </div>
          {loading && <div className="text-sm text-slate-400 p-6 text-center border rounded-lg">Loading attachments…</div>}
          {!loading && available.length===0 && (
            <div className="text-sm text-slate-500 p-6 border rounded-lg text-center bg-slate-50">
              No attachments found on this sample, its lead, or the activity thread.<br/>
              <span className="text-xs">You can still send the card to Printing — it will arrive without files.</span>
            </div>
          )}
          {!loading && available.length>0 && (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-[55vh] overflow-y-auto pr-1">
              {available.map(a=>{
                const checked=picked.has(a._key);
                const srcColor = a._src==='Lead'?'bg-blue-100 text-blue-700':a._src==='Activity'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700';
                return (
                  <button type="button" key={a._key} onClick={()=>toggle(a._key)} className={`text-left border rounded-lg overflow-hidden bg-white hover:bg-slate-50 transition ${checked?'ring-2 ring-indigo-500 border-indigo-500':'border-slate-200'}`}>
                    <div className="relative">
                      <AttachmentChip att={a} />
                      <div className={`absolute top-1 left-1 w-5 h-5 rounded border-2 flex items-center justify-center text-xs font-bold ${checked?'bg-indigo-600 border-indigo-600 text-white':'bg-white/90 border-slate-300'}`}>{checked?'✓':''}</div>
                    </div>
                    <div className="p-2 text-[11px]">
                      <div className="font-medium truncate" title={a.name}>{a.name||'attachment'}</div>
                      <div className="mt-1"><span className={`inline-block text-[9px] uppercase px-1.5 py-0.5 rounded font-semibold ${srcColor}`}>{a._src}</span></div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        <div>
          <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Note for Printing (optional)</div>
          <textarea className="input min-h-[60px]" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Sublimation only, use Pantone 186C for red panels" />
        </div>
        {err && <div className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded p-2">{err}</div>}
        <div className="flex justify-end gap-2 pt-3 border-t">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-slate-600 text-sm">Cancel</button>
          <button disabled={busy||loading} onClick={send} className="px-4 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700 disabled:opacity-50">{busy?'Sending…':`🖨 Send ${picked.size} file${picked.size===1?'':'s'} to Printing`}</button>
        </div>
      </div>
    </Modal>
  );
}

function SamplingJobForm({ existing, leads, onClose, onSaved }){
  const isEdit=!!existing;
  const [f,setF]=useState(existing||{ client_name:'', item:'', quantity:0, status:'endorsed', due_date:'', notes:'', lead_id:null });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  async function save(){ if(!f.client_name && !f.item){ setMsg('Client or item required.'); return; } setBusy(true); setMsg('');
    const payload={ client_name:f.client_name||'', item:f.item||'', quantity:Number(f.quantity)||0, status:f.status, due_date:f.due_date||null, notes:f.notes||'', lead_id:f.lead_id||null };
    if(!isEdit) payload.number='SMP-'+Date.now().toString().slice(-5);
    const { error } = isEdit ? await sb.from('sampling_jobs').update(payload).eq('id',existing.id) : await sb.from('sampling_jobs').insert(payload);
    setBusy(false); if(error){ setMsg(error.message); return; } onSaved(); }
  return (
    <Modal title={isEdit?'Edit sample job':'New sample job'} onClose={onClose}>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Client"><input className="input" value={f.client_name} onChange={e=>up('client_name',e.target.value)} /></TpLbl>
          <TpLbl t="Item"><input className="input" value={f.item} onChange={e=>up('item',e.target.value)} /></TpLbl>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Quantity"><input type="number" className="input" value={f.quantity} onChange={e=>up('quantity',e.target.value)} /></TpLbl>
          <TpLbl t="Due date"><input type="date" className="input" value={f.due_date||''} onChange={e=>up('due_date',e.target.value)} /></TpLbl>
          <TpLbl t="Status"><select className="input" value={f.status} onChange={e=>up('status',e.target.value)}>{SAMPLING_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></TpLbl>
        </div>
        <TpLbl t="Link to lead (optional)"><select className="input" value={f.lead_id||''} onChange={e=>up('lead_id',e.target.value||null)}><option value="">—</option>{leads.map(l=><option key={l.id} value={l.id}>{l.title}</option>)}</select></TpLbl>
        <TpLbl t="Notes"><textarea className="input min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save':'Create sample job')}</button>
      </div>
    </Modal>
  );
}

/* ----------------------- Inbox ----------------------- */
function Inbox({ profile, profiles, leads, graphicJobs, printingJobs, productionJobs, sampleJobs, mentions, onOpen, onGoToTask }){
  const [filter,setFilter]=useState('all');
  const unread=mentions.filter(m=>!(m.read_by||[]).includes(profile.id));
  const visible=filter==='unread'?unread:mentions;
  function ctx(m){
    if(m.source==='lead'){ const l=leads.find(x=>x.id===m.lead_id); return { label:l?.title||'a lead', tag:'Lead', cta:'Open lead' }; }
    const list=m.job_type==='graphic'?graphicJobs:m.job_type==='printing'?printingJobs:m.job_type==='sampling'?sampleJobs:productionJobs;
    const j=list.find(x=>x.id===m.job_id);
    const tag=m.job_type==='graphic'?'Graphic Design':m.job_type==='printing'?'Printing':m.job_type==='sampling'?'Sampling':'Production';
    return { label:j?`${j.item} · ${j.client_name}`:'a job', tag, cta:'Open job' };
  }
  return (
    <div className="p-6 max-w-3xl mx-auto">
      <div className="flex items-center justify-between mb-4"><div><h1 className="text-2xl font-bold">📥 Inbox</h1><p className="text-slate-500 text-sm">{unread.length?`${unread.length} unread`:'All caught up.'}</p></div>
        <div className="inline-flex rounded border bg-slate-100 p-0.5 text-xs"><button onClick={()=>setFilter('all')} className={`px-3 py-1 rounded ${filter==='all'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>All ({mentions.length})</button><button onClick={()=>setFilter('unread')} className={`px-3 py-1 rounded ${filter==='unread'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Unread ({unread.length})</button></div>
      </div>
      <div className="space-y-2">
        {visible.length===0 && <div className="text-center py-12 border rounded-xl border-dashed bg-white text-slate-400"><div className="text-3xl mb-2">📭</div><div className="text-sm">Nothing here. Mentions with @{firstName(profile)} show up here.</div></div>}
        {visible.map(m=>{ const sender=profiles.find(p=>p.id===m.actor_id); const c=ctx(m); const isUnread=!(m.read_by||[]).includes(profile.id); return (
          <div key={m.id+m.source} className={`bg-white border rounded-xl p-4 hover:shadow-md flex items-start gap-3 ${isUnread?'border-l-4 border-l-indigo-500 bg-indigo-50/30':''}`}>
            <Avatar profile={sender} />
            <div className="flex-1 min-w-0">
              <div className="flex items-baseline gap-2 flex-wrap"><span className="font-semibold text-sm">{sender?.name}</span><span className="text-xs text-slate-500">mentioned you</span>{isUnread && <span className="text-[9px] uppercase px-1.5 py-0.5 rounded bg-indigo-600 text-white font-bold">new</span>}<span className="text-xs text-slate-400 ml-auto">{fmtTime(m.created_at)}</span></div>
              <div className="text-xs text-slate-500 mt-0.5"><span className="inline-block mr-1.5 text-[9px] uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold">{c.tag}</span>on <strong className="text-slate-700">{c.label}</strong></div>
              <div className="mt-2 text-sm text-slate-700 whitespace-pre-wrap">{renderCommentText(m.text, profiles)}</div>
              <div className="mt-3 flex items-center gap-2">
                <button onClick={()=>onGoToTask(m)} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">→ {c.cta}</button>
                <button onClick={()=>onOpen(m)} className="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">💬 View thread</button>
              </div>
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

/* ----------------------- Pipeline ----------------------- */
function Pipeline({ profile, profiles, clients, leads, activityCounts, onOpenLead, onNew, reload, onOpenTechpack }){
  const [mineOnly,setMineOnly]=useState(true); const [search,setSearch]=useState('');
  const [importing,setImporting]=useState(false);
  const [layout,setLayout]=useState(()=>{ try{ return localStorage.getItem('pipelineLayout')||'board'; }catch(e){ return 'board'; } });
  function changeLayout(v){ setLayout(v); try{ localStorage.setItem('pipelineLayout',v); }catch(e){} }
  const [collapsed,setCollapsed]=useState({}); // stage.key -> true if collapsed
  function toggleCollapsed(k){ setCollapsed(p=>({...p,[k]:!p[k]})); }
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  // Admin-only: pick which manager's pipeline to view.
  //   '' = use the mineOnly toggle behaviour (default)
  //   'all' = every manager
  //   <profile id> = that specific manager
  const [managerFilter,setManagerFilter]=useState('');
  const selectedMgr = managerFilter && managerFilter!=='all' ? profiles.find(p=>p.id===managerFilter) : null;
  const salesPeople = profiles.filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const clientName=(id)=>clients.find(c=>c.id===id)?.company||'—';
  function ownerMatch(l){
    if(isAdmin && managerFilter==='all') return true;
    if(isAdmin && managerFilter) return l.manager_id===managerFilter;
    return mineOnly ? l.manager_id===profile.id : true;
  }
  const visible=leads.filter(l=>ownerMatch(l) && (!search || `${l.title} ${clientName(l.client_id)}`.toLowerCase().includes(search.toLowerCase())));
  async function move(l,st){ const patch={ stage:st }; if(SOLD_STAGES.includes(st) && !l.won_at) patch.won_at=new Date().toISOString().slice(0,10); if(st==='delivered_paid') patch.payment_status='paid'; const {error}=await sb.from('leads').update(patch).eq('id',l.id); if(error){ alert(error.message); return; } await sb.from('lead_activity').insert({ lead_id:l.id, actor_id:profile.id, type:'system', text:`Moved to "${stageMeta(st).label}"` }); reload(); }
  async function del(l){ if(!confirm('Delete this lead?')) return; const {error}=await sb.from('leads').delete().eq('id',l.id); if(error){ alert(error.message); return; } reload(); }
  return (
    <div>
      <div className="sticky top-0 z-20 bg-slate-100/95 backdrop-blur border-b border-slate-200 px-6 pt-5 pb-3">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 className="text-2xl font-bold text-slate-900">Sales Pipeline</h1>
            <p className="text-slate-500 text-sm">
              {selectedMgr
                ? <>Viewing <span className="font-semibold text-slate-700">{selectedMgr.name||selectedMgr.email}'s</span> pipeline</>
                : (isAdmin && managerFilter==='all')
                  ? 'Viewing all managers — every active lead, every stage.'
                  : 'Active pipeline across all stages. Click a card to view client details.'}
            </p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search leads…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-52" />
            <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm" title="View style">
              <button onClick={()=>changeLayout('board')} className={`px-3 py-1.5 rounded-md ${layout==='board'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>▦ Board</button>
              <button onClick={()=>changeLayout('list')} className={`px-3 py-1.5 rounded-md ${layout==='list'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>☰ List</button>
            </div>
            {isAdmin ? (
              <select value={managerFilter} onChange={e=>setManagerFilter(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300 bg-white whitespace-nowrap">
                <option value="">My leads only</option>
                <option value="all">All managers</option>
                <option disabled>──────────</option>
                {salesPeople.map(p=>(<option key={p.id} value={p.id}>{p.name||p.email}</option>))}
              </select>
            ) : (
              <label className="flex items-center gap-1.5 text-sm text-slate-600 bg-white border rounded-lg px-3 py-2 whitespace-nowrap"><input type="checkbox" checked={mineOnly} onChange={e=>setMineOnly(e.target.checked)} /> My leads only</label>
            )}
            {isAdmin && <button onClick={()=>setImporting(true)} className="px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50 whitespace-nowrap">⇪ Import CSV</button>}
            <button onClick={onNew} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 whitespace-nowrap">+ New lead</button>
          </div>
        </div>
      </div>
      {layout==='board' && (
      <div className="flex gap-3 overflow-x-auto px-6 pt-4 pb-4">{STAGES.map(st=>{ const col=visible.filter(l=>l.stage===st.key); const colTotal=col.reduce((s,l)=>s+(Number(l.value)||0),0); return (

            <span className="text-xs text-slate-500">{col.length} · {peso(colTotal)}</span>
          </div>
          <div className="bg-slate-100/70 rounded-b-xl border border-t-0 p-2 space-y-2 min-h-[140px]">{col.map(l=>{ const mgr=profiles.find(p=>p.id===l.manager_id); const canEdit=isAdmin||isAssistant||l.manager_id===profile.id; return (
            <div key={l.id} className="bg-white border rounded-xl p-3 shadow-sm">
              <div className="flex items-start justify-between gap-2">
                <button onClick={()=>onOpenLead(l)} className="text-left min-w-0 flex-1"><div className="font-semibold text-sm leading-tight text-slate-900 truncate">{l.title}</div><div className="text-xs text-slate-500 truncate">{clientName(l.client_id)}</div></button>
                <Avatar profile={mgr} size="sm" />
              </div>
              <div className="flex items-center justify-between mt-2"><span className="text-sm font-bold text-slate-900">{peso(l.value)}</span><span className="text-xs text-slate-400">{l.expected_close?fmtDate(l.expected_close):''}</span></div>
              <div className="flex items-center gap-1 mt-2">
                {canEdit ? <select value={l.stage} onChange={e=>move(l,e.target.value)} className="text-xs border rounded-md px-2 py-1 flex-1 bg-white">{STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
                  : <div className="text-xs flex-1 px-2 py-1 rounded-md bg-slate-50 text-slate-500">{stageMeta(l.stage).label}</div>}
                <button onClick={()=>onOpenLead(l)} title="Attachments / details" className="text-slate-400 hover:text-indigo-600 text-xs px-1 relative">📎{(l.attachments||[]).length>0 && <span className="text-[9px] text-indigo-600 font-semibold">{l.attachments.length}</span>}</button>

              {onOpenTechpack && <button onClick={(e)=>{e.stopPropagation(); onOpenTechpack(l);}} className="w-full mt-1 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold">📋 {l.techpack ? 'Techpack' : 'Create techpack'}</button>}

        </div>
      ); })}</div>
      )}

      {layout==='list' && (

        const col=visible.filter(l=>l.stage===st.key);
        const colTotal=col.reduce((s,l)=>s+(Number(l.value)||0),0);
        const stageTextColor = st.key==='qualified'?'text-blue-700':st.key==='proposal'?'text-indigo-700':st.key==='negotiation'?'text-amber-700':st.key==='sampling'?'text-purple-700':st.key==='won'?'text-emerald-700':st.key==='lost'?'text-rose-700':st.key==='delivered_pending'?'text-amber-700':st.key==='delivered_paid'?'text-emerald-700':'text-slate-700';
        const stagePillBg  = st.key==='qualified'?'bg-blue-100':st.key==='proposal'?'bg-indigo-100':st.key==='negotiation'?'bg-amber-100':st.key==='sampling'?'bg-purple-100':st.key==='won'?'bg-emerald-100':st.key==='lost'?'bg-rose-100':st.key==='delivered_pending'?'bg-amber-100':st.key==='delivered_paid'?'bg-emerald-100':'bg-slate-100';
        const isCollapsed=!!collapsed[st.key];
        return (
          <div key={st.key} className="bg-white rounded-xl border overflow-hidden">
            <button onClick={()=>toggleCollapsed(st.key)} className="w-full flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 border-b">
              <span className={`text-slate-400 text-xs transition-transform inline-block ${isCollapsed?'-rotate-90':''}`}>▼</span>
              <span className={`inline-flex items-center px-2.5 py-0.5 rounded-md ${stagePillBg} ${stageTextColor} text-xs font-bold uppercase tracking-wide`}>{st.label}</span>
              <span className="text-slate-500 text-sm font-semibold">{col.length}</span>
              {colTotal>0 && <span className="text-slate-400 text-xs">· {peso(colTotal)}</span>}
            </button>
            {!isCollapsed && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 text-[10px] uppercase text-slate-400">
                    <tr>
                      <th className="text-left px-4 py-2 font-medium">Name</th>
                      <th className="text-left px-3 py-2 font-medium">Company</th>
                      <th className="text-left px-3 py-2 font-medium">Items</th>
                      <th className="text-right px-3 py-2 font-medium">Qty</th>
                      <th className="text-right px-3 py-2 font-medium">Value</th>
                      <th className="text-left px-3 py-2 font-medium">Assignee</th>
                      <th className="text-left px-3 py-2 font-medium">Stage</th>
                      <th className="px-3 py-2"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {col.map(l=>{

                      const canEdit=isAdmin||isAssistant||l.manager_id===profile.id;
                      const attCount=(l.attachments||[]).length;
                      const items=l.items||[];
                      const firstItem=items[0];
                      const itemSummary=firstItem ? (firstItem.itemType||'—')+(items.length>1?` +${items.length-1}`:'') : '—';
                      const totalQty=items.reduce((s,it)=>s+(Number(it.quantity)||0),0);
                      return (
                        <tr key={l.id} className="border-t hover:bg-slate-50 group">
                          <td className="px-4 py-2.5">
                            <button onClick={()=>onOpenLead(l)} className="text-left flex items-center gap-1.5 min-w-0">
                              <span className={`w-2.5 h-2.5 rounded-full border-2 ${stageTextColor.replace('text-','border-')}`}></span>
                              <span className="font-medium text-slate-900 truncate" title={l.title}>{l.title}</span>
                              {attCount>0 && <span className="text-slate-400 text-xs whitespace-nowrap" title={attCount+' attachment'+(attCount===1?'':'s')}>📎{attCount}</span>}
                              {l.techpack && <span className="text-teal-600 text-xs" title="Has techpack">📋</span>}
                              {activityCounts[l.id]>0 && <span className="text-slate-400 text-xs whitespace-nowrap">💬{activityCounts[l.id]}</span>}
                            </button>
                          </td>
                          <td className="px-3 py-2.5 text-slate-600 truncate max-w-[180px]" title={clientName(l.client_id)}>{clientName(l.client_id)}</td>
                          <td className="px-3 py-2.5 text-slate-600 text-xs">{firstItem ? <span className="inline-block px-2 py-0.5 rounded bg-pink-100 text-pink-700 font-medium">{itemSummary}</span> : <span className="text-slate-300">—</span>}</td>
                          <td className="px-3 py-2.5 text-right text-slate-700 whitespace-nowrap">{totalQty>0 ? totalQty : <span className="text-slate-300">—</span>}</td>
                          <td className="px-3 py-2.5 text-right font-bold text-slate-900 whitespace-nowrap">{l.value?peso(l.value):<span className="text-slate-300 font-normal">—</span>}</td>
                          <td className="px-3 py-2.5">{mgr ? <div className="flex items-center gap-1.5 min-w-0"><Avatar profile={mgr} size="sm" /><span className="text-xs text-slate-600 truncate max-w-[100px]">{mgr.name||mgr.email}</span></div> : <span className="text-slate-300 text-xs">— Unassigned</span>}</td>
                          <td className="px-3 py-2.5">
                            {canEdit ? <select value={l.stage} onChange={e=>move(l,e.target.value)} className="text-xs border rounded px-2 py-1 bg-white min-w-[110px]">{STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
                              : <span className={`text-xs px-2 py-1 rounded font-medium ${stagePillBg} ${stageTextColor}`}>{stageMeta(l.stage).label}</span>}
                          </td>
                          <td className="px-3 py-2.5 text-right whitespace-nowrap">
                            <button onClick={()=>onOpenLead(l)} className="text-xs text-indigo-600 hover:underline mr-2">Open</button>
                            {onOpenTechpack && <button onClick={()=>onOpenTechpack(l)} className="text-xs text-teal-700 hover:underline mr-2">📋</button>}
                            {canEdit && !isAssistant && <button onClick={()=>del(l)} title="Delete" className="text-xs text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100">✕</button>}
                          </td>
                        </tr>
                      );
                    })}
                    {col.length===0 && (
                      <tr><td colSpan="8" className="text-center text-slate-300 text-xs py-3">— no leads in this stage —</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}</div>
      )}
      {importing && <LeadImportModal profiles={profiles} clients={clients} onClose={()=>setImporting(false)} onDone={()=>{ setImporting(false); reload(); }} />}
    </div>
  );
}

function LeadImportModal({ profiles, clients, onClose, onDone }){
  const [csv,setCsv]=useState(''); const [parsed,setParsed]=useState(null);
  const [step,setStep]=useState('paste'); // paste | preview | importing | done
  const [results,setResults]=useState(null); const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState({ done:0, total:0 });

  // ClickUp → ERP email mapping (override here if a teammate registered with a different address).
  const EMAIL_MAP = {
    'kairadimatulac@gmail.com'      : 'kaira.raval@steeze.com.ph',
    'salesmary.steezecorp@gmail.com': 'steezecorp.mary@gmail.com',
  };
  // ClickUp status → ERP stage
  const STAGE_MAP = {
    'lead in':'new','contacted':'new',
    'existing sample req.':'qualified','follow-up':'qualified',
    'quotation sent':'proposal',
    'negotiation':'negotiation','on hold':'negotiation',
    'for sampling (techpack )':'sampling','for sampling (techpack)':'sampling',
    'sample/revision':'sampling','for graphic design works':'sampling',
    'done deal! (techpack)':'won','for production':'won',
    'delivered - for payment':'delivered_pending',
    'delivered and paid':'delivered_paid','delivered & paid':'delivered_paid','paid':'delivered_paid',
    'closed- lost':'lost','closed - lost':'lost',
  };

  function onFile(e){ const f=e.target.files && e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>setCsv(String(r.result||'')); r.readAsText(f); }
  function getVal(row, hdr, ...candidates){
    for(const c of candidates){ const idx=hdr.indexOf(c.toLowerCase()); if(idx>=0 && row[idx]!=null && String(row[idx]).trim()!=='') return String(row[idx]).trim(); }
    return '';
  }
  function doParse(){
    const rows=parseCSV(csv.trim());
    if(rows.length<2){ alert('Need a header row + at least one data row.'); return; }
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    // We need at least Task ID OR Task Name to anchor each row.
    if(!headers.some(h=>h==='task id'||h==='id'||h==='task name'||h==='name')){
      alert('CSV needs at least a "Task ID" or "Task Name" column.'); return;
    }
    setParsed({ headers, dataRows:rows.slice(1) });
    setStep('preview');
  }

  function findClient(name){
    if(!name) return null;
    const n=name.toLowerCase().trim();
    const exact=(clients||[]).find(c=>String(c.company||'').toLowerCase().trim()===n);
    if(exact) return exact;
    return (clients||[]).find(c=>String(c.company||'').toLowerCase().trim().startsWith(n)) || null;
  }
  function findManager(ownerCell){
    if(!ownerCell) return null;
    // Owner cell may be an email, a name, or a comma-separated multi-assignee list. Try email first, then name.
    const parts=String(ownerCell).split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    for(const p of parts){
      const lc=p.toLowerCase();
      const mapped=EMAIL_MAP[lc]||lc;
      const byEmail=(profiles||[]).find(pr=>String(pr.email||'').toLowerCase()===mapped);
      if(byEmail) return byEmail;
      // try name LIKE
      const byName=(profiles||[]).find(pr=>String(pr.name||'').toLowerCase().includes(lc) || lc.includes(String(pr.name||'').toLowerCase().split(' ')[0]));
      if(byName) return byName;
    }
    return null;
  }
  function parseDate(s){
    if(!s) return null; const t=String(s).trim(); if(!t||t==='null') return null;
    // Accept YYYY-MM-DD, MM/DD/YYYY, or ms-since-epoch
    if(/^\d+$/.test(t)){ const ms=Number(t); if(ms>1e10) return new Date(ms).toISOString().slice(0,10); }
    const d=new Date(t); if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
    return null;
  }
  function parseTitle(name){
    if(!name) return { company:'', title:'' };
    let s=String(name).trim();
    // Strip leading "20XX-XXX |" production prefix
    s=s.replace(/^\s*20\d{2}-\d{2,5}\s*\|\s*/i,'');
    const parts=s.split(/\s*\|\s*/);
    if(parts.length===1) return { company:'', title:parts[0].trim() };
    return { company:parts[0].trim(), title:parts.slice(1).join(' | ').trim() };
  }

  async function doImport(){
    setBusy(true); setStep('importing');
    const { headers, dataRows } = parsed;
    let inserted=0, updated=0; const errors=[];
    setProgress({ done:0, total:dataRows.length });

    for(let i=0;i<dataRows.length;i++){
      const r=dataRows[i];
      try {
        const taskId=getVal(r,headers,'task id','id','custom id');
        const nameCol=getVal(r,headers,'task name','name');
        const { company, title }=parseTitle(nameCol);
        const explicitCompany=getVal(r,headers,'company name','company','client');
        const finalCompany=explicitCompany||company;
        const status=getVal(r,headers,'status').toLowerCase();
        const stage=STAGE_MAP[status]||'new';
        const due=parseDate(getVal(r,headers,'due date'));
        const startDue=parseDate(getVal(r,headers,'sample due date'));
        const owner=getVal(r,headers,'sales owner','assignees','assignee');
        const productType=getVal(r,headers,'product type');
        const productCategory=getVal(r,headers,'product category');
        const qty=Number(getVal(r,headers,'est. qnty','est qty','estimated quantity','quantity'))||0;
        const unitPrice=Number(getVal(r,headers,'unit price','price'))||0;
        const totalAmt=Number(getVal(r,headers,'total amount','total'))||(qty*unitPrice);
        const poNumber=getVal(r,headers,'po number','po');
        const techpackNo=getVal(r,headers,'prod form no.','prod form no','techpack number','techpack no');
        const client=findClient(finalCompany);
        const manager=findManager(owner);

        const items = (productType || productCategory || qty || unitPrice) ? [{
          itemType: productType||'',
          category: productCategory||'',
          quantity: qty,
          pricePerItem: unitPrice,
          withVat: false,
          lineTotal: qty*unitPrice
        }] : [];

        const payload = {
          title: title||nameCol||'(untitled)',
          stage,
          value: totalAmt,
          subtotal_amount: totalAmt,
          expected_close: due,
          delivery_date: startDue,
          client_id: client ? client.id : null,
          manager_id: manager ? manager.id : null,
          po_number: poNumber,
          techpack_number: techpackNo,
          items,
        };

        if(taskId){
          // upsert by clickup_id
          const { data:existing, error:selErr }=await sb.from('leads').select('id').eq('clickup_id', taskId).maybeSingle();
          if(selErr) throw selErr;
          if(existing){
            const { error }=await sb.from('leads').update(payload).eq('id', existing.id);
            if(error) throw error; updated++;
          } else {
            const { error }=await sb.from('leads').insert({ ...payload, clickup_id:taskId });
            if(error) throw error; inserted++;
          }
        } else {
          const { error }=await sb.from('leads').insert(payload);
          if(error) throw error; inserted++;
        }
      } catch(er){ errors.push(`Row ${i+2}: ${er.message||er}`); }
      setProgress({ done:i+1, total:dataRows.length });
    }
    setResults({ inserted, updated, total:dataRows.length, errors });
    setStep('done'); setBusy(false);
  }

  return (
    <Modal title="Import Leads from ClickUp CSV" onClose={onClose} wide>
      {step==='paste' && (
        <div className="space-y-3">
          <div className="bg-slate-50 border rounded-lg p-3 text-xs text-slate-700">
            <div className="font-semibold mb-1">How to export from ClickUp:</div>
            <ol className="list-decimal pl-4 space-y-0.5 mb-2">
              <li>Open the <b>Active Sales Pipeline</b> list in ClickUp.</li>
              <li>Click the <b>"..."</b> menu (top-right of the list) → <b>Export view → CSV</b>.</li>
              <li>Open the CSV (or just upload it directly here).</li>
            </ol>
            <div className="font-semibold mt-2 mb-1">Columns the importer reads (case-insensitive):</div>
            <div className="leading-relaxed">
              <code className="bg-white px-1 rounded border">Task ID</code>, <code className="bg-white px-1 rounded border">Task Name</code>, <code className="bg-white px-1 rounded border">Status</code>, <code className="bg-white px-1 rounded border">Due Date</code>, <code className="bg-white px-1 rounded border">Sample Due Date</code>, <code className="bg-white px-1 rounded border">Sales Owner</code>, <code className="bg-white px-1 rounded border">Company Name</code>, <code className="bg-white px-1 rounded border">Product Type</code>, <code className="bg-white px-1 rounded border">Product Category</code>, <code className="bg-white px-1 rounded border">Est. Qnty</code>, <code className="bg-white px-1 rounded border">Unit Price</code>, <code className="bg-white px-1 rounded border">Total Amount</code>, <code className="bg-white px-1 rounded border">PO Number</code>, <code className="bg-white px-1 rounded border">Prod Form No.</code>
            </div>
            <div className="mt-2 text-slate-500">Rows with a Task ID that already exists in the ERP are <b>updated</b>; new rows are <b>inserted</b>. Safe to re-run.</div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <label className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50 cursor-pointer">📁 Upload .csv file<input type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onFile} /></label>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide text-slate-500">Or paste CSV here</label>
            <textarea className="input font-mono text-xs" rows="10" value={csv} onChange={e=>setCsv(e.target.value)} placeholder='"Task ID","Task Name","Status",...' />
          </div>
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button><button onClick={doParse} disabled={!csv.trim()} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">Parse →</button></div>
        </div>
      )}

      {step==='preview' && parsed && (
        <div className="space-y-3">
          <div className="text-sm text-slate-700">Found <b>{parsed.dataRows.length}</b> rows. Detected columns: <span className="font-mono text-[10px]">{parsed.headers.join(', ')}</span></div>
          <div className="border rounded-lg overflow-hidden max-h-80 overflow-y-auto"><table className="w-full text-xs">
            <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 sticky top-0"><tr>{parsed.headers.slice(0,8).map(h=><th key={h} className="text-left px-2 py-1.5">{h}</th>)}</tr></thead>
            <tbody>{parsed.dataRows.slice(0,30).map((r,i)=>(
              <tr key={i} className="border-t">{parsed.headers.slice(0,8).map((h,j)=>(<td key={j} className="px-2 py-1 text-slate-700 truncate max-w-[10rem]">{r[j]||''}</td>))}</tr>
            ))}</tbody>
          </table></div>
          {(parsed.dataRows.length>30||parsed.headers.length>8) && <div className="text-xs text-slate-500">Showing first 30 rows × first 8 columns. The importer reads all rows and all relevant columns.</div>}
          <div className="flex justify-between"><button onClick={()=>setStep('paste')} className="px-3 py-2 rounded-lg bg-white border text-sm">← Back</button><button onClick={doImport} disabled={busy} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{busy?'Importing…':`Import / update ${parsed.dataRows.length} leads`}</button></div>
        </div>
      )}

      {step==='importing' && (
        <div className="py-8 text-center space-y-3">
          <div className="text-slate-700 font-semibold">Importing…</div>
          <div className="text-xs text-slate-500">{progress.done} of {progress.total} processed</div>
          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-indigo-600 h-2 rounded-full transition-all" style={{ width:`${progress.total?Math.round(progress.done/progress.total*100):0}%` }}></div></div>
        </div>
      )}

      {step==='done' && results && (
        <div className="space-y-3">
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-800">
            <div className="font-semibold mb-1">Import complete</div>
            <div>✓ Inserted <b>{results.inserted}</b> new lead{results.inserted===1?'':'s'}</div>
            <div>✓ Updated <b>{results.updated}</b> existing lead{results.updated===1?'':'s'}</div>
          </div>
          {results.errors.length>0 && (
            <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-xs text-rose-800 max-h-40 overflow-y-auto">
              <div className="font-semibold mb-1">{results.errors.length} row{results.errors.length===1?'':'s'} had errors:</div>
              <ul className="list-disc pl-4 space-y-0.5">{results.errors.slice(0,30).map((e,i)=><li key={i}>{e}</li>)}</ul>
              {results.errors.length>30 && <div className="mt-1">…and {results.errors.length-30} more.</div>}
            </div>
          )}
          <div className="flex justify-end gap-2"><button onClick={onDone} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Done</button></div>
        </div>
      )}
    </Modal>
  );
}

/* ----------------------- Dashboard ----------------------- */
function Dashboard({ profile, profiles, leads, clients, prodJobs }){
  const mine=leads.filter(l=>l.manager_id===profile.id);
  const open=leads.filter(l=>!CLOSED_STAGES.includes(l.stage));
  const openVal=open.reduce((s,l)=>s+(Number(l.value)||0),0);
  const won=leads.filter(l=>SOLD_STAGES.includes(l.stage));
  const _now=new Date();
  const wonThisMonth=won.filter(l=>{ if(!l.won_at) return false; const d=new Date(l.won_at+'T00:00:00'); return d.getMonth()===_now.getMonth()&&d.getFullYear()===_now.getFullYear(); });
  const wonMonthVal=wonThisMonth.reduce((s,l)=>s+(Number(l.value)||0),0);
  const activeProd=(prodJobs||[]).filter(j=>j.status!=='delivered').length;
  // Per sales owner — won deals this month
  const ownerAgg={};
  wonThisMonth.forEach(l=>{ const k=l.manager_id||'__unassigned__'; if(!ownerAgg[k]) ownerAgg[k]={count:0,total:0}; ownerAgg[k].count++; ownerAgg[k].total+=Number(l.value)||0; });
  const ownerRows=Object.entries(ownerAgg).map(([id,agg])=>({
    name: id==='__unassigned__' ? 'Unassigned' : ((profiles||[]).find(p=>p.id===id)?.name || 'Unknown'),
    ...agg
  })).sort((a,b)=>b.total-a.total);
  // Last 6 months — closed-won totals
  const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(_now.getFullYear(), _now.getMonth()-i, 1); months.push({ key:d.getMonth()+'-'+d.getFullYear(), label:d.toLocaleString('en-PH',{ month:'short' })+' '+String(d.getFullYear()).slice(2), m:d.getMonth(), y:d.getFullYear(), total:0, count:0 }); }
  won.forEach(l=>{ if(!l.won_at) return; const d=new Date(l.won_at+'T00:00:00'); const slot=months.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear()); if(slot){ slot.total+=Number(l.value)||0; slot.count++; } });
  const maxM=Math.max(1,...months.map(m=>m.total));
  const tiles=[
    { label:'Open pipeline value', value:peso(openVal), sub:`${open.length} active leads` },
    { label:'Won this month', value:peso(wonMonthVal), sub:`${wonThisMonth.length} deal${wonThisMonth.length===1?'':'s'} · ${won.length} won all-time` },
    { label:'My leads', value:mine.length, sub:`${mine.filter(l=>!CLOSED_STAGES.includes(l.stage)).length} still open` },
    { label:'In production', value:activeProd, sub:'active jobs' },
  ];
  return (
    <div className="p-6">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Dashboard</h1>
      <p className="text-slate-500 text-sm mb-5">Welcome back, {firstName(profile)}. Here's the live picture.</p>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">{tiles.map((t,i)=>(
        <div key={i} className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase tracking-wide text-slate-400">{t.label}</div><div className="text-2xl font-bold text-slate-900 mt-1">{t.value}</div><div className="text-xs text-slate-500 mt-0.5">{t.sub}</div></div>
      ))}</div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="bg-white border rounded-xl p-4"><div className="font-semibold text-slate-900 mb-2">Pipeline by stage</div>{STAGES.filter(s=>!CLOSED_STAGES.includes(s.key)).map(s=>{ const c=open.filter(l=>l.stage===s.key); const v=c.reduce((a,l)=>a+(Number(l.value)||0),0); return (<div key={s.key} className="flex items-center justify-between py-1.5 border-b last:border-0 text-sm"><span className="text-slate-600">{s.label}</span><span className="text-slate-500">{c.length} · {peso(v)}</span></div>); })}</div>
        <div className="bg-white border rounded-xl p-4"><div className="font-semibold text-slate-900 mb-2">Top clients by value</div>{clients.map(c=>({ c, v:leads.filter(l=>l.client_id===c.id&&SOLD_STAGES.includes(l.stage)).reduce((a,l)=>a+(Number(l.value)||0),0) })).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6).map(({c,v})=>(<div key={c.id} className="flex items-center justify-between py-1.5 border-b last:border-0 text-sm"><span className="text-slate-600">{c.company}</span><span className="font-medium text-slate-800">{peso(v)}</span></div>))}{clients.every(c=>leads.filter(l=>l.client_id===c.id&&SOLD_STAGES.includes(l.stage)).length===0) && <div className="text-xs text-slate-400">No won deals yet.</div>}</div>
      </div>

      {/* New row: per-sales-owner this month + last 6 months bar chart */}
      <div className="grid md:grid-cols-2 gap-4 mt-4">
        <div className="bg-white border rounded-xl p-4">
          <div className="font-semibold text-slate-900 mb-2">Won this month — per sales owner</div>
          <p className="text-[11px] text-slate-400 mb-2">Total value of deals stamped won in the current calendar month, grouped by manager.</p>
          {ownerRows.length===0 && <div className="text-xs text-slate-400 py-2">No won deals this month yet.</div>}
          {ownerRows.map(r=>(
            <div key={r.name} className="flex items-center justify-between py-1.5 border-b last:border-0 text-sm">
              <span className="text-slate-700 font-medium">{r.name}</span>
              <span className="text-slate-500">{r.count} deal{r.count===1?'':'s'} · <span className="text-emerald-700 font-semibold">{peso(r.total)}</span></span>
            </div>
          ))}
          {ownerRows.length>0 && (
            <div className="flex items-center justify-between pt-2 mt-2 border-t-2 text-sm">
              <span className="font-semibold text-slate-700">Team total</span>
              <span className="text-emerald-800 font-bold">{peso(wonMonthVal)}</span>
            </div>
          )}
        </div>
        <div className="bg-white border rounded-xl p-4">
          <div className="font-semibold text-slate-900 mb-3">Closed Won — last 6 months</div>
          <div className="flex items-end gap-3 h-48">{months.map(m=>(
            <div key={m.key} className="flex-1 flex flex-col items-center justify-end gap-1">
              <div className="text-[10px] text-slate-600 font-medium whitespace-nowrap">{m.total?peso(m.total).replace('₱',''):''}</div>
              <div className="w-full bg-emerald-500 rounded-t hover:bg-emerald-600 transition-colors" style={{ height:Math.max(2, (m.total/maxM*100))+'%', minHeight:m.total?'4px':'2px' }} title={`${m.count} deal(s)`}></div>
              <div className="text-[11px] text-slate-500">{m.label}</div>
              <div className="text-[9px] text-slate-400">{m.count?`${m.count}×`:''}</div>
            </div>
          ))}</div>
          <div className="mt-3 pt-2 border-t text-xs text-slate-500 flex justify-between">
            <span>6-month total:</span>
            <span className="font-semibold text-slate-700">{peso(months.reduce((s,m)=>s+m.total,0))}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ----------------------- Clients ----------------------- */
function ClientsView({ profile, profiles, clients, leads, onOpen, reload }){
  const [search,setSearch]=useState(''); const [mgrFilter,setMgrFilter]=useState('');
  const [creating,setCreating]=useState(false);
  const ltv=(cid)=>leads.filter(l=>l.client_id===cid&&SOLD_STAGES.includes(l.stage)).reduce((s,l)=>s+(Number(l.value)||0),0);
  function primaryContact(c){ const list=c.contacts; if(Array.isArray(list)&&list.length>0) return list[0]; if(c.contact||c.email||c.phone) return { name:c.contact||'', email:c.email||'', phone:c.phone||'' }; return null; }
  const rows=clients.filter(c=>{
    const term=search.toLowerCase();
    if(mgrFilter && c.manager_id!==mgrFilter) return false;
    if(!term) return true;
    const pc=primaryContact(c);
    const haystack=[c.company, pc?.name, pc?.email, ...(Array.isArray(c.contacts)?c.contacts.map(x=>x.name+' '+x.email):[])].join(' ').toLowerCase();
    return haystack.includes(term);
  });
  return (
    <div className="p-6">
      <div className="flex items-start justify-between gap-3 flex-wrap mb-4">
        <div>
          <h1 className="text-2xl font-bold text-slate-900 mb-1">Clients</h1>
          <p className="text-slate-500 text-sm">All Steeze clients. Click one to see its leads, contacts and lifetime value.</p>
        </div>
        <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 whitespace-nowrap">+ New client</button>
      </div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search clients…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
        <select value={mgrFilter} onChange={e=>setMgrFilter(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All managers</option>{profiles.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Company</th><th className="text-left px-3 py-2">Primary contact</th><th className="text-left px-3 py-2">Manager</th><th className="text-right px-3 py-2">Leads</th><th className="text-right px-3 py-2">Lifetime value</th></tr></thead>
        <tbody>{rows.map(c=>{ const mgr=profiles.find(p=>p.id===c.manager_id); const cnt=leads.filter(l=>l.client_id===c.id).length; const pc=primaryContact(c); const extra=Array.isArray(c.contacts)&&c.contacts.length>1 ? c.contacts.length-1 : 0; return (
          <tr key={c.id} onClick={()=>onOpen(c)} className="border-t hover:bg-slate-50 cursor-pointer">
            <td className="px-3 py-2 font-medium text-slate-900">{c.company}</td>
            <td className="px-3 py-2 text-slate-600">{pc?.name||'—'}{pc?.email && <div className="text-[11px] text-slate-400">{pc.email}</div>}{extra>0 && <div className="text-[10px] text-indigo-600 font-medium mt-0.5">+{extra} more contact{extra===1?'':'s'}</div>}</td>
            <td className="px-3 py-2"><span className="inline-flex items-center gap-1.5"><Avatar profile={mgr} size="sm" /><span className="text-xs text-slate-600">{mgr?firstName(mgr):'—'}</span></span></td>
            <td className="px-3 py-2 text-right">{cnt}</td>
            <td className="px-3 py-2 text-right font-semibold text-emerald-700">{peso(ltv(c.id))}</td>
          </tr>
        ); })}{rows.length===0 && <tr><td colSpan="5" className="text-center text-slate-400 py-8">No clients yet. Click "+ New client" above to add one.</td></tr>}</tbody>
      </table></div></div>
      {creating && <ClientEditForm profile={profile} onClose={()=>setCreating(false)} onSaved={()=>{ setCreating(false); reload && reload(); }} />}
    </div>
  );
}
function ClientEditForm({ client, profile, onClose, onSaved }){
  const isEdit=!!client;
  // Build initial contacts: existing array, or migrate legacy fields, or one empty row.
  const initialContacts = (()=>{
    if(client && Array.isArray(client.contacts) && client.contacts.length>0) return client.contacts.map((c,i)=>({...c, id:'c'+i}));
    if(client && (client.contact||client.email||client.phone)) return [{ id:'c0', name:client.contact||'', role:'', email:client.email||'', phone:client.phone||'' }];
    return [{ id:'c0', name:'', role:'', email:'', phone:'' }];
  })();
  const [f,setF]=useState({ company:client?.company||'', industry:client?.industry||'', address:client?.address||'', tags:(client?.tags||[]).join(', '), notes:client?.notes||'' });
  const [contacts,setContacts]=useState(initialContacts);
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setContact(idx,k,v){ setContacts(arr=>arr.map((c,i)=>i===idx?{...c,[k]:v}:c)); }
  function addContact(){ setContacts(arr=>[...arr,{ id:'c'+Date.now(), name:'', role:'', email:'', phone:'' }]); }
  function removeContact(idx){ setContacts(arr=>arr.length===1?[{ id:'c'+Date.now(), name:'', role:'', email:'', phone:'' }]:arr.filter((_,i)=>i!==idx)); }
  function moveToPrimary(idx){ setContacts(arr=>{ const next=[...arr]; const [c]=next.splice(idx,1); next.unshift(c); return next; }); }
  async function save(){ if(!f.company.trim()){ setMsg('Company is required.'); return; } setBusy(true); setMsg('');
    const tags=f.tags.split(',').map(t=>t.trim()).filter(Boolean);
    const cleanContacts = contacts.map(({id,...rest})=>({ name:(rest.name||'').trim(), role:(rest.role||'').trim(), email:(rest.email||'').trim(), phone:(rest.phone||'').trim() })).filter(c=>c.name||c.email||c.phone);
    const primary = cleanContacts[0] || { name:'', email:'', phone:'' };
    const payload = {
      company: f.company.trim(),
      contact: primary.name,    // legacy fields kept in sync with primary contact
      email:   primary.email,
      phone:   primary.phone,
      industry: f.industry.trim(),
      address:  f.address.trim(),
      tags, notes:f.notes,
      contacts: cleanContacts,
    };
    if(isEdit){
      const {error}=await sb.from('clients').update(payload).eq('id',client.id);
      setBusy(false); if(error){ setMsg(error.message); return; } onSaved&&onSaved();
    } else {
      const insertPayload = { ...payload, manager_id: profile?.id || null };
      const {error}=await sb.from('clients').insert(insertPayload);
      setBusy(false); if(error){ setMsg(error.message); return; } onSaved&&onSaved();
    }
  }
  return (
    <Modal title={isEdit?'Edit client':'New client'} onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Company *"><input className="input" value={f.company} onChange={e=>up('company',e.target.value)} placeholder="Acme Corp" /></TpLbl>
          <TpLbl t="Industry"><input className="input" value={f.industry} onChange={e=>up('industry',e.target.value)} /></TpLbl>
        </div>
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-slate-700">Contacts <span className="text-slate-400 font-normal">· first row is the primary contact</span></div>
            <button onClick={addContact} className="text-xs text-indigo-600 hover:underline font-medium">+ Add contact</button>
          </div>
          <div className="space-y-2">{contacts.map((c,idx)=>(
            <div key={c.id} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-end">
              <div className="col-span-3"><label className="text-[10px] text-slate-500 uppercase">Name {idx===0 && <span className="text-indigo-600">· primary</span>}</label><input className="input mt-0.5" value={c.name} onChange={e=>setContact(idx,'name',e.target.value)} placeholder="Drew Siapco" /></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Role</label><input className="input mt-0.5" value={c.role||''} onChange={e=>setContact(idx,'role',e.target.value)} placeholder="HR / Procurement" /></div>
              <div className="col-span-3"><label className="text-[10px] text-slate-500 uppercase">Email</label><input className="input mt-0.5" value={c.email} onChange={e=>setContact(idx,'email',e.target.value)} placeholder="drew@acme.com" /></div>
              <div className="col-span-3"><label className="text-[10px] text-slate-500 uppercase">Phone</label><input className="input mt-0.5" value={c.phone} onChange={e=>setContact(idx,'phone',e.target.value)} placeholder="+63 917…" /></div>
              <div className="col-span-1 flex flex-col items-end gap-1">
                {idx>0 && <button title="Make primary" onClick={()=>moveToPrimary(idx)} className="text-slate-400 hover:text-indigo-600 text-xs">↑</button>}
                <button onClick={()=>removeContact(idx)} className="text-rose-400 hover:text-rose-600 text-sm">✕</button>
              </div>
            </div>
          ))}</div>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Address"><input className="input" value={f.address} onChange={e=>up('address',e.target.value)} /></TpLbl>
          <TpLbl t="Tags (comma-separated)"><input className="input" value={f.tags} onChange={e=>up('tags',e.target.value)} placeholder="VIP, repeat" /></TpLbl>
        </div>
        <TpLbl t="Notes"><textarea className="input min-h-[60px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save changes':'Create client')}</button>
      </div>
    </Modal>
  );
}

/* ----------------------- My Profile ----------------------- */
function ProfileView({ profile, leads, clients, profiles, reload, onSendToPR }){
  const mine=leads.filter(l=>l.manager_id===profile.id);
  const won=mine.filter(l=>SOLD_STAGES.includes(l.stage));
  async function setPayment(l,val){ const {error}=await sb.from('leads').update({ payment_status:val }).eq('id',l.id); if(error){ alert(error.message); return; } reload&&reload(); }
  const payAgg=PAYMENT_OPTS.map(p=>{ const rows=won.filter(l=>(l.payment_status||'unpaid')===p.key); return { ...p, count:rows.length, total:rows.reduce((s,l)=>s+(Number(l.value)||0),0) }; });
  const wonTotal=won.reduce((s,l)=>s+(Number(l.value)||0),0);
  const open=mine.filter(l=>!CLOSED_STAGES.includes(l.stage));
  const wonVal=won.reduce((s,l)=>s+(Number(l.value)||0),0);
  const openVal=open.reduce((s,l)=>s+(Number(l.value)||0),0);
  // Won this month — sum of won deals whose won_at falls in the current calendar month.
  const _now=new Date();
  const wonThisMonth=won.filter(l=>{ if(!l.won_at) return false; const d=new Date(l.won_at+'T00:00:00'); return d.getMonth()===_now.getMonth()&&d.getFullYear()===_now.getFullYear(); });
  const wonMonthVal=wonThisMonth.reduce((s,l)=>s+(Number(l.value)||0),0);
  // last 6 months won totals
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({ key:d.getMonth()+'-'+d.getFullYear(), label:d.toLocaleString('en-PH',{ month:'short' }), m:d.getMonth(), y:d.getFullYear(), total:0 }); }
  won.forEach(l=>{ if(!l.won_at) return; const d=new Date(l.won_at+'T00:00:00'); const slot=months.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear()); if(slot) slot.total+=Number(l.value)||0; });
  const maxM=Math.max(1,...months.map(m=>m.total));
  const clientName=(id)=>clients.find(c=>c.id===id)?.company||'—';
  return (
    <div className="p-6">
      <div className="flex items-center gap-3 mb-5"><Avatar profile={profile} /><div><h1 className="text-2xl font-bold text-slate-900">{profile.name}</h1><p className="text-slate-500 text-sm">{profile.role==='admin'?'Administrator':profile.role==='assistant'?'Sales Assistant':'Sales Manager'} · {profile.email}</p></div></div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Open pipeline</div><div className="text-2xl font-bold mt-1">{peso(openVal)}</div><div className="text-xs text-slate-500">{open.length} leads</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Won this month</div><div className="text-2xl font-bold mt-1 text-emerald-700">{peso(wonMonthVal)}</div><div className="text-xs text-slate-500">{wonThisMonth.length} deal{wonThisMonth.length===1?'':'s'}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Won (all-time)</div><div className="text-2xl font-bold mt-1 text-emerald-700">{peso(wonVal)}</div><div className="text-xs text-slate-500">{won.length} deals</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">My leads</div><div className="text-2xl font-bold mt-1">{mine.length}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Win rate</div><div className="text-2xl font-bold mt-1">{mine.length?Math.round(won.length/mine.length*100):0}%</div></div>
      </div>
      <div className="bg-white border rounded-xl p-4 mb-6"><div className="font-semibold text-slate-900 mb-3">Won sales — last 6 months</div>
        <div className="flex items-end gap-3 h-40">{months.map(m=>(<div key={m.key} className="flex-1 flex flex-col items-center justify-end gap-1"><div className="text-[10px] text-slate-500">{m.total?peso(m.total).replace('₱',''):''}</div><div className="w-full bg-indigo-500 rounded-t" style={{ height:(m.total/maxM*100)+'%', minHeight:m.total?'4px':'0' }}></div><div className="text-[11px] text-slate-500">{m.label}</div></div>))}</div>
      </div>
      <div className="bg-white border rounded-xl p-4">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div className="font-semibold text-slate-900">Closed Won deals</div>
          <div className="flex items-center gap-2 flex-wrap text-xs">{payAgg.map(p=>(<span key={p.key} className={`px-2 py-1 rounded-full font-medium ${p.chip}`}>{p.label}: <strong>{p.count}</strong> · {peso(p.total)}</span>))}</div>
        </div>
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="text-[11px] uppercase text-slate-400 border-b"><tr><th className="text-left py-2 pr-3">Date won</th><th className="text-left py-2 pr-3">Client</th><th className="text-left py-2 pr-3">Lead</th><th className="text-right py-2 pr-3">Amount</th><th className="text-left py-2">Payment</th></tr></thead>
          <tbody>{won.map(l=>{ const mgr=profiles?profiles.find(p=>p.id===l.manager_id):null; const pm=payMeta(l.payment_status); return (
            <tr key={l.id} className="border-b last:border-0">
              <td className="py-2 pr-3 text-slate-600 align-top">{fmtDate(l.won_at)}</td>
              <td className="py-2 pr-3 align-top"><div className="font-medium text-slate-800">{clientName(l.client_id)}</div>{mgr && <div className="text-xs text-slate-400">{mgr.name}</div>}</td>
              <td className="py-2 pr-3 align-top"><div className="text-slate-700">{l.title}</div></td>
              <td className="py-2 pr-3 text-right font-bold text-slate-900 align-top">{peso(l.value)}</td>
              <td className="py-2 align-top"><select value={l.payment_status||'unpaid'} onChange={e=>setPayment(l,e.target.value)} className={`text-xs px-2 py-1 rounded-lg border font-medium cursor-pointer ${pm.sel}`}>{PAYMENT_OPTS.map(p=><option key={p.key} value={p.key}>{p.label}</option>)}</select></td>
            </tr>
          ); })}{won.length===0 && <tr><td colSpan="5" className="text-center text-slate-400 py-4">No closed-won deals yet.</td></tr>}</tbody>

/* ----------------------- Team Overview ----------------------- */
function TeamOverview({ profile, profiles, leads, clients, pendingInvites, reload }){
  const isAdmin = profile && profile.role==='admin';
  const rows=profiles.map(p=>{ const mine=leads.filter(l=>l.manager_id===p.id); const won=mine.filter(l=>SOLD_STAGES.includes(l.stage)); const open=mine.filter(l=>!CLOSED_STAGES.includes(l.stage)); return { p, total:mine.length, openVal:open.reduce((s,l)=>s+(Number(l.value)||0),0), wonVal:won.reduce((s,l)=>s+(Number(l.value)||0),0), wonCount:won.length }; }).sort((a,b)=>b.wonVal-a.wonVal);

  const [inviteEmail,setInviteEmail]=useState('');
  const [inviteRole,setInviteRole]=useState('manager');
  const [inviteNote,setInviteNote]=useState('');
  const [inviting,setInviting]=useState(false);
  const [msg,setMsg]=useState('');
  const [copied,setCopied]=useState('');
  const [editingNameId,setEditingNameId]=useState(null);
  const [draftName,setDraftName]=useState('');
  const [viewingMember,setViewingMember]=useState(null);
  const appUrl = typeof window!=='undefined' ? window.location.origin : '';

  async function changeName(p){
    const n=(draftName||'').trim();
    if(!n){ alert('Name cannot be empty.'); return; }
    const { error } = await sb.from('profiles').update({ name:n }).eq('id', p.id);
    if(error){ alert(error.message); return; }
    setEditingNameId(null); setDraftName(''); reload && reload();
  }

  const roleLabel = (r) => r==='admin'?'Administrator' : r==='assistant'?'Sales Assistant' : 'Sales Manager';
  const roleBadge = (r) => {
    const cls = r==='admin'?'bg-indigo-100 text-indigo-700' : r==='assistant'?'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
    return <span className={`text-[9px] px-1.5 py-0.5 rounded ${cls}`}>{roleLabel(r)}</span>;
  };

  async function sendInvite(e){
    e.preventDefault();
    if(!inviteEmail.trim()){ setMsg('Enter an email.'); return; }
    setInviting(true); setMsg('');
    const payload = { email: inviteEmail.trim().toLowerCase(), role: inviteRole, invited_by: profile.id, note: inviteNote.trim() };
    const { error } = await sb.from('pending_invites').upsert(payload, { onConflict:'email' });
    setInviting(false);
    if(error){ setMsg(error.message); return; }
    setInviteEmail(''); setInviteNote(''); setInviteRole('manager');
    setMsg(`Invite ready for ${payload.email}. Share the link below — when they sign up with that email, they'll be a ${roleLabel(payload.role)} automatically.`);
    reload && reload();
  }

  async function cancelInvite(email){
    if(!confirm(`Cancel invite for ${email}?`)) return;
    const { error } = await sb.from('pending_invites').delete().eq('email', email);
    if(error){ alert(error.message); return; }
    reload && reload();
  }

  async function changeRole(p, newRole){
    if(p.id===profile.id && newRole!=='admin'){ if(!confirm("You're about to remove your own admin access. Continue?")) return; }
    const { error } = await sb.from('profiles').update({ role:newRole }).eq('id', p.id);
    if(error){ alert(error.message); return; }
    reload && reload();
  }

  function copyTo(target, value){
    if(!navigator.clipboard){ alert(value); return; }
    navigator.clipboard.writeText(value).then(()=>{ setCopied(target); setTimeout(()=>setCopied(''),1500); });
  }

  const inviteMessage = (email) => `Hi — you're invited to Steeze ERP.\n\n1. Open ${appUrl}\n2. Click "Create one"\n3. Register with this email: ${email}\n\nYou'll be set up automatically and land in your dashboard. Any questions, ping me.`;

  return (
    <div className="p-6 space-y-6">
      <div>
        <h1 className="text-2xl font-bold text-slate-900 mb-1">Team Overview</h1>
        <p className="text-slate-500 text-sm">Every manager's numbers, side by side.{isAdmin && ' Invite teammates and assign roles below.'}</p>
      </div>

      {isAdmin && (
        <div className="bg-white border rounded-xl p-4">
          <div className="font-semibold text-slate-900 mb-1">Invite someone new</div>
          <p className="text-xs text-slate-500 mb-3">Pre-assign their role here. When they self-register with this email, they'll automatically get that role.</p>
          <form onSubmit={sendInvite} className="grid md:grid-cols-12 gap-2 items-end">
            <div className="md:col-span-5"><label className="text-[10px] uppercase tracking-wide text-slate-500">Email</label><input className="input" type="email" placeholder="them@steeze.com" value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} /></div>
            <div className="md:col-span-3"><label className="text-[10px] uppercase tracking-wide text-slate-500">Role</label>
              <select className="input" value={inviteRole} onChange={e=>setInviteRole(e.target.value)}>
                <option value="admin">Administrator</option>
                <option value="manager">Sales Manager</option>
                <option value="assistant">Sales Assistant</option>
              </select>
            </div>
            <div className="md:col-span-3"><label className="text-[10px] uppercase tracking-wide text-slate-500">Note (optional)</label><input className="input" placeholder="e.g. CRO, started June 1" value={inviteNote} onChange={e=>setInviteNote(e.target.value)} /></div>
            <div className="md:col-span-1"><button type="submit" disabled={inviting} className="w-full px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">{inviting?'…':'Invite'}</button></div>
          </form>
          {msg && <div className="mt-3 text-xs text-slate-600 bg-slate-50 border rounded-lg p-2">{msg}</div>}

          <div className="mt-4 grid md:grid-cols-2 gap-3 text-xs">
            <div className="bg-slate-50 border rounded-lg p-3">
              <div className="font-semibold text-slate-700 mb-1">Sign-up link</div>
              <div className="flex items-center gap-2"><code className="flex-1 bg-white border rounded px-2 py-1 text-[11px] truncate">{appUrl}</code><button type="button" onClick={()=>copyTo('url',appUrl)} className="px-2 py-1 rounded bg-white border hover:bg-slate-100 text-[11px]">{copied==='url'?'Copied':'Copy'}</button></div>
            </div>
            <div className="bg-slate-50 border rounded-lg p-3">
              <div className="font-semibold text-slate-700 mb-1">Invite message template</div>
              <div className="flex items-center gap-2"><span className="flex-1 text-[11px] text-slate-500 truncate">Pre-filled with the URL + their email.</span><button type="button" onClick={()=>copyTo('msg',inviteMessage(inviteEmail||'their.email@steeze.com'))} className="px-2 py-1 rounded bg-white border hover:bg-slate-100 text-[11px]">{copied==='msg'?'Copied':'Copy message'}</button></div>
            </div>
          </div>
        </div>
      )}

      {isAdmin && pendingInvites && pendingInvites.length>0 && (
        <div className="bg-white border rounded-xl p-4">
          <div className="font-semibold text-slate-900 mb-2">Pending invites <span className="text-xs text-slate-500 font-normal">· {pendingInvites.length}</span></div>
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1.5">Email</th><th className="text-left py-1.5">Role on signup</th><th className="text-left py-1.5">Note</th><th className="text-left py-1.5">Invited</th><th className="text-right py-1.5">Actions</th></tr></thead>
            <tbody>{pendingInvites.map(inv=>(
              <tr key={inv.email} className="border-t">
                <td className="py-1.5 text-slate-800 font-medium">{inv.email}</td>
                <td className="py-1.5">{roleBadge(inv.role)}</td>
                <td className="py-1.5 text-slate-500">{inv.note||'—'}</td>
                <td className="py-1.5 text-xs text-slate-500">{inv.created_at?fmtDate(inv.created_at):''}</td>
                <td className="py-1.5 text-right space-x-2">
                  <button onClick={()=>copyTo('inv-'+inv.email, inviteMessage(inv.email))} className="text-xs px-2 py-1 rounded bg-slate-100 hover:bg-slate-200">{copied===('inv-'+inv.email)?'Copied':'Copy invite'}</button>
                  <button onClick={()=>cancelInvite(inv.email)} className="text-xs px-2 py-1 rounded bg-rose-50 text-rose-600 hover:bg-rose-100">Cancel</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>
        </div>
      )}

      <div className="bg-white rounded-xl border overflow-hidden">
        <div className="px-4 py-3 border-b font-semibold text-slate-900">Team members</div>
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr>
            <th className="text-left px-3 py-2">Name</th>
            <th className="text-left px-3 py-2">Role</th>
            <th className="text-right px-3 py-2">Total leads</th>
            <th className="text-right px-3 py-2">Open value</th>
            <th className="text-right px-3 py-2">Won deals</th>
            <th className="text-right px-3 py-2">Won value</th>
            <th className="text-right px-3 py-2">Actions</th>
          </tr></thead>
          <tbody>{rows.map(({p,total,openVal,wonVal,wonCount})=>(
            <tr key={p.id} className="border-t hover:bg-slate-50/60">
              <td className="px-3 py-2">
                <div className="flex items-center gap-2"><Avatar profile={p} size="sm" />
                  {editingNameId===p.id ? (
                    <div className="flex items-center gap-1">
                      <input autoFocus value={draftName} onChange={e=>setDraftName(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') changeName(p); if(e.key==='Escape'){ setEditingNameId(null); setDraftName(''); } }} className="text-xs px-2 py-1 rounded border border-indigo-300 bg-white w-44" placeholder="Real name (used for @mentions)" />
                      <button onClick={()=>changeName(p)} className="text-xs px-2 py-1 rounded bg-emerald-600 text-white hover:bg-emerald-700">Save</button>
                      <button onClick={()=>{ setEditingNameId(null); setDraftName(''); }} className="text-xs px-2 py-1 rounded text-slate-500 hover:bg-slate-100">Cancel</button>

                    <>
                      <button onClick={()=>setViewingMember(p)} className="font-medium text-slate-800 hover:text-indigo-700 hover:underline">{p.name||p.email.split('@')[0]}</button>

                    </>

                    <option value="admin">Administrator</option>
                    <option value="manager">Sales Manager</option>

      {viewingMember && <MemberProfileModal member={viewingMember} leads={leads} clients={clients} onClose={()=>setViewingMember(null)} />}
