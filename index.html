// Reports + planning over Sprint 1 + 2 data. No new tables.
//   • Payment Calendar (forward look at what's due)
//   • P&L Summary (Revenue − COGS − Opex = Net Income)
//   • BIR Tax Helpers (VAT summary + 2307 generation)

// Pre-filled PH BIR monthly deadlines. These show on every month of the calendar
// so you never miss filing dates. Day = day of month.
const BIR_DEADLINES = [
  { day:10, label:'BIR 1601-C (WHT on Compensation)',   detail:'Filing & payment due — withholding tax on salaries from previous month' },
  { day:12, label:'BIR 2550M (Monthly VAT Return)',     detail:'Monthly VAT declaration & payment (covering previous month sales)' },
  { day:20, label:'BIR 1601-EQ / 1601-FQ',              detail:'Quarterly expanded / final withholding tax (if quarter-end month)' },
  { day:25, label:'BIR 2550Q / 1701Q (Quarterly)',      detail:'Quarterly VAT return / income tax return (if quarter-end month)' },
];


/* ─────────── PAYMENT CALENDAR ─────────── */
function PaymentCalendarView({ profile, salesOrders, rfps, budgetRequests, vouchers, suppliers }){
  const today = new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth()); // 0-indexed
  const [selectedDay,setSelectedDay]=useState(null);
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;

  // Build events for the month. Each event has: day, type, direction, amount, label, status, raw
  const events = [];
  // SO expected deliveries → expected money in
  salesOrders.filter(s=> s.expected_delivery && (s.expected_delivery||'').startsWith(monthKey) && s.status!=='cancelled')
    .forEach(s => events.push({
      day: parseInt((s.expected_delivery||'').slice(8,10),10),
      type:'so', direction:'in', amount:Number(s.balance_due||0), label:`${s.client_name||''} · ${s.number}`,
      status: s.status==='paid'?'paid':(s.status==='partial'?'partial':'open'), raw:s,
    }));
  // RFPs due dates → money out
  rfps.filter(r=> r.due_date && (r.due_date||'').startsWith(monthKey) && r.status!=='rejected')
    .forEach(r => events.push({
      day: parseInt((r.due_date||'').slice(8,10),10),
      type:'rfp', direction:'out', amount:Number(r.amount||0), label:`${r.supplier_name||''} · ${r.number}`,
      status: r.status==='paid'?'paid':(r.status==='approved'?'approved':'pending'), raw:r,
    }));
  // Approved budgets with date_needed
  budgetRequests.filter(b=> b.status==='approved' && b.date_needed && (b.date_needed||'').startsWith(monthKey))
    .forEach(b => events.push({
      day: parseInt((b.date_needed||'').slice(8,10),10),
      type:'budget', direction:'out', amount:Number(b.amount||0), label:`${b.department||''} · ${b.purpose||''}`,
      status:'approved', raw:b,
    }));
  // Vouchers released this month (historical paid items)
  vouchers.filter(v=> v.date && (v.date||'').startsWith(monthKey))
    .forEach(v => events.push({
      day: parseInt((v.date||'').slice(8,10),10),
      type:'voucher', direction:'out', amount:Number(v.amount||0), label:`${v.payee||''} · ${v.number}`,
      status:'paid', raw:v,
    }));
  // BIR deadlines — every month gets these. They are zero-amount reminders.
  BIR_DEADLINES.forEach(d=> events.push({
    day:d.day, type:'bir', direction:'out', amount:0, label:`📋 ${d.label}`, status:'pinned', raw:d,
  }));

  // Group by day
  const byDay = {};
  events.forEach(e => { if(!byDay[e.day]) byDay[e.day]=[]; byDay[e.day].push(e); });

  // Month grid
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  // pad to weeks of 7
  while(cells.length%7!==0) cells.push(null);

  function nav(dir){
    let y=year, m=month+dir;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    setYear(y); setMonth(m); setSelectedDay(null);
  }
  function gotoToday(){ setYear(today.getFullYear()); setMonth(today.getMonth()); setSelectedDay(today.getDate()); }

  const totalIn = events.filter(e=>e.direction==='in').reduce((s,e)=>s+e.amount, 0);
  const totalOut = events.filter(e=>e.direction==='out').reduce((s,e)=>s+e.amount, 0);
  const monthName = new Date(year, month).toLocaleString('en-PH',{ month:'long', year:'numeric' });
  const isToday = (d)=> d===today.getDate() && month===today.getMonth() && year===today.getFullYear();

  function dayCellColor(d){
    if(!d) return 'bg-slate-50';
    if(selectedDay===d) return 'bg-indigo-100 border-indigo-400';
    if(isToday(d)) return 'bg-amber-50 border-amber-300';
    const evs = byDay[d]||[];
    if(evs.some(e=>e.type!=='bir' && e.direction==='out' && e.status!=='paid')) return 'bg-rose-50/60 hover:bg-rose-100';
    if(evs.some(e=>e.type!=='bir' && e.direction==='in')) return 'bg-emerald-50/60 hover:bg-emerald-100';
    if(evs.length>0) return 'bg-white hover:bg-slate-50';
    return 'bg-white hover:bg-slate-50';
  }

  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl font-bold">🗓 Payment Calendar</h1>
            <p className="text-slate-500 text-sm">{monthName} · Expected in <strong className="text-emerald-700">{peso(totalIn)}</strong> · Expected out <strong className="text-rose-700">{peso(totalOut)}</strong></p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>nav(-1)} className="px-3 py-1.5 rounded-lg bg-white border text-sm font-semibold hover:bg-slate-50">‹ Prev</button>
            <button onClick={gotoToday} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Today</button>
            <button onClick={()=>nav(1)} className="px-3 py-1.5 rounded-lg bg-white border text-sm font-semibold hover:bg-slate-50">Next ›</button>
          </div>
        </div>
      </div>

      {/* Legend */}
      <div className="flex items-center gap-4 mb-3 text-xs flex-wrap">
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded bg-emerald-200"></span> Money in</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded bg-rose-200"></span> Money out (unpaid)</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded bg-amber-300"></span> Today</span>
        <span className="flex items-center gap-1">📋 BIR deadline</span>
      </div>

      {/* Calendar grid */}
      <div className="bg-white rounded-xl border overflow-hidden">
        <div className="grid grid-cols-7 bg-slate-50 text-[10px] uppercase font-bold text-slate-500 text-center py-2 border-b">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7">
          {cells.map((d,i)=>{
            const evs = d ? (byDay[d]||[]) : [];
            const dayIn = evs.filter(e=>e.direction==='in').reduce((s,e)=>s+e.amount,0);
            const dayOut = evs.filter(e=>e.direction==='out' && e.type!=='bir').reduce((s,e)=>s+e.amount,0);
            return (
              <div key={i} onClick={()=>d && setSelectedDay(d)} className={`min-h-[110px] p-1.5 border-r border-b last:border-r-0 cursor-pointer transition ${dayCellColor(d)}`}>
                {d && (
                  <>
                    <div className={`text-xs font-bold mb-1 ${isToday(d)?'text-amber-700':'text-slate-600'}`}>{d}</div>
                    <div className="space-y-0.5">
                      {evs.slice(0,3).map((e,j)=>(
                        <div key={j} className={`text-[10px] truncate px-1 py-0.5 rounded ${e.type==='bir'?'bg-purple-100 text-purple-800':e.direction==='in'?'bg-emerald-200/80 text-emerald-900':e.status==='paid'?'bg-slate-200 text-slate-500 line-through':'bg-rose-200/80 text-rose-900'}`} title={e.label}>
                          {e.amount>0 && <span className="font-bold">{e.direction==='in'?'+':'−'}{peso(e.amount).replace('₱','')}</span>} {e.label}
                        </div>
                      ))}
                      {evs.length>3 && <div className="text-[10px] text-slate-500 px-1">+{evs.length-3} more</div>}
                    </div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Selected day detail */}
      {selectedDay && (
        <div className="mt-4 bg-white border-2 border-indigo-300 rounded-xl p-4">
          <div className="flex items-center justify-between mb-3">
            <div className="font-bold text-slate-800">{new Date(year, month, selectedDay).toLocaleDateString('en-PH',{ weekday:'long', month:'long', day:'numeric', year:'numeric' })}</div>
            <button onClick={()=>setSelectedDay(null)} className="text-xs text-slate-400 hover:text-slate-700">Close ✕</button>
          </div>
          {(byDay[selectedDay]||[]).length===0 ? (
            <div className="text-sm text-slate-400">Nothing scheduled this day.</div>
          ) : (
            <table className="w-full text-sm">
              <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1">Type</th><th className="text-left py-1">Description</th><th className="text-left py-1">Status</th><th className="text-right py-1">Amount</th></tr></thead>
              <tbody>{(byDay[selectedDay]||[]).map((e,i)=>(
                <tr key={i} className="border-t">
                  <td className="py-1.5"><span className={`text-[10px] font-bold uppercase px-1.5 py-0.5 rounded ${e.type==='bir'?'bg-purple-100 text-purple-700':e.type==='so'?'bg-emerald-100 text-emerald-700':e.type==='rfp'?'bg-amber-100 text-amber-700':e.type==='budget'?'bg-blue-100 text-blue-700':'bg-slate-100 text-slate-700'}`}>{e.type==='so'?'SO':e.type==='rfp'?'RFP':e.type==='budget'?'Budget':e.type==='voucher'?'Voucher':'BIR'}</span></td>
                  <td className="py-1.5">{e.label}</td>
                  <td className="py-1.5"><span className={`text-[10px] uppercase px-1.5 py-0.5 rounded ${e.status==='paid'?'bg-emerald-100 text-emerald-700':e.status==='approved'?'bg-blue-100 text-blue-700':e.status==='pinned'?'bg-purple-100 text-purple-700':'bg-amber-100 text-amber-700'}`}>{e.status}</span></td>
                  <td className={`py-1.5 text-right font-semibold ${e.direction==='in'?'text-emerald-700':e.amount>0?'text-rose-700':'text-slate-400'}`}>{e.amount>0?(e.direction==='in'?'+':'−')+peso(e.amount):'—'}</td>
                </tr>
              ))}</tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}


/* ─────────── P&L SUMMARY ─────────── */
function PnLView({ salesOrders, soPayments, orders, expenses, vouchers, bankTransactions }){
  const today = new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [mode,setMode]=useState('month'); // 'month' | 'ytd'
  const [month,setMonth]=useState(today.getMonth()); // 0-indexed
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const yearKey = `${year}-`;

  // Helper: does a date string fall within the current selection?
  function inRange(d){
    if(!d) return false;
    return mode==='ytd' ? d.startsWith(String(year)) : d.startsWith(monthKey);
  }

  // Revenue — we use SOs delivered in the period as the revenue trigger (accrual).
  // If delivered_at is not set, fall back to date (helpful while you're adopting).
  const revenueSOs = salesOrders.filter(s => s.status!=='cancelled' && inRange(s.delivered_at || s.date));
  const revenue = revenueSOs.reduce((s,o)=>s+Number(o.total||0), 0);

  // COGS — PO totals for POs received in the period (subtotal only, VAT we get back).
  // If a PO has vat_enabled, COGS is total/1.12 (back out VAT); otherwise total.
  const cogsPOs = orders.filter(o => o.status!=='draft' && o.status!=='cancelled' && inRange(o.received_at || o.date));
  const cogs = cogsPOs.reduce((s,o)=>{
    const tot = Number(o.total||0);
    return s + (o.vat_enabled ? tot/1.12 : tot);
  }, 0);

  // Opex — expenses by category for the period
  const opexExpenses = expenses.filter(e => inRange(e.date));
  const opex = opexExpenses.reduce((s,e)=>s+Number(e.amount||0), 0);
  const byCat = {};
  opexExpenses.forEach(e=>{ const c=e.category||'Other'; byCat[c]=(byCat[c]||0)+Number(e.amount||0); });
  const sortedCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  const grossProfit = revenue - cogs;
  const netIncome = grossProfit - opex;
  const grossMargin = revenue>0 ? (grossProfit/revenue*100) : 0;
  const netMargin = revenue>0 ? (netIncome/revenue*100) : 0;

  // Cash receipts vs cash payments in period (cash basis, derived from bank txns)
  const cashIn = bankTransactions.filter(t => t.direction==='in' && inRange(t.date)).reduce((s,t)=>s+Number(t.amount||0), 0);
  const cashOut = bankTransactions.filter(t => t.direction==='out' && inRange(t.date)).reduce((s,t)=>s+Number(t.amount||0), 0);
  const cashNet = cashIn - cashOut;

  const monthName = new Date(year, month).toLocaleString('en-PH',{ month:'long', year:'numeric' });

  function Row({ label, value, bold, color, sub, indent }){
    return (
      <tr className={bold?'border-t-2 border-b-2 border-slate-300':'border-t'}>
        <td className={`py-2 ${indent?'pl-6':''} ${bold?'font-extrabold uppercase text-xs tracking-wider':'text-slate-700'} ${color||''}`}>{label}{sub && <span className="text-[10px] text-slate-400 ml-2 normal-case font-normal">{sub}</span>}</td>
        <td className={`py-2 text-right ${bold?'font-extrabold text-base':'font-semibold'} ${color||''}`}>{peso(value)}</td>
      </tr>
    );
  }

  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl font-bold">📊 P&L Summary</h1>
            <p className="text-slate-500 text-sm">{mode==='month'?monthName:`Year ${year} (YTD)`} · {revenueSOs.length} delivered SOs · {opexExpenses.length} expenses</p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-xs">
              <button onClick={()=>setMode('month')} className={`px-3 py-1 rounded-md ${mode==='month'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Month</button>
              <button onClick={()=>setMode('ytd')} className={`px-3 py-1 rounded-md ${mode==='ytd'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>YTD</button>
            </div>
            {mode==='month' && (
              <select className="input text-xs py-1.5 w-32" value={month} onChange={e=>setMonth(parseInt(e.target.value,10))}>
                {['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=><option key={m} value={i}>{m}</option>)}
              </select>
            )}
            <select className="input text-xs py-1.5 w-24" value={year} onChange={e=>setYear(parseInt(e.target.value,10))}>
              {[today.getFullYear(), today.getFullYear()-1, today.getFullYear()-2].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
      </div>

      {/* Big numbers */}
      <div className="grid md:grid-cols-4 gap-3 mb-4">
        <div className="bg-emerald-50 border-2 border-emerald-200 rounded-xl p-4"><div className="text-[10px] uppercase font-bold tracking-widest text-emerald-700">Revenue</div><div className="text-2xl font-extrabold text-emerald-800 mt-1">{peso(revenue)}</div></div>
        <div className="bg-rose-50 border-2 border-rose-200 rounded-xl p-4"><div className="text-[10px] uppercase font-bold tracking-widest text-rose-700">COGS</div><div className="text-2xl font-extrabold text-rose-800 mt-1">{peso(cogs)}</div></div>
        <div className="bg-amber-50 border-2 border-amber-200 rounded-xl p-4"><div className="text-[10px] uppercase font-bold tracking-widest text-amber-700">Opex</div><div className="text-2xl font-extrabold text-amber-800 mt-1">{peso(opex)}</div></div>
        <div className={`border-2 rounded-xl p-4 ${netIncome>=0?'bg-indigo-50 border-indigo-200':'bg-slate-100 border-slate-300'}`}><div className={`text-[10px] uppercase font-bold tracking-widest ${netIncome>=0?'text-indigo-700':'text-slate-600'}`}>Net Income</div><div className={`text-2xl font-extrabold mt-1 ${netIncome>=0?'text-indigo-800':'text-rose-700'}`}>{peso(netIncome)}</div><div className="text-[10px] mt-1 text-slate-500">{netMargin.toFixed(1)}% margin</div></div>
      </div>

      {/* Income statement table */}
      <div className="bg-white border rounded-xl p-4 mb-4">
        <div className="text-xs font-semibold uppercase text-slate-500 mb-3">Income Statement</div>
        <table className="w-full text-sm">
          <tbody>
            <Row label="REVENUE" value={revenue} bold />
            <Row label="Sales (delivered SOs)" value={revenue} indent sub={`${revenueSOs.length} SO${revenueSOs.length===1?'':'s'}`} />
            <Row label="COST OF GOODS SOLD" value={cogs} bold color="text-rose-700" />
            <Row label="Materials & supplier costs (POs)" value={cogs} indent sub={`${cogsPOs.length} PO${cogsPOs.length===1?'':'s'}`} />
            <Row label="GROSS PROFIT" value={grossProfit} bold color={grossProfit>=0?'text-emerald-700':'text-rose-700'} sub={`${grossMargin.toFixed(1)}% margin`} />
            <Row label="OPERATING EXPENSES" value={opex} bold color="text-amber-700" />
            {sortedCats.map(([cat,amt])=>(
              <Row key={cat} label={cat} value={amt} indent />
            ))}
            <Row label="NET INCOME" value={netIncome} bold color={netIncome>=0?'text-indigo-700':'text-rose-700'} sub={`${netMargin.toFixed(1)}% margin`} />
          </tbody>
        </table>
      </div>

      {/* Cash basis comparison */}
      <div className="bg-slate-50 border rounded-xl p-4">
        <div className="text-xs font-semibold uppercase text-slate-500 mb-3">Cash Basis (from bank transactions, same period)</div>
        <div className="grid grid-cols-3 gap-3 text-center">
          <div className="bg-white border rounded p-3"><div className="text-[10px] uppercase text-slate-500">Cash In</div><div className="text-lg font-bold text-emerald-700">{peso(cashIn)}</div></div>
          <div className="bg-white border rounded p-3"><div className="text-[10px] uppercase text-slate-500">Cash Out</div><div className="text-lg font-bold text-rose-700">{peso(cashOut)}</div></div>
          <div className="bg-white border rounded p-3"><div className="text-[10px] uppercase text-slate-500">Net Cash</div><div className={`text-lg font-bold ${cashNet>=0?'text-emerald-700':'text-rose-700'}`}>{peso(cashNet)}</div></div>
        </div>
        <div className="text-[10px] text-slate-400 mt-2">P&L uses accrual (when SO delivered / PO received). Cash basis above shows actual bank movement in the same window — useful for catching timing differences.</div>
      </div>
    </div>
  );
}


/* ─────────── BIR TAX HELPERS ─────────── */
function BIRHelpersView({ profile, orders, salesOrders, suppliers, vouchers }){
  const today = new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [printing2307,setPrinting2307]=useState(null);
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  function inRange(d){ return d && d.startsWith(monthKey); }

  // OUTPUT VAT — from SOs delivered in the period (sales VAT we collected)
  const outputRows = salesOrders.filter(s => s.status!=='cancelled' && inRange(s.delivered_at || s.date));
  const outputVat = outputRows.reduce((s,o)=>{
    // Use saved vat_amount if present; otherwise back out 12% from total when vatable_sales known
    if(o.vat_amount) return s + Number(o.vat_amount);
    return s + Number(o.vatable_sales||0) * 0.12;
  }, 0);
  const outputVatableSales = outputRows.reduce((s,o)=>s+Number(o.vatable_sales||o.total||0), 0);

  // INPUT VAT — from POs where vat_enabled is true (purchases VAT we can claim back)
  const inputRows = orders.filter(o => o.vat_enabled && o.status!=='draft' && o.status!=='cancelled' && inRange(o.received_at || o.date));
  const inputVat = inputRows.reduce((s,o)=>{
    const subtotal = (o.lines||[]).reduce((ss,l)=>ss+(Number(l.qty)||0)*(Number(l.unit_cost)||0), 0);
    return s + subtotal*0.12;
  }, 0);
  const inputVatableTotal = inputRows.reduce((s,o)=>{
    return s + (o.lines||[]).reduce((ss,l)=>ss+(Number(l.qty)||0)*(Number(l.unit_cost)||0), 0);
  }, 0);

  const vatPayable = Math.max(0, outputVat - inputVat);
  const vatCreditable = outputVat < inputVat ? (inputVat - outputVat) : 0;

  // WITHHOLDING TAX by supplier — for 2307 generation
  const whtBySupp = {};
  orders.filter(o => o.withholding_tax_enabled && o.status!=='draft' && o.status!=='cancelled' && inRange(o.received_at || o.date)).forEach(o=>{
    const subtotal = (o.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unit_cost)||0), 0);
    const rate = Number(o.withholding_tax_rate)||0;
    const wht = subtotal * rate/100;
    const k = o.supplier_id || 'unknown';
    if(!whtBySupp[k]) whtBySupp[k] = { supplier: suppliers.find(s=>s.id===k), pos:[], totalSubtotal:0, totalWHT:0, rate };
    whtBySupp[k].pos.push(o);
    whtBySupp[k].totalSubtotal += subtotal;
    whtBySupp[k].totalWHT += wht;
  });
  const whtSuppliers = Object.entries(whtBySupp);
  const totalWHT = whtSuppliers.reduce((s,[_,v])=>s+v.totalWHT, 0);

  const monthName = new Date(year, month).toLocaleString('en-PH',{ month:'long', year:'numeric' });

  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl font-bold">🧾 BIR Tax Helpers</h1>
            <p className="text-slate-500 text-sm">{monthName} · VAT Payable {peso(vatPayable)} · WHT to remit {peso(totalWHT)}</p>
          </div>
          <div className="flex items-center gap-2">
            <select className="input text-xs py-1.5 w-32" value={month} onChange={e=>setMonth(parseInt(e.target.value,10))}>
              {['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=><option key={m} value={i}>{m}</option>)}
            </select>
            <select className="input text-xs py-1.5 w-24" value={year} onChange={e=>setYear(parseInt(e.target.value,10))}>
              {[today.getFullYear(), today.getFullYear()-1].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
      </div>

      {/* Reminder: monthly BIR deadlines */}
      <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 mb-4 text-xs">
        <div className="font-bold text-purple-900 mb-1">📅 BIR monthly deadlines</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          {BIR_DEADLINES.map(d=><div key={d.day} className="bg-white border rounded p-2"><div className="font-bold">{d.day}th</div><div className="text-[10px] text-slate-500">{d.label}</div></div>)}
        </div>
      </div>

      {/* VAT SECTION */}
      <div className="bg-white border rounded-xl p-4 mb-4">
        <div className="text-sm font-bold uppercase text-slate-700 mb-3">VAT Summary (BIR Form 2550M)</div>
        <table className="w-full text-sm">
          <tbody>
            <tr className="border-t-2 border-emerald-300 bg-emerald-50">
              <td className="py-2 px-3 font-bold uppercase text-xs tracking-wider text-emerald-700">OUTPUT VAT (Sales)</td>
              <td className="py-2 text-right font-extrabold text-emerald-800">{peso(outputVat)}</td>
            </tr>
            <tr className="border-t"><td className="py-1.5 px-3 pl-6 text-xs">VATable Sales (subtotal)</td><td className="py-1.5 text-right">{peso(outputVatableSales)}</td></tr>
            <tr className="border-t"><td className="py-1.5 px-3 pl-6 text-xs">× 12% VAT</td><td className="py-1.5 text-right font-semibold">{peso(outputVat)}</td></tr>

            <tr className="border-t-2 border-rose-300 bg-rose-50">
              <td className="py-2 px-3 font-bold uppercase text-xs tracking-wider text-rose-700">LESS: INPUT VAT (Purchases)</td>
              <td className="py-2 text-right font-extrabold text-rose-800">({peso(inputVat)})</td>
            </tr>
            <tr className="border-t"><td className="py-1.5 px-3 pl-6 text-xs">VATable Purchases (subtotal)</td><td className="py-1.5 text-right">{peso(inputVatableTotal)}</td></tr>
            <tr className="border-t"><td className="py-1.5 px-3 pl-6 text-xs">× 12% VAT</td><td className="py-1.5 text-right font-semibold">{peso(inputVat)}</td></tr>

            <tr className={`border-t-2 border-b-2 ${vatPayable>0?'bg-indigo-50 border-indigo-300':'bg-emerald-50 border-emerald-300'}`}>
              <td className="py-3 px-3 font-extrabold uppercase tracking-wider">VAT PAYABLE</td>
              <td className={`py-3 text-right text-xl font-black ${vatPayable>0?'text-indigo-800':'text-emerald-800'}`}>{peso(vatPayable)}</td>
            </tr>
            {vatCreditable>0 && (
              <tr className="border-t"><td className="py-1.5 px-3 text-xs text-emerald-700">Excess Input VAT (creditable forward)</td><td className="py-1.5 text-right font-semibold text-emerald-700">{peso(vatCreditable)}</td></tr>
            )}
          </tbody>
        </table>
        <div className="text-[10px] text-slate-400 mt-2">File: BIR Form 2550M by the 20th of the following month. If VAT Payable {'>'}  0, also remit via online banking or AAB.</div>
      </div>

      {/* WHT — suppliers we withheld from */}
      <div className="bg-white border rounded-xl p-4 mb-4">
        <div className="text-sm font-bold uppercase text-slate-700 mb-3">Expanded Withholding Tax (BIR Form 1601-EQ)</div>
        {whtSuppliers.length===0 ? (
          <div className="text-sm text-slate-400 py-4">No POs in {monthName} have withholding tax enabled. Toggle it on a PO's totals box to record WHT here.</div>
        ) : (
          <>
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Supplier</th><th className="text-left px-3 py-2">TIN</th><th className="text-right px-3 py-2">VATable Purchases</th><th className="text-right px-3 py-2">Rate</th><th className="text-right px-3 py-2">WHT Amount</th><th></th></tr></thead>
              <tbody>{whtSuppliers.map(([k,v])=>(
                <tr key={k} className="border-t hover:bg-slate-50">
                  <td className="px-3 py-2 font-medium">{v.supplier?.company||'Unknown supplier'}</td>
                  <td className="px-3 py-2 text-xs font-mono">{v.supplier?.tin||'—'}</td>
                  <td className="px-3 py-2 text-right">{peso(v.totalSubtotal)}</td>
                  <td className="px-3 py-2 text-right">{v.rate}%</td>
                  <td className="px-3 py-2 text-right font-bold text-amber-700">{peso(v.totalWHT)}</td>
                  <td className="px-3 py-2 text-right"><button onClick={()=>setPrinting2307({ supplier:v.supplier, pos:v.pos, subtotal:v.totalSubtotal, wht:v.totalWHT, rate:v.rate, month:monthName, monthKey })} className="text-xs px-2 py-1 rounded bg-indigo-600 text-white font-semibold hover:bg-indigo-700">🖨 2307</button></td>
                </tr>
              ))}
              <tr className="border-t-2 bg-amber-50">
                <td colSpan="4" className="px-3 py-2 font-bold uppercase tracking-wider text-xs text-amber-800">Total WHT to remit</td>
                <td className="px-3 py-2 text-right font-extrabold text-amber-800 text-base">{peso(totalWHT)}</td>
                <td></td>
              </tr>
              </tbody>
            </table>
            <div className="text-[10px] text-slate-400 mt-2">Click 🖨 2307 to generate a BIR Form 2307 (Certificate of Creditable Tax Withheld at Source) for each supplier — give a copy to them, keep one for your books, and remit the total to BIR by the 10th of the following month.</div>
          </>
        )}
      </div>

      {printing2307 && <BIR2307PrintView data={printing2307} profile={profile} onClose={()=>setPrinting2307(null)} />}
    </div>
  );
}

function StylesView({ styles, items, suppliers, departments, profile, reload }){
  const [search,setSearch]=useState(''); const [editing,setEditing]=useState(null); const [creating,setCreating]=useState(false);
  const rows=(styles||[]).filter(s=>!search||`${s.number} ${s.name} ${s.category} ${s.fabric}`.toLowerCase().includes(search.toLowerCase()));
  function bomCost(s){ return (s.bom_rows||[]).reduce((sum,r)=>sum+(Number(r.qty)||0)*(Number(r.unit_cost)||0),0); }
  function totalCost(s){ return bomCost(s)+Number(s.decoration_cost||0)+Number(s.labor_cost||0); }
  function margin(s){ const sell=Number(s.sell_price||0); if(!sell) return null; return ((sell-totalCost(s))/sell*100); }
  async function del(id){ if(!confirm('Delete this style?')) return; const {error}=await sb.from('styles').delete().eq('id',id); if(error){ alert(error.message); return; } reload(); }
  const cats=Array.from(new Set((styles||[]).map(s=>s.category).filter(Boolean))).sort();
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">👕 Styles & BOMs</h1><p className="text-slate-500 text-sm">{styles.length} style{styles.length===1?'':'s'} · {cats.length} categor{cats.length===1?'y':'ies'}</p></div>
          <div className="flex items-center gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" /><button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">+ New style</button></div>
        </div>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Style #</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">Fabric</th><th className="text-right px-3 py-2">Sell ₱</th><th className="text-right px-3 py-2">Total cost</th><th className="text-right px-3 py-2">Margin</th><th></th></tr></thead>
        <tbody>{rows.map(s=>{ const m=margin(s); const lowMargin=m!==null&&m<20; return (
          <tr key={s.id} className={`border-t hover:bg-slate-50 cursor-pointer ${lowMargin?'bg-rose-50/40':''}`} onClick={()=>setEditing(s)}>
            <td className="px-3 py-2 font-mono text-xs">{s.number||'—'}</td>
            <td className="px-3 py-2 font-medium">{s.name}</td>
            <td className="px-3 py-2 text-xs">{s.category||'—'}</td>
            <td className="px-3 py-2 text-xs">{s.fabric||'—'}</td>
            <td className="px-3 py-2 text-right">{peso(s.sell_price)}</td>
            <td className="px-3 py-2 text-right">{peso(totalCost(s))}</td>
            <td className={`px-3 py-2 text-right font-semibold ${m===null?'text-slate-400':m>=30?'text-emerald-700':m>=20?'text-amber-700':'text-rose-700'}`}>{m===null?'—':m.toFixed(1)+'%'}</td>
            <td className="px-3 py-2 text-right"><button onClick={(e)=>{e.stopPropagation(); del(s.id);}} className="text-xs text-rose-500 hover:underline">Delete</button></td>
          </tr>
        ); })}{rows.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No styles yet. Click "+ New style" to add one.</td></tr>}</tbody>

}

function StyleForm({ existing, items, suppliers, departments, profile, onClose, onSaved, reloadItems }){
  const isEdit=!!existing;
  const [f,setF]=useState(existing?{...existing, bom_rows:existing.bom_rows||[]}:{ name:'', category:'', fabric:'', sell_price:0, decoration_cost:0, labor_cost:0, notes:'', bom_rows:[{item_id:null, sku:'', name:'', qty:1, unit:'pc', unit_cost:0}] });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const [addingItem,setAddingItem]=useState(false); const [addingForRow,setAddingForRow]=useState(null);
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setRow(i,patch){ setF(p=>({...p,bom_rows:p.bom_rows.map((r,j)=>j===i?{...r,...patch}:r)})); }
  function addRow(){ setF(p=>({...p,bom_rows:[...p.bom_rows,{item_id:null, sku:'', name:'', qty:1, unit:'pc', unit_cost:0}]})); }
  function removeRow(i){ setF(p=>({...p,bom_rows:p.bom_rows.filter((_,j)=>j!==i)})); }
  function pickItem(i, itemId){ if(itemId==='__new__'){ setAddingForRow(i); setAddingItem(true); return; } const it=items.find(x=>x.id===itemId); setRow(i,{ item_id:itemId||null, sku:it?.sku||'', name:it?.name||'', unit:it?.unit||'pc', unit_cost:it?.cost||0 }); }
  const materialCost=f.bom_rows.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.unit_cost)||0),0);
  const totalCost=materialCost+Number(f.decoration_cost||0)+Number(f.labor_cost||0);
  const grossProfit=Number(f.sell_price||0)-totalCost;
  const marginPct=Number(f.sell_price||0)>0?(grossProfit/Number(f.sell_price)*100):null;
  async function save(){ if(!f.name.trim()){ setMsg('Name is required.'); return; } setBusy(true); setMsg('');
    const payload={ name:f.name.trim(), category:f.category||'', fabric:f.fabric||'', sell_price:Number(f.sell_price)||0, decoration_cost:Number(f.decoration_cost)||0, labor_cost:Number(f.labor_cost)||0, notes:f.notes||'', bom_rows:f.bom_rows };
    if(!isEdit) payload.number='STY-'+Date.now().toString().slice(-5);
    const { error } = isEdit ? await sb.from('styles').update(payload).eq('id',existing.id) : await sb.from('styles').insert(payload);
    setBusy(false); if(error){ setMsg(error.message); return; } onSaved(); }
  return (
    <Modal title={isEdit?'Edit style':'New style'} onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Style name *"><input className="input" value={f.name} onChange={e=>up('name',e.target.value)} /></TpLbl>
          <TpLbl t="Category"><input className="input" value={f.category} onChange={e=>up('category',e.target.value)} placeholder="e.g. Polo, Jacket" /></TpLbl>
          <TpLbl t="Fabric"><input className="input" value={f.fabric} onChange={e=>up('fabric',e.target.value)} /></TpLbl>
        </div>

        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Bill of Materials</div><button onClick={addRow} className="text-xs text-indigo-600 font-semibold">+ Add row</button></div>
          <div className="space-y-2">{f.bom_rows.map((r,i)=>(
            <div key={i} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-end">
              <div className="col-span-5"><label className="text-[10px] text-slate-500 uppercase">Material (from inventory)</label><select className="input mt-0.5 text-xs" value={r.item_id||''} onChange={e=>pickItem(i,e.target.value)}><option value="">— pick —</option>{items.map(it=><option key={it.id} value={it.id}>{it.name}{it.sku?' · '+it.sku:''}</option>)}<option value="__new__">+ Add new inventory item…</option></select>{r.name && <div className="text-[10px] text-slate-500 mt-0.5">{r.name}{r.sku?' · '+r.sku:''}</div>}</div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5 text-xs" value={r.qty} onChange={e=>setRow(i,{qty:e.target.value})} /></div>
              <div className="col-span-1"><label className="text-[10px] text-slate-500 uppercase">Unit</label><input className="input mt-0.5 text-xs" value={r.unit||'pc'} onChange={e=>setRow(i,{unit:e.target.value})} /></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Unit cost ₱</label><input type="number" className="input mt-0.5 text-xs" value={r.unit_cost} onChange={e=>setRow(i,{unit_cost:e.target.value})} /></div>
              <div className="col-span-1 text-right text-xs"><div className="text-[10px] uppercase text-slate-500">Total</div><div className="font-semibold">{peso(Number(r.qty||0)*Number(r.unit_cost||0))}</div></div>
              <div className="col-span-1 text-right"><button onClick={()=>removeRow(i)} className="text-rose-400 text-sm">✕</button></div>
            </div>
          ))}</div>
          <div className="text-right mt-2 text-sm"><span className="text-slate-500 mr-2">Material cost:</span><span className="font-semibold">{peso(materialCost)}</span></div>
        </div>

        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Sell price ₱"><input type="number" className="input" value={f.sell_price} onChange={e=>up('sell_price',e.target.value)} /></TpLbl>
          <TpLbl t="Decoration cost ₱ (print/embroidery)"><input type="number" className="input" value={f.decoration_cost} onChange={e=>up('decoration_cost',e.target.value)} /></TpLbl>
          <TpLbl t="Labor cost ₱"><input type="number" className="input" value={f.labor_cost} onChange={e=>up('labor_cost',e.target.value)} /></TpLbl>
        </div>

        <div className="bg-slate-900 text-white rounded-xl p-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          <div><div className="text-[10px] uppercase text-slate-400">Material</div><div className="font-bold">{peso(materialCost)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Total cost</div><div className="font-bold">{peso(totalCost)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Gross profit</div><div className={`font-bold ${grossProfit>=0?'text-emerald-400':'text-rose-400'}`}>{peso(grossProfit)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Margin</div><div className={`font-bold ${marginPct===null?'text-slate-500':marginPct>=30?'text-emerald-400':marginPct>=20?'text-amber-400':'text-rose-400'}`}>{marginPct===null?'—':marginPct.toFixed(1)+'%'}</div></div>
        </div>

        <TpLbl t="Notes"><textarea className="input min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save changes':'Create style')}</button>
      </div>
      {addingItem && <ItemForm suppliers={suppliers} departments={departments} onClose={()=>{ setAddingItem(false); setAddingForRow(null); }} onSaved={(newItem)=>{ setAddingItem(false); const r=addingForRow; setAddingForRow(null); if(newItem && r!=null){ setRow(r,{ item_id:newItem.id, sku:newItem.sku||'', name:newItem.name, unit:newItem.unit||'pc', unit_cost:newItem.cost||0 }); } reloadItems && reloadItems(); }} />}
    </Modal>
  );
}

  const [pendingInvites,setPendingInvites]=useState([]);
  // Finance Sprint 1 state: SOs, SO payments, bank accounts, bank txns, RFPs, vouchers.
  // All loaded in loadAll() so any view can use them. Sprint 2 adds expenses + budgets + CAs.
  const [salesOrders,setSalesOrders]=useState([]); const [soPayments,setSoPayments]=useState([]);
  const [bankAccounts,setBankAccounts]=useState([]); const [bankTransactions,setBankTransactions]=useState([]);
  const [rfps,setRfps]=useState([]); const [vouchers,setVouchers]=useState([]);
  const [budgetRequests,setBudgetRequests]=useState([]);
  // Sprint 2: expenses, cash advances (petty cash). Budget requests already loaded above.
  const [expenses,setExpenses]=useState([]); const [cashAdvances,setCashAdvances]=useState([]);
  const [createPOFromPR,setCreatePOFromPR]=useState(null);
  const [loadErr,setLoadErr]=useState(''); const [view,setView]=useState('dashboard');
  const [detailLead,setDetailLead]=useState(null); const [editLead,setEditLead]=useState(null); const [activityLead,setActivityLead]=useState(null);
  // Separate state for dept-board "Open lead" — opens a read-only LeadInfoModal
  // that ONLY shows the dept-job conversation (not the sales chat) and the
  // sent attachments. Holds { lead, job, jobType, canSendToPrinting } so the
  // modal knows which dept job to scope the conversation to.
  const [deptLeadInfo,setDeptLeadInfo]=useState(null);
  const openLeadFromDept=(ctx)=>{ setDeptLeadInfo(ctx); };
  const closeLeadDetail=()=>{ setDetailLead(null); };
  const [sendGraphicLead,setSendGraphicLead]=useState(null); const [sendPrintLead,setSendPrintLead]=useState(null); const [showNew,setShowNew]=useState(false);
  const [selectedClient,setSelectedClient]=useState(null);
  const [selectedSupplier,setSelectedSupplier]=useState(null);
  const [techpackLead,setTechpackLead]=useState(null);
  const [techpackReadOnly,setTechpackReadOnly]=useState(false);
  const openTechpackEdit=(lead)=>{ setTechpackReadOnly(false); setTechpackLead(lead); };
  const openTechpackView=(lead)=>{ setTechpackReadOnly(true); setTechpackLead(lead); };
  const [deptActivity,setDeptActivity]=useState(null); // { job, jobType, title }
  // Collapsible sidebar groups — remembered across reloads.
  const [collapsedGroups,setCollapsedGroups]=useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem('steeze.sidebar.collapsed')||'[]')); }
    catch(_) { return new Set(); }
  });
  function toggleGroup(g){ setCollapsedGroups(prev=>{ const n=new Set(prev); if(n.has(g)) n.delete(g); else n.add(g); try{ localStorage.setItem('steeze.sidebar.collapsed', JSON.stringify([...n])); }catch(_){} return n; }); }

  // Mobile drawer: sidebar slides in/out from the left on phones. On desktop
  // (md and up) it's always visible and this state has no effect.
  const [sidebarOpen, setSidebarOpen] = useState(false);
  function navTo(v){ setView(v); setSidebarOpen(false); }

  // Mention notifications: mute toggle + toast + ref to keep callback fresh.
  const [muted,setMuted]=useState(()=>{ try{ return localStorage.getItem('steeze.notifications.muted')==='1'; }catch(_){ return false; } });
  function toggleMute(){ setMuted(m=>{ const n=!m; try{ localStorage.setItem('steeze.notifications.muted', n?'1':'0'); }catch(_){} return n; }); }
  const mutedRef=useRef(muted); useEffect(()=>{ mutedRef.current=muted; },[muted]);
  const [toast,setToast]=useState(null); // { title, body }
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),5000); return ()=>clearTimeout(t); },[toast]);
  // Won celebration — listens for the custom event dispatched by Pipeline
  // and LeadModal whenever a deal lands in the Won stage for the first time.
  const [wonCelebration,setWonCelebration]=useState(null); // { lead }
  useEffect(()=>{
    function onWon(e){
      const lead = e?.detail?.lead;
      if(!lead) return;
      setWonCelebration({ lead });
      // Pop confetti + chord right now while the audio context is still in
      // user-gesture context. Both respect the mute toggle via mutedRef.
      try { fireWonConfetti(); } catch(_){}
      if(!mutedRef.current){ try { playWonSound(); } catch(_){} }
    }
    window.addEventListener('steeze:won', onWon);
    return ()=>window.removeEventListener('steeze:won', onWon);
  },[]);
  useEffect(()=>{ if(!wonCelebration) return; const t=setTimeout(()=>setWonCelebration(null),5500); return ()=>clearTimeout(t); },[wonCelebration]);

  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session)); const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);

  async function loadAll(){
    if(!session) return; setLoadErr(''); const me=session.user.id;
    const [pf,pr,cl,ld,lm,dm,ac,dac,pj,gj,prj,it,sp,dp,pq,po,sj,sc,gm,st,pi,so,sop,ba,bt,rf,vc,br,ex,ca]=await Promise.all([
      sb.from('profiles').select('*').eq('id',me).single(),
      sb.from('profiles').select('*'),
      sb.from('clients').select('*').order('company'),
      sb.from('leads').select('*').is('deleted_at', null).order('created_at',{ ascending:false }),
      sb.from('lead_activity').select('*').contains('mentions',[me]).order('created_at',{ ascending:false }),
      sb.from('dept_job_activity').select('*').contains('mentions',[me]).order('created_at',{ ascending:false }),
      sb.from('lead_activity').select('lead_id').eq('type','comment'),
      sb.from('dept_job_activity').select('job_id,job_type').eq('type','comment'),
      sb.from('production_jobs').select('*').is('deleted_at', null).order('created_at',{ ascending:false }),
      sb.from('graphic_design_jobs').select('*').is('deleted_at', null).order('created_at',{ ascending:false }),
      sb.from('printing_jobs').select('*').is('deleted_at', null).order('created_at',{ ascending:false }),
      sb.from('items').select('*').order('name'),
      sb.from('suppliers').select('*').order('company'),
      sb.from('departments').select('*').order('name'),
      sb.from('purchase_requests').select('*').order('created_at',{ascending:false}),
      sb.from('purchase_orders').select('*').order('created_at',{ascending:false}),
      sb.from('sampling_jobs').select('*').is('deleted_at', null).order('created_at',{ascending:false}),
      sb.from('size_charts').select('*').order('name'),
      sb.from('garment_mockups').select('*').order('name'),
      sb.from('styles').select('*').order('created_at',{ascending:false}),
      sb.from('pending_invites').select('*').order('created_at',{ascending:false}),
      // Finance Sprint 1 — fail-safe with empty fallback if SQL hasn't been run yet
      sb.from('sales_orders').select('*').is('deleted_at', null).order('created_at',{ascending:false}),
      sb.from('sales_order_payments').select('*').order('date',{ascending:false}),
      sb.from('bank_accounts').select('*').order('position'),
      sb.from('bank_transactions').select('*').order('date',{ascending:false}),
      sb.from('rfps').select('*').order('created_at',{ascending:false}),

  // System notifications: when the tab is in the background (or phone screen
  // is on but Steeze OS isn't the active app), we fire a real OS notification
  // so people see they were @mentioned without keeping the app focused.
  // Tracks 'default' | 'granted' | 'denied'. Refreshed on permission change.
  const [notifPerm, setNotifPerm] = useState(()=> typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
  async function enableSystemNotifications(){
    if(typeof Notification === 'undefined'){ alert('This browser doesn\'t support notifications. On iPhone, open Steeze OS from your home-screen icon (PWA), not Safari.'); return; }
    if(Notification.permission === 'denied'){ alert('Notifications are blocked for this site. Open your browser settings → Notifications → allow steeze-erp.vercel.app, then reload.'); return; }
    let perm = Notification.permission;
    if(perm !== 'granted'){
      perm = await Notification.requestPermission();
      setNotifPerm(perm);
    } else {
      setNotifPerm('granted');
    }
    if(perm !== 'granted') return;
    // Also subscribe this device to OneSignal so we get pushes even when the
    // app is fully closed (Layer 2). The login() call links the device to
    // the user's profile.id so the Edge Function can target them by name.
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal){
        try { if(profile && profile.id) await OneSignal.login(String(profile.id)); } catch(_){}
        try { await OneSignal.Notifications.requestPermission(); } catch(_){}
        try { await OneSignal.User.PushSubscription.optIn(); } catch(_){}
      });
    } catch(_){}
    try { new Notification('Steeze OS notifications on', { body:'You\'ll see a ping when someone @mentions you.', icon:'/icon-192.png' }); } catch(_){}
  }
  // Re-identify the user to OneSignal whenever the profile loads / changes, so
  // a teammate using a shared device still gets pushes routed to the right
  // person. Also auto opt-in if Notification permission was already granted
  // (otherwise existing users who granted permission BEFORE OneSignal was
  // added would never register as a subscription). Logout on sign-out
  // detaches the device from the user.
  useEffect(()=>{
    if(!profile || !profile.id) return;
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal){
      try { await OneSignal.login(String(profile.id)); } catch(_){}
      if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
        try { await OneSignal.User.PushSubscription.optIn(); } catch(_){}
      }
    });
    return ()=>{
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal){
        try { await OneSignal.logout(); } catch(_){}
      });
    };
  },[profile && profile.id]);

  function showSystemMention(title, body, onClick){

    try {
      const n = new Notification(title, { body: body||'', icon:'/icon-192.png', badge:'/icon-192.png', tag:'steeze-mention', renotify:true });
      n.onclick = ()=>{ try { window.focus(); } catch(_){} try { n.close(); } catch(_){} if(onClick) onClick(); };

      if(!row || !Array.isArray(row.mentions)) return;

      if(row.actor_id === me) return;             // don't ping yourself
      if(!mutedRef.current) playPing();

      setToast({ title:'New @mention', body: snippet || 'You were tagged in a comment.' });

      loadAll();

  useEffect(()=>{

          <span className="font-bold text-sm">Steeze <span className="text-indigo-300">OS</span></span>
        </div>

      {sidebarOpen && <div className="md:hidden no-print fixed inset-0 bg-black/50 z-40" onClick={()=>setSidebarOpen(false)} />}

          <div className="flex-1 min-w-0">
            <div className="font-black text-white leading-tight tracking-tight text-base">Steeze <span className="text-indigo-300">OS</span></div>
            <div className="text-[10px] uppercase tracking-wider text-slate-500">Operations</div>
          </div>
          {/* Mobile-only close button. Hidden on desktop where the drawer is

          </button>
        </div>
        <nav className="flex-1 px-2 py-3 space-y-1">

            const isCollapsed = sec.group && collapsedGroups.has(sec.group);
            return (
              <div key={si} className="mb-1">
                {sec.group && (
                  <button type="button" onClick={()=>toggleGroup(sec.group)} className="w-full px-3 pt-3 pb-1 text-[10px] uppercase tracking-wider text-slate-500 hover:text-slate-300 font-semibold flex items-center gap-1.5 select-none">
                    <span className={`text-[9px] transition-transform ${isCollapsed?'-rotate-90':''}`}>▾</span>
                    <span className="flex-1 text-left">{sec.group}</span>
                    {sec.soon && <span className="text-[8px] bg-slate-700 text-slate-300 rounded px-1 py-0.5 normal-case tracking-normal">soon</span>}
                  </button>
                )}
                {!isCollapsed && sec.items.map(it=>NavBtn(it))}
              </div>
            );
          })}
        </nav>
        <div className="px-3 py-3 border-t border-slate-800">

          {/* System notification opt-in banner. Shows only when the browser
              supports notifications AND the user hasn't decided yet. Once
              granted (or permanently denied) the banner disappears. */}
          {notifPerm === 'default' && (
            <button onClick={enableSystemNotifications} className="w-full text-[11px] px-2 py-1.5 mb-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-semibold flex items-center justify-center gap-1.5">
              <span>📲</span><span>Enable phone notifications</span>
            </button>

          <div className="flex items-center gap-2">
            <button onClick={()=>sb.auth.signOut()} className="flex-1 text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">Sign out</button>
            <button onClick={()=>playPing()} title="Play test sound" className="text-xs px-2 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-emerald-300">▶</button>
            <button onClick={toggleMute} title={muted?'Notifications muted — click to unmute':'Notifications on — click to mute'} className={`text-xs px-2 py-1.5 rounded-lg ${muted?'bg-slate-800 text-slate-500 hover:text-slate-300':'bg-slate-800 text-emerald-400 hover:text-emerald-300'}`}>{muted?'🔕':'🔔'}</button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="no-print md:ml-60 pt-12 md:pt-0 min-h-screen">
        {loadErr && <div className="bg-rose-50 text-rose-700 text-xs px-6 py-2 border-b border-rose-200">{loadErr}</div>}

      {editLead && <LeadForm profile={profile} profiles={profiles} clients={clients} existing={editLead} onClose={()=>setEditLead(null)} onSaved={()=>{ setEditLead(null); loadAll(); }} />}
      {sendGraphicLead && <SendToGraphicModal profile={profile} lead={sendGraphicLead} clients={clients} onClose={()=>setSendGraphicLead(null)} onSent={(n)=>{ setSendGraphicLead(null); loadAll(); alert('Sent to Graphic Design'+(n?` with ${n} attachment(s)`:'')+'.'); }} />}

      {activityLead && <Thread profile={profile} profiles={profiles} table="lead_activity" match={{ lead_id:(leads.find(l=>l.id===activityLead.id)||activityLead).id }} scope={'activity/'+activityLead.id} titleText={(leads.find(l=>l.id===activityLead.id)||activityLead).title} openSourceLabel={detailLead?null:'Open lead'} onOpenSource={detailLead?null:()=>{ const l=leads.find(x=>x.id===activityLead.id)||activityLead; setActivityLead(null); setDetailLead(l); }} afterChange={loadAll} onBack={detailLead?()=>setActivityLead(null):null} onClose={()=>setActivityLead(null)} />}
      {deptActivity && <Thread profile={profile} profiles={profiles} table="dept_job_activity" match={{ job_id:deptActivity.job.id, job_type:deptActivity.jobType }} scope={'dept/'+deptActivity.job.id} titleText={deptActivity.title} openSourceLabel={'Go to board'} onOpenSource={()=>{ const map={ graphic:'graphic', printing:'printing', sampling:'sampling', production:'prod' }; setDeptActivity(null); setView(map[deptActivity.jobType]||'prod'); }} afterChange={loadAll} onClose={()=>setDeptActivity(null)} />}

      <div className="no-print fixed bottom-3 right-3 text-[10px] px-2 py-1 rounded-full bg-slate-800 text-white/90">{BUILD}</div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state={ err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  componentDidCatch(e){ showFatal((e && e.message) || String(e)); }
  render(){ if(this.state.err) return <div className="p-6 text-rose-700 text-sm">App error: {String((this.state.err && this.state.err.message) || this.state.err)}</div>; return this.props.children; }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);

// PWA: register the service worker so the app can install + work offline.
// Only runs on https or localhost (browser requirement).
// Auto-update: when a NEW service worker takes control of the page, force a
// reload so the user immediately sees the latest build. Without this, devices
// keep serving stale cached HTML / icons until the user manually clears data.
// IMPORTANT: we guard against infinite reload loops with two checks:
//   1. Skip the initial controller assignment (first time SW takes over a
//      previously-uncontrolled page) — that fires on every fresh page load
//      after a SW unregister and would loop us forever.
//   2. Mark sessionStorage when we DO reload so the very next page-load
//      ignores the immediate controllerchange that follows.
if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
  let reloading = false;
  // If we just reloaded for a SW swap, skip the next controllerchange.
  const justReloaded = sessionStorage.getItem('sw-just-reloaded') === '1';
  if (justReloaded) sessionStorage.removeItem('sw-just-reloaded');
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    if (justReloaded) return;                            // ignore the post-reload event
    if (!navigator.serviceWorker.controller) return;     // initial SW install — no reload
    reloading = true;
    sessionStorage.setItem('sw-just-reloaded', '1');
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      // Check for updates every 30 minutes the app is open.
      setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);
      // If an update is already waiting at registration time, activate it.
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // A new SW finished installing while the old one still controls
            // the page. Tell it to take over — controllerchange then reloads.
            nw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(err => console.warn('SW registration failed:', err));
  });
}
