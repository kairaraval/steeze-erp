  );
}

function MemberProfileModal({ member, leads, clients, onClose }){
  const mine=leads.filter(l=>l.manager_id===member.id);
  const won=mine.filter(l=>SOLD_STAGES.includes(l.stage));
  const open=mine.filter(l=>!CLOSED_STAGES.includes(l.stage));
  const wonVal=won.reduce((s,l)=>s+(Number(l.value)||0),0);
  const openVal=open.reduce((s,l)=>s+(Number(l.value)||0),0);
  const _now=new Date();
  const wonThisMonth=won.filter(l=>{ if(!l.won_at) return false; const d=new Date(l.won_at+'T00:00:00'); return d.getMonth()===_now.getMonth()&&d.getFullYear()===_now.getFullYear(); });
  const wonMonthVal=wonThisMonth.reduce((s,l)=>s+(Number(l.value)||0),0);
  const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(_now.getFullYear(), _now.getMonth()-i, 1); months.push({ key:d.getMonth()+'-'+d.getFullYear(), label:d.toLocaleString('en-PH',{ month:'short' }), m:d.getMonth(), y:d.getFullYear(), total:0 }); }
  won.forEach(l=>{ if(!l.won_at) return; const d=new Date(l.won_at+'T00:00:00'); const slot=months.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear()); if(slot) slot.total+=Number(l.value)||0; });
  const maxM=Math.max(1,...months.map(m=>m.total));
  const clientName=(id)=>(clients||[]).find(c=>c.id===id)?.company||'—';
  const roleLbl = member.role==='admin'?'Administrator' : member.role==='assistant'?'Sales Assistant' : 'Sales Manager';
  const recentWon=won.slice().sort((a,b)=>(b.won_at||'').localeCompare(a.won_at||'')).slice(0,8);
  return (
    <Modal title="Team member" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex items-center gap-3"><Avatar profile={member} />
          <div>
            <div className="text-xl font-bold text-slate-900">{member.name||member.email}</div>
            <div className="text-xs text-slate-500">{roleLbl} · {member.email}</div>
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Open pipeline</div><div className="text-xl font-bold mt-0.5">{peso(openVal)}</div><div className="text-[11px] text-slate-500">{open.length} lead{open.length===1?'':'s'}</div></div>
          <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3"><div className="text-[10px] uppercase text-emerald-700">Won this month</div><div className="text-xl font-bold mt-0.5 text-emerald-800">{peso(wonMonthVal)}</div><div className="text-[11px] text-emerald-600">{wonThisMonth.length} deal{wonThisMonth.length===1?'':'s'}</div></div>
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Won (all-time)</div><div className="text-xl font-bold mt-0.5 text-emerald-700">{peso(wonVal)}</div><div className="text-[11px] text-slate-500">{won.length} deal{won.length===1?'':'s'}</div></div>
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Win rate</div><div className="text-xl font-bold mt-0.5">{mine.length?Math.round(won.length/mine.length*100):0}%</div><div className="text-[11px] text-slate-500">{mine.length} total leads</div></div>
        </div>
        <div className="bg-slate-50 border rounded-lg p-3">
          <div className="text-[10px] uppercase text-slate-500 font-semibold mb-2">Closed Won — last 6 months</div>
          <div className="flex items-end gap-2 h-28">{months.map(m=>(
            <div key={m.key} className="flex-1 flex flex-col items-center justify-end gap-1">
              <div className="text-[9px] text-slate-500">{m.total?peso(m.total).replace('₱',''):''}</div>
              <div className="w-full bg-emerald-500 rounded-t" style={{ height:Math.max(2,(m.total/maxM*100))+'%', minHeight:m.total?'4px':'2px' }}></div>
              <div className="text-[10px] text-slate-500">{m.label}</div>
            </div>
          ))}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase text-slate-500 font-semibold mb-2">Most recent Closed Won</div>
          {recentWon.length===0 ? <div className="text-xs text-slate-400 py-2">No won deals yet.</div> :
            <div className="border rounded-lg overflow-hidden"><table className="w-full text-sm">
              <thead className="bg-slate-50 text-[10px] uppercase text-slate-500"><tr><th className="text-left px-2 py-1.5">Date</th><th className="text-left px-2 py-1.5">Client</th><th className="text-left px-2 py-1.5">Lead</th><th className="text-right px-2 py-1.5">Value</th></tr></thead>
              <tbody>{recentWon.map(l=>(
                <tr key={l.id} className="border-t">
                  <td className="px-2 py-1 text-xs text-slate-500">{fmtDate(l.won_at)}</td>
                  <td className="px-2 py-1">{clientName(l.client_id)}</td>
                  <td className="px-2 py-1 text-slate-700">{l.title}</td>
                  <td className="px-2 py-1 text-right font-semibold">{peso(l.value)}</td>
                </tr>
              ))}</tbody>
            </table></div>
          }
        </div>
      </div>
    </Modal>
  );
}

function mergeTechpack(existing, lead, client, profile){
  const blank=blankTechpack(lead, client, profile);
  if(!existing||typeof existing!=='object') return blank;
  const out={ ...blank, ...existing };
  TECHPACK_SECTIONS.forEach(s=>{ out[s.key]={ ...blank[s.key], ...(existing[s.key]||{}) }; });
  out.extraPages = Array.isArray(out.extraPages) ? out.extraPages : [];
  return out;
}

function readFileAsDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function dataUrlToBlob(dataUrl){ const r=await fetch(dataUrl); return await r.blob(); }
async function uploadDataUrl(scope, dataUrl){ const blob=await dataUrlToBlob(dataUrl); const path=`${scope}/${Date.now()}_img.png`; const { error }=await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/png', upsert:false }); if(error) throw error; return path; }

let __cropperLibPromise=null;

  return __cropperLibPromise;
}
let __bgState=null;
async function loadBgRemover(onProgress){ if(__bgState) return __bgState; if(onProgress) onProgress('Loading AI library…');
  const transformers=await (new Function('return import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0")'))();
  const { AutoModel, AutoProcessor, RawImage, env }=transformers; env.allowRemoteModels=true; env.allowLocalModels=false;
  if(onProgress) onProgress('Downloading model (first run ~50MB)…');
  const model=await AutoModel.from_pretrained('briaai/RMBG-1.4', { config:{ model_type:'custom' } });
  const processor=await AutoProcessor.from_pretrained('briaai/RMBG-1.4', { config:{ do_normalize:true, do_pad:false, do_rescale:true, do_resize:true, image_mean:[0.5,0.5,0.5], feature_extractor_type:'ImageFeatureExtractor', image_std:[1,1,1], resample:2, rescale_factor:0.00392156862745098, size:{ width:1024, height:1024 } } });
  __bgState={ model, processor, RawImage }; return __bgState;
}
async function removeImageBackground(srcDataUrl, onProgress){
  const { model, processor, RawImage }=await loadBgRemover(onProgress); if(onProgress) onProgress('Analyzing image…');
  const image=await RawImage.fromURL(srcDataUrl); const { pixel_values }=await processor(image); const { output }=await model({ input:pixel_values });
  const mask=await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(image.width, image.height);
  const canvas=document.createElement('canvas'); canvas.width=image.width; canvas.height=image.height; const ctx=canvas.getContext('2d');
  ctx.drawImage(image.toCanvas(),0,0); const imageData=ctx.getImageData(0,0,image.width,image.height);
  for(let i=0;i<mask.data.length;i++){ imageData.data[4*i+3]=mask.data[i]; }
  ctx.putImageData(imageData,0,0); return canvas.toDataURL('image/png');
}

function CropModal({ src, onClose, onApply }){

    return ()=>{ cancelled=true; if(cropperRef.current){ try{ cropperRef.current.destroy(); }catch(_){} cropperRef.current=null; } };
  },[]);
  function setRatio(label,v){ setAspect(label); if(cropperRef.current) cropperRef.current.setAspectRatio(v); }

function TpImage({ scope, value, onChange, label, h }){

  useEffect(()=>{ let on=true; setLoadErr(false); setUrl('');
    if(value){ signedUrl(value).then(u=>{ if(on) setUrl(u); }).catch(()=>{ if(on) setLoadErr(true); }); }
    return ()=>{on=false;};
  },[value]);
  async function pick(e){ const f=e.target.files[0]; if(!f) return; try{ setWorking(await readFileAsDataUrl(f)); }catch(err){ alert('Could not read file.'); } e.target.value=''; }
  async function onPaste(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault();
    try{ setWorking(await readFileAsDataUrl(f)); }
    catch(err){ alert('Could not read pasted image.'); }
  }
  async function editExisting(){ if(!url) return; try{ const blob=await (await fetch(url)).blob(); setWorking(await readFileAsDataUrl(blob)); }catch(err){ alert('Could not load image for editing.'); } }
  async function removeBg(){ if(!working) return; setBusy('Starting…'); try{ const data=await removeImageBackground(working, m=>setBusy(m)); setWorking(data); setBusy(''); }catch(err){ setBusy(''); alert('Background removal failed: '+(err.message||err)+'\n\nThe AI model loads from a CDN; if your network blocks it, this will not work.'); } }
  async function saveWorking(){ setBusy('Saving…'); try{ const path=await uploadDataUrl(scope, working); onChange(path); setWorking(null); setBusy(''); }catch(err){ setBusy(''); alert('Upload failed: '+(err.message||err)+'\n\nIf this keeps happening, ask your admin to verify the Attachments storage policies are set up (see steeze-erp-storage-policies.sql).'); } }

          <button onClick={removeBg} disabled={!!busy} className="text-xs px-2 py-1 rounded bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 font-semibold">{busy && busy!=='Saving…'?'⟳ '+busy:'🪄 Remove BG'}</button>
          <button onClick={saveWorking} disabled={!!busy} className="text-xs px-2 py-1 rounded bg-slate-900 text-white disabled:opacity-50 font-semibold flex-1">{busy==='Saving…'?'Saving…':'Save'}</button>
          <button onClick={()=>setWorking(null)} className="text-xs px-2 py-1 rounded border bg-white">Cancel</button>
        </div>
      </div>
    ) : (
      <div>
        <div className={`border-2 border-dashed rounded-lg overflow-hidden bg-slate-50 ${h||'h-32'} flex flex-col items-center justify-center`}>
          {url ? <img src={url} className="w-full h-full object-contain" /> :
           (value && loadErr) ? <span className="text-rose-500 text-xs text-center px-2">⚠ Image not available<div className="text-[10px] text-rose-400 mt-0.5">Storage may not be accessible. Re-upload or contact admin.</div></span> :
           value ? <span className="text-slate-400 text-xs">Loading…</span> :
           <span className="text-slate-300 text-xs">No image · paste with ⌘V</span>}
        </div>
        <div className="flex gap-1 mt-1 no-print"><label className="text-xs px-2 py-1 rounded border bg-white cursor-pointer flex-1 text-center hover:bg-slate-50">📎 {value?'Replace':'Upload'}<input type="file" accept="image/*" className="hidden" onChange={pick} /></label>{value && !loadErr && <button onClick={editExisting} className="text-xs px-2 py-1 rounded border bg-white" title="Crop / remove background">✎</button>}{value && <button onClick={()=>onChange('')} className="text-xs px-2 py-1 rounded border bg-white text-rose-500">✕</button>}</div>
      </div>
    )}
    {showCrop && <CropModal src={working} onClose={()=>setShowCrop(false)} onApply={(d)=>{ setWorking(d); setShowCrop(false); }} />}
  </div>);
}

  const scope='techpack/'+lead.id;

  function setSec(key,patch){ setTp(t=>{ if(isExtra) return {...t, extraPages:(t.extraPages||[]).map(p=>p.id===active?{...p,data:{...p.data,...patch}}:p)}; const enabled=('enabled' in patch)?patch.enabled:true; return {...t,[key]:{...t[key],...patch,enabled}}; }); }

      case 'breakdown': return (<div className="space-y-3">{sizeTableEditor()}<TpLbl t="Names"><div className="space-y-1">{(sec.names||[]).map((n,i)=>(<div key={i} className="flex gap-1"><input className="input text-xs" value={n} onChange={e=>setSec('breakdown',{names:sec.names.map((x,j)=>j===i?e.target.value:x)})} /><button onClick={()=>setSec('breakdown',{names:sec.names.filter((_,j)=>j!==i)})} className="text-rose-400 px-2">✕</button></div>))}<button onClick={()=>setSec('breakdown',{names:[...(sec.names||[]),'']})} className="text-xs text-indigo-600">+ Add name</button></div></TpLbl></div>);
      case 'garment1': return (<div className="space-y-3"><div className="flex gap-2 flex-wrap"><button onClick={()=>setPickingMockup(true)} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">📚 Pick mockup from library ({garmentMockups?garmentMockups.length:0})</button><button onClick={saveMockupToLibrary} className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">💾 Save to library</button></div><TpRow><TpImage scope={scope} label="Front" value={sec.frontImage} onChange={v=>setSec('garment1',{frontImage:v})} /><TpImage scope={scope} label="Back" value={sec.backImage} onChange={v=>setSec('garment1',{backImage:v})} /></TpRow><TpLbl t="Annotations / callouts"><div className="space-y-1">{(sec.annotations||[]).map((a,i)=>(<div key={i} className="flex gap-1"><input className="input text-xs" value={a} onChange={e=>setSec('garment1',{annotations:sec.annotations.map((x,j)=>j===i?e.target.value:x)})} /><button onClick={()=>setSec('garment1',{annotations:sec.annotations.filter((_,j)=>j!==i)})} className="text-rose-400 px-2">✕</button></div>))}<button onClick={()=>setSec('garment1',{annotations:[...(sec.annotations||[]),'']})} className="text-xs text-indigo-600">+ Add note</button></div></TpLbl></div>);
      case 'collarCuffs': return (<div className="space-y-3"><TpRow><div><TpImage scope={scope} label="Photo 1" value={sec.photo1} onChange={v=>setSec('collarCuffs',{photo1:v})} /><input className="input mt-1 text-xs" value={sec.caption1} onChange={e=>setSec('collarCuffs',{caption1:e.target.value})} /></div><div><TpImage scope={scope} label="Photo 2" value={sec.photo2} onChange={v=>setSec('collarCuffs',{photo2:v})} /><input className="input mt-1 text-xs" value={sec.caption2} onChange={e=>setSec('collarCuffs',{caption2:e.target.value})} /></div></TpRow></div>);
      case 'sizechart': return (<div className="space-y-3"><div className="flex gap-2 flex-wrap"><button onClick={()=>setPickingChart(true)} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">📚 Pick from library ({sizeCharts?sizeCharts.length:0})</button><button onClick={saveChartToLibrary} className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">💾 Save to library</button></div><TpRow><TpLbl t="Title heading"><input className="input" value={sec.titleHeading} onChange={e=>setSec('sizechart',{titleHeading:e.target.value})} /></TpLbl><TpLbl t="Fabric note"><input className="input" value={sec.fabricNote} onChange={e=>setSec('sizechart',{fabricNote:e.target.value})} /></TpLbl></TpRow><TpImage scope={scope} label="Size chart image" value={sec.chartImage} onChange={v=>setSec('sizechart',{chartImage:v})} h="h-72" /><TpRow><TpLbl t="Footer note 1"><input className="input" value={sec.footerNote1} onChange={e=>setSec('sizechart',{footerNote1:e.target.value})} /></TpLbl><TpLbl t="Footer note 2"><input className="input" value={sec.footerNote2} onChange={e=>setSec('sizechart',{footerNote2:e.target.value})} /></TpLbl></TpRow></div>);
      case 'materials': return (<div className="grid grid-cols-3 gap-3">{sec.columns.map((c,i)=>(<div key={i} className="border rounded-lg p-2 space-y-2"><input className="input text-xs font-semibold" value={c.title} onChange={e=>setSec('materials',{columns:sec.columns.map((x,j)=>j===i?{...x,title:e.target.value}:x)})} /><TpImage scope={scope} value={c.image} onChange={v=>setSec('materials',{columns:sec.columns.map((x,j)=>j===i?{...x,image:v}:x)})} h="h-28" /><input className="input text-xs" placeholder="Name" value={c.name} onChange={e=>setSec('materials',{columns:sec.columns.map((x,j)=>j===i?{...x,name:e.target.value}:x)})} /><input className="input text-xs" placeholder="Color code" value={c.colorCode} onChange={e=>setSec('materials',{columns:sec.columns.map((x,j)=>j===i?{...x,colorCode:e.target.value}:x)})} /></div>))}<button onClick={()=>setSec('materials',{columns:[...sec.columns,{title:'',name:'',colorCode:'',image:''}]})} className="text-xs text-indigo-600 self-start">+ Add material</button></div>);
      case 'trims': return (<div className="space-y-3"><div className="grid grid-cols-3 gap-3">{sec.columns.map((c,i)=>(<div key={i} className="border rounded-lg p-2 space-y-2"><input className="input text-xs font-semibold" value={c.title} onChange={e=>setSec('trims',{columns:sec.columns.map((x,j)=>j===i?{...x,title:e.target.value}:x)})} /><TpImage scope={scope} value={c.image} onChange={v=>setSec('trims',{columns:sec.columns.map((x,j)=>j===i?{...x,image:v}:x)})} h="h-28" /><input className="input text-xs" placeholder="Name" value={c.name} onChange={e=>setSec('trims',{columns:sec.columns.map((x,j)=>j===i?{...x,name:e.target.value}:x)})} /></div>))}</div><div className="border rounded-lg p-2 grid grid-cols-3 gap-2"><input className="input text-xs" value={sec.packaging.title} onChange={e=>setSec('trims',{packaging:{...sec.packaging,title:e.target.value}})} /><input className="input text-xs" value={sec.packaging.type} onChange={e=>setSec('trims',{packaging:{...sec.packaging,type:e.target.value}})} /><input className="input text-xs" placeholder="Size" value={sec.packaging.size} onChange={e=>setSec('trims',{packaging:{...sec.packaging,size:e.target.value}})} /></div></div>);
      case 'graphicFront': case 'graphicBack': { const k=pageType; return (<div className="space-y-3"><TpRow><TpImage scope={scope} label="Artwork" value={sec.artworkImage} onChange={v=>setSec(k,{artworkImage:v})} /><TpImage scope={scope} label="Placement" value={sec.placementImage} onChange={v=>setSec(k,{placementImage:v})} /></TpRow><TpLbl t="Width label"><input className="input" value={sec.widthLabel} onChange={e=>setSec(k,{widthLabel:e.target.value})} /></TpLbl>{['cw1','cw2'].map(cw=>(<div key={cw} className="border rounded-lg p-2"><div className="text-[10px] uppercase text-slate-400 mb-1">{cw==='cw1'?'Colourway 1':'Colourway 2'}</div><div className="grid grid-cols-2 gap-2">{['technique','position','size','extra'].map(f=>(<input key={f} className="input text-xs" placeholder={f} value={sec[cw][f]} onChange={e=>setSec(k,{[cw]:{...sec[cw],[f]:e.target.value}})} />))}</div></div>))}</div>); }
      case 'bom': return (<div className="space-y-2"><div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-left text-slate-400">{['Item','Description','Color','Supplier','Qty','Unit','Unit ₱',''].map(h=><th key={h} className="py-1 pr-1">{h}</th>)}</tr></thead><tbody>{(sec.rows||[]).map((r,i)=>(<tr key={i}>{['item','description','color','supplier','qty','unit','price'].map(f=><td key={f} className="pr-1 py-0.5"><input className="input text-xs px-1 py-1" value={r[f]||''} onChange={e=>setSec('bom',{rows:sec.rows.map((x,j)=>j===i?{...x,[f]:e.target.value}:x)})} /></td>)}<td><button onClick={()=>setSec('bom',{rows:sec.rows.filter((_,j)=>j!==i)})} className="text-rose-400 px-1">✕</button></td></tr>))}</tbody></table></div><button onClick={()=>setSec('bom',{rows:[...(sec.rows||[]),{item:'',description:'',color:'',supplier:'',qty:'',unit:'',price:''}]})} className="text-xs text-indigo-600">+ Add row</button></div>);
      case 'signatures': return (<div className="space-y-3"><TpLbl t="Warning"><textarea className="input min-h-[50px]" value={sec.warning} onChange={e=>setSec('signatures',{warning:e.target.value})} /></TpLbl><div className="space-y-1">{sec.rows.map((r,i)=>(<div key={i} className="grid grid-cols-3 gap-1"><input className="input text-xs" value={r.role} onChange={e=>setSec('signatures',{rows:sec.rows.map((x,j)=>j===i?{...x,role:e.target.value}:x)})} /><input className="input text-xs" placeholder="Name" value={r.name} onChange={e=>setSec('signatures',{rows:sec.rows.map((x,j)=>j===i?{...x,name:e.target.value}:x)})} /><input type="date" className="input text-xs" value={r.date} onChange={e=>setSec('signatures',{rows:sec.rows.map((x,j)=>j===i?{...x,date:e.target.value}:x)})} /></div>))}</div><TpLbl t="Footer note"><input className="input" value={sec.footerNote} onChange={e=>setSec('signatures',{footerNote:e.target.value})} /></TpLbl></div>);
      default: return null;
    }
  }
  function sizeTableEditor(){ const s=sec; return (<div className="border rounded-lg p-2"><div className="text-[10px] uppercase text-slate-400 mb-1">Size table</div><table className="w-full text-xs"><thead><tr className="text-slate-400"><th className="text-left">Size</th><th>{s.sizeColMale}</th><th>{s.sizeColFemale}</th><th></th></tr></thead><tbody>{s.sizeRows.map((r,i)=>(<tr key={i}><td><input className="input text-xs px-1 py-1" value={r.size} onChange={e=>setSec(pageType,{sizeRows:s.sizeRows.map((x,j)=>j===i?{...x,size:e.target.value}:x)})} /></td><td><input className="input text-xs px-1 py-1" value={r.male} onChange={e=>setSec(pageType,{sizeRows:s.sizeRows.map((x,j)=>j===i?{...x,male:e.target.value}:x)})} /></td><td><input className="input text-xs px-1 py-1" value={r.female} onChange={e=>setSec(pageType,{sizeRows:s.sizeRows.map((x,j)=>j===i?{...x,female:e.target.value}:x)})} /></td><td><button onClick={()=>setSec(pageType,{sizeRows:s.sizeRows.filter((_,j)=>j!==i)})} className="text-rose-400 px-1">✕</button></td></tr>))}</tbody></table><button onClick={()=>setSec(pageType,{sizeRows:[...s.sizeRows,{size:'',male:'',female:''}]})} className="text-xs text-indigo-600 mt-1">+ Add size</button></div>); }

  // ---- preview ----
  const TP={ box:{border:'1px solid #1a1a1a', display:'flex', flexDirection:'column', overflow:'hidden', minHeight:0}, bar:{background:'#e8e8e8', borderBottom:'1px solid #1a1a1a', padding:'4px 10px', fontSize:'9pt', fontWeight:600}, imgWrap:{flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:'6px', background:'#fff', minHeight:0, overflow:'hidden'}, cell:{border:'1px solid #1a1a1a', padding:'3px 8px', textAlign:'center'} };
  function bullets(t){ return (t||'').split('\n').filter(Boolean).map((l,i)=><div key={i} style={{fontSize:'9pt'}}>{l}</div>); }
  function previewSizeTable(s){ return (<table style={{borderCollapse:'collapse', fontSize:'9pt', width:'100%'}}><thead><tr><th style={{...TP.cell, background:'#f0f0f0'}}>SIZE</th><th style={{...TP.cell, background:'#b0c4de'}}>{s.sizeColMale||'MALE'}</th><th style={{...TP.cell, background:'#f7d5d5'}}>{s.sizeColFemale||'FEMALE'}</th></tr></thead><tbody>{(s.sizeRows||[]).map((r,i)=><tr key={i}><td style={TP.cell}>{r.size}</td><td style={TP.cell}>{r.male}</td><td style={TP.cell}>{r.female}</td></tr>)}<tr style={{fontWeight:700, background:'#f5f5f5'}}><td style={TP.cell}>{s.sizeTotalLabel||'TOTAL'}</td><td style={TP.cell}>{s.totalMale}</td><td style={TP.cell}>{s.totalFemale}</td></tr></tbody></table>); }
  function sectionBody(type, s){
    if(type==='coverMain') return (<div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'10px', minHeight:0}}><div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'14px', width:'100%', maxWidth:'8.5in', justifyItems:'center', marginBottom:'10px', minHeight:0}}><TImg path={s.frontImage} maxH="3.6in" /><TImg path={s.backImage} maxH="3.6in" /></div><div style={{textAlign:'center'}}><div style={{fontWeight:700, color:'#d63031', fontSize:'11pt', marginBottom:'4px'}}>{s.mainLine}</div>{bullets(s.details)}</div></div>);
    if(type==='construction') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gridTemplateRows:'1fr 1fr', gap:'8px', padding:'10px', minHeight:0}}>{(s.boxes||[]).map((b,i)=>(<div key={i} style={TP.box}><div style={TP.bar}>{b.title}</div><div style={TP.imgWrap}><TImg path={b.image} /></div></div>))}</div>);
    if(type==='colourways') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px', padding:'10px', minHeight:0}}>{(s.columns||[]).map((c,i)=>(<div key={i} style={TP.box}><div style={{...TP.bar, fontWeight:600}}>{c.headerTitle||' '}</div><div style={TP.imgWrap}><TImg path={c.image} /></div><div style={{borderTop:'1px solid #1a1a1a'}}><div style={{background:'#e8e8e8', padding:'3px 10px', fontWeight:700, fontSize:'9pt', textAlign:'center', borderBottom:'1px solid #1a1a1a'}}>{c.detailTitle}</div>{(c.detailLines||[]).map((l,j)=><div key={j} style={{padding:'2px 10px', borderBottom:'1px solid #1a1a1a', fontSize:'8.5pt', minHeight:'13px'}}>{l}</div>)}</div></div>))}</div>);
    if(type==='cover1') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', padding:'10px', alignItems:'center'}}><div><div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'8px', justifyItems:'center'}}><TImg path={s.frontImage} maxH="3.8in" /><TImg path={s.backImage} maxH="3.8in" /></div><div style={{textAlign:'center', marginTop:'8px'}}><div style={{fontWeight:700, color:'#d63031', fontSize:'10pt'}}>{s.mainLine}</div>{bullets(s.details)}</div></div><div>{previewSizeTable(s)}</div></div>);
    if(type==='breakdown') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'260px 1fr', gap:'14px', padding:'10px', alignItems:'flex-start'}}><div>{previewSizeTable(s)}</div><table style={{borderCollapse:'collapse', width:'100%', fontSize:'8.5pt'}}><thead><tr><th style={{...TP.cell, background:'#f0f0f0', width:'40px'}}>No.</th><th style={{...TP.cell, background:'#f0f0f0', textAlign:'left'}}>Name</th></tr></thead><tbody>{(s.names||[]).map((n,i)=><tr key={i}><td style={TP.cell}>{i+1}</td><td style={{...TP.cell, textAlign:'left'}}>{n}</td></tr>)}</tbody></table></div>);
    if(type==='garment1'){ const a=s.annotations||[]; const h=Math.ceil(a.length/2); return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 2fr 1fr', gap:'10px', padding:'10px', alignItems:'flex-start'}}><div>{a.slice(0,h).map((x,i)=><div key={i} style={{marginBottom:'10px', padding:'6px 10px', borderRight:'2px solid #d63031', fontSize:'9pt'}}>{x}</div>)}</div><div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'10px', justifyItems:'center'}}><TImg path={s.frontImage} maxH="5in" /><TImg path={s.backImage} maxH="5in" /></div><div>{a.slice(h).map((x,i)=><div key={i} style={{marginBottom:'10px', padding:'6px 10px', borderLeft:'2px solid #d63031', fontSize:'9pt'}}>{x}</div>)}</div></div>); }
    if(type==='collarCuffs') return (<div style={{flex:1, display:'flex', flexDirection:'column', gap:'12px', padding:'14px 20px'}}>{[1,2].map(n=>{ const photo=s['photo'+n], cap=s['caption'+n]; return (<div key={n} style={{border:'2px solid #1a1a1a', padding:'10px', flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:0, background:'#fafafa'}}><TImg path={photo} maxH="2.6in" />{cap&&<div style={{marginTop:'6px', fontWeight:700, fontSize:'9pt'}}>{cap}</div>}</div>); })}</div>);
    if(type==='sizechart') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', padding:'10px', alignItems:'center'}}><div style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}><TImg path={s.chartImage} maxH="5.5in" />{s.fabricNote&&<div style={{marginTop:'10px', fontSize:'9pt', fontWeight:700}}>{s.fabricNote}</div>}</div><div style={{textAlign:'center'}}><div style={{fontSize:'16pt', fontWeight:700, fontStyle:'italic', letterSpacing:'1px', color:'#1d3557'}}>Steeze</div><div style={{letterSpacing:'1px', marginBottom:'10px', fontSize:'11pt'}}>{s.titleHeading}</div>{s.footerNote1&&<div style={{fontSize:'9pt', fontWeight:700, marginTop:'8px'}}>{s.footerNote1}</div>}{s.footerNote2&&<div style={{fontSize:'9pt'}}>{s.footerNote2}</div>}</div></div>);
    if(type==='materials') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px', padding:'10px'}}>{(s.columns||[]).map((c,i)=>(<div key={i} style={TP.box}><div style={{background:'#f0f0f0', borderBottom:'1px solid #1a1a1a', padding:'6px 10px', fontWeight:700, fontSize:'10pt', textAlign:'center'}}>{c.title}</div><div style={{padding:'6px 10px', fontSize:'9pt'}}><strong>FABRIC NAME:</strong> {c.name}</div><div style={{padding:'6px 10px', fontSize:'9pt', borderBottom:'1px solid #d0d0d0'}}><strong>COLOR CODE:</strong> {c.colorCode}</div><div style={{...TP.imgWrap, background:'#fafafa', minHeight:'2in'}}><TImg path={c.image} /></div></div>))}</div>);
    if(type==='trims') return (<div style={{flex:1, padding:'10px', display:'flex', flexDirection:'column', gap:'8px'}}><div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', border:'1px solid #1a1a1a', flex:1, minHeight:0}}>{(s.columns||[]).map((c,i,arr)=>(<div key={i} style={{borderRight:i<arr.length-1?'1px solid #1a1a1a':'none', display:'flex', flexDirection:'column', minHeight:0}}><div style={{background:'#f0f0f0', padding:'6px 10px', fontWeight:700, fontSize:'10pt', borderBottom:'1px solid #1a1a1a'}}>{c.title}</div><div style={{padding:'6px 10px', borderBottom:'1px solid #d0d0d0', fontSize:'9.5pt', fontWeight:700}}>{c.name}</div><div style={{...TP.imgWrap, background:'#fafafa'}}><TImg path={c.image} /></div></div>))}</div>{s.packaging&&<div style={{border:'1px solid #1a1a1a', padding:'8px 12px', fontSize:'9.5pt'}}><div style={{fontWeight:700, marginBottom:'4px'}}>{s.packaging.title||'PACKAGING'}</div><div><strong>PACKAGING TYPE:</strong> {s.packaging.type}</div><div><strong>SIZE:</strong> {s.packaging.size}</div></div>}</div>);
    if(type==='graphicFront'||type==='graphicBack') return (<div style={{flex:1, padding:'10px', display:'flex', flexDirection:'column', gap:'10px', minHeight:0}}><div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px', minHeight:0}}>{['artworkImage','placementImage'].map((k,i)=>(<div key={k} style={TP.box}><div style={{...TP.bar}}>{i===0?'GRAPHIC ARTWORK LAYOUT AND MEASUREMENTS':'GRAPHIC PLACEMENT'}</div><div style={{...TP.imgWrap, position:'relative'}}><TImg path={s[k]} />{i===0&&s.widthLabel&&<div style={{position:'absolute', bottom:'4px', color:'#d63031', fontWeight:700, fontSize:'9pt'}}>← {s.widthLabel} →</div>}</div></div>))}</div><div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>{['cw1','cw2'].map((cw,i)=>{ const d=s[cw]||{}; return (<div key={cw} style={{border:'1px solid #1a1a1a'}}><div style={{background:'#e8e8e8', padding:'4px 10px', fontWeight:700, fontSize:'9pt', borderBottom:'1px solid #1a1a1a'}}>GRAPHIC COLOUR(S): COLOURWAY 0{i+1}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Technique: {d.technique}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Position: {d.position}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Size: {d.size}</div>{d.extra&&<div style={{padding:'3px 10px', fontSize:'9pt'}}>{d.extra}</div>}</div>); })}</div></div>);
    if(type==='bom'){ const rows=[...(s.rows||[])]; while(rows.length<8) rows.push({}); return (<div style={{flex:1, padding:'10px'}}><table style={{borderCollapse:'collapse', width:'100%', fontSize:'8pt'}}><thead><tr>{['ITEM','DESCRIPTION','COLOR','SUPPLIER','QTY','UNIT','UNIT ₱'].map(h=><th key={h} style={{...TP.cell, background:'#f0f0f0'}}>{h}</th>)}</tr></thead><tbody>{rows.map((r,i)=>(<tr key={i}>{['item','description','color','supplier','qty','unit','price'].map(k=><td key={k} style={{...TP.cell, textAlign:'left', height:'22px'}}>{r[k]||''}</td>)}</tr>))}</tbody></table></div>); }
    if(type==='signatures') return (<div style={{flex:1, padding:'10px'}}>{s.warning&&<div style={{textAlign:'center', color:'#d63031', fontWeight:700, fontSize:'10pt', padding:'4px 10px'}}>{s.warning}</div>}<table style={{borderCollapse:'collapse', width:'100%', fontSize:'9.5pt', marginTop:'6px'}}><thead><tr>{['','NAME','SIGNATURE','DATE'].map(h=><th key={h} style={{...TP.cell, background:'#f0f0f0'}}>{h}</th>)}</tr></thead><tbody>{(s.rows||[]).map((r,i)=>(<tr key={i}><td style={{...TP.cell, textAlign:'left', fontWeight:700, background:'#fafafa'}}>{r.role}</td><td style={{...TP.cell, textAlign:'left'}}>{r.name}</td><td style={{...TP.cell, height:'30px'}}></td><td style={{...TP.cell, textAlign:'left'}}>{r.date}</td></tr>))}</tbody></table>{s.footerNote&&<div style={{marginTop:'10px', color:'#d63031', fontWeight:700, fontSize:'9pt'}}>{s.footerNote}</div>}</div>);
    return null;
  }

  return (
    <div className="tp-root fixed inset-0 bg-slate-100 z-50 overflow-auto">
      <div className="no-print sticky top-0 bg-white border-b px-5 py-3 flex items-center justify-between gap-3 flex-wrap z-10">
        <div className="min-w-0"><div className="font-bold text-slate-900 truncate">Techpack — {tp.styleName||lead.title}</div><div className="text-xs text-slate-500">{tp.clientName}</div></div>
        <div className="flex items-center gap-2">
          {readOnly ? <div className="text-xs text-slate-500 px-2 py-1 bg-slate-100 rounded">📋 Preview (read-only)</div> : <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setMode('edit')} className={`px-3 py-1.5 rounded-md ${mode==='edit'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Edit</button><button onClick={()=>setMode('preview')} className={`px-3 py-1.5 rounded-md ${mode==='preview'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Preview</button></div>}
          {mode==='preview' && <button onClick={()=>window.print()} className="px-3 py-2 rounded-lg border text-sm hover:bg-slate-50">🖨 Print</button>}
          {!readOnly && <button onClick={save} disabled={saving} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold disabled:opacity-50">{saving?'Saving…':'Save'}</button>}

function InventoryView({ suppliers, items, departments, reload }){

  const lowCount=(items||[]).filter(i=>Number(i.qty||0)<=Number(i.reorder||0) && Number(i.reorder||0)>0).length;
  const rows=(items||[]).filter(i=>(!search||`${i.sku} ${i.name} ${i.brand} ${i.model}`.toLowerCase().includes(search.toLowerCase()))&&(!filterCat||i.category===filterCat)&&(!showLow||(Number(i.qty||0)<=Number(i.reorder||0) && Number(i.reorder||0)>0)));
  async function del(id){ if(!confirm('Delete this item?')) return; const {error}=await sb.from('items').delete().eq('id',id); if(error){ alert(error.message); return; } reload(); }

  return (
    <div className="p-6">

        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">📦 Inventory</h1><p className="text-slate-500 text-sm">{items.length} items · {peso(totalValue)} value · {lowCount} below reorder</p></div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setImporting(true)} className="px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">⇪ Import CSV</button>
            <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">+ New item</button>
          </div>
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Total items</div><div className="text-2xl font-bold">{items.length}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Total value</div><div className="text-2xl font-bold">{peso(totalValue)}</div></div>
        <button onClick={()=>setShowLow(!showLow)} className={`text-left rounded-xl border p-4 ${showLow?'bg-rose-600 border-rose-600 text-white':'bg-white hover:border-rose-300'}`}><div className={`text-[11px] uppercase ${showLow?'text-rose-100':'text-slate-400'}`}>Below reorder</div><div className="text-2xl font-bold">{lowCount}</div><div className={`text-xs ${showLow?'text-rose-100':'text-slate-500'}`}>{showLow?'filtering':'click to filter'}</div></button>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Categories</div><div className="text-2xl font-bold">{cats.length}</div></div>
      </div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search SKU, name, brand…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-72" />
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All categories</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">SKU</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">Supplier</th><th className="text-right px-3 py-2">Qty</th><th className="text-right px-3 py-2">Cost ₱</th><th className="text-right px-3 py-2">Value</th><th></th></tr></thead>

          <tr key={i.id} className={`border-t hover:bg-slate-50 ${low?'bg-rose-50/40':''}`}>

      {importing && <ItemImportModal suppliers={suppliers} departments={departments} onClose={()=>setImporting(false)} onDone={()=>{ setImporting(false); reload(); }} />}
    </div>
  );
}

function ItemImportModal({ suppliers, departments, onClose, onDone }){
  const TEMPLATE = 'name,sku,category,brand,model,color,size,unit,qty,cost,price,reorder,department,supplier,location,notes\nMain Fabric White,FAB-001,Fabrics,Texstyle,,White,,yd,100,45,80,20,Fabrics,Texstyle Trading,Shelf A1,\nMetal Zipper 8in,TRM-014,Zippers,YKK,8" Closed,Black,8in,pc,500,12,0,100,Trims,YKK Manila,Bin 3,';
  const [csv,setCsv]=useState(''); const [parsed,setParsed]=useState(null);
  const [step,setStep]=useState('paste'); // paste | preview | importing | done
  const [results,setResults]=useState(null); const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState({ done:0, total:0 });

  function onFile(e){
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>setCsv(String(r.result||'')); r.readAsText(f);
  }
  function copyTemplate(){
    if(navigator.clipboard) navigator.clipboard.writeText(TEMPLATE).then(()=>{}, ()=>{});
    else setCsv(TEMPLATE);
  }
  function getVal(row, headers, col){ const idx=headers.indexOf(col); return idx>=0 ? String(row[idx]||'').trim() : ''; }
  function doParse(){
    const rows=parseCSV(csv.trim());
    if(rows.length<2){ alert('Need at least a header row + one data row.'); return; }
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    if(!headers.includes('name')){ alert('CSV must have a "name" column.'); return; }
    setParsed({ headers, dataRows:rows.slice(1) });
    setStep('preview');
  }
  async function doImport(){
    setBusy(true); setStep('importing');
    const { headers, dataRows } = parsed;
    let inserted=0, deptCreated=0, suppCreated=0; const errors=[];
    const deptMap=new Map(); (departments||[]).forEach(d=>deptMap.set(String(d.name||'').toLowerCase(), d.id));
    const suppMap=new Map(); (suppliers||[]).forEach(s=>suppMap.set(String(s.company||'').toLowerCase(), s.id));

    setProgress({ done:0, total:dataRows.length });
    const payloads=[];
    for(const r of dataRows){
      const name=getVal(r,headers,'name'); if(!name) continue;
      const dn=getVal(r,headers,'department'); const sn=getVal(r,headers,'supplier');
      let dept_id=null, supplier_id=null;
      if(dn){ const k=dn.toLowerCase(); if(deptMap.has(k)) dept_id=deptMap.get(k); else { const { data, error }=await sb.from('departments').insert({ name:dn }).select().single(); if(error) errors.push(`Dept "${dn}" create failed: ${error.message}`); else { dept_id=data.id; deptMap.set(k,data.id); deptCreated++; } } }
      if(sn){ const k=sn.toLowerCase(); if(suppMap.has(k)) supplier_id=suppMap.get(k); else { const { data, error }=await sb.from('suppliers').insert({ company:sn }).select().single(); if(error) errors.push(`Supplier "${sn}" create failed: ${error.message}`); else { supplier_id=data.id; suppMap.set(k,data.id); suppCreated++; } } }
      payloads.push({ name, sku:getVal(r,headers,'sku'), category:getVal(r,headers,'category'), brand:getVal(r,headers,'brand'), model:getVal(r,headers,'model'), color:getVal(r,headers,'color'), size:getVal(r,headers,'size'), unit:getVal(r,headers,'unit')||'pc', qty:Number(getVal(r,headers,'qty'))||0, cost:Number(getVal(r,headers,'cost'))||0, price:Number(getVal(r,headers,'price'))||0, reorder:Number(getVal(r,headers,'reorder'))||0, dept_id, supplier_id, location:getVal(r,headers,'location'), notes:getVal(r,headers,'notes') });
    }
    const chunkSize=100;
    for(let i=0;i<payloads.length;i+=chunkSize){
      const chunk=payloads.slice(i,i+chunkSize);
      const { error }=await sb.from('items').insert(chunk);
      if(error){ errors.push(`Batch ${Math.floor(i/chunkSize)+1}: ${error.message}`); }
      else inserted+=chunk.length;
      setProgress({ done:Math.min(i+chunkSize, payloads.length), total:payloads.length });
    }
    setResults({ inserted, total:payloads.length, deptCreated, suppCreated, errors });
    setStep('done'); setBusy(false);
  }

  return (
    <Modal title="Import Inventory from CSV" onClose={onClose} wide>
      {step==='paste' && (
        <div className="space-y-3">
          <div className="bg-slate-50 border rounded-lg p-3 text-xs text-slate-700">
            <div className="font-semibold mb-1">Required column:</div>
            <div className="mb-2"><code className="bg-white px-1 py-0.5 rounded border">name</code></div>
            <div className="font-semibold mb-1">Optional columns (any order):</div>
            <div className="leading-relaxed">
              <code className="bg-white px-1 py-0.5 rounded border">sku</code>, <code className="bg-white px-1 py-0.5 rounded border">category</code>, <code className="bg-white px-1 py-0.5 rounded border">brand</code>, <code className="bg-white px-1 py-0.5 rounded border">model</code>, <code className="bg-white px-1 py-0.5 rounded border">color</code>, <code className="bg-white px-1 py-0.5 rounded border">size</code>, <code className="bg-white px-1 py-0.5 rounded border">unit</code> (default <code>pc</code>), <code className="bg-white px-1 py-0.5 rounded border">qty</code>, <code className="bg-white px-1 py-0.5 rounded border">cost</code>, <code className="bg-white px-1 py-0.5 rounded border">price</code>, <code className="bg-white px-1 py-0.5 rounded border">reorder</code>, <code className="bg-white px-1 py-0.5 rounded border">department</code>, <code className="bg-white px-1 py-0.5 rounded border">supplier</code>, <code className="bg-white px-1 py-0.5 rounded border">location</code>, <code className="bg-white px-1 py-0.5 rounded border">notes</code>
            </div>
            <div className="mt-2 text-slate-500">Department and supplier are matched by name (case-insensitive). New ones are <b>auto-created</b>.</div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <label className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50 cursor-pointer">📁 Upload .csv file<input type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onFile} /></label>
            <button onClick={()=>setCsv(TEMPLATE)} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Load template</button>
            <button onClick={copyTemplate} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Copy template</button>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide text-slate-500">Or paste CSV here</label>
            <textarea className="input font-mono text-xs" rows="10" value={csv} onChange={e=>setCsv(e.target.value)} placeholder="name,sku,category,…" />
          </div>
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button><button onClick={doParse} disabled={!csv.trim()} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">Parse →</button></div>
        </div>
      )}

      {step==='preview' && parsed && (
        <div className="space-y-3">
          <div className="text-sm text-slate-700">Found <b>{parsed.dataRows.length}</b> rows. Detected columns: <span className="font-mono text-xs">{parsed.headers.join(', ')}</span></div>
          <div className="border rounded-lg overflow-hidden max-h-96 overflow-y-auto"><table className="w-full text-xs">
            <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 sticky top-0"><tr>{parsed.headers.map(h=><th key={h} className="text-left px-2 py-1.5">{h}</th>)}</tr></thead>
            <tbody>{parsed.dataRows.slice(0,50).map((r,i)=>(
              <tr key={i} className="border-t">{parsed.headers.map((h,j)=>(<td key={j} className="px-2 py-1 text-slate-700 truncate max-w-[10rem]">{r[j]||''}</td>))}</tr>
            ))}</tbody>
          </table></div>
          {parsed.dataRows.length>50 && <div className="text-xs text-slate-500">Showing first 50 of {parsed.dataRows.length} rows. All will be imported.</div>}

function SupplierImportModal({ suppliers, onClose, onDone }){
  const TEMPLATE = 'company,contact,email,phone,address,payment_terms,notes\nTexstyle Trading,Anna Cruz,anna@texstyle.com,+63 917 123 4567,Quezon City,30 Days,Main fabric supplier\nYKK Manila,Boy Reyes,sales@ykk.com.ph,+63 2 8888 1234,Makati,COD,';
  const [csv,setCsv]=useState(''); const [parsed,setParsed]=useState(null);
  const [step,setStep]=useState('paste'); // paste | preview | importing | done
  const [results,setResults]=useState(null); const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState({ done:0, total:0 });
  const [skipDupes,setSkipDupes]=useState(true);

  function onFile(e){ const f=e.target.files && e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>setCsv(String(r.result||'')); r.readAsText(f); }
  function copyTemplate(){ if(navigator.clipboard) navigator.clipboard.writeText(TEMPLATE).then(()=>{},()=>{}); else setCsv(TEMPLATE); }
  function getVal(row, headers, col){ const idx=headers.indexOf(col); return idx>=0 ? String(row[idx]||'').trim() : ''; }
  function doParse(){
    const rows=parseCSV(csv.trim());
    if(rows.length<2){ alert('Need at least a header row + one data row.'); return; }
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    if(!headers.includes('company')){ alert('CSV must have a "company" column.'); return; }
    setParsed({ headers, dataRows:rows.slice(1) });
    setStep('preview');
  }
  async function doImport(){
    setBusy(true); setStep('importing');
    const { headers, dataRows } = parsed;
    const existing=new Set((suppliers||[]).map(s=>String(s.company||'').toLowerCase()));
    let inserted=0, skipped=0; const errors=[];
    const payloads=[];
    for(const r of dataRows){
      const company=getVal(r,headers,'company'); if(!company) continue;
      if(skipDupes && existing.has(company.toLowerCase())){ skipped++; continue; }
      existing.add(company.toLowerCase()); // also dedupe within the file
      payloads.push({
        company,
        contact: getVal(r,headers,'contact'),
        email:   getVal(r,headers,'email'),
        phone:   getVal(r,headers,'phone'),
        address: getVal(r,headers,'address'),
        payment_terms: getVal(r,headers,'payment_terms') || getVal(r,headers,'payment terms'),
        notes:   getVal(r,headers,'notes'),
      });
    }
    setProgress({ done:0, total:payloads.length });
    const chunkSize=100;
    for(let i=0;i<payloads.length;i+=chunkSize){
      const chunk=payloads.slice(i,i+chunkSize);
      const { error }=await sb.from('suppliers').insert(chunk);
      if(error){ errors.push(`Batch ${Math.floor(i/chunkSize)+1}: ${error.message}`); }
      else inserted+=chunk.length;
      setProgress({ done:Math.min(i+chunkSize, payloads.length), total:payloads.length });
    }
    setResults({ inserted, skipped, total:dataRows.length, errors });
    setStep('done'); setBusy(false);
  }

  return (
    <Modal title="Import Suppliers from CSV" onClose={onClose} wide>
      {step==='paste' && (
        <div className="space-y-3">
          <div className="bg-slate-50 border rounded-lg p-3 text-xs text-slate-700">
            <div className="font-semibold mb-1">Required column:</div>
            <div className="mb-2"><code className="bg-white px-1 py-0.5 rounded border">company</code></div>
            <div className="font-semibold mb-1">Optional columns (any order):</div>
            <div className="leading-relaxed">
              <code className="bg-white px-1 py-0.5 rounded border">contact</code>, <code className="bg-white px-1 py-0.5 rounded border">email</code>, <code className="bg-white px-1 py-0.5 rounded border">phone</code>, <code className="bg-white px-1 py-0.5 rounded border">address</code>, <code className="bg-white px-1 py-0.5 rounded border">payment_terms</code>, <code className="bg-white px-1 py-0.5 rounded border">notes</code>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <label className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50 cursor-pointer">📁 Upload .csv file<input type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onFile} /></label>
            <button onClick={()=>setCsv(TEMPLATE)} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Load template</button>
            <button onClick={copyTemplate} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Copy template</button>
            <label className="ml-auto inline-flex items-center gap-1.5 text-xs text-slate-600 bg-white border rounded-lg px-3 py-2"><input type="checkbox" checked={skipDupes} onChange={e=>setSkipDupes(e.target.checked)} /> Skip duplicates (by company name)</label>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide text-slate-500">Or paste CSV here</label>
            <textarea className="input font-mono text-xs" rows="10" value={csv} onChange={e=>setCsv(e.target.value)} placeholder="company,contact,email,…" />
          </div>
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button><button onClick={doParse} disabled={!csv.trim()} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">Parse →</button></div>
        </div>
      )}

      {step==='preview' && parsed && (
        <div className="space-y-3">
          <div className="text-sm text-slate-700">Found <b>{parsed.dataRows.length}</b> rows. Detected columns: <span className="font-mono text-xs">{parsed.headers.join(', ')}</span></div>
          <div className="border rounded-lg overflow-hidden max-h-96 overflow-y-auto"><table className="w-full text-xs">
            <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 sticky top-0"><tr>{parsed.headers.map(h=><th key={h} className="text-left px-2 py-1.5">{h}</th>)}</tr></thead>
            <tbody>{parsed.dataRows.slice(0,50).map((r,i)=>(
              <tr key={i} className="border-t">{parsed.headers.map((h,j)=>(<td key={j} className="px-2 py-1 text-slate-700 truncate max-w-[10rem]">{r[j]||''}</td>))}</tr>
            ))}</tbody>
          </table></div>
          {parsed.dataRows.length>50 && <div className="text-xs text-slate-500">Showing first 50 of {parsed.dataRows.length} rows. All will be imported.</div>}
          <div className="flex justify-between"><button onClick={()=>setStep('paste')} className="px-3 py-2 rounded-lg bg-white border text-sm">← Back</button><button onClick={doImport} disabled={busy} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{busy?'Importing…':`Import ${parsed.dataRows.length} suppliers`}</button></div>
        </div>
      )}

      {step==='importing' && (
        <div className="py-8 text-center space-y-3">
          <div className="text-slate-700 font-semibold">Importing…</div>
          <div className="text-xs text-slate-500">{progress.done} of {progress.total} processed</div>
          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-indigo-600 h-2 rounded-full transition-all" style={{ width:`${progress.total?Math.round(progress.done/progress.total*100):0}%` }}></div></div>
        </div>
      )}

      {step==='done' && results && (
        <div className="space-y-3">
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-800">
            <div className="font-semibold mb-1">Import complete</div>
            <div>✓ Inserted <b>{results.inserted}</b> new supplier{results.inserted===1?'':'s'}</div>
            {results.skipped>0 && <div className="text-amber-700">↷ Skipped <b>{results.skipped}</b> duplicate{results.skipped===1?'':'s'} (already exist)</div>}
          </div>
          {results.errors.length>0 && (
            <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-xs text-rose-800 max-h-40 overflow-y-auto">
              <div className="font-semibold mb-1">{results.errors.length} warning{results.errors.length===1?'':'s'}:</div>
              <ul className="list-disc pl-4 space-y-0.5">{results.errors.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <div className="flex justify-end gap-2"><button onClick={onDone} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Done</button></div>
        </div>
      )}
    </Modal>
  );
}

function buildPRFromLead(profile, lead){
  const lines=(lead.items||[]).map(it=>({
    description: `${it.itemType||'Item'}${it.category?` (${it.category})`:''} — for "${lead.title}"`,
    sku:'', item_id:null,
    qty: Number(it.quantity)||0,
    est_cost: Number(it.pricePerItem)||0,
    link:'', notes:'',
  }));
  return {
    number:'PR-'+Date.now().toString().slice(-5),
    date:new Date().toISOString().slice(0,10),
    requested_by: profile.id,
    dept_id:null,
    urgency:'normal',
    status:'submitted',
    justification:`Materials for Closed Won deal "${lead.title}". Lead value ${peso(lead.value)}.`,
    approver_note:'',
    linked_lead_id: lead.id,
    lines: lines.length?lines:[{description:`Materials for "${lead.title}"`, sku:'', item_id:null, qty:1, est_cost:0, link:'', notes:''}],
  };
}

function PurchaseRequestForm({ profile, existing, items, suppliers, departments, leads, onClose, onSaved, onCreatePO, onViewTechpack }){
  const isEdit=!!existing;
  const isAdmin=profile.role==='admin';
  const [f,setF]=useState(existing?{...existing, lines:existing.lines||[]}:{ date:new Date().toISOString().slice(0,10), requested_by:profile.id, dept_id:null, urgency:'normal', status:'submitted', justification:'', approver_note:'', lines:[{description:'',sku:'',item_id:null,qty:1,est_cost:0,link:'',notes:''}] });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const readOnly = f.status==='ordered' || (f.status==='rejected' && !isAdmin);
  const linkedLead = existing&&existing.linked_lead_id ? (leads||[]).find(l=>l.id===existing.linked_lead_id) : null;
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setLine(i,patch){ setF(p=>({...p,lines:p.lines.map((l,j)=>j===i?{...l,...patch}:l)})); }
  function addLine(){ setF(p=>({...p,lines:[...p.lines,{description:'',sku:'',item_id:null,qty:1,est_cost:0,link:'',notes:''}]})); }
  function removeLine(i){ setF(p=>({...p,lines:p.lines.filter((_,j)=>j!==i)})); }
  const total=f.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.est_cost)||0),0);
  async function save(){ if(!f.lines.some(l=>l.description||l.sku||l.item_id)){ setMsg('Add at least one line.'); return; } setBusy(true); setMsg('');
    const payload={ date:f.date, requested_by:f.requested_by||profile.id, dept_id:f.dept_id||null, urgency:f.urgency, status:f.status, justification:f.justification||'', approver_note:f.approver_note||'', lines:f.lines };
    if(!isEdit) payload.number='PR-'+Date.now().toString().slice(-5);
    const { error } = isEdit ? await sb.from('purchase_requests').update(payload).eq('id',existing.id) : await sb.from('purchase_requests').insert(payload);

  async function setStatus(s){ if(!isEdit) return; setBusy(true); const {error}=await sb.from('purchase_requests').update({ status:s, approver_note:f.approver_note||'' }).eq('id',existing.id); setBusy(false); if(error){ alert(error.message); return; } onSaved(); }

    </Modal>

function PurchaseOrderForm({ profile, existing, fromPR, items, suppliers, onClose, onSaved }){
  const isEdit=!!existing;

  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setLine(i,patch){ setF(p=>({...p,lines:p.lines.map((l,j)=>j===i?{...l,...patch}:l)})); }
  function addLine(){ setF(p=>({...p,lines:[...p.lines,{item_id:null, description:'', qty:1, qty_received:0, unit_cost:0}]})); }
  function removeLine(i){ setF(p=>({...p,lines:p.lines.filter((_,j)=>j!==i)})); }
  const total=f.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unit_cost)||0),0);

    const payload={ date:f.date, supplier_id:f.supplier_id, pr_id:f.pr_id||null, status:f.status, notes:f.notes||'', total, lines:f.lines };
    if(!isEdit) payload.number='PO-'+Date.now().toString().slice(-5);

    if(error){ setBusy(false); setMsg(error.message); return; }

    setBusy(false); onSaved(); }
  return (
    <Modal title={isEdit?`PO ${existing.number||existing.id.slice(0,6)}`:'New purchase order'} onClose={onClose} wide>

function PurchaseOrderReceive({ po, items, profile, onClose, onSaved }){
  const [rec,setRec]=useState((po.lines||[]).map(l=>({ ...l, receive_now:0 })));
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(i,v){ setRec(rec.map((r,j)=>j===i?{...r,receive_now:v}:r)); }
  async function save(){ const toPost=rec.filter(r=>Number(r.receive_now)>0); if(!toPost.length){ setMsg('Enter at least one quantity to receive.'); return; } setBusy(true); setMsg('');
    try{
      for(const r of toPost){
        // Update inventory qty (if linked)
        if(r.item_id){
          const it=items.find(x=>x.id===r.item_id); const newQty=Number(it?.qty||0)+Number(r.receive_now);
          const {error}=await sb.from('items').update({ qty:newQty }).eq('id',r.item_id); if(error) throw error;
        }
        // Stock movement
        await sb.from('stock_movements').insert({ item_id:r.item_id||null, type:'in', qty:Number(r.receive_now), reason:'PO receive', ref_type:'po', ref_id:po.id, actor_id:profile.id });
      }
      // Update PO lines + status
      const newLines=rec.map(r=>({ ...r, qty_received:(Number(r.qty_received)||0)+Number(r.receive_now||0), receive_now:undefined }));
      const fully=newLines.every(l=>Number(l.qty_received||0)>=Number(l.qty||0));
      const any=newLines.some(l=>Number(l.qty_received||0)>0);
      const status = fully?'received':(any?'partial':'open');
      const {error}=await sb.from('purchase_orders').update({ lines:newLines.map(({receive_now,...rest})=>rest), status, received_at: fully?new Date().toISOString().slice(0,10):po.received_at }).eq('id',po.id); if(error) throw error;
      onSaved();
    } catch(err){ setBusy(false); setMsg(err.message||String(err)); }
  }
  return (
    <Modal title={`Receive PO ${po.number||''}`} onClose={onClose} wide>
      <div className="space-y-3">
