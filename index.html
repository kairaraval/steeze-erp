function StylesView({ styles, items, suppliers, departments, profile, reload }){
  const [search,setSearch]=useState(''); const [editing,setEditing]=useState(null); const [creating,setCreating]=useState(false);
  const rows=(styles||[]).filter(s=>!search||`${s.number} ${s.name} ${s.category} ${s.fabric}`.toLowerCase().includes(search.toLowerCase()));
  function bomCost(s){ return (s.bom_rows||[]).reduce((sum,r)=>sum+(Number(r.qty)||0)*(Number(r.unit_cost)||0),0); }
  function totalCost(s){ return bomCost(s)+Number(s.decoration_cost||0)+Number(s.labor_cost||0); }
  function margin(s){ const sell=Number(s.sell_price||0); if(!sell) return null; return ((sell-totalCost(s))/sell*100); }
  async function del(id){ if(!confirm('Delete this style?')) return; const {error}=await sb.from('styles').delete().eq('id',id); if(error){ alert(error.message); return; } reload(); }
  const cats=Array.from(new Set((styles||[]).map(s=>s.category).filter(Boolean))).sort();
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">👕 Styles & BOMs</h1><p className="text-slate-500 text-sm">{styles.length} style{styles.length===1?'':'s'} · {cats.length} categor{cats.length===1?'y':'ies'}</p></div>
          <div className="flex items-center gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" /><button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">+ New style</button></div>
        </div>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Style #</th><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Category</th><th className="text-left px-3 py-2">Fabric</th><th className="text-right px-3 py-2">Sell ₱</th><th className="text-right px-3 py-2">Total cost</th><th className="text-right px-3 py-2">Margin</th><th></th></tr></thead>
        <tbody>{rows.map(s=>{ const m=margin(s); const lowMargin=m!==null&&m<20; return (
          <tr key={s.id} className={`border-t hover:bg-slate-50 cursor-pointer ${lowMargin?'bg-rose-50/40':''}`} onClick={()=>setEditing(s)}>
            <td className="px-3 py-2 font-mono text-xs">{s.number||'—'}</td>
            <td className="px-3 py-2 font-medium">{s.name}</td>
            <td className="px-3 py-2 text-xs">{s.category||'—'}</td>
            <td className="px-3 py-2 text-xs">{s.fabric||'—'}</td>
            <td className="px-3 py-2 text-right">{peso(s.sell_price)}</td>
            <td className="px-3 py-2 text-right">{peso(totalCost(s))}</td>
            <td className={`px-3 py-2 text-right font-semibold ${m===null?'text-slate-400':m>=30?'text-emerald-700':m>=20?'text-amber-700':'text-rose-700'}`}>{m===null?'—':m.toFixed(1)+'%'}</td>
            <td className="px-3 py-2 text-right"><button onClick={(e)=>{e.stopPropagation(); del(s.id);}} className="text-xs text-rose-500 hover:underline">Delete</button></td>
          </tr>
        ); })}{rows.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No styles yet. Click "+ New style" to add one.</td></tr>}</tbody>
      </table></div></div>
      {(creating||editing) && <StyleForm existing={editing} items={items} suppliers={suppliers} departments={departments} profile={profile} reloadItems={reload} onClose={()=>{ setCreating(false); setEditing(null); }} onSaved={()=>{ setCreating(false); setEditing(null); reload(); }} />}
    </div>
  );
}

function StyleForm({ existing, items, suppliers, departments, profile, onClose, onSaved, reloadItems }){
  const isEdit=!!existing;
  const [f,setF]=useState(existing?{...existing, bom_rows:existing.bom_rows||[]}:{ name:'', category:'', fabric:'', sell_price:0, decoration_cost:0, labor_cost:0, notes:'', bom_rows:[{item_id:null, sku:'', name:'', qty:1, unit:'pc', unit_cost:0}] });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const [addingItem,setAddingItem]=useState(false); const [addingForRow,setAddingForRow]=useState(null);
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setRow(i,patch){ setF(p=>({...p,bom_rows:p.bom_rows.map((r,j)=>j===i?{...r,...patch}:r)})); }
  function addRow(){ setF(p=>({...p,bom_rows:[...p.bom_rows,{item_id:null, sku:'', name:'', qty:1, unit:'pc', unit_cost:0}]})); }
  function removeRow(i){ setF(p=>({...p,bom_rows:p.bom_rows.filter((_,j)=>j!==i)})); }
  function pickItem(i, itemId){ if(itemId==='__new__'){ setAddingForRow(i); setAddingItem(true); return; } const it=items.find(x=>x.id===itemId); setRow(i,{ item_id:itemId||null, sku:it?.sku||'', name:it?.name||'', unit:it?.unit||'pc', unit_cost:it?.cost||0 }); }
  const materialCost=f.bom_rows.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.unit_cost)||0),0);
  const totalCost=materialCost+Number(f.decoration_cost||0)+Number(f.labor_cost||0);
  const grossProfit=Number(f.sell_price||0)-totalCost;
  const marginPct=Number(f.sell_price||0)>0?(grossProfit/Number(f.sell_price)*100):null;
  async function save(){ if(!f.name.trim()){ setMsg('Name is required.'); return; } setBusy(true); setMsg('');
    const payload={ name:f.name.trim(), category:f.category||'', fabric:f.fabric||'', sell_price:Number(f.sell_price)||0, decoration_cost:Number(f.decoration_cost)||0, labor_cost:Number(f.labor_cost)||0, notes:f.notes||'', bom_rows:f.bom_rows };
    if(!isEdit) payload.number='STY-'+Date.now().toString().slice(-5);
    const { error } = isEdit ? await sb.from('styles').update(payload).eq('id',existing.id) : await sb.from('styles').insert(payload);
    setBusy(false); if(error){ setMsg(error.message); return; } onSaved(); }
  return (
    <Modal title={isEdit?'Edit style':'New style'} onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Style name *"><input className="input" value={f.name} onChange={e=>up('name',e.target.value)} /></TpLbl>
          <TpLbl t="Category"><input className="input" value={f.category} onChange={e=>up('category',e.target.value)} placeholder="e.g. Polo, Jacket" /></TpLbl>
          <TpLbl t="Fabric"><input className="input" value={f.fabric} onChange={e=>up('fabric',e.target.value)} /></TpLbl>
        </div>

        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Bill of Materials</div><button onClick={addRow} className="text-xs text-indigo-600 font-semibold">+ Add row</button></div>
          <div className="space-y-2">{f.bom_rows.map((r,i)=>(
            <div key={i} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-end">
              <div className="col-span-5"><label className="text-[10px] text-slate-500 uppercase">Material (from inventory)</label><select className="input mt-0.5 text-xs" value={r.item_id||''} onChange={e=>pickItem(i,e.target.value)}><option value="">— pick —</option>{items.map(it=><option key={it.id} value={it.id}>{it.name}{it.sku?' · '+it.sku:''}</option>)}<option value="__new__">+ Add new inventory item…</option></select>{r.name && <div className="text-[10px] text-slate-500 mt-0.5">{r.name}{r.sku?' · '+r.sku:''}</div>}</div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5 text-xs" value={r.qty} onChange={e=>setRow(i,{qty:e.target.value})} /></div>
              <div className="col-span-1"><label className="text-[10px] text-slate-500 uppercase">Unit</label><input className="input mt-0.5 text-xs" value={r.unit||'pc'} onChange={e=>setRow(i,{unit:e.target.value})} /></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Unit cost ₱</label><input type="number" className="input mt-0.5 text-xs" value={r.unit_cost} onChange={e=>setRow(i,{unit_cost:e.target.value})} /></div>
              <div className="col-span-1 text-right text-xs"><div className="text-[10px] uppercase text-slate-500">Total</div><div className="font-semibold">{peso(Number(r.qty||0)*Number(r.unit_cost||0))}</div></div>
              <div className="col-span-1 text-right"><button onClick={()=>removeRow(i)} className="text-rose-400 text-sm">✕</button></div>
            </div>
          ))}</div>
          <div className="text-right mt-2 text-sm"><span className="text-slate-500 mr-2">Material cost:</span><span className="font-semibold">{peso(materialCost)}</span></div>
        </div>

        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Sell price ₱"><input type="number" className="input" value={f.sell_price} onChange={e=>up('sell_price',e.target.value)} /></TpLbl>
          <TpLbl t="Decoration cost ₱ (print/embroidery)"><input type="number" className="input" value={f.decoration_cost} onChange={e=>up('decoration_cost',e.target.value)} /></TpLbl>
          <TpLbl t="Labor cost ₱"><input type="number" className="input" value={f.labor_cost} onChange={e=>up('labor_cost',e.target.value)} /></TpLbl>
        </div>

        <div className="bg-slate-900 text-white rounded-xl p-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          <div><div className="text-[10px] uppercase text-slate-400">Material</div><div className="font-bold">{peso(materialCost)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Total cost</div><div className="font-bold">{peso(totalCost)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Gross profit</div><div className={`font-bold ${grossProfit>=0?'text-emerald-400':'text-rose-400'}`}>{peso(grossProfit)}</div></div>
          <div><div className="text-[10px] uppercase text-slate-400">Margin</div><div className={`font-bold ${marginPct===null?'text-slate-500':marginPct>=30?'text-emerald-400':marginPct>=20?'text-amber-400':'text-rose-400'}`}>{marginPct===null?'—':marginPct.toFixed(1)+'%'}</div></div>
        </div>

        <TpLbl t="Notes"><textarea className="input min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save changes':'Create style')}</button>
      </div>
      {addingItem && <ItemForm suppliers={suppliers} departments={departments} onClose={()=>{ setAddingItem(false); setAddingForRow(null); }} onSaved={(newItem)=>{ setAddingItem(false); const r=addingForRow; setAddingForRow(null); if(newItem && r!=null){ setRow(r,{ item_id:newItem.id, sku:newItem.sku||'', name:newItem.name, unit:newItem.unit||'pc', unit_cost:newItem.cost||0 }); } reloadItems && reloadItems(); }} />}
    </Modal>
  );
}

/* ----------------------- App ----------------------- */
function App(){
  const [session,setSession]=useState(undefined); const [profile,setProfile]=useState(null); const [profiles,setProfiles]=useState([]);
  const [clients,setClients]=useState([]); const [leads,setLeads]=useState([]); const [mentions,setMentions]=useState([]);
  const [activityCounts,setActivityCounts]=useState({});
  const [prodJobs,setProdJobs]=useState([]); const [graphicJobs,setGraphicJobs]=useState([]); const [printingJobs,setPrintingJobs]=useState([]); const [sampleJobs,setSampleJobs]=useState([]);
  const [sizeCharts,setSizeCharts]=useState([]); const [garmentMockups,setGarmentMockups]=useState([]);
  const [styles,setStyles]=useState([]);
  const [items,setItems]=useState([]); const [suppliers,setSuppliers]=useState([]); const [departments,setDepartments]=useState([]);
  const [requests,setRequests]=useState([]); const [orders,setOrders]=useState([]);
  const [pendingInvites,setPendingInvites]=useState([]);
  const [createPOFromPR,setCreatePOFromPR]=useState(null);
  const [loadErr,setLoadErr]=useState(''); const [view,setView]=useState('dashboard');
  const [detailLead,setDetailLead]=useState(null); const [editLead,setEditLead]=useState(null); const [activityLead,setActivityLead]=useState(null);
  const [detailLeadHideActivity,setDetailLeadHideActivity]=useState(false);
  // When opening a lead from Graphic/Printing, hide the lead-activity panel so the
  // dept team only sees the order info — not the sales team's internal chat.
  const openLeadFromDept=(lead)=>{ setDetailLeadHideActivity(true); setDetailLead(lead); };
  const openLeadFull=(lead)=>{ setDetailLeadHideActivity(false); setDetailLead(lead); };
  const closeLeadDetail=()=>{ setDetailLead(null); setDetailLeadHideActivity(false); };
  const [sendGraphicLead,setSendGraphicLead]=useState(null); const [sendPrintLead,setSendPrintLead]=useState(null); const [showNew,setShowNew]=useState(false);
  const [selectedClient,setSelectedClient]=useState(null);
  const [techpackLead,setTechpackLead]=useState(null);
  const [techpackReadOnly,setTechpackReadOnly]=useState(false);
  const openTechpackEdit=(lead)=>{ setTechpackReadOnly(false); setTechpackLead(lead); };
  const openTechpackView=(lead)=>{ setTechpackReadOnly(true); setTechpackLead(lead); };
  const [deptActivity,setDeptActivity]=useState(null); // { job, jobType, title }
  // Collapsible sidebar groups — remembered across reloads.
  const [collapsedGroups,setCollapsedGroups]=useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem('steeze.sidebar.collapsed')||'[]')); }
    catch(_) { return new Set(); }
  });
  function toggleGroup(g){ setCollapsedGroups(prev=>{ const n=new Set(prev); if(n.has(g)) n.delete(g); else n.add(g); try{ localStorage.setItem('steeze.sidebar.collapsed', JSON.stringify([...n])); }catch(_){} return n; }); }

  // Mention notifications: mute toggle + toast + ref to keep callback fresh.
  const [muted,setMuted]=useState(()=>{ try{ return localStorage.getItem('steeze.notifications.muted')==='1'; }catch(_){ return false; } });
  function toggleMute(){ setMuted(m=>{ const n=!m; try{ localStorage.setItem('steeze.notifications.muted', n?'1':'0'); }catch(_){} return n; }); }
  const mutedRef=useRef(muted); useEffect(()=>{ mutedRef.current=muted; },[muted]);
  const [toast,setToast]=useState(null); // { title, body }
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),5000); return ()=>clearTimeout(t); },[toast]);

  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session)); const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);

  async function loadAll(){
    if(!session) return; setLoadErr(''); const me=session.user.id;
    const [pf,pr,cl,ld,lm,dm,ac,pj,gj,prj,it,sp,dp,pq,po,sj,sc,gm,st,pi]=await Promise.all([
      sb.from('profiles').select('*').eq('id',me).single(),
      sb.from('profiles').select('*'),
      sb.from('clients').select('*').order('company'),
      sb.from('leads').select('*').order('created_at',{ ascending:false }),
      sb.from('lead_activity').select('*').contains('mentions',[me]).order('created_at',{ ascending:false }),
      sb.from('dept_job_activity').select('*').contains('mentions',[me]).order('created_at',{ ascending:false }),
      sb.from('lead_activity').select('lead_id').eq('type','comment'),
      sb.from('production_jobs').select('*').order('created_at',{ ascending:false }),
      sb.from('graphic_design_jobs').select('*').order('created_at',{ ascending:false }),
      sb.from('printing_jobs').select('*').order('created_at',{ ascending:false }),
      sb.from('items').select('*').order('name'),
      sb.from('suppliers').select('*').order('company'),
      sb.from('departments').select('*').order('name'),
      sb.from('purchase_requests').select('*').order('created_at',{ascending:false}),
      sb.from('purchase_orders').select('*').order('created_at',{ascending:false}),
      sb.from('sampling_jobs').select('*').order('created_at',{ascending:false}),
      sb.from('size_charts').select('*').order('name'),
      sb.from('garment_mockups').select('*').order('name'),
      sb.from('styles').select('*').order('created_at',{ascending:false}),
      sb.from('pending_invites').select('*').order('created_at',{ascending:false}),
    ]);
    const firstErr=[pf,pr,cl,ld,lm,dm,ac,pj,gj,prj,it,sp,dp,pq,po,sj,sc,gm,st].find(r=>r.error); if(firstErr) setLoadErr(firstErr.error.message);
    // pending_invites may be RLS-denied for non-admins; that's expected, fail silently
    setPendingInvites(pi && pi.data ? pi.data : []);
    if(pf.data) setProfile(pf.data); setProfiles(pr.data||[]); setClients(cl.data||[]); setLeads(ld.data||[]);
    const leadMentions=(lm.data||[]).map(r=>({ ...r, source:'lead' }));
    const deptMentions=(dm.data||[]).map(r=>({ ...r, source:r.job_type }));
    setMentions([...leadMentions,...deptMentions].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')));
    const counts={}; (ac.data||[]).forEach(r=>{ counts[r.lead_id]=(counts[r.lead_id]||0)+1; }); setActivityCounts(counts);
    setProdJobs(pj.data||[]); setGraphicJobs(gj.data||[]); setPrintingJobs(prj.data||[]);
    setItems(it.data||[]); setSuppliers(sp.data||[]); setDepartments(dp.data||[]);
    setRequests(pq.data||[]); setOrders(po.data||[]);
    setSampleJobs(sj.data||[]);
    setSizeCharts(sc.data||[]); setGarmentMockups(gm.data||[]);
    setStyles(st.data||[]);
  }
  useEffect(()=>{ if(session) loadAll(); },[session]);
  useEffect(()=>{ setSelectedClient(null); },[view]);
  // Assistants only have Sales + Production tabs. If they land anywhere else
  // (Dashboard, Team, Operations, Purchasing, Other) bounce to Sales Pipeline.
  useEffect(()=>{
    if(!profile || profile.role!=='assistant') return;
    const allowed = new Set(['inbox','pipeline','techpacks','clients','profile','prod','sampling','graphic','printing']);
    if(!allowed.has(view)) setView('pipeline');
  },[profile, view]);

  // Realtime: ping + toast the moment someone @mentions you anywhere.
  useEffect(()=>{
    if(!profile || !profile.id) return;
    const me = profile.id;
    function maybeNotify(row){
      if(!row || !Array.isArray(row.mentions)) return;
      if(!row.mentions.includes(me)) return;
      if(row.actor_id === me) return;             // don't ping yourself
      if(!mutedRef.current) playPing();
      const snippet = (row.text||'').replace(/@\[[^\]]+\]\([^)]+\)/g,'@').slice(0,140);
      setToast({ title:'New @mention', body: snippet || 'You were tagged in a comment.' });
      loadAll();
    }
    const ch = sb.channel('mentions-'+me)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'lead_activity' },     (p)=>maybeNotify(p.new))
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'dept_job_activity' }, (p)=>maybeNotify(p.new))
      .subscribe();
    return ()=>{ try{ sb.removeChannel(ch); }catch(_){} };
  },[profile && profile.id]);

  async function sendLeadToPR(lead){
    const payload=buildPRFromLead(profile, lead);
    const { data, error }=await sb.from('purchase_requests').insert(payload).select().single();
    if(error){ alert(error.message); return; }
    alert('Created '+(data.number||'PR')+' from "'+lead.title+'". Opening Purchase Requests…');
    setView('requests'); loadAll();
  }
  async function sendLeadToSampling(lead){
    const client=clients.find(c=>c.id===lead.client_id);
    const items=(lead.items||[]).map(it=>({ itemType:it.itemType, category:it.category||'', quantity:Number(it.quantity)||0 }));
    const qty=items.reduce((s,it)=>s+it.quantity,0);
    const { error }=await sb.from('sampling_jobs').insert({ number:'SMP-'+Date.now().toString().slice(-5), lead_id:lead.id, client_id:lead.client_id, client_name:client?.company||'', item:lead.title, items, quantity:qty, status:'endorsed', due_date:lead.delivery_date||null });
    if(error){ alert(error.message); return; }
    alert('Sent "'+lead.title+'" to Sampling Board.'); setDetailLead(null); setView('sampling'); loadAll();
  }
  async function sendToProduction(lead){
    const client=clients.find(c=>c.id===lead.client_id);
    const items=(lead.items||[]).map(it=>({ itemType:it.itemType, category:it.category||'', quantity:Number(it.quantity)||0 }));
    const qty=items.reduce((s,it)=>s+it.quantity,0);
    const { error }=await sb.from('production_jobs').insert({ number:'PROD-'+Date.now().toString().slice(-5), lead_id:lead.id, client_id:lead.client_id, client_name:client?.company||'', item:lead.title, items, quantity:qty, status:'materials to purchase', due_date:lead.delivery_date||null, sales_owner_id: lead.manager_id||null });
    if(error){ alert(error.message); return; } alert('Sent "'+lead.title+'" to Production.'); setDetailLead(null); setView('prod'); loadAll();
  }

  if(session===undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400">Connecting…</div>;
  if(!session) return <LoginScreen />;
  if(!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 flex-col gap-2"><div>Loading your workspace…</div>{loadErr && <div className="text-xs text-rose-600 max-w-md text-center">{loadErr}</div>}</div>;

  const unreadInbox=mentions.filter(m=>!(m.read_by||[]).includes(profile.id)).length;
  const liveDetail=detailLead?(leads.find(l=>l.id===detailLead.id)||detailLead):null;
  const prodActive=prodJobs.filter(j=>j.status!=='delivered').length;

  function openDeptActivity(info){ setDeptActivity(info); }
  // From the Inbox: small "💬 Comments" button → opens the activity thread.
  function openInboxItem(m){
    if(m.source==='lead'){ const l=leads.find(x=>x.id===m.lead_id); if(l) setActivityLead(l); return; }
    const list=m.source==='graphic'?graphicJobs:m.source==='printing'?printingJobs:m.source==='sampling'?sampleJobs:prodJobs;
    const j=list.find(x=>x.id===m.job_id); if(j) setDeptActivity({ job:j, jobType:m.source, title:`${j.item} · ${j.client_name}` });
  }
  // From the Inbox: main card click → opens the actual lead detail / board.
  function openInboxTask(m){
    if(m.source==='lead'){ const l=leads.find(x=>x.id===m.lead_id); if(l) setDetailLead(l); return; }
    const map={ graphic:'graphic', printing:'printing', sampling:'sampling', production:'prod' };
    const v=map[m.source]||'prod'; setView(v);
    // Also open the job's activity so they can see the context they were mentioned in.
    const list=m.source==='graphic'?graphicJobs:m.source==='printing'?printingJobs:m.source==='sampling'?sampleJobs:prodJobs;
    const j=list.find(x=>x.id===m.job_id); if(j) setDeptActivity({ job:j, jobType:m.source, title:`${j.item} · ${j.client_name}` });
  }

  const isAssistant=profile.role==='assistant';
  const NAV = isAssistant ? [
    // Sales Assistants only see Sales + Production. No Team Overview, no
    // Operations / Purchasing / Other modules.
    { items: [ ['inbox','Inbox','📥'] ] },
    { group:'Sales', items:[ ['pipeline','Sales Pipeline','🧭'], ['techpacks','Techpacks','📋'], ['clients','Clients','👥'], ['profile','My Profile','⭐'] ] },
    { group:'Production', items:[ ['prod','Production Board','⚙'], ['sampling','Sampling Board','🧵'], ['graphic','Graphic Design','🎨'], ['printing','Printing','🖨'] ] },
  ] : [
    { items:[ ['dashboard','Dashboard','📊'], ['inbox','Inbox','📥'] ] },
    { group:'Sales', items:[ ['pipeline','Sales Pipeline','🧭'], ['techpacks','Techpacks','📋'], ['clients','Clients','👥'], ['profile','My Profile','⭐'], ['team','Team Overview','🏢'] ] },
    { group:'Production', items:[ ['prod','Production Board','⚙'], ['sampling','Sampling Board','🧵'], ['graphic','Graphic Design','🎨'], ['printing','Printing','🖨'] ] },
    { group:'Operations', items:[ ['inventory','Inventory','📦'] ] },
    { group:'Purchasing', items:[ ['suppliers','Suppliers','⚒'], ['requests','Purchase Requests','📝'], ['orders','Purchase Orders','🧾'], ['styles','Styles & BOMs','👕'] ] },
    { group:'Other', soon:true, items:[ ['soon-rep','Reports','📈'] ] },
  ];
  function NavBtn([k,lbl,icon]){
    const badge = k==='inbox'?unreadInbox : k==='prod'?prodActive : 0;
    return <button key={k} onClick={()=>{ setView(k); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm ${view===k?'bg-slate-700/80 text-white font-semibold':'text-slate-300 hover:bg-slate-800 hover:text-white'}`}><span className="w-4 text-center">{icon}</span><span className="flex-1 text-left">{lbl}</span>{badge>0 && <span className="text-[10px] bg-rose-500 text-white rounded-full px-1.5 py-0.5 font-bold">{badge}</span>}</button>;
  }

  return (
    <div className="app-root min-h-screen bg-slate-100">
      {/* Sidebar */}
      <aside className="no-print w-60 bg-slate-900 text-slate-300 flex flex-col fixed inset-y-0 left-0 overflow-y-auto z-40">
        <div className="flex items-center gap-3 px-4 py-4 border-b border-slate-800">
          <div className="w-9 h-9 rounded-lg bg-white text-slate-900 font-bold flex items-center justify-center">S</div>
          <div><div className="font-bold text-white leading-tight">Steeze ERP</div><div className="text-[10px] uppercase tracking-wider text-slate-500">Sales Module</div></div>
        </div>
        <nav className="flex-1 px-2 py-3 space-y-1">
          {NAV.map((sec,si)=>{
            const isCollapsed = sec.group && collapsedGroups.has(sec.group);
            return (
              <div key={si} className="mb-1">
                {sec.group && (
                  <button type="button" onClick={()=>toggleGroup(sec.group)} className="w-full px-3 pt-3 pb-1 text-[10px] uppercase tracking-wider text-slate-500 hover:text-slate-300 font-semibold flex items-center gap-1.5 select-none">
                    <span className={`text-[9px] transition-transform ${isCollapsed?'-rotate-90':''}`}>▾</span>
                    <span className="flex-1 text-left">{sec.group}</span>
                    {sec.soon && <span className="text-[8px] bg-slate-700 text-slate-300 rounded px-1 py-0.5 normal-case tracking-normal">soon</span>}
                  </button>
                )}
                {!isCollapsed && sec.items.map(it=>NavBtn(it))}
              </div>
            );
          })}
        </nav>
        <div className="px-3 py-3 border-t border-slate-800">
          <div className="flex items-center gap-2 mb-2"><Avatar profile={profile} size="sm" /><div className="min-w-0"><div className="text-xs font-medium text-white truncate">{profile.name||profile.email}</div><div className="text-[10px] text-slate-500">{profile.role==='admin'?'Administrator':profile.role==='assistant'?'Sales Assistant':'Sales Manager'}</div></div></div>
          <div className="flex items-center gap-2">
            <button onClick={()=>sb.auth.signOut()} className="flex-1 text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">Sign out</button>
            <button onClick={toggleMute} title={muted?'Notifications muted — click to unmute':'Notifications on — click to mute'} className={`text-xs px-2 py-1.5 rounded-lg ${muted?'bg-slate-800 text-slate-500 hover:text-slate-300':'bg-slate-800 text-emerald-400 hover:text-emerald-300'}`}>{muted?'🔕':'🔔'}</button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="no-print ml-60 min-h-screen">
        {loadErr && <div className="bg-rose-50 text-rose-700 text-xs px-6 py-2 border-b border-rose-200">{loadErr}</div>}
        {view==='dashboard' && <Dashboard profile={profile} profiles={profiles} leads={leads} clients={clients} prodJobs={prodJobs} />}
        {view==='inbox' && <Inbox profile={profile} profiles={profiles} leads={leads} graphicJobs={graphicJobs} printingJobs={printingJobs} productionJobs={prodJobs} sampleJobs={sampleJobs} mentions={mentions} onOpen={openInboxItem} onGoToTask={openInboxTask} />}
        {view==='pipeline' && <Pipeline profile={profile} profiles={profiles} clients={clients} leads={leads} activityCounts={activityCounts} onOpenLead={setDetailLead} onNew={()=>setShowNew(true)} reload={loadAll} onOpenTechpack={openTechpackEdit} />}
        {view==='clients' && (selectedClient
          ? <ClientDetail client={clients.find(c=>c.id===selectedClient.id)||selectedClient} profile={profile} profiles={profiles} leads={leads} reload={loadAll} onBack={()=>setSelectedClient(null)} onOpenLead={(l)=>setDetailLead(l)} />
          : <ClientsView profile={profile} profiles={profiles} clients={clients} leads={leads} onOpen={setSelectedClient} reload={loadAll} />)}
        {view==='profile' && <ProfileView profile={profile} leads={leads} clients={clients} profiles={profiles} reload={loadAll} onSendToPR={sendLeadToPR} />}
        {view==='team' && <TeamOverview profile={profile} profiles={profiles} leads={leads} clients={clients} pendingInvites={pendingInvites} reload={loadAll} />}
        {view==='prod' && <ProductionBoard profile={profile} profiles={profiles} jobs={prodJobs} leads={leads} reload={loadAll} openActivity={openDeptActivity} openTechpack={openTechpackView} />}
        {view==='sampling' && <SamplingBoard profile={profile} profiles={profiles} jobs={sampleJobs} leads={leads} reload={loadAll} openActivity={openDeptActivity} openTechpack={openTechpackView} />}
        {view==='graphic' && <DeptBoard profile={profile} profiles={profiles} title="Graphic Design" icon="🎨" table="graphic_design_jobs" jobType="graphic" statuses={GRAPHIC_STATUSES} doneStatuses={GRAPHIC_DONE} jobs={graphicJobs} leads={leads} graphicTypes={GRAPHIC_REQUEST_TYPES} canSendToPrinting={true} reload={loadAll} openActivity={openDeptActivity} openTechpack={openTechpackView} openLead={openLeadFromDept} />}
        {view==='printing' && <DeptBoard profile={profile} profiles={profiles} title="Printing" icon="🖨" table="printing_jobs" jobType="printing" statuses={PRINTING_STATUSES} doneStatuses={PRINTING_DONE} jobs={printingJobs} leads={leads} canSendToPrinting={false} reload={loadAll} openActivity={openDeptActivity} openTechpack={openTechpackView} openLead={openLeadFromDept} />}
        {view==='techpacks' && <TechpacksList profile={profile} profiles={profiles} leads={leads} clients={clients} onOpen={setTechpackLead} />}
        {view==='inventory' && <InventoryView suppliers={suppliers} items={items} departments={departments} reload={loadAll} />}
        {view==='suppliers' && <SuppliersView suppliers={suppliers} reload={loadAll} />}
        {view==='requests' && <PurchaseRequestsView profile={profile} requests={requests} items={items} suppliers={suppliers} departments={departments} profiles={profiles} leads={leads} reload={loadAll} onCreatePO={(pr)=>{ setCreatePOFromPR(pr); setView('orders'); }} onViewTechpack={(lead)=>setTechpackLead(lead)} />}
        {view==='orders' && <PurchaseOrdersView profile={profile} orders={orders} items={items} suppliers={suppliers} reload={loadAll} openFromPR={createPOFromPR} onClearPR={()=>setCreatePOFromPR(null)} />}
        {view==='styles' && <StylesView styles={styles} items={items} suppliers={suppliers} departments={departments} profile={profile} reload={loadAll} />}
        {view.indexOf('soon-')===0 && (
          <div className="p-6"><h1 className="text-2xl font-bold text-slate-900 mb-1">Coming in the next round</h1><p className="text-slate-500 text-sm">Purchase Requests, Purchase Orders, Styles &amp; BOMs, and Reports are part of the next build round. They will appear here as we build them live.</p></div>
        )}
      </main>

      {/* Mention toast */}
      {toast && (
        <div className="no-print fixed top-4 right-4 z-50 max-w-sm bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700 overflow-hidden animate-pulse-once">
          <button onClick={()=>{ setToast(null); setView('inbox'); }} className="block w-full text-left p-4 hover:bg-slate-800">
            <div className="text-[10px] uppercase tracking-wider text-emerald-400 font-bold mb-1">🔔 {toast.title}</div>
            <div className="text-sm leading-snug">{toast.body}</div>
            <div className="text-[10px] text-slate-400 mt-1">Click to open Inbox</div>
          </button>
        </div>
      )}
      {showNew && <LeadForm profile={profile} profiles={profiles} clients={clients} onClose={()=>setShowNew(false)} onSaved={()=>{ setShowNew(false); loadAll(); }} />}
      {liveDetail && !editLead && !activityLead && !sendGraphicLead && !sendPrintLead && (
        <LeadDetail profile={profile} profiles={profiles} reload={loadAll} lead={liveDetail} clients={clients} activityCount={activityCounts[liveDetail.id]}
          hideActivity={detailLeadHideActivity}
          onEdit={()=>setEditLead(liveDetail)} onOpenActivity={()=>setActivityLead(liveDetail)}
          onSendProduction={()=>sendToProduction(liveDetail)} onSendGraphic={()=>setSendGraphicLead(liveDetail)}
          onSendSampling={()=>sendLeadToSampling(liveDetail)}
          onSendPrinting={()=>setSendPrintLead(liveDetail)}
          onSendToPR={()=>{ closeLeadDetail(); sendLeadToPR(liveDetail); }}
          onOpenTechpack={()=>{ const l=liveDetail; closeLeadDetail(); openTechpackEdit(l); }} onClose={closeLeadDetail} />
      )}
      {techpackLead && <TechpackEditor profile={profile} lead={leads.find(l=>l.id===techpackLead.id)||techpackLead} client={clients.find(c=>c.id===(leads.find(l=>l.id===techpackLead.id)||techpackLead).client_id)} reload={loadAll} readOnly={techpackReadOnly} sizeCharts={sizeCharts} reloadCharts={loadAll} garmentMockups={garmentMockups} reloadMockups={loadAll} onClose={()=>{ setTechpackLead(null); setTechpackReadOnly(false); }} />}
      {editLead && <LeadForm profile={profile} profiles={profiles} clients={clients} existing={editLead} onClose={()=>setEditLead(null)} onSaved={()=>{ setEditLead(null); loadAll(); }} />}
      {sendGraphicLead && <SendToGraphicModal profile={profile} lead={sendGraphicLead} clients={clients} onClose={()=>setSendGraphicLead(null)} onSent={(n)=>{ setSendGraphicLead(null); loadAll(); alert('Sent to Graphic Design'+(n?` with ${n} attachment(s)`:'')+'.'); }} />}
      {sendPrintLead && <SendLeadToPrintingModal profile={profile} lead={sendPrintLead} client={clients.find(c=>c.id===sendPrintLead.client_id)} onClose={()=>setSendPrintLead(null)} onSent={(n)=>{ setSendPrintLead(null); loadAll(); alert('Sent to Printing'+(n?` with ${n} attachment${n===1?'':'s'}`:'')+'.'); }} />}
      {activityLead && <Thread profile={profile} profiles={profiles} table="lead_activity" match={{ lead_id:(leads.find(l=>l.id===activityLead.id)||activityLead).id }} scope={'activity/'+activityLead.id} titleText={(leads.find(l=>l.id===activityLead.id)||activityLead).title} openSourceLabel={detailLead?null:'Open lead'} onOpenSource={detailLead?null:()=>{ const l=leads.find(x=>x.id===activityLead.id)||activityLead; setActivityLead(null); setDetailLead(l); }} afterChange={loadAll} onBack={detailLead?()=>setActivityLead(null):null} onClose={()=>setActivityLead(null)} />}
      {deptActivity && <Thread profile={profile} profiles={profiles} table="dept_job_activity" match={{ job_id:deptActivity.job.id, job_type:deptActivity.jobType }} scope={'dept/'+deptActivity.job.id} titleText={deptActivity.title} openSourceLabel={'Go to board'} onOpenSource={()=>{ const map={ graphic:'graphic', printing:'printing', sampling:'sampling', production:'prod' }; setDeptActivity(null); setView(map[deptActivity.jobType]||'prod'); }} afterChange={loadAll} onClose={()=>setDeptActivity(null)} />}

      <div className="no-print fixed bottom-3 right-3 text-[10px] px-2 py-1 rounded-full bg-slate-800 text-white/90">{BUILD}</div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state={ err:null }; }
  static getDerivedStateFromError(e){ return { err:e }; }
  componentDidCatch(e){ showFatal((e && e.message) || String(e)); }
  render(){ if(this.state.err) return <div className="p-6 text-rose-700 text-sm">App error: {String((this.state.err && this.state.err.message) || this.state.err)}</div>; return this.props.children; }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
