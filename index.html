/* ============================================================================
   LOGISTICS — Daily delivery scheduling (simple, two drivers)
   ============================================================================ */
function DailyLogistics({ profile, clients }){
  // Build a YYYY-MM-DD string from the LOCAL date parts of a Date object.
  // Using toISOString().slice(0,10) was producing wrong values in Asia/Manila
  // (UTC+8) — at local midnight the UTC date is still the previous calendar
  // day, so "Next day" kept landing back on the same day.
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayISO = () => ymd(new Date());
  const VEHICLE_OPTIONS = ['Truck','Motorbike','Van','Car','Other'];
  const [date,setDate]=useState(todayISO());
  const [drivers,setDrivers]=useState([]);
  const [deliveries,setDeliveries]=useState([]);
  const [dayAssign,setDayAssign]=useState([]); // logistics_day_assignments for this date
  const [loading,setLoading]=useState(true);
  const [loadErr,setLoadErr]=useState('');
  const [editing,setEditing]=useState(null); // delivery being edited; null=closed, 'new'=create form
  const [showDrivers,setShowDrivers]=useState(false);

  async function loadAll(){
    setLoading(true); setLoadErr('');
    try{
      const [dRes,eRes,aRes] = await Promise.all([
        sb.from('logistics_drivers').select('*').order('name',{ascending:true}),
        sb.from('logistics_deliveries').select('*').eq('date',date).order('position',{ascending:true}).order('created_at',{ascending:true}),
        sb.from('logistics_day_assignments').select('*').eq('date',date),
      ]);
      if(dRes.error) throw dRes.error;
      if(eRes.error) throw eRes.error;
      if(aRes.error) throw aRes.error;
      setDrivers(dRes.data||[]);
      setDeliveries(eRes.data||[]);
      setDayAssign(aRes.data||[]);
    }catch(e){
      console.error('Logistics load failed:', e);
      setLoadErr(e.message||String(e));
    } finally { setLoading(false); }
  }
  useEffect(()=>{ loadAll(); },[date]);

  // Returns the vehicle assigned to this driver on this date — falls back to
  // the driver's default vehicle from the drivers table.
  function vehicleFor(dr){
    const row = dayAssign.find(a=>a.driver_id===dr.id);
    if(row && row.vehicle) return row.vehicle;
    return dr.vehicle || '';
  }
  async function setVehicleFor(dr, vehicle){
    const { error } = await sb.from('logistics_day_assignments').upsert(
      { date, driver_id: dr.id, vehicle },
      { onConflict: 'date,driver_id' }
    );
    if(error){ alert(error.message); return; }
    loadAll();
  }

  function shiftDate(days){
    const d = new Date(date+'T00:00:00');
    d.setDate(d.getDate()+days);
    setDate(ymd(d));
  }
  function fmtDateLong(d){
    if(!d) return '';
    return new Date(d+'T00:00:00').toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric', year:'numeric' });
  }
  async function toggleDelivered(d){
    const next = d.status==='delivered' ? 'pending' : 'delivered';
    const { error } = await sb.from('logistics_deliveries').update({
      status: next,
      delivered_at: next==='delivered' ? new Date().toISOString() : null,
    }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    loadAll();
  }
  async function setStatusOf(d, status){
    const { error } = await sb.from('logistics_deliveries').update({
      status,
      delivered_at: status==='delivered' ? new Date().toISOString() : null,
    }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    loadAll();
  }
  async function deleteDelivery(d){
    if(!confirm(`Delete delivery "${d.item||d.client_name||'untitled'}"?`)) return;
    const { error } = await sb.from('logistics_deliveries').delete().eq('id', d.id);
    if(error){ alert(error.message); return; }
    loadAll();
  }

  // Drag-and-drop reordering. Each delivery row exposes a ≡ handle. Dropping
  // ON another row inserts the dragged delivery just BEFORE the target row in
  // the target driver's column. Dropping on an empty driver column pushes the
  // delivery to the end of that column.
  const [dragId,setDragId]=useState(null);     // delivery currently being dragged
  const [dragOverId,setDragOverId]=useState(null); // current hover target id
  const [dragOverDriverId,setDragOverDriverId]=useState(null); // for empty-column drops
  // Reorder helper — given the dragged delivery id, the target row id (or
  // null for end-of-column), and the target driver id, rebuild the target
  // column's order and batch-save new position numbers.
  async function reorderTo(draggedId, targetRowId, targetDriverId){
    if(!draggedId) return;
    const dragged = deliveries.find(d=>d.id===draggedId);
    if(!dragged) return;
    if(draggedId === targetRowId) return; // dropped on self → no-op
    const targetKey = targetDriverId || '__unassigned';
    // Source list with dragged removed (so we don't double-insert when staying in same column)
    const targetCol = (deliveries||[])
      .filter(d => (d.driver_id || '__unassigned') === targetKey)
      .filter(d => d.id !== draggedId)
      .sort((a,b)=> (a.position||0)-(b.position||0));
    // Where to insert?
    let insertIdx = targetRowId ? targetCol.findIndex(d=>d.id===targetRowId) : targetCol.length;
    if(insertIdx === -1) insertIdx = targetCol.length;
    const reordered = [...targetCol.slice(0,insertIdx), { ...dragged, driver_id: targetDriverId||null }, ...targetCol.slice(insertIdx)];
    // Reassign positions in increments of 100 so future drags between two
    // existing rows can land at half-positions without renumbering everything.
    const updates = reordered.map((d,idx)=>({ id:d.id, position:(idx+1)*100, driver_id: targetDriverId||null }));
    try {
      // Run updates in parallel — these are independent rows.
      await Promise.all(updates.map(u =>
        sb.from('logistics_deliveries').update({ position: u.position, driver_id: u.driver_id }).eq('id', u.id)
      ));
      loadAll();
    } catch(e){
      console.error('Logistics reorder failed:', e);
      alert('Couldn\'t save the new order. Please try again.');
    }
  }

  const grouped = {};
  drivers.forEach(dr => grouped[dr.id] = []);
  grouped['__unassigned'] = [];
  deliveries.forEach(d => { const k = d.driver_id || '__unassigned'; (grouped[k]=grouped[k]||[]).push(d); });

  const dayDone = deliveries.filter(d=>d.status==='delivered').length;

  if(loading){
    return <div className="p-6"><h1 className="text-2xl font-bold mb-2">🚚 Logistics</h1><div className="text-sm text-slate-400">Loading…</div></div>;
  }
  if(loadErr){
    return <div className="p-6"><h1 className="text-2xl font-bold mb-2">🚚 Logistics</h1><div className="text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded p-3">Failed to load: {loadErr}<br/><span className="text-xs text-slate-500">If this is the first time, make sure you ran steeze-erp-logistics-module.sql in Supabase.</span></div></div>;
  }

  return (
    <div className="p-6 max-w-7xl mx-auto">
      <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
        <div>
          <h1 className="text-2xl font-bold">🚚 Daily Delivery Schedule</h1>
          <p className="text-slate-500 text-sm">Plan today's runs, check off as they're delivered.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={()=>setShowDrivers(true)} className="text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">👥 Drivers ({drivers.length})</button>
          <button onClick={()=>setEditing('new')} className="text-xs px-3 py-2 rounded bg-orange-600 text-white font-semibold hover:bg-orange-700">+ New delivery</button>
        </div>
      </div>

      {/* Date strip */}
      <div className="bg-white border rounded-xl p-3 flex items-center gap-3 flex-wrap mb-4">
        <button onClick={()=>shiftDate(-1)} className="text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">← Previous day</button>
        <button onClick={()=>setDate(todayISO())} className="text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">Today</button>
        <button onClick={()=>shiftDate(1)} className="text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">Next day →</button>
        <input type="date" className="input max-w-[10rem]" value={date} onChange={e=>setDate(e.target.value)} />
        <div className="flex-1"></div>
        <div className="text-sm">
          <span className="font-semibold">{fmtDateLong(date)}</span>
          {deliveries.length>0 && <span className="text-slate-500 ml-3">· {dayDone}/{deliveries.length} delivered</span>}
        </div>
      </div>

      {/* Driver columns */}
      <div className="grid md:grid-cols-2 gap-3">
        {drivers.length===0 && (
          <div className="md:col-span-2 bg-white border rounded-xl p-8 text-center text-sm text-slate-400">
            No drivers yet. Click <button onClick={()=>setShowDrivers(true)} className="text-orange-600 underline">👥 Drivers</button> to add some.
          </div>
        )}
        {drivers.map(dr=>{
          const list = grouped[dr.id]||[];
          const done = list.filter(d=>d.status==='delivered').length;
          const todayVehicle = vehicleFor(dr);
          const vIcon = todayVehicle==='Truck'?'🚚':todayVehicle==='Motorbike'?'🏍':todayVehicle==='Van'?'🚐':todayVehicle==='Car'?'🚗':'🚗';
          return (
            <div key={dr.id} className="bg-white border rounded-xl overflow-hidden">
              <div className="bg-orange-50 border-b border-orange-200 px-4 py-3">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div className="font-bold text-orange-800">{vIcon} {dr.name}</div>
                    <div className="text-[11px] text-orange-700">{dr.phone?`📞 ${dr.phone}`:''}</div>
                  </div>
                  <div className="text-xs text-orange-700"><strong>{done}/{list.length}</strong> done</div>
                </div>
                <div className="mt-2 flex items-center gap-2">
                  <span className="text-[10px] uppercase tracking-wide text-orange-700 font-semibold">Vehicle today:</span>
                  <select value={todayVehicle} onChange={e=>setVehicleFor(dr, e.target.value)} className="text-xs border rounded px-2 py-1 bg-white text-orange-900">
                    <option value="">— Not set —</option>
                    {VEHICLE_OPTIONS.map(v=><option key={v} value={v}>{v}</option>)}
                  </select>
                </div>
              </div>
              {list.length===0 ? (
                <div
                  onDragOver={(e)=>{ if(dragId){ e.preventDefault(); setDragOverDriverId(dr.id); } }}
                  onDragLeave={()=>setDragOverDriverId(prev => prev===dr.id ? null : prev)}
                  onDrop={(e)=>{ e.preventDefault(); reorderTo(dragId, null, dr.id); setDragId(null); setDragOverId(null); setDragOverDriverId(null); }}
                  className={`text-center text-sm text-slate-400 py-8 ${dragOverDriverId===dr.id?'bg-orange-50/60 ring-2 ring-orange-200 ring-inset':''}`}
                >
                  No deliveries assigned.<br/>
                  <button onClick={()=>setEditing({driver_id:dr.id})} className="mt-2 text-xs text-orange-600 hover:underline">+ Schedule one</button>
                  {dragId && <div className="mt-2 text-[11px] text-orange-600">Drop here to assign</div>}
                </div>
              ) : (
                <div className="divide-y">
                  {list.map(d => (
                    <DeliveryRow
                      key={d.id} d={d}
                      driverId={dr.id}
                      isDragging={dragId===d.id}
                      isDropTarget={dragOverId===d.id}
                      onDragStartRow={()=>setDragId(d.id)}
                      onDragOverRow={()=>setDragOverId(d.id)}
                      onDragLeaveRow={()=>setDragOverId(prev=>prev===d.id?null:prev)}
                      onDropRow={()=>{ reorderTo(dragId, d.id, dr.id); setDragId(null); setDragOverId(null); }}
                      onDragEndRow={()=>{ setDragId(null); setDragOverId(null); setDragOverDriverId(null); }}
                      onToggle={()=>toggleDelivered(d)} onSetStatus={(s)=>setStatusOf(d,s)} onEdit={()=>setEditing(d)} onDelete={()=>deleteDelivery(d)}
                    />
                  ))}
                </div>
              )}
            </div>
          );
        })}

        {/* Unassigned column appears only when there are unassigned deliveries */}
        {grouped['__unassigned'].length>0 && (
          <div className="md:col-span-2 bg-white border rounded-xl overflow-hidden">
            <div className="bg-slate-50 border-b px-4 py-3 flex items-center justify-between">
              <div className="font-bold text-slate-700">❓ Unassigned</div>
              <div className="text-xs text-slate-500">{grouped['__unassigned'].length} delivery{grouped['__unassigned'].length===1?'':'s'} need a driver</div>
            </div>
            <div className="divide-y">
              {grouped['__unassigned'].map(d => (
                <DeliveryRow
                  key={d.id} d={d}
                  driverId={null}
                  isDragging={dragId===d.id}
                  isDropTarget={dragOverId===d.id}
                  onDragStartRow={()=>setDragId(d.id)}
                  onDragOverRow={()=>setDragOverId(d.id)}
                  onDragLeaveRow={()=>setDragOverId(prev=>prev===d.id?null:prev)}
                  onDropRow={()=>{ reorderTo(dragId, d.id, null); setDragId(null); setDragOverId(null); }}
                  onDragEndRow={()=>{ setDragId(null); setDragOverId(null); setDragOverDriverId(null); }}
                  onToggle={()=>toggleDelivered(d)} onSetStatus={(s)=>setStatusOf(d,s)} onEdit={()=>setEditing(d)} onDelete={()=>deleteDelivery(d)}
                />
              ))}
            </div>
          </div>
        )}
      </div>

      {editing && <DeliveryEditModal delivery={editing==='new'?{ date }:editing} date={date} drivers={drivers} clients={clients||[]} onClose={()=>setEditing(null)} onSaved={()=>{ setEditing(null); loadAll(); }} />}
      {showDrivers && <DriversManageModal drivers={drivers} onClose={()=>setShowDrivers(false)} onChanged={loadAll} />}
    </div>
  );
}

function DeliveryRow({ d, driverId, isDragging, isDropTarget, onDragStartRow, onDragOverRow, onDragLeaveRow, onDropRow, onDragEndRow, onToggle, onSetStatus, onEdit, onDelete }){
  const isDone = d.status==='delivered';
  const isTransit = d.status==='in_transit';
  const isFail = d.status==='failed';
  return (
    <div
      // Whole row is draggable, but grabbing the ≡ handle on the left feels
      // more obvious. Native HTML5 drag: setData carries the row id; drop
      // target's onDrop reads it and reorders.
      draggable
      onDragStart={(e)=>{ try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', d.id); } catch(_){} onDragStartRow&&onDragStartRow(); }}
      onDragOver={(e)=>{ e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch(_){} onDragOverRow&&onDragOverRow(); }}
      onDragLeave={()=>onDragLeaveRow&&onDragLeaveRow()}
      onDrop={(e)=>{ e.preventDefault(); onDropRow&&onDropRow(); }}
      onDragEnd={()=>onDragEndRow&&onDragEndRow()}
      className={`flex items-start gap-3 px-4 py-3 transition ${isDone?'bg-emerald-50/40':(isFail?'bg-rose-50/40':(isTransit?'bg-blue-50/40':''))} ${isDragging?'opacity-40':''} ${isDropTarget?'ring-2 ring-orange-300 ring-inset bg-orange-50/40':''}`}
    >
      {/* Drag handle — visual affordance that this row is reorderable. */}
      <span className="shrink-0 mt-1 select-none text-slate-300 hover:text-slate-500 cursor-grab active:cursor-grabbing text-base" title="Drag to reorder">≡</span>
      <button onClick={onToggle} title={isDone?'Mark as not delivered':'Mark as delivered'} className={`shrink-0 mt-0.5 w-6 h-6 rounded-md border-2 flex items-center justify-center text-sm transition ${isDone?'bg-emerald-600 border-emerald-600 text-white':'bg-white border-slate-300 hover:border-emerald-400'}`}>{isDone?'✓':''}</button>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <div className={`font-semibold ${isDone?'text-slate-500 line-through':'text-slate-800'}`}>{d.item || '(no item)'}</div>
          {isTransit && <span className="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-700">In transit</span>}
          {isFail && <span className="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-700">Failed</span>}
        </div>
        <div className="text-xs text-slate-500 mt-0.5">
          📍 {d.address || '—'}
          {d.client_name && <span> · {d.client_name}</span>}
          {(d.contact||d.contact_phone) && <span> · {d.contact}{d.contact_phone?` (${d.contact_phone})`:''}</span>}
        </div>
        {d.notes && <div className="text-xs text-slate-600 mt-1 bg-amber-50 border border-amber-100 rounded px-2 py-1">📝 {d.notes}</div>}
        {isDone && d.delivered_at && (
          <div className="text-[10px] text-emerald-700 mt-1">✓ Delivered {new Date(d.delivered_at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })}</div>
        )}
        <div className="flex items-center gap-2 mt-1.5">
          <select value={d.status} onChange={e=>onSetStatus(e.target.value)} className="text-[11px] border rounded px-1.5 py-0.5 bg-white">
            <option value="pending">Pending</option>
            <option value="in_transit">In transit</option>
            <option value="delivered">Delivered</option>
            <option value="failed">Failed</option>
          </select>
          <button onClick={onEdit} className="text-[11px] text-slate-500 hover:underline">Edit</button>
          <button onClick={onDelete} className="text-[11px] text-rose-500 hover:underline">Delete</button>
        </div>
      </div>
    </div>
  );
}

function DeliveryEditModal({ delivery, date, drivers, clients, onClose, onSaved }){
  const isNew = !delivery || !delivery.id;
  const [d,setD]=useState(()=>({
    date: delivery?.date || date,
    driver_id: delivery?.driver_id || '',
    client_id: delivery?.client_id || '',
    client_name: delivery?.client_name || '',
    item: delivery?.item || '',
    address: delivery?.address || '',
    contact: delivery?.contact || '',
    contact_phone: delivery?.contact_phone || '',
    notes: delivery?.notes || '',
    status: delivery?.status || 'pending',
  }));
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  function up(k,v){ setD(p=>({...p,[k]:v})); }
  // When the user picks a client from the dropdown, auto-fill the address +
  // primary contact + phone from the clients table. They can still edit any
  // field after the autofill.
  function pickClient(clientId){
    if(!clientId){
      setD(p=>({...p, client_id:'', client_name:''}));
      return;
    }
    const c = (clients||[]).find(x=>x.id===clientId);
    if(!c){ setD(p=>({...p, client_id:clientId})); return; }
    // Primary contact (first item in contacts array, or legacy contact/phone fields)
    const primary = Array.isArray(c.contacts) && c.contacts.length>0 ? c.contacts[0] : null;
    const cName = (primary && primary.name) || c.contact || '';
    const cPhone = (primary && primary.phone) || c.phone || '';
    setD(p=>({
      ...p,
      client_id: clientId,
      client_name: c.company || p.client_name,
      address: c.address || p.address,
      contact: cName || p.contact,
      contact_phone: cPhone || p.contact_phone,
    }));
  }
  async function save(){
    if(!d.item.trim() && !d.client_name.trim()){ setMsg('Add either an item or a client name.'); return; }
    setBusy(true); setMsg('');
    try{
      const payload = { ...d, driver_id: d.driver_id||null, client_id: d.client_id||null };
      if(isNew){
        const { error } = await sb.from('logistics_deliveries').insert(payload);
        if(error) throw error;
      } else {
        const { error } = await sb.from('logistics_deliveries').update(payload).eq('id', delivery.id);
        if(error) throw error;
      }
      onSaved();
    }catch(e){ setMsg(e.message||String(e)); setBusy(false); }
  }
  const sortedClients = (clients||[]).slice().sort((a,b)=>String(a.company||'').localeCompare(String(b.company||'')));
  return (
    <Modal title={isNew?'+ New delivery':'Edit delivery'} onClose={onClose}>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Date"><input type="date" className="input" value={d.date} onChange={e=>up('date',e.target.value)} /></TpLbl>
          <TpLbl t="Driver"><select className="input" value={d.driver_id} onChange={e=>up('driver_id',e.target.value)}><option value="">— Unassigned —</option>{drivers.map(dr=><option key={dr.id} value={dr.id}>{dr.name}</option>)}</select></TpLbl>
        </div>
        <TpLbl t="Item / What's being delivered"><input className="input" value={d.item} onChange={e=>up('item',e.target.value)} placeholder="e.g. Polo Shirt 60pcs · Techpack samples · Invoice 13828" /></TpLbl>
        {/* Client picker — pulls from your clients list and autofills address + contact */}
        <div className="border rounded-lg p-3 bg-slate-50">
          <TpLbl t={`Pick a client (auto-fills address + contact)${sortedClients.length?` · ${sortedClients.length} on file`:''}`}>
            <select className="input" value={d.client_id} onChange={e=>pickClient(e.target.value)}>
              <option value="">— Type manually below —</option>
              {sortedClients.map(c=><option key={c.id} value={c.id}>{c.company}</option>)}
            </select>
          </TpLbl>
          <div className="mt-2 grid grid-cols-2 gap-2">
            <TpLbl t="Client / Recipient name"><input className="input" value={d.client_name} onChange={e=>up('client_name',e.target.value)} placeholder="e.g. Pro Sigma Events" /></TpLbl>
            <TpLbl t="Status"><select className="input" value={d.status} onChange={e=>up('status',e.target.value)}><option value="pending">Pending</option><option value="in_transit">In transit</option><option value="delivered">Delivered</option><option value="failed">Failed</option></select></TpLbl>
          </div>
        </div>
        <TpLbl t="Address"><input className="input" value={d.address} onChange={e=>up('address',e.target.value)} placeholder="e.g. Unit 5, Eastwood City, Quezon City" /></TpLbl>
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Contact name"><input className="input" value={d.contact} onChange={e=>up('contact',e.target.value)} placeholder="e.g. Drew Siapco" /></TpLbl>
          <TpLbl t="Contact phone"><input className="input" value={d.contact_phone} onChange={e=>up('contact_phone',e.target.value)} placeholder="e.g. +63 917 …" /></TpLbl>
        </div>
        <TpLbl t="Notes"><textarea className="input min-h-[60px]" value={d.notes} onChange={e=>up('notes',e.target.value)} placeholder="e.g. Call before arriving · Cash on delivery · Fragile" /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-50">{busy?'Saving…':(isNew?'Create delivery':'Save changes')}</button>
      </div>
    </Modal>
  );
}

function DriversManageModal({ drivers, onClose, onChanged }){
  const [newName,setNewName]=useState('');
  const [newPhone,setNewPhone]=useState('');
  const [newVehicle,setNewVehicle]=useState('');
  const [busy,setBusy]=useState(false);
  async function addDriver(){
    if(!newName.trim()) return alert('Enter a name.');
    setBusy(true);
    const { error } = await sb.from('logistics_drivers').insert({ name:newName.trim(), phone:newPhone.trim(), vehicle:newVehicle.trim() });
    setBusy(false);
    if(error){ alert(error.message); return; }
    setNewName(''); setNewPhone(''); setNewVehicle('');
    onChanged();
  }
  async function renameDriver(d){
    const n=(prompt('Rename driver:', d.name)||'').trim(); if(!n) return;
    const { error } = await sb.from('logistics_drivers').update({ name:n }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    onChanged();
  }
  async function setPhone(d){
    const v=(prompt('Phone:', d.phone||'')||'').trim();
    const { error } = await sb.from('logistics_drivers').update({ phone:v }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    onChanged();
  }
  async function setVehicle(d){
    const v=(prompt('Vehicle:', d.vehicle||'')||'').trim();
    const { error } = await sb.from('logistics_drivers').update({ vehicle:v }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    onChanged();
  }
  async function toggleActive(d){
    const { error } = await sb.from('logistics_drivers').update({ active: !d.active }).eq('id', d.id);
    if(error){ alert(error.message); return; }
    onChanged();
  }
  async function deleteDriver(d){
    if(!confirm(`Delete "${d.name}"? Their assigned deliveries will become Unassigned.`)) return;
    const { error } = await sb.from('logistics_drivers').delete().eq('id', d.id);
    if(error){ alert(error.message); return; }
    onChanged();
  }
  return (
    <Modal title="👥 Drivers" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="bg-slate-50 border rounded-lg p-3">
          <div className="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-2">Add a driver</div>
          <div className="grid grid-cols-3 gap-2">
            <input className="input" placeholder="Name" value={newName} onChange={e=>setNewName(e.target.value)} />
            <input className="input" placeholder="Phone (optional)" value={newPhone} onChange={e=>setNewPhone(e.target.value)} />
            <input className="input" placeholder="Vehicle (e.g. Motorbike)" value={newVehicle} onChange={e=>setNewVehicle(e.target.value)} />
          </div>
          <button disabled={busy} onClick={addDriver} className="mt-2 px-4 py-1.5 rounded bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 disabled:opacity-50">{busy?'Adding…':'Add driver'}</button>
        </div>
        {drivers.length===0 ? <div className="text-center text-sm text-slate-400 py-6">No drivers yet.</div> : (
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1.5">Name</th><th className="text-left">Phone</th><th className="text-left">Vehicle</th><th>Status</th><th></th></tr></thead>
            <tbody>{drivers.map(d=>(
              <tr key={d.id} className="border-t">
                <td className="py-1.5 font-medium">{d.name}</td>
                <td>{d.phone||'—'}</td>
                <td>{d.vehicle||'—'}</td>
                <td>{d.active?<span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold">Active</span>:<span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">Inactive</span>}</td>
                <td className="text-right whitespace-nowrap">
                  <button onClick={()=>renameDriver(d)} className="text-xs text-slate-500 hover:underline mr-2">Rename</button>
                  <button onClick={()=>setPhone(d)} className="text-xs text-slate-500 hover:underline mr-2">Phone</button>
                  <button onClick={()=>setVehicle(d)} className="text-xs text-slate-500 hover:underline mr-2">Vehicle</button>
                  <button onClick={()=>toggleActive(d)} className="text-xs text-slate-500 hover:underline mr-2">{d.active?'Deactivate':'Reactivate'}</button>
                  <button onClick={()=>deleteDriver(d)} className="text-xs text-rose-500 hover:underline">Delete</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
      </div>
    </Modal>
  );
}

function TechpackEditor({ profile, lead, client, onClose, reload, readOnly, sizeCharts, reloadCharts, garmentMockups, reloadMockups }){
  const [tp,setTp]=useState(()=>mergeTechpack(lead.techpack, lead, client, profile));
  const [active,setActive]=useState('header'); const [mode,setMode]=useState(readOnly?'preview':'edit'); const [saving,setSaving]=useState(false);

  const [pickingChart,setPickingChart]=useState(false);
  async function saveChartToLibrary(){ const name=(prompt('Save this size chart as:')||'').trim(); if(!name) return; const garment=(prompt('Garment type (optional):')||'').trim(); const s=tp.sizechart||{}; const { error }=await sb.from('size_charts').insert({ name, garment_type:garment, chart_image:s.chartImage||'', title_heading:s.titleHeading||'', fabric_note:s.fabricNote||'', footer_note1:s.footerNote1||'', footer_note2:s.footerNote2||'', created_by:profile.id }); if(error){ alert(error.message); return; } alert('Saved "'+name+'" to library.'); reloadCharts&&reloadCharts(); }

  const [pickingMockup,setPickingMockup]=useState(false);

  function setSec(key,patch){ setTp(t=>{ if(isExtra) return {...t, extraPages:(t.extraPages||[]).map(p=>p.id===active?{...p,data:{...p.data,...patch}}:p)}; const enabled=('enabled' in patch)?patch.enabled:true; return {...t,[key]:{...t[key],...patch,enabled}}; }); }

  function duplicateSection(key){ const id='xp'+Date.now()+Math.random().toString(36).slice(2,5); setTp(t=>({...t, extraPages:[...(t.extraPages||[]), { id, type:key, data:{ ...JSON.parse(JSON.stringify(t[key])), enabled:true } }]})); setActive(id); }
  function removeExtra(id){ if(!confirm('Delete this duplicated page?')) return; setTp(t=>({...t, extraPages:(t.extraPages||[]).filter(p=>p.id!==id)})); if(active===id) setActive('header'); }
  async function save(){
    if(readOnly){ alert("You're viewing this techpack in preview-only mode."); return; }
    setSaving(true);
    const payload={...tp,updatedAt:todayISO()};
    // Save and also read back the updated row, so we can detect silent RLS failures
    // (when an update matches 0 rows because the policy filtered them out, Supabase returns no error).
    const { data:updated, error } = await sb.from('leads')
      .update({ techpack: payload })
      .eq('id', lead.id)
      .select('id');
    setSaving(false);
    if(error){
      console.error('Techpack save error:', error, 'lead.id=', lead.id, 'profile.role=', profile?.role, 'manager_id=', lead.manager_id);
      const code = error.code || '—';
      const isRls = /row-level security|permission denied|RLS|42501/i.test(String(error.message||'')+' '+code);
      const details = `\n\nDetails:\n• code: ${code}\n• your role: ${profile?.role||'—'}\n• your id: ${profile?.id||'—'}\n• lead manager_id: ${lead.manager_id||'(unassigned)'}\n• lead id: ${lead.id}`;
      const hint = isRls
        ? '\n\nLikely cause: row-level security is blocking this update. Ask kaira to run steeze-erp-fix-techpack-save.sql in Supabase, then try again.'
        : '';
      alert('Save failed: '+(error.message||error)+details+hint);
      return;
    }
    if(!updated || updated.length===0){
      // No error but no row updated — almost certainly RLS silently filtered it.
      console.warn('Techpack save: 0 rows updated', 'lead.id=', lead.id, 'profile.role=', profile?.role, 'manager_id=', lead.manager_id);
      alert(
        "Save didn't fail, but nothing was updated.\n\n"+
        "This means your account does not currently have permission to update this lead.\n\n"+
        `• your role: ${profile?.role||'—'}\n`+
        `• your id: ${profile?.id||'—'}\n`+
        `• lead manager_id: ${lead.manager_id||'(unassigned)'}\n`+
        `• lead id: ${lead.id}\n\n`+
        "Ask kaira to run steeze-erp-fix-techpack-save.sql in Supabase, then try again."
      );
      return;
    }
    reload&&reload();
    alert('Techpack saved.');
  }
