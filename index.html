  function sectionBody(type, s){
    if(type==='coverMain') return (
      // Cover page — bullet-proof layout to guarantee NO overlap and NO crop:
      //   * Image row uses a FIXED height (4in) with flexShrink:0 so the
      //     image never grows past it — browsers can't override an explicit
      //     `height` the way they sometimes do with `max-height`+`flex:1`.
      //   * Image content inside is letterboxed (object-fit:contain) — no crop.
      //   * Caption sits BELOW the image with a clear 28px gap and is also
      //     flexShrink:0 so it always renders its full text.
      //   * Any leftover vertical space stays as empty whitespace at the
      //     bottom — preferable to risking an overlap.
      <div style={{flex:1, display:'flex', flexDirection:'column', padding:'10px', minHeight:0}}>
        <div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'14px', width:'100%', justifyItems:'center', alignItems:'center', height:'4in', flexShrink:0}}>
          <TImg path={s.frontImage} maxH="4in" />
          <TImg path={s.backImage} maxH="4in" />
        </div>
        <div style={{textAlign:'center', flexShrink:0, marginTop:'28px'}}>
          <div style={{fontWeight:700, color:'#d63031', fontSize:'11pt', marginBottom:'4px'}}>{s.mainLine}</div>
          {bullets(s.details)}
        </div>
      </div>
    );
    if(type==='construction') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gridTemplateRows:'1fr 1fr', gap:'8px', padding:'10px', minHeight:0}}>{(s.boxes||[]).map((b,i)=>(<div key={i} style={TP.box}><div style={TP.bar}>{b.title}</div><div style={TP.imgWrap}><TImg path={b.image} /></div></div>))}</div>);
    if(type==='colourways') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px', padding:'10px', minHeight:0}}>{(s.columns||[]).map((c,i)=>(<div key={i} style={TP.box}><div style={{...TP.bar, fontWeight:600}}>{c.headerTitle||' '}</div><div style={TP.imgWrap}><TImg path={c.image} /></div><div style={{borderTop:'1px solid #1a1a1a'}}><div style={{background:'#e8e8e8', padding:'3px 10px', fontWeight:700, fontSize:'9pt', textAlign:'center', borderBottom:'1px solid #1a1a1a'}}>{c.detailTitle}</div>{(c.detailLines||[]).map((l,j)=><div key={j} style={{padding:'2px 10px', borderBottom:'1px solid #1a1a1a', fontSize:'8.5pt', minHeight:'13px'}}>{l}</div>)}</div></div>))}</div>);
    if(type==='cover1') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', padding:'10px', alignItems:'center'}}><div><div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'8px', justifyItems:'center'}}><TImg path={s.frontImage} maxH="5.5in" /><TImg path={s.backImage} maxH="5.5in" /></div><div style={{textAlign:'center', marginTop:'8px'}}><div style={{fontWeight:700, color:'#d63031', fontSize:'10pt'}}>{s.mainLine}</div>{bullets(s.details)}</div></div><div>{previewSizeTable(s)}</div></div>);
    if(type==='breakdown') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'260px 1fr', gap:'14px', padding:'10px', alignItems:'flex-start'}}><div>{previewSizeTable(s)}</div><table style={{borderCollapse:'collapse', width:'100%', fontSize:'8.5pt'}}><thead><tr><th style={{...TP.cell, background:'#f0f0f0', width:'40px'}}>No.</th><th style={{...TP.cell, background:'#f0f0f0', textAlign:'left'}}>Name</th></tr></thead><tbody>{(s.names||[]).map((n,i)=><tr key={i}><td style={TP.cell}>{i+1}</td><td style={{...TP.cell, textAlign:'left'}}>{n}</td></tr>)}</tbody></table></div>);
    if(type==='garment1'){
      const a=s.annotations||[]; const h=Math.ceil(a.length/2);
      // Layout: annotation column | image column | annotation column.
      // The image gets 5/7 (~71%) of the page width and stretches to the full
      // page height (alignItems:'stretch' on the outer grid + minHeight:0 on
      // the image wrapper). This is roughly 2× bigger than the old 3/5 split
      // and reclaims the empty top/bottom whitespace seen on prior prints.
      return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 5fr 1fr', gap:'8px', padding:'10px', alignItems:'stretch', minHeight:0}}>
        <div style={{display:'flex', flexDirection:'column', justifyContent:'center'}}>{a.slice(0,h).map((x,i)=><div key={i} style={{marginBottom:'10px', padding:'6px 10px', borderRight:'2px solid #d63031', fontSize:'9pt'}}>{x}</div>)}</div>
        <div style={{display:'grid', gridTemplateColumns:(s.frontImage&&s.backImage?'1fr 1fr':'1fr'), gap:'10px', justifyItems:'center', alignItems:'center', minHeight:0}}>
          <TImg path={s.frontImage} maxH="100%" />
          <TImg path={s.backImage} maxH="100%" />
        </div>
        <div style={{display:'flex', flexDirection:'column', justifyContent:'center'}}>{a.slice(h).map((x,i)=><div key={i} style={{marginBottom:'10px', padding:'6px 10px', borderLeft:'2px solid #d63031', fontSize:'9pt'}}>{x}</div>)}</div>
      </div>);
    }
    if(type==='collarCuffs') return (<div style={{flex:1, display:'flex', flexDirection:'column', gap:'12px', padding:'14px 20px'}}>{[1,2].map(n=>{ const photo=s['photo'+n], cap=s['caption'+n]; return (<div key={n} style={{border:'2px solid #1a1a1a', padding:'10px', flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:0, background:'#fafafa'}}><TImg path={photo} maxH="2.6in" />{cap&&<div style={{marginTop:'6px', fontWeight:700, fontSize:'9pt'}}>{cap}</div>}</div>); })}</div>);
    if(type==='sizechart') return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', padding:'10px', alignItems:'center'}}><div style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}><TImg path={s.chartImage} maxH="5.5in" />{s.fabricNote&&<div style={{marginTop:'10px', fontSize:'9pt', fontWeight:700}}>{s.fabricNote}</div>}</div><div style={{textAlign:'center'}}><div style={{fontSize:'16pt', fontWeight:700, fontStyle:'italic', letterSpacing:'1px', color:'#1d3557'}}>Steeze</div><div style={{letterSpacing:'1px', marginBottom:'10px', fontSize:'11pt'}}>{s.titleHeading}</div>{s.footerNote1&&<div style={{fontSize:'9pt', fontWeight:700, marginTop:'8px'}}>{s.footerNote1}</div>}{s.footerNote2&&<div style={{fontSize:'9pt'}}>{s.footerNote2}</div>}</div></div>);
    if(type==='materials'){
      const cols=(s.columns||[]).filter(c=>c && (c.title||c.name||c.colorCode||c.image));
      const rowCount=Math.max(1, Math.ceil(cols.length/3));
      const rowsTpl=Array(rowCount).fill('1fr').join(' ');
      return (<div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gridTemplateRows:rowsTpl, gap:'8px', padding:'10px', minHeight:0, overflow:'hidden'}}>{cols.map((c,i)=>(<div key={i} style={{...TP.box, minHeight:0}}><div style={{background:'#f0f0f0', borderBottom:'1px solid #1a1a1a', padding:'4px 10px', fontWeight:700, fontSize:'10pt', textAlign:'center', flexShrink:0}}>{c.title}</div><div style={{padding:'3px 10px', fontSize:'8.5pt', flexShrink:0}}><strong>FABRIC NAME:</strong> {c.name}</div><div style={{padding:'3px 10px', fontSize:'8.5pt', borderBottom:'1px solid #d0d0d0', flexShrink:0}}><strong>COLOR CODE:</strong> {c.colorCode}</div><div style={{...TP.imgWrap, background:'#fafafa', minHeight:0, flex:1}}><TImg path={c.image} /></div></div>))}</div>);
    }
    if(type==='trims') return (<div style={{flex:1, padding:'10px', display:'flex', flexDirection:'column', gap:'8px'}}><div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', border:'1px solid #1a1a1a', flex:1, minHeight:0}}>{(s.columns||[]).map((c,i,arr)=>(<div key={i} style={{borderRight:i<arr.length-1?'1px solid #1a1a1a':'none', display:'flex', flexDirection:'column', minHeight:0}}><div style={{background:'#f0f0f0', padding:'6px 10px', fontWeight:700, fontSize:'10pt', borderBottom:'1px solid #1a1a1a'}}>{c.title}</div><div style={{padding:'6px 10px', borderBottom:'1px solid #d0d0d0', fontSize:'9.5pt', fontWeight:700}}>{c.name}</div><div style={{...TP.imgWrap, background:'#fafafa'}}><TImg path={c.image} /></div></div>))}</div>{s.packaging&&<div style={{border:'1px solid #1a1a1a', padding:'8px 12px', fontSize:'9.5pt'}}><div style={{fontWeight:700, marginBottom:'4px'}}>{s.packaging.title||'PACKAGING'}</div><div><strong>PACKAGING TYPE:</strong> {s.packaging.type}</div><div><strong>SIZE:</strong> {s.packaging.size}</div></div>}</div>);
    if(type==='graphicFront'||type==='graphicBack') return (<div style={{flex:1, padding:'10px', display:'flex', flexDirection:'column', gap:'10px', minHeight:0}}><div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px', minHeight:0}}>{['artworkImage','placementImage'].map((k,i)=>(<div key={k} style={TP.box}><div style={{...TP.bar}}>{i===0?'GRAPHIC ARTWORK LAYOUT AND MEASUREMENTS':'GRAPHIC PLACEMENT'}</div><div style={{...TP.imgWrap, position:'relative'}}><TImg path={s[k]} />{i===0&&s.widthLabel&&<div style={{position:'absolute', bottom:'4px', color:'#d63031', fontWeight:700, fontSize:'9pt'}}>← {s.widthLabel} →</div>}</div></div>))}</div><div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>{['cw1','cw2'].map((cw,i)=>{ const d=s[cw]||{}; return (<div key={cw} style={{border:'1px solid #1a1a1a'}}><div style={{background:'#e8e8e8', padding:'4px 10px', fontWeight:700, fontSize:'9pt', borderBottom:'1px solid #1a1a1a'}}>GRAPHIC COLOUR(S): COLOURWAY 0{i+1}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Technique: {d.technique}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Position: {d.position}</div><div style={{padding:'3px 10px', fontSize:'9pt'}}>Size: {d.size}</div>{d.extra&&<div style={{padding:'3px 10px', fontSize:'9pt'}}>{d.extra}</div>}</div>); })}</div></div>);
    if(type==='bom'){ const rows=[...(s.rows||[])]; while(rows.length<8) rows.push({}); return (<div style={{flex:1, padding:'10px'}}><table style={{borderCollapse:'collapse', width:'100%', fontSize:'8pt'}}><thead><tr>{['ITEM','DESCRIPTION','COLOR','SUPPLIER','QTY','UNIT','UNIT ₱'].map(h=><th key={h} style={{...TP.cell, background:'#f0f0f0'}}>{h}</th>)}</tr></thead><tbody>{rows.map((r,i)=>(<tr key={i}>{['item','description','color','supplier','qty','unit','price'].map(k=><td key={k} style={{...TP.cell, textAlign:'left', height:'22px'}}>{r[k]||''}</td>)}</tr>))}</tbody></table></div>); }
    if(type==='signatures') return (<div style={{flex:1, padding:'10px'}}>{s.warning&&<div style={{textAlign:'center', color:'#d63031', fontWeight:700, fontSize:'10pt', padding:'4px 10px'}}>{s.warning}</div>}<table style={{borderCollapse:'collapse', width:'100%', fontSize:'9.5pt', marginTop:'6px'}}><thead><tr>{['','NAME','SIGNATURE','DATE'].map(h=><th key={h} style={{...TP.cell, background:'#f0f0f0'}}>{h}</th>)}</tr></thead><tbody>{(s.rows||[]).map((r,i)=>(<tr key={i}><td style={{...TP.cell, textAlign:'left', fontWeight:700, background:'#fafafa'}}>{r.role}</td><td style={{...TP.cell, textAlign:'left'}}>{r.name}</td><td style={{...TP.cell, height:'30px'}}></td><td style={{...TP.cell, textAlign:'left'}}>{r.date}</td></tr>))}</tbody></table>{s.footerNote&&<div style={{marginTop:'10px', color:'#d63031', fontWeight:700, fontSize:'9pt'}}>{s.footerNote}</div>}</div>);
    return null;
  }

  return (
    <div className="tp-root fixed inset-0 bg-slate-100 z-50 overflow-auto">
      <div className="no-print sticky top-0 bg-white border-b px-5 py-3 flex items-center justify-between gap-3 flex-wrap z-10">
        <div className="min-w-0"><div className="font-bold text-slate-900 truncate">Techpack — {tp.styleName||lead.title}</div><div className="text-xs text-slate-500">{tp.clientName}</div></div>
        <div className="flex items-center gap-2">
          {readOnly ? <div className="text-xs text-slate-500 px-2 py-1 bg-slate-100 rounded">📋 Preview (read-only)</div> : <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setMode('edit')} className={`px-3 py-1.5 rounded-md ${mode==='edit'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Edit</button><button onClick={()=>setMode('preview')} className={`px-3 py-1.5 rounded-md ${mode==='preview'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Preview</button></div>}
          {mode==='preview' && <button onClick={()=>window.print()} className="px-3 py-2 rounded-lg border text-sm hover:bg-slate-50">🖨 Print</button>}
          {!readOnly && <button onClick={save} disabled={saving} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold disabled:opacity-50">{saving?'Saving…':'Save'}</button>}
          <button onClick={onClose} className="px-3 py-2 rounded-lg text-slate-500 text-sm hover:text-slate-800">Close</button>
        </div>
      </div>

      {mode==='edit' ? (
        <div className="flex">
          <div className="no-print w-56 bg-white border-r min-h-screen p-2 space-y-2">
            <button onClick={()=>setActive('header')} className={`w-full flex items-center gap-2 rounded-lg px-2 py-2 text-sm ${active==='header'?'bg-indigo-50 text-indigo-700 font-semibold':'text-slate-700 hover:bg-slate-50'}`}><span>📄</span> Header Info</button>
            <div className="text-[10px] uppercase text-slate-400 px-2 pt-1">Sections</div>
            <div className="space-y-0.5">{TECHPACK_SECTIONS.map(s=>{ const dupes=(tp.extraPages||[]).filter(p=>p.type===s.key); return (
              <div key={s.key}>
                <div className={`flex items-center gap-2 rounded-lg px-2 py-1.5 ${active===s.key?'bg-indigo-50':''}`}>
                  <input type="checkbox" checked={tp[s.key].enabled!==false} onChange={e=>toggleSection(s.key,e.target.checked)} />
                  <button onClick={()=>setActive(s.key)} className={`flex-1 text-left text-sm ${active===s.key?'text-indigo-700 font-semibold':'text-slate-600'}`}>{s.label}</button>
                  <button onClick={()=>duplicateSection(s.key)} title="Duplicate this page" className="text-slate-400 hover:text-indigo-600 text-sm">⧉</button>
                </div>
                {dupes.map((p,di)=>(<div key={p.id} className={`flex items-center gap-2 rounded-lg pl-7 pr-2 py-1 ${active===p.id?'bg-indigo-50':''}`}><button onClick={()=>setActive(p.id)} className={`flex-1 text-left text-xs ${active===p.id?'text-indigo-700 font-semibold':'text-slate-500'}`}>{s.label} (copy {di+1})</button><button onClick={()=>removeExtra(p.id)} title="Delete copy" className="text-rose-300 hover:text-rose-500 text-xs">✕</button></div>))}
              </div>
            ); })}</div>
          </div>
          <div className="flex-1 p-6"><div className="bg-white border rounded-xl p-5 max-w-3xl"><div className="font-bold text-slate-900 mb-3">{active==='header'?'Header Info':((TECHPACK_SECTIONS.find(s=>s.key===pageType)||{}).label)+(isExtra?' (copy)':'')}</div>{editor()}</div></div>
        </div>
      ) : null}

      {pickingChart && <Modal title="Size chart library" onClose={()=>setPickingChart(false)} wide>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {(sizeCharts||[]).map(c=>(
            <div key={c.id} className="border rounded-lg p-3 bg-white hover:border-indigo-500">
              <button onClick={()=>applyChart(c)} className="w-full text-left">
                <div className="font-semibold text-sm">{c.name}</div>
                {c.garment_type && <div className="text-[10px] text-slate-500 uppercase mb-1">{c.garment_type}</div>}
                <div className="h-28 bg-slate-50 border rounded flex items-center justify-center overflow-hidden mt-1">{c.chart_image ? <TImg path={c.chart_image} maxH="6.5rem" /> : <span className="text-slate-300 text-xs">no image</span>}</div>
                {c.title_heading && <div className="text-xs text-slate-600 mt-1 truncate">{c.title_heading}</div>}
              </button>
              <div className="flex justify-between mt-2"><button onClick={()=>applyChart(c)} className="text-xs px-2 py-1 rounded bg-indigo-600 text-white font-semibold">Use this</button><button onClick={async()=>{ if(!confirm('Delete "'+c.name+'" from library?')) return; const {error}=await sb.from('size_charts').delete().eq('id',c.id); if(error){ alert(error.message); return; } reloadCharts&&reloadCharts(); }} className="text-xs text-rose-500 hover:underline">Delete</button></div>
            </div>
          ))}
          {(sizeCharts||[]).length===0 && <div className="col-span-3 text-center text-slate-400 py-8 text-sm">No saved size charts yet. Use "💾 Save to library" on a size guide section to add your first one.</div>}
        </div>
      </Modal>}

      {pickingMockup && <Modal title="Garment mockup library" onClose={()=>setPickingMockup(false)} wide>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {(garmentMockups||[]).map(m=>(
            <div key={m.id} className="border rounded-lg p-3 bg-white hover:border-indigo-500">
              <button onClick={()=>applyMockup(m)} className="w-full text-left">
                <div className="font-semibold text-sm">{m.name}</div>
                {m.garment_type && <div className="text-[10px] text-slate-500 uppercase mb-1">{m.garment_type}</div>}
                <div className="grid grid-cols-2 gap-1 mt-1">
                  <div className="h-24 bg-slate-50 border rounded flex items-center justify-center overflow-hidden">{m.front_image?<TImg path={m.front_image} maxH="5.5rem" />:<span className="text-slate-300 text-[10px]">front</span>}</div>
                  <div className="h-24 bg-slate-50 border rounded flex items-center justify-center overflow-hidden">{m.back_image?<TImg path={m.back_image} maxH="5.5rem" />:<span className="text-slate-300 text-[10px]">back</span>}</div>
                </div>
              </button>
              <div className="flex justify-between mt-2"><button onClick={()=>applyMockup(m)} className="text-xs px-2 py-1 rounded bg-indigo-600 text-white font-semibold">Use this</button><button onClick={async()=>{ if(!confirm('Delete "'+m.name+'" from library?')) return; const {error}=await sb.from('garment_mockups').delete().eq('id',m.id); if(error){ alert(error.message); return; } reloadMockups&&reloadMockups(); }} className="text-xs text-rose-500 hover:underline">Delete</button></div>
            </div>
          ))}
          {(garmentMockups||[]).length===0 && <div className="col-span-3 text-center text-slate-400 py-8 text-sm">No saved mockups yet. Use "💾 Save to library" on a Garment Details section to add your first one.</div>}
        </div>
      </Modal>}

      {mode==='preview' && (
        <div className="tp-print py-6">
          {(()=>{
            const pages=[]; let n=0;
            const add=(type,s,domKey,isCopy)=>{ if(!s||s.enabled===false) return; n++; const meta=TECHPACK_SECTIONS.find(x=>x.key===type); pages.push(<TpPageFrame key={domKey} hdr={tp} pageNo={n} title={(meta?meta.label.toUpperCase():'')+(isCopy?' (COPY)':'')}>{sectionBody(type,s)}</TpPageFrame>); };
            TECHPACK_SECTIONS.forEach(s=>{ add(s.key, tp[s.key], s.key, false); (tp.extraPages||[]).filter(p=>p.type===s.key).forEach(p=>add(p.type,p.data,p.id,true)); });
            if(pages.length===0) pages.push(<div key="empty" className="text-center text-slate-400 py-12">No sections included yet. Tick or edit a section, then come back to Preview.</div>);
            return pages;
          })()}
        </div>
      )}
    </div>
  );
}

/* ----------------------- Techpacks list ----------------------- */
function TechpacksList({ profile, profiles, leads, clients, onOpen }){
  const [search,setSearch]=useState('');
  const [typeFilter,setTypeFilter]=useState(''); // '' = all
  // Per-type counts so the chip filter shows the size of each bucket.
  const typeCounts = (()=>{
    const counts = { __all: 0 };
    TECHPACK_TYPES.forEach(t => counts[t] = 0);
    (leads||[]).forEach(l => {
      if(!l.techpack) return;
      counts.__all += 1;
      const t = l.techpack.techpackType;
      if(t && counts[t] !== undefined) counts[t] += 1;
    });
    return counts;
  })();
  const tpColors = {
    'TRAD PRODUCTION': 'bg-rose-100 text-rose-700 border-rose-200',
    'SUBLI PRODUCTION': 'bg-purple-100 text-purple-700 border-purple-200',
    'TRAD SAMPLE': 'bg-amber-100 text-amber-700 border-amber-200',
    'SUBLI SAMPLE': 'bg-blue-100 text-blue-700 border-blue-200',
  };
  // Sort by updated desc so freshest work is on top.
  const withTp = (leads||[])
    .filter(l => l.techpack)
    .filter(l => !typeFilter || l.techpack.techpackType === typeFilter)
    .filter(l => {
      if(!search) return true;
      const term = search.toLowerCase();
      const c = clients.find(x => x.id === l.client_id);
      const tpNo = l.techpack?.prodFormNo || l.techpack_number || '';
      return [l.title, c?.company || '', l.techpack.styleName || '', l.techpack.techpackType || '', tpNo]
        .join(' ').toLowerCase().includes(term);
    })
    .sort((a,b) => (b.techpack?.updatedAt||'').localeCompare(a.techpack?.updatedAt||''));
  return (
    <div className="p-6">
      <div className="mb-4">
        <h1 className="text-2xl font-bold text-slate-900 mb-1">📋 Techpacks</h1>
        <p className="text-slate-500 text-sm">All techpacks created by the team. Click any row to open the techpack editor.</p>
      </div>

      {/* Type filter chips */}
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <button onClick={()=>setTypeFilter('')} className={`text-xs px-3 py-1.5 rounded-full border font-medium ${typeFilter===''?'bg-slate-900 text-white border-slate-900':'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}`}>
          All <span className={`ml-1 ${typeFilter===''?'opacity-80':'text-slate-400'}`}>({typeCounts.__all})</span>
        </button>
        {TECHPACK_TYPES.map(t => (
          <button key={t} onClick={()=>setTypeFilter(typeFilter===t?'':t)} className={`text-xs px-3 py-1.5 rounded-full border font-medium ${typeFilter===t?(tpColors[t]||'bg-indigo-100 text-indigo-700 border-indigo-200')+' ring-2 ring-offset-1':'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}`}>
            {t} <span className={`ml-1 ${typeFilter===t?'opacity-80':'text-slate-400'}`}>({typeCounts[t]||0})</span>
          </button>
        ))}
      </div>

      <div className="flex items-center gap-2 mb-4">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search techpack #, client, style…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-72" />
        {(search || typeFilter) && <button onClick={()=>{ setSearch(''); setTypeFilter(''); }} className="text-xs text-slate-500 hover:text-slate-800 underline">Clear filters</button>}
      </div>

      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr>
          <th className="text-left px-3 py-2">Techpack #</th>
          <th className="text-left px-3 py-2">Client</th>
          <th className="text-left px-3 py-2">Style</th>
          <th className="text-left px-3 py-2">Type</th>
          <th className="text-left px-3 py-2">Updated</th>
          <th></th>
        </tr></thead>
        <tbody>{withTp.map(l=>{
          const c = clients.find(x => x.id === l.client_id);
          const tpNo = l.techpack?.prodFormNo || l.techpack_number || '';
          const tpType = l.techpack?.techpackType || '';
          const styleName = l.techpack?.styleName || l.title;
          return (
            <tr key={l.id} onClick={()=>onOpen(l)} className="border-t hover:bg-slate-50 cursor-pointer">
              <td className="px-3 py-2 font-mono text-xs">{tpNo || <span className="text-slate-300">—</span>}</td>
              <td className="px-3 py-2 font-medium">{c?.company || <span className="text-slate-400">—</span>}</td>
              <td className="px-3 py-2">{styleName}</td>
              <td className="px-3 py-2">{tpType ? <span className={`text-[10px] px-2 py-0.5 rounded font-semibold ${tpColors[tpType]||'bg-slate-100 text-slate-700'}`}>{tpType}</span> : <span className="text-slate-300 text-xs">—</span>}</td>
              <td className="px-3 py-2 text-xs text-slate-500">{l.techpack?.updatedAt || '—'}</td>
              <td className="px-3 py-2 text-right"><button onClick={(e)=>{ e.stopPropagation(); onOpen(l); }} className="text-xs text-indigo-600 hover:underline">Open</button></td>
            </tr>
          );
        })}{withTp.length===0 && <tr><td colSpan="6" className="text-center text-slate-400 py-8">{typeFilter||search ? 'No techpacks match these filters.' : 'No techpacks yet. Open a lead and click "Create techpack".'}</td></tr>}</tbody>
      </table></div></div>
    </div>
  );
}

/* ====================== PURCHASING MODULE (Inventory / Suppliers) ====================== */
// Four inventory "buckets" — these become the top tabs. The `key` is what's
// stored in items.bucket; the `match` patterns are used as a fallback in case
// an item came from a legacy import without a bucket assigned.
const INV_BUCKETS = [
  { key:'fabrics',  label:'Fabrics',          icon:'🧵' },
  { key:'trims',    label:'Trims',            icon:'🔗' },
  { key:'printing', label:'Printing Supplies', icon:'🖨' },
  { key:'office',   label:'Office Supplies',  icon:'📎' },
  { key:'other',    label:'Other',            icon:'•••' }, // catch-all
];
const INV_BUCKET_KEYS = INV_BUCKETS.map(b=>b.key);
function bucketOf(item){
  const b = (item.bucket||'').toLowerCase().trim();
  return INV_BUCKET_KEYS.includes(b) ? b : 'other';
}

function InventoryView({ suppliers, items, departments, reload }){
  const [tab,setTab]=useState(()=>{ try{ return localStorage.getItem('steeze.inv.tab')||'fabrics'; }catch(_){ return 'fabrics'; } });
  function pickTab(k){ setTab(k); try{ localStorage.setItem('steeze.inv.tab', k); }catch(_){} }
  const [search,setSearch]=useState('');
  const [editing,setEditing]=useState(null);
  const [creating,setCreating]=useState(false);
  const [filterCat,setFilterCat]=useState('');
  const [showLow,setShowLow]=useState(false);
  const [importing,setImporting]=useState(false);
  // Precompute per-bucket stats so each tab header can show its own counts.
  const stats = INV_BUCKETS.reduce((acc,b)=>{ acc[b.key]={ count:0, value:0, low:0 }; return acc; },{});
  (items||[]).forEach(i=>{
    const k = bucketOf(i);
    if(!stats[k]) stats[k] = { count:0, value:0, low:0 };
    stats[k].count += 1;
    stats[k].value += Number(i.qty||0)*Number(i.cost||0);
    const isLow = Number(i.qty||0)<=Number(i.reorder||0) && Number(i.reorder||0)>0;
    if(isLow) stats[k].low += 1;
  });
  // Hide the Other tab if it's empty — no need to clutter the nav when every
  // item already maps cleanly into one of the four real buckets.
  const visibleBuckets = INV_BUCKETS.filter(b => b.key !== 'other' || stats.other.count > 0);
  // Items in the current tab, after search / sub-category filter / low-stock.
  const tabItems = (items||[]).filter(i => bucketOf(i) === tab);
  const subCats = Array.from(new Set(tabItems.map(i=>i.category).filter(Boolean))).sort();
  const rows = tabItems.filter(i=>
    (!search || `${i.sku} ${i.name} ${i.brand} ${i.model}`.toLowerCase().includes(search.toLowerCase()))
    && (!filterCat || i.category === filterCat)
    && (!showLow || (Number(i.qty||0)<=Number(i.reorder||0) && Number(i.reorder||0)>0))
  );
  async function del(id){ if(!confirm('Delete this item?')) return; const {error}=await sb.from('items').delete().eq('id',id); if(error){ alert(error.message); return; } reload(); }
  const suppName=(id)=>suppliers.find(s=>s.id===id)?.company||'—';
  const tabMeta = INV_BUCKETS.find(b=>b.key===tab) || INV_BUCKETS[0];

  // Group rows by trimmed lowercase `name` so e.g. "Lacoste" appears once as
  // a parent row with its color variants underneath. Singletons (a fabric
  // with only one row) render flat — no expand/collapse noise.
  const groups = (()=>{
    const map = new Map();
    rows.forEach(i=>{
      const key = (i.name||'').trim().toLowerCase() || '__unnamed';
      if(!map.has(key)) map.set(key,{ key, name:i.name||'—', items:[], totalQty:0, totalValue:0, low:0, units:new Set() });
      const g = map.get(key);
      g.items.push(i);
      g.totalQty += Number(i.qty||0);
      g.totalValue += Number(i.qty||0) * Number(i.cost||0);
      if(i.unit) g.units.add(i.unit);
      if(Number(i.qty||0) <= Number(i.reorder||0) && Number(i.reorder||0) > 0) g.low += 1;
    });
    return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name));
  })();
  const [expanded,setExpanded]=useState(()=>new Set());
  function toggleExpand(key){ setExpanded(prev=>{ const n=new Set(prev); if(n.has(key)) n.delete(key); else n.add(key); return n; }); }
  const [bulkAdding,setBulkAdding]=useState(false);
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">📦 Inventory</h1><p className="text-slate-500 text-sm">{items.length} items total · {peso(Object.values(stats).reduce((s,x)=>s+x.value,0))} total value · {Object.values(stats).reduce((s,x)=>s+x.low,0)} below reorder</p></div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setImporting(true)} className="px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">⇪ Import CSV</button>
            <button onClick={()=>setBulkAdding(true)} className="px-4 py-2 rounded-lg bg-white border border-indigo-300 text-indigo-700 text-sm font-semibold hover:bg-indigo-50">+ Multi-color</button>
            <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">+ New item</button>
          </div>
        </div>
      </div>

      {/* Top tabs — one per inventory bucket. Each shows its own item count and
          a red dot when there's at least one item below its reorder point so
          the right team spots low stock at a glance. */}
      <div className="flex gap-1 border-b mb-4 overflow-x-auto">
        {visibleBuckets.map(b=>{ const s=stats[b.key]||{count:0,low:0}; const active=tab===b.key; return (
          <button key={b.key} onClick={()=>{ pickTab(b.key); setFilterCat(''); setShowLow(false); }} className={`px-4 py-2 text-sm rounded-t-lg flex items-center gap-2 whitespace-nowrap ${active?'border border-b-0 bg-white font-semibold text-indigo-700':'text-slate-500 hover:text-slate-800'}`}>
            <span>{b.icon}</span>
            <span>{b.label}</span>
            <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${active?'bg-indigo-100 text-indigo-700':'bg-slate-100 text-slate-500'}`}>{s.count}</span>
            {s.low > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 font-semibold">{s.low} low</span>}
          </button>
        ); })}
      </div>

      {/* Per-tab stats strip */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">{tabMeta.label} items</div><div className="text-2xl font-bold">{stats[tab]?.count||0}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">{tabMeta.label} value</div><div className="text-2xl font-bold">{peso(stats[tab]?.value||0)}</div></div>
        <button onClick={()=>setShowLow(!showLow)} className={`text-left rounded-xl border p-4 ${showLow?'bg-rose-600 border-rose-600 text-white':'bg-white hover:border-rose-300'}`}>
          <div className={`text-[11px] uppercase ${showLow?'text-rose-100':'text-slate-400'}`}>Below reorder</div>
          <div className="text-2xl font-bold">{stats[tab]?.low||0}</div>
          <div className={`text-xs ${showLow?'text-rose-100':'text-slate-500'}`}>{showLow?'filtering':'click to filter'}</div>
        </button>
        <div className="bg-white border rounded-xl p-4"><div className="text-[11px] uppercase text-slate-400">Sub-categories</div><div className="text-2xl font-bold">{subCats.length}</div></div>
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={`Search ${tabMeta.label}…`} className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-72" />
        {subCats.length>0 && <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All sub-categories</option>{subCats.map(c=><option key={c} value={c}>{c}</option>)}</select>}
      </div>

      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr>
          <th className="text-left px-3 py-2 w-8"></th>
          <th className="text-left px-3 py-2">SKU</th>
          <th className="text-left px-3 py-2">Name / Color</th>
          <th className="text-left px-3 py-2">Sub-category</th>
          <th className="text-left px-3 py-2">Supplier</th>
          <th className="text-right px-3 py-2">Qty</th>
          <th className="text-right px-3 py-2">Cost ₱</th>
          <th className="text-right px-3 py-2">Value</th>
          <th></th>
        </tr></thead>
        <tbody>{groups.map(g=>{
          const isMulti = g.items.length > 1;
          const open = !isMulti || expanded.has(g.key);
          // Singletons (one color/variant) render as a flat row — no parent
          // header needed, just the item itself.
          if(!isMulti){
            const i = g.items[0];
            const low = Number(i.qty||0)<=Number(i.reorder||0)&&Number(i.reorder||0)>0;
            return (
              <tr key={g.key} className={`border-t hover:bg-slate-50 ${low?'bg-rose-50/40':''}`}>
                <td></td>
                <td className="px-3 py-2 font-mono text-xs">{i.sku||'—'}</td>
                <td className="px-3 py-2 font-medium">{i.name}<div className="text-[10px] text-slate-500">{[i.brand,i.model,i.color,i.size].filter(Boolean).join(' · ')}</div></td>
                <td className="px-3 py-2 text-xs">{i.category||'—'}</td>
                <td className="px-3 py-2 text-xs">{suppName(i.supplier_id)}</td>
                <td className={`px-3 py-2 text-right ${low?'text-rose-600 font-bold':''}`}>{i.qty||0} {i.unit||''}{low && <div className="text-[10px]">low · reorder at {i.reorder}</div>}</td>
                <td className="px-3 py-2 text-right">{peso(i.cost)}</td>
                <td className="px-3 py-2 text-right font-semibold">{peso(Number(i.qty||0)*Number(i.cost||0))}</td>
                <td className="px-3 py-2 text-right whitespace-nowrap"><button onClick={()=>setEditing(i)} className="text-xs text-indigo-600 hover:underline mr-2">Edit</button><button onClick={()=>del(i.id)} className="text-xs text-rose-500 hover:underline">Delete</button></td>
              </tr>
            );
          }
          // Multi-color group: parent header row + child rows when expanded.
          const unitDisplay = g.units.size === 1 ? Array.from(g.units)[0] : '';
          return (<React.Fragment key={g.key}>
            <tr className="border-t bg-slate-50/60 hover:bg-slate-100 cursor-pointer" onClick={()=>toggleExpand(g.key)}>
              <td className="px-3 py-2 text-center text-slate-400 select-none">{open?'▾':'▸'}</td>
              <td className="px-3 py-2 text-[10px] uppercase tracking-wider text-slate-500">{g.items.length} color{g.items.length===1?'':'s'}</td>
              <td className="px-3 py-2 font-bold text-slate-900">{g.name}</td>
              <td className="px-3 py-2 text-xs text-slate-500">{Array.from(new Set(g.items.map(x=>x.category).filter(Boolean))).join(' · ')||'—'}</td>
              <td className="px-3 py-2 text-xs text-slate-500">{Array.from(new Set(g.items.map(x=>suppName(x.supplier_id)).filter(s=>s&&s!=='—'))).join(' · ')||'—'}</td>
              <td className="px-3 py-2 text-right font-semibold">{g.totalQty} {unitDisplay}</td>
              <td className="px-3 py-2 text-right text-xs text-slate-500">—</td>
              <td className="px-3 py-2 text-right font-bold text-emerald-700">{peso(g.totalValue)}</td>
              <td className="px-3 py-2 text-right whitespace-nowrap">{g.low > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 font-semibold">{g.low} low</span>}</td>
            </tr>
            {open && g.items.map(i=>{ const low=Number(i.qty||0)<=Number(i.reorder||0)&&Number(i.reorder||0)>0; return (
              <tr key={i.id} className={`border-t hover:bg-slate-50 ${low?'bg-rose-50/40':''}`}>
                <td></td>
                <td className="px-3 py-2 font-mono text-xs pl-6">{i.sku||'—'}</td>
                <td className="px-3 py-2 pl-6"><span className="text-slate-500 text-xs">↳</span> <span className="font-medium">{i.color||'(no color)'}</span><div className="text-[10px] text-slate-400">{[i.brand,i.model,i.size].filter(Boolean).join(' · ')}</div></td>
                <td className="px-3 py-2 text-xs">{i.category||'—'}</td>
                <td className="px-3 py-2 text-xs">{suppName(i.supplier_id)}</td>
                <td className={`px-3 py-2 text-right ${low?'text-rose-600 font-bold':''}`}>{i.qty||0} {i.unit||''}{low && <div className="text-[10px]">low · reorder at {i.reorder}</div>}</td>
                <td className="px-3 py-2 text-right">{peso(i.cost)}</td>
                <td className="px-3 py-2 text-right font-semibold">{peso(Number(i.qty||0)*Number(i.cost||0))}</td>
                <td className="px-3 py-2 text-right whitespace-nowrap"><button onClick={()=>setEditing(i)} className="text-xs text-indigo-600 hover:underline mr-2">Edit</button><button onClick={()=>del(i.id)} className="text-xs text-rose-500 hover:underline">Delete</button></td>
              </tr>
            ); })}
          </React.Fragment>);
        })}{groups.length===0 && <tr><td colSpan="9" className="text-center text-slate-400 py-8">No {tabMeta.label.toLowerCase()} yet{showLow?' below the reorder threshold':''}. Click "+ New item" or "+ Multi-color" to add.</td></tr>}</tbody>
      </table></div></div>

      {(creating||editing) && <ItemForm existing={editing} defaultBucket={tab} suppliers={suppliers} departments={departments} onClose={()=>{ setCreating(false); setEditing(null); }} onSaved={(saved)=>{ setCreating(false); setEditing(null); if(saved && saved.bucket && saved.bucket !== tab) pickTab(saved.bucket); reload(); }} />}
      {bulkAdding && <BulkColorItemForm defaultBucket={tab} suppliers={suppliers} departments={departments} onClose={()=>setBulkAdding(false)} onSaved={()=>{ setBulkAdding(false); reload(); }} />}
      {importing && <ItemImportModal suppliers={suppliers} departments={departments} onClose={()=>setImporting(false)} onDone={()=>{ setImporting(false); reload(); }} />}
    </div>
  );
}

// Bulk-add form: one shared parent (name, brand, supplier, cost defaults) +
// many color rows. Each color row becomes its own item with its own SKU and
// starting qty. Same `name` field across all rows is what makes them appear
// grouped on the Inventory page.
function BulkColorItemForm({ defaultBucket, suppliers, departments, onClose, onSaved }){
  const [shared,setShared]=useState({
    name:'', brand:'', model:'',
    bucket:(defaultBucket && defaultBucket!=='other')?defaultBucket:'fabrics',
    category:'',
    unit:'yd',
    cost:0,
    price:0,
    reorder:0,
    dept_id:null, supplier_id:null,
    location:'', notes:''
  });
  function setS(k,v){ setShared(p=>({...p,[k]:v})); }
  const [colors,setColors]=useState([
    { id:'c'+Date.now(), color:'', sku:'', qty:0 },
    { id:'c'+(Date.now()+1), color:'', sku:'', qty:0 },
  ]);
  function setColor(idx,k,v){ setColors(arr=>arr.map((c,i)=>i===idx?{...c,[k]:v}:c)); }
  function addRow(){ setColors(arr=>[...arr,{ id:'c'+Date.now()+Math.random(), color:'', sku:'', qty:0 }]); }
  function removeRow(idx){ setColors(arr=>arr.length===1?arr:arr.filter((_,i)=>i!==idx)); }
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  async function save(){
    if(!shared.name.trim()){ setMsg('Fabric / item name is required.'); return; }
    const valid = colors.filter(c=>c.color.trim());
    if(valid.length===0){ setMsg('Add at least one color row.'); return; }
    setBusy(true); setMsg('');
    const payloads = valid.map(c=>({
      name: shared.name.trim(),
      sku: (c.sku||'').trim(),
      bucket: shared.bucket,
      category: shared.category||'',
      brand: shared.brand||'',
      model: shared.model||'',
      color: c.color.trim(),
      size:'',
      unit: shared.unit||'pc',
      qty: Number(c.qty)||0,
      cost: Number(shared.cost)||0,
      price: Number(shared.price)||0,
      reorder: Number(shared.reorder)||0,
      dept_id: shared.dept_id||null,
      supplier_id: shared.supplier_id||null,
      location: shared.location||'',
      notes: shared.notes||''
    }));
    const { error } = await sb.from('items').insert(payloads);
    setBusy(false);
    if(error){ setMsg(error.message); return; }
    onSaved();
  }
  return (
    <Modal title="Add fabric / item in multiple colors" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="bg-slate-50 border rounded-lg p-3">
          <div className="text-xs font-semibold text-slate-700 mb-2">🧵 Shared fabric details — applied to every color row</div>
          <div className="grid grid-cols-3 gap-2">
            <TpLbl t="Name *"><input className="input" value={shared.name} onChange={e=>setS('name',e.target.value)} placeholder="e.g. Lacoste" /></TpLbl>
            <TpLbl t="Bucket *">
              <select className="input" value={shared.bucket} onChange={e=>setS('bucket',e.target.value)}>
                {INV_BUCKETS.filter(b=>b.key!=='other').map(b=>(<option key={b.key} value={b.key}>{b.icon} {b.label}</option>))}
              </select>
            </TpLbl>
            <TpLbl t="Sub-category"><input className="input" value={shared.category} onChange={e=>setS('category',e.target.value)} placeholder="e.g. Cotton, Microfiber" /></TpLbl>
            <TpLbl t="Brand"><input className="input" value={shared.brand} onChange={e=>setS('brand',e.target.value)} /></TpLbl>
            <TpLbl t="Model / spec"><input className="input" value={shared.model} onChange={e=>setS('model',e.target.value)} placeholder="e.g. 200gsm" /></TpLbl>
            <TpLbl t="Unit"><input className="input" value={shared.unit} onChange={e=>setS('unit',e.target.value)} placeholder="yd / m / pc" /></TpLbl>
            <TpLbl t="Cost per unit ₱"><input type="number" className="input" value={shared.cost} onChange={e=>setS('cost',e.target.value)} /></TpLbl>
            <TpLbl t="Reorder point"><input type="number" className="input" value={shared.reorder} onChange={e=>setS('reorder',e.target.value)} /></TpLbl>
            <TpLbl t="Supplier"><select className="input" value={shared.supplier_id||''} onChange={e=>setS('supplier_id',e.target.value||null)}><option value="">—</option>{suppliers.map(s=>(<option key={s.id} value={s.id}>{s.company}</option>))}</select></TpLbl>
          </div>
        </div>

        <div className="bg-white border rounded-lg p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-slate-700">🎨 Colors — one row = one SKU on the shelf</div>
            <button onClick={addRow} className="text-xs text-indigo-600 hover:underline font-medium">+ Add color</button>
          </div>
          <div className="grid grid-cols-12 gap-2 text-[10px] uppercase tracking-wide text-slate-500 mb-1">
            <div className="col-span-4">Color *</div>
            <div className="col-span-4">SKU (optional)</div>
            <div className="col-span-3">Starting qty</div>
            <div className="col-span-1"></div>
          </div>
          <div className="space-y-2">{colors.map((c,idx)=>(
            <div key={c.id} className="grid grid-cols-12 gap-2 items-center">
              <input className="input col-span-4" placeholder="White / Beige / Black" value={c.color} onChange={e=>setColor(idx,'color',e.target.value)} />
              <input className="input col-span-4 font-mono text-xs" placeholder="LAC-WHT (auto if blank)" value={c.sku} onChange={e=>setColor(idx,'sku',e.target.value)} />
              <input type="number" min="0" className="input col-span-3" value={c.qty} onChange={e=>setColor(idx,'qty',e.target.value)} />
              <button onClick={()=>removeRow(idx)} className="col-span-1 text-rose-400 hover:text-rose-600 text-lg" title="Remove">✕</button>
            </div>
          ))}</div>
        </div>

        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':`Create ${colors.filter(c=>c.color.trim()).length||'all'} color item${colors.filter(c=>c.color.trim()).length===1?'':'s'}`}</button>
      </div>
    </Modal>
  );
}

function ItemImportModal({ suppliers, departments, onClose, onDone }){
  const TEMPLATE = 'name,sku,bucket,category,brand,model,color,size,unit,qty,cost,price,reorder,department,supplier,location,notes\nMain Fabric White,FAB-001,fabrics,Lacoste,Texstyle,,White,,yd,100,45,80,20,Fabrics,Texstyle Trading,Shelf A1,\nMetal Zipper 8in,TRM-014,trims,Zippers,YKK,8" Closed,Black,8in,pc,500,12,0,100,Trims,YKK Manila,Bin 3,\nDTF Black Ink,PRT-005,printing,Ink,Epson,,,500ml,bot,5,2200,0,2,Printing,Inkmaster,Cabinet A,\nA4 Bond Paper,OFF-002,office,Paper,Hard Copy,80gsm,White,A4,rim,10,180,0,5,Office,National Bookstore,Cabinet B,';
  const [csv,setCsv]=useState(''); const [parsed,setParsed]=useState(null);
  const [step,setStep]=useState('paste'); // paste | preview | importing | done
  const [results,setResults]=useState(null); const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState({ done:0, total:0 });

  function onFile(e){
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>setCsv(String(r.result||'')); r.readAsText(f);
  }
  function copyTemplate(){
    if(navigator.clipboard) navigator.clipboard.writeText(TEMPLATE).then(()=>{}, ()=>{});
    else setCsv(TEMPLATE);
  }
  function getVal(row, headers, col){ const idx=headers.indexOf(col); return idx>=0 ? String(row[idx]||'').trim() : ''; }
  function doParse(){
    const rows=parseCSV(csv.trim());
    if(rows.length<2){ alert('Need at least a header row + one data row.'); return; }
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    if(!headers.includes('name')){ alert('CSV must have a "name" column.'); return; }
    setParsed({ headers, dataRows:rows.slice(1) });
    setStep('preview');
  }
  async function doImport(){
    setBusy(true); setStep('importing');
    const { headers, dataRows } = parsed;
    let inserted=0, deptCreated=0, suppCreated=0; const errors=[];
    const deptMap=new Map(); (departments||[]).forEach(d=>deptMap.set(String(d.name||'').toLowerCase(), d.id));
    const suppMap=new Map(); (suppliers||[]).forEach(s=>suppMap.set(String(s.company||'').toLowerCase(), s.id));

    setProgress({ done:0, total:dataRows.length });
    const payloads=[];
    for(const r of dataRows){
      const name=getVal(r,headers,'name'); if(!name) continue;
      const dn=getVal(r,headers,'department'); const sn=getVal(r,headers,'supplier');
      let dept_id=null, supplier_id=null;
      if(dn){ const k=dn.toLowerCase(); if(deptMap.has(k)) dept_id=deptMap.get(k); else { const { data, error }=await sb.from('departments').insert({ name:dn }).select().single(); if(error) errors.push(`Dept "${dn}" create failed: ${error.message}`); else { dept_id=data.id; deptMap.set(k,data.id); deptCreated++; } } }
      if(sn){ const k=sn.toLowerCase(); if(suppMap.has(k)) supplier_id=suppMap.get(k); else { const { data, error }=await sb.from('suppliers').insert({ company:sn }).select().single(); if(error) errors.push(`Supplier "${sn}" create failed: ${error.message}`); else { supplier_id=data.id; suppMap.set(k,data.id); suppCreated++; } } }
      // Accept either an explicit `bucket` column OR infer it from the
      // free-text `category` column using the same pattern map as the SQL
      // migration. Anything we can't classify lands in 'other'.
      const explicitBucket=getVal(r,headers,'bucket').toLowerCase();
      const cat=getVal(r,headers,'category');
      let bucket=INV_BUCKET_KEYS.includes(explicitBucket)?explicitBucket:'other';
      if(bucket==='other'){
        const c=cat.toLowerCase();
        if(/fabric|cloth|material|cotton|polyester|microfiber|lacoste|denim|canvas/.test(c)) bucket='fabrics';
        else if(/trim|zip|button|thread|lining|pelon|elastic|collar|cuff|label|tag/.test(c)) bucket='trims';
        else if(/print|ink|dtf|subli|vinyl|toner|powder|transfer|embro/.test(c)) bucket='printing';
        else if(/office|paper|pen|pencil|folder|stationery|staple|clip/.test(c)) bucket='office';
      }
      payloads.push({ name, sku:getVal(r,headers,'sku'), bucket, category:cat, brand:getVal(r,headers,'brand'), model:getVal(r,headers,'model'), color:getVal(r,headers,'color'), size:getVal(r,headers,'size'), unit:getVal(r,headers,'unit')||'pc', qty:Number(getVal(r,headers,'qty'))||0, cost:Number(getVal(r,headers,'cost'))||0, price:Number(getVal(r,headers,'price'))||0, reorder:Number(getVal(r,headers,'reorder'))||0, dept_id, supplier_id, location:getVal(r,headers,'location'), notes:getVal(r,headers,'notes') });
    }
    const chunkSize=100;
    for(let i=0;i<payloads.length;i+=chunkSize){
      const chunk=payloads.slice(i,i+chunkSize);
      const { error }=await sb.from('items').insert(chunk);
      if(error){ errors.push(`Batch ${Math.floor(i/chunkSize)+1}: ${error.message}`); }
      else inserted+=chunk.length;
      setProgress({ done:Math.min(i+chunkSize, payloads.length), total:payloads.length });
    }
    setResults({ inserted, total:payloads.length, deptCreated, suppCreated, errors });
    setStep('done'); setBusy(false);
  }

  return (
    <Modal title="Import Inventory from CSV" onClose={onClose} wide>
      {step==='paste' && (
        <div className="space-y-3">
          <div className="bg-slate-50 border rounded-lg p-3 text-xs text-slate-700">
            <div className="font-semibold mb-1">Required column:</div>
            <div className="mb-2"><code className="bg-white px-1 py-0.5 rounded border">name</code></div>
            <div className="font-semibold mb-1">Optional columns (any order):</div>
            <div className="leading-relaxed">
              <code className="bg-white px-1 py-0.5 rounded border">sku</code>, <code className="bg-white px-1 py-0.5 rounded border">category</code>, <code className="bg-white px-1 py-0.5 rounded border">brand</code>, <code className="bg-white px-1 py-0.5 rounded border">model</code>, <code className="bg-white px-1 py-0.5 rounded border">color</code>, <code className="bg-white px-1 py-0.5 rounded border">size</code>, <code className="bg-white px-1 py-0.5 rounded border">unit</code> (default <code>pc</code>), <code className="bg-white px-1 py-0.5 rounded border">qty</code>, <code className="bg-white px-1 py-0.5 rounded border">cost</code>, <code className="bg-white px-1 py-0.5 rounded border">price</code>, <code className="bg-white px-1 py-0.5 rounded border">reorder</code>, <code className="bg-white px-1 py-0.5 rounded border">department</code>, <code className="bg-white px-1 py-0.5 rounded border">supplier</code>, <code className="bg-white px-1 py-0.5 rounded border">location</code>, <code className="bg-white px-1 py-0.5 rounded border">notes</code>
            </div>
            <div className="mt-2 text-slate-500">Department and supplier are matched by name (case-insensitive). New ones are <b>auto-created</b>.</div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <label className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50 cursor-pointer">📁 Upload .csv file<input type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onFile} /></label>
            <button onClick={()=>setCsv(TEMPLATE)} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Load template</button>
            <button onClick={copyTemplate} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Copy template</button>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide text-slate-500">Or paste CSV here</label>
            <textarea className="input font-mono text-xs" rows="10" value={csv} onChange={e=>setCsv(e.target.value)} placeholder="name,sku,category,…" />
          </div>
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button><button onClick={doParse} disabled={!csv.trim()} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">Parse →</button></div>
        </div>
      )}

      {step==='preview' && parsed && (
        <div className="space-y-3">
          <div className="text-sm text-slate-700">Found <b>{parsed.dataRows.length}</b> rows. Detected columns: <span className="font-mono text-xs">{parsed.headers.join(', ')}</span></div>
          <div className="border rounded-lg overflow-hidden max-h-96 overflow-y-auto"><table className="w-full text-xs">
            <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 sticky top-0"><tr>{parsed.headers.map(h=><th key={h} className="text-left px-2 py-1.5">{h}</th>)}</tr></thead>
            <tbody>{parsed.dataRows.slice(0,50).map((r,i)=>(
              <tr key={i} className="border-t">{parsed.headers.map((h,j)=>(<td key={j} className="px-2 py-1 text-slate-700 truncate max-w-[10rem]">{r[j]||''}</td>))}</tr>
            ))}</tbody>
          </table></div>
          {parsed.dataRows.length>50 && <div className="text-xs text-slate-500">Showing first 50 of {parsed.dataRows.length} rows. All will be imported.</div>}
          <div className="flex justify-between"><button onClick={()=>setStep('paste')} className="px-3 py-2 rounded-lg bg-white border text-sm">← Back</button><button onClick={doImport} disabled={busy} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{busy?'Importing…':`Import ${parsed.dataRows.length} items`}</button></div>
        </div>
      )}

      {step==='importing' && (
        <div className="py-8 text-center space-y-3">
          <div className="text-slate-700 font-semibold">Importing…</div>
          <div className="text-xs text-slate-500">{progress.done} of {progress.total} processed</div>
          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-indigo-600 h-2 rounded-full transition-all" style={{ width:`${progress.total?Math.round(progress.done/progress.total*100):0}%` }}></div></div>
        </div>
      )}

      {step==='done' && results && (
        <div className="space-y-3">
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-800">
            <div className="font-semibold mb-1">Import complete</div>
            <div>✓ Inserted <b>{results.inserted}</b> of {results.total} items</div>
            {results.deptCreated>0 && <div>✓ Created <b>{results.deptCreated}</b> new department{results.deptCreated===1?'':'s'}</div>}
            {results.suppCreated>0 && <div>✓ Created <b>{results.suppCreated}</b> new supplier{results.suppCreated===1?'':'s'}</div>}
          </div>
          {results.errors.length>0 && (
            <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-xs text-rose-800 max-h-40 overflow-y-auto">
              <div className="font-semibold mb-1">{results.errors.length} warning{results.errors.length===1?'':'s'}:</div>
              <ul className="list-disc pl-4 space-y-0.5">{results.errors.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <div className="flex justify-end gap-2"><button onClick={onDone} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Done</button></div>
        </div>
      )}
    </Modal>
  );
}

function ItemForm({ existing, defaultBucket, suppliers, departments, onClose, onSaved }){
  const [f,setF]=useState(existing||{ sku:'', name:'', bucket:(defaultBucket && defaultBucket!=='other')?defaultBucket:'fabrics', category:'', brand:'', model:'', color:'', size:'', unit:'pc', qty:0, cost:0, price:0, reorder:0, dept_id:null, supplier_id:null, location:'', notes:'' });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  async function save(){ if(!f.name.trim()){ setMsg('Name is required.'); return; } setBusy(true); setMsg('');
    const payload={ sku:f.sku||'', name:f.name.trim(), bucket:f.bucket||'other', category:f.category||'', brand:f.brand||'', model:f.model||'', color:f.color||'', size:f.size||'', unit:f.unit||'pc', qty:Number(f.qty)||0, cost:Number(f.cost)||0, price:Number(f.price)||0, reorder:Number(f.reorder)||0, dept_id:f.dept_id||null, supplier_id:f.supplier_id||null, location:f.location||'', notes:f.notes||'' };
    const { data, error } = existing ? await sb.from('items').update(payload).eq('id',existing.id).select().single() : await sb.from('items').insert(payload).select().single();
    setBusy(false); if(error){ setMsg(error.message); return; } onSaved(data); }
  return (
    <Modal title={existing?'Edit item':'New item'} onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Bucket *">
            <select className="input" value={f.bucket||'other'} onChange={e=>up('bucket',e.target.value)}>
              {INV_BUCKETS.filter(b=>b.key!=='other'||f.bucket==='other').map(b=>(<option key={b.key} value={b.key}>{b.icon} {b.label}</option>))}
            </select>
          </TpLbl>
          <TpLbl t="SKU"><input className="input" value={f.sku} onChange={e=>up('sku',e.target.value)} /></TpLbl>
          <TpLbl t="Name *"><input className="input" value={f.name} onChange={e=>up('name',e.target.value)} /></TpLbl>
          <TpLbl t="Sub-category"><input className="input" value={f.category} onChange={e=>up('category',e.target.value)} placeholder="e.g. Lacoste, YKK Zipper" /></TpLbl>
          <TpLbl t="Brand"><input className="input" value={f.brand} onChange={e=>up('brand',e.target.value)} /></TpLbl>
          <TpLbl t="Model"><input className="input" value={f.model} onChange={e=>up('model',e.target.value)} /></TpLbl>
          <TpLbl t="Color"><input className="input" value={f.color} onChange={e=>up('color',e.target.value)} /></TpLbl>
          <TpLbl t="Size"><input className="input" value={f.size} onChange={e=>up('size',e.target.value)} /></TpLbl>
          <TpLbl t="Unit"><input className="input" value={f.unit} onChange={e=>up('unit',e.target.value)} placeholder="pc / yd / m / pack" /></TpLbl>
          <TpLbl t="Department"><select className="input" value={f.dept_id||''} onChange={e=>up('dept_id',e.target.value||null)}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></TpLbl>
          <TpLbl t="Quantity"><input type="number" className="input" value={f.qty} onChange={e=>up('qty',e.target.value)} /></TpLbl>
          <TpLbl t="Cost ₱"><input type="number" className="input" value={f.cost} onChange={e=>up('cost',e.target.value)} /></TpLbl>
          <TpLbl t="Sell price ₱"><input type="number" className="input" value={f.price} onChange={e=>up('price',e.target.value)} /></TpLbl>
          <TpLbl t="Reorder point"><input type="number" className="input" value={f.reorder} onChange={e=>up('reorder',e.target.value)} /></TpLbl>
          <TpLbl t="Supplier"><select className="input" value={f.supplier_id||''} onChange={e=>up('supplier_id',e.target.value||null)}><option value="">—</option>{suppliers.map(s=><option key={s.id} value={s.id}>{s.company}</option>)}</select></TpLbl>
          <TpLbl t="Location"><input className="input" value={f.location} onChange={e=>up('location',e.target.value)} placeholder="Bin / shelf" /></TpLbl>
        </div>
        <TpLbl t="Notes"><textarea className="input min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(existing?'Save changes':'Create item')}</button>
      </div>
    </Modal>
  );
}

function SuppliersView({ suppliers, orders, onOpen, reload }){
  const [search,setSearch]=useState(''); const [creating,setCreating]=useState(false); const [importing,setImporting]=useState(false);
  // Precompute total spend + order count per supplier from PO totals.
  const spendBy = (suppliers||[]).reduce((acc,s)=>{ acc[s.id]={ total:0, count:0 }; return acc; },{});
  (orders||[]).forEach(o=>{
    if(!o.supplier_id || !spendBy[o.supplier_id]) return;
    spendBy[o.supplier_id].total += Number(o.total)||0;
    spendBy[o.supplier_id].count += 1;
  });
  const rows=(suppliers||[]).filter(s=>!search||`${s.company} ${s.contact} ${s.email}`.toLowerCase().includes(search.toLowerCase()));
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">⚒ Suppliers</h1><p className="text-slate-500 text-sm">{suppliers.length} supplier{suppliers.length===1?'':'s'} · click a row to see details</p></div>
          <div className="flex items-center gap-2">
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
            <button onClick={()=>setImporting(true)} className="px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">⇪ Import CSV</button>
            <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">+ New supplier</button>
          </div>
        </div>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr>
          <th className="text-left px-3 py-2">Company</th>
          <th className="text-left px-3 py-2">Contact</th>
          <th className="text-left px-3 py-2">Phone</th>
          <th className="text-left px-3 py-2">Payment terms</th>
          <th className="text-right px-3 py-2">Orders</th>
          <th className="text-right px-3 py-2">Total spend</th>
        </tr></thead>
        <tbody>{rows.map(s=>{ const sp=spendBy[s.id]||{total:0,count:0}; return (
          <tr key={s.id} onClick={()=>onOpen(s)} className="border-t hover:bg-slate-50 cursor-pointer">
            <td className="px-3 py-2 font-medium text-slate-900">{s.company}</td>
            <td className="px-3 py-2 text-slate-600">{s.contact||'—'}{s.email && <div className="text-[11px] text-slate-400">{s.email}</div>}</td>
            <td className="px-3 py-2 text-xs">{s.phone||'—'}</td>
            <td className="px-3 py-2 text-xs">{s.payment_terms||'—'}</td>
            <td className="px-3 py-2 text-right">{sp.count||'—'}</td>
            <td className="px-3 py-2 text-right font-semibold text-emerald-700">{sp.total>0?peso(sp.total):'—'}</td>
          </tr>
        ); })}{rows.length===0 && <tr><td colSpan="6" className="text-center text-slate-400 py-8">No suppliers yet. Click "+ New supplier" to add one.</td></tr>}</tbody>
      </table></div></div>
      {creating && <SupplierForm onClose={()=>setCreating(false)} onSaved={()=>{ setCreating(false); reload(); }} />}
      {importing && <SupplierImportModal suppliers={suppliers} onClose={()=>setImporting(false)} onDone={()=>{ setImporting(false); reload(); }} />}
    </div>
  );
}

function SupplierImportModal({ suppliers, onClose, onDone }){
  const TEMPLATE = 'company,contact,email,phone,address,payment_terms,notes\nTexstyle Trading,Anna Cruz,anna@texstyle.com,+63 917 123 4567,Quezon City,30 Days,Main fabric supplier\nYKK Manila,Boy Reyes,sales@ykk.com.ph,+63 2 8888 1234,Makati,COD,';
  const [csv,setCsv]=useState(''); const [parsed,setParsed]=useState(null);
  const [step,setStep]=useState('paste'); // paste | preview | importing | done
  const [results,setResults]=useState(null); const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState({ done:0, total:0 });
  const [skipDupes,setSkipDupes]=useState(true);

  function onFile(e){ const f=e.target.files && e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>setCsv(String(r.result||'')); r.readAsText(f); }
  function copyTemplate(){ if(navigator.clipboard) navigator.clipboard.writeText(TEMPLATE).then(()=>{},()=>{}); else setCsv(TEMPLATE); }
  function getVal(row, headers, col){ const idx=headers.indexOf(col); return idx>=0 ? String(row[idx]||'').trim() : ''; }
  function doParse(){
    const rows=parseCSV(csv.trim());
    if(rows.length<2){ alert('Need at least a header row + one data row.'); return; }
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    if(!headers.includes('company')){ alert('CSV must have a "company" column.'); return; }
    setParsed({ headers, dataRows:rows.slice(1) });
    setStep('preview');
  }
  async function doImport(){
    setBusy(true); setStep('importing');
    const { headers, dataRows } = parsed;
    const existing=new Set((suppliers||[]).map(s=>String(s.company||'').toLowerCase()));
    let inserted=0, skipped=0; const errors=[];
    const payloads=[];
    for(const r of dataRows){
      const company=getVal(r,headers,'company'); if(!company) continue;
      if(skipDupes && existing.has(company.toLowerCase())){ skipped++; continue; }
      existing.add(company.toLowerCase()); // also dedupe within the file
      payloads.push({
        company,
        contact: getVal(r,headers,'contact'),
        email:   getVal(r,headers,'email'),
        phone:   getVal(r,headers,'phone'),
        address: getVal(r,headers,'address'),
        payment_terms: getVal(r,headers,'payment_terms') || getVal(r,headers,'payment terms'),
        notes:   getVal(r,headers,'notes'),
      });
    }
    setProgress({ done:0, total:payloads.length });
    const chunkSize=100;
    for(let i=0;i<payloads.length;i+=chunkSize){
      const chunk=payloads.slice(i,i+chunkSize);
      const { error }=await sb.from('suppliers').insert(chunk);
      if(error){ errors.push(`Batch ${Math.floor(i/chunkSize)+1}: ${error.message}`); }
      else inserted+=chunk.length;
      setProgress({ done:Math.min(i+chunkSize, payloads.length), total:payloads.length });
    }
    setResults({ inserted, skipped, total:dataRows.length, errors });
    setStep('done'); setBusy(false);
  }

  return (
    <Modal title="Import Suppliers from CSV" onClose={onClose} wide>
      {step==='paste' && (
        <div className="space-y-3">
          <div className="bg-slate-50 border rounded-lg p-3 text-xs text-slate-700">
            <div className="font-semibold mb-1">Required column:</div>
            <div className="mb-2"><code className="bg-white px-1 py-0.5 rounded border">company</code></div>
            <div className="font-semibold mb-1">Optional columns (any order):</div>
            <div className="leading-relaxed">
              <code className="bg-white px-1 py-0.5 rounded border">contact</code>, <code className="bg-white px-1 py-0.5 rounded border">email</code>, <code className="bg-white px-1 py-0.5 rounded border">phone</code>, <code className="bg-white px-1 py-0.5 rounded border">address</code>, <code className="bg-white px-1 py-0.5 rounded border">payment_terms</code>, <code className="bg-white px-1 py-0.5 rounded border">notes</code>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <label className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50 cursor-pointer">📁 Upload .csv file<input type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onFile} /></label>
            <button onClick={()=>setCsv(TEMPLATE)} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Load template</button>
            <button onClick={copyTemplate} className="px-3 py-2 rounded-lg bg-white border text-sm font-medium hover:bg-slate-50">Copy template</button>
            <label className="ml-auto inline-flex items-center gap-1.5 text-xs text-slate-600 bg-white border rounded-lg px-3 py-2"><input type="checkbox" checked={skipDupes} onChange={e=>setSkipDupes(e.target.checked)} /> Skip duplicates (by company name)</label>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide text-slate-500">Or paste CSV here</label>
            <textarea className="input font-mono text-xs" rows="10" value={csv} onChange={e=>setCsv(e.target.value)} placeholder="company,contact,email,…" />
          </div>
          <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button><button onClick={doParse} disabled={!csv.trim()} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">Parse →</button></div>
        </div>
      )}

      {step==='preview' && parsed && (
        <div className="space-y-3">
          <div className="text-sm text-slate-700">Found <b>{parsed.dataRows.length}</b> rows. Detected columns: <span className="font-mono text-xs">{parsed.headers.join(', ')}</span></div>
          <div className="border rounded-lg overflow-hidden max-h-96 overflow-y-auto"><table className="w-full text-xs">
            <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 sticky top-0"><tr>{parsed.headers.map(h=><th key={h} className="text-left px-2 py-1.5">{h}</th>)}</tr></thead>
            <tbody>{parsed.dataRows.slice(0,50).map((r,i)=>(
              <tr key={i} className="border-t">{parsed.headers.map((h,j)=>(<td key={j} className="px-2 py-1 text-slate-700 truncate max-w-[10rem]">{r[j]||''}</td>))}</tr>
            ))}</tbody>
          </table></div>
          {parsed.dataRows.length>50 && <div className="text-xs text-slate-500">Showing first 50 of {parsed.dataRows.length} rows. All will be imported.</div>}
          <div className="flex justify-between"><button onClick={()=>setStep('paste')} className="px-3 py-2 rounded-lg bg-white border text-sm">← Back</button><button onClick={doImport} disabled={busy} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{busy?'Importing…':`Import ${parsed.dataRows.length} suppliers`}</button></div>
        </div>
      )}

      {step==='importing' && (
        <div className="py-8 text-center space-y-3">
          <div className="text-slate-700 font-semibold">Importing…</div>
          <div className="text-xs text-slate-500">{progress.done} of {progress.total} processed</div>
          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-indigo-600 h-2 rounded-full transition-all" style={{ width:`${progress.total?Math.round(progress.done/progress.total*100):0}%` }}></div></div>
        </div>
      )}

      {step==='done' && results && (
        <div className="space-y-3">
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-800">
            <div className="font-semibold mb-1">Import complete</div>
            <div>✓ Inserted <b>{results.inserted}</b> new supplier{results.inserted===1?'':'s'}</div>
            {results.skipped>0 && <div className="text-amber-700">↷ Skipped <b>{results.skipped}</b> duplicate{results.skipped===1?'':'s'} (already exist)</div>}
          </div>
          {results.errors.length>0 && (
            <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-xs text-rose-800 max-h-40 overflow-y-auto">
              <div className="font-semibold mb-1">{results.errors.length} warning{results.errors.length===1?'':'s'}:</div>
              <ul className="list-disc pl-4 space-y-0.5">{results.errors.map((e,i)=><li key={i}>{e}</li>)}</ul>
            </div>
          )}
          <div className="flex justify-end gap-2"><button onClick={onDone} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Done</button></div>
        </div>
      )}
    </Modal>
  );
}

/* ============================================================================
   PURCHASE DOC PRINT VIEWS (PO + PR)
   ============================================================================
   Both reuse the .tp-page CSS already defined for techpack printing
   (Letter landscape, 0.4in margin, color-faithful printing). The print
   button calls window.print() which renders just the .tp-page content
   thanks to the existing @media print rules that hide .no-print elements.
   ============================================================================ */

// Injects a portrait Letter @page rule into <head> while this component is
// mounted. We do this dynamically because the default @page (defined in the
// global <style> block) is landscape for the techpack — and there's no clean
// way in plain CSS to make @page conditional on which modal is open.
// On unmount, the style tag is removed so the next print (e.g. techpack)
// goes back to landscape.
function PortraitPagePrintStyle(){
  useEffect(() => {
    const s = document.createElement('style');
    s.dataset.purpose = 'portrait-page-print';
    s.textContent = '@media print { @page { size: 8.5in 11in !important; margin: 0.4in !important; } @page :first { size: 8.5in 11in !important; margin: 0.4in !important; } }';
    document.head.appendChild(s);
    return () => { try { s.remove(); } catch(_){} };
  }, []);
  return null;
}
