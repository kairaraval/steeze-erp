         padding was spilling onto a blank second PDF page. */
      .tp-print { margin:0 !important; padding:0 !important; max-width:none !important; }
      /* Make the printed page match the on-screen preview exactly.
         Letter landscape (11in × 8.5in) minus the 0.4in @page margin on each
         side leaves a printable area of 10.2in × 7.7in — same usable size as
         the preview's 11in page with 0.4in padding. Using inches (not vh)
         keeps proportions stable across browsers/printers. */
      .tp-page { width:10.2in; height:7.6in; min-height:0; box-shadow:none; border:none; margin:0; padding:0; overflow:hidden; display:flex; flex-direction:column; page-break-after: always; break-after: page; page-break-inside: avoid; break-inside: avoid; }
      /* The last page must NOT force a page break — otherwise the print
         engine emits a blank final page. !important beats inherited rules. */
      .tp-page:last-child { page-break-after: avoid !important; break-after: avoid !important; }
      /* Portrait Letter (8.5in × 11in) minus 0.4in @page margin all sides
         leaves 7.7in × 10.2in of usable area. PR/PO modals inject a portrait
         @page override at runtime so this size is what actually fits. */
      .po-page { width:7.7in; height:10.2in; min-height:0; box-shadow:none; border:none; margin:0; padding:0; overflow:hidden; display:flex; flex-direction:column; page-break-after: always; break-after: page; page-break-inside: avoid; break-inside: avoid; }

         we don't blow them up beyond the design intent. The previous
         !important override was stripping the inline cap. */
      .tp-page img { max-width:100%; max-height:100%; object-fit:contain; }

  <script>
  // On-screen fatal-error panel. Only surfaces TRULY fatal errors:
  //   • thrown JS errors (window.error) — usually means the React tree crashed
  //   • unhandled promise rejections that look like app bugs
  // Library noise like Supabase Realtime "Failed to fetch" retries is ignored.
  (function(){
    function box(){ var d=document.getElementById('fatal'); if(!d){ d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:#fee2e2;color:#991b1b;font:12px/1.5 monospace;padding:12px;z-index:99999;white-space:pre-wrap;border-top:3px solid #991b1b;';
      (document.body||document.documentElement).appendChild(d); d.textContent='⚠ ERROR — screenshot this and send it:\n'; } return d; }
    window.__err=function(m){ try{ box().textContent += '\n'+m; }catch(_){}};
    // Patterns we want to silence (transient network / realtime / browser noise).
    var IGNORE=[/Failed to fetch/i, /NetworkError/i, /Load failed/i, /WebSocket/i, /realtime/i, /Channel error/i, /AbortError/i, /ResizeObserver/i];
    function isNoise(s){ s=String(s||''); return IGNORE.some(function(re){ return re.test(s); }); }
    window.addEventListener('error', function(e){ var msg=(e.message||e.error||e); if(isNoise(msg)) return; window.__err('JS: '+msg+(e.filename?'  ['+e.filename+':'+e.lineno+']':'')); });
    window.addEventListener('unhandledrejection', function(e){ var msg=(e.reason&&e.reason.message)||JSON.stringify(e.reason); if(isNoise(msg)) return; window.__err('PROMISE: '+msg); });
  })();

// Minimal RFC-4180 CSV parser: handles quoted fields, doubled-quote escapes, CRLF.
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  const s=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inQ){
      if(c==='"'){ if(s[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>(v||'').trim()!==''));
}

// Gentle two-tone ping for @mention notifications. Web Audio (no asset needed).
// Reuse a single AudioContext and resume it on the first user gesture, because
// browsers block audio playback until the user has interacted with the page.
let __steezeAudioCtx = null;
function getAudioCtx(){
  // If the cached context was somehow closed, drop it and make a new one.
  if(__steezeAudioCtx && __steezeAudioCtx.state==='closed') __steezeAudioCtx = null;
  if(__steezeAudioCtx) return __steezeAudioCtx;
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  try{ __steezeAudioCtx = new AC(); }catch(_){ __steezeAudioCtx = null; }
  return __steezeAudioCtx;
}
// Unlock the AudioContext on the next user click/keydown — once is enough.
if(typeof window !== 'undefined' && !window.__steezeAudioUnlockInstalled){
  window.__steezeAudioUnlockInstalled = true;
  const unlock = ()=>{ try{ const ctx=getAudioCtx(); if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{}); }catch(_){ } };
  window.addEventListener('click', unlock);
  window.addEventListener('keydown', unlock);
}
function playPing(){
  try {
    const ctx = getAudioCtx(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    [880, 1320].forEach((freq,i)=>{
      const t = now + i*0.13;
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, t+0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+0.4);
    });
    // Do NOT close the context — we reuse it for every subsequent ping.
  } catch(_) {}
}
// Triumphant chord for a closed-won deal — a C-major triad (C5, E5, G5)
// arpeggiated quickly, fading out over ~1.3s. Same shared AudioContext as
// playPing so it doesn't fight iOS's autoplay rules.
function playWonSound(){
  try {
    const ctx = getAudioCtx(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq,i)=>{
      const t = now + i*0.07;
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='triangle'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.16, t+0.04);
      gain.gain.exponentialRampToValueAtTime(0.0008, t+1.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+1.4);
    });
  } catch(_) {}
}

function fmtTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleString('en-PH',{ timeZone:'Asia/Manila', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
function fmtDate(d){
  if(!d) return '—';
  // Accept either a YYYY-MM-DD date string or a full ISO timestamp (e.g. from
  // a `timestamptz` column). Bare date strings get parsed at local midnight so
  // they don't drift to the previous day in PH timezone.
  const s = String(d);
  const dt = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s+'T00:00:00') : new Date(s);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-PH',{ timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric' });
}

function deadlineInfo(due, done){
  if(done) return { label:'', cls:'text-slate-400', overdue:false };
  if(!due) return { label:'', cls:'text-slate-400', overdue:false };
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due+'T00:00:00');
  const days = Math.round((d - today)/86400000);
  if(days < 0)   return { label:`${-days} ${-days===1?'day':'days'} overdue`, cls:'text-rose-600 font-semibold', overdue:true };
  if(days === 0) return { label:'due today', cls:'text-amber-600 font-semibold', overdue:false };
  if(days === 1) return { label:'tomorrow',  cls:'text-amber-600 font-semibold', overdue:false };
  // Anything further out — fall through to the formatted date in the cell.
  return { label:'', cls:'text-slate-500', overdue:false };
}

// Build the @-tag handle for one teammate. Tries first word of their NAME
// first; if no name is set in the profile, falls back to the part of their
// EMAIL before the @ sign so the user is still mention-able. Returns a
// lowercase string for case-insensitive matching.
function profileHandle(p){
  const fromName = ((p && p.name) || '').trim().split(/\s+/)[0] || '';
  if(fromName) return fromName.toLowerCase();
  return ((p && p.email) || '').split('@')[0].toLowerCase();
}
// Mention regex: \p{L} matches letters in ANY language (including é, ñ, ü, etc.)
// and \p{N} matches digits. This was previously \w which only covers ASCII.
const MENTION_RE = /@([\p{L}\p{N}._-]+)/gu;
function parseMentions(text, profiles){
  const ids=[]; let m; MENTION_RE.lastIndex = 0;
  while((m=MENTION_RE.exec(text||''))){
    const tag = m[1].toLowerCase();
    const p = profiles.find(pp => profileHandle(pp) === tag);
    if(p && !ids.includes(p.id)) ids.push(p.id);
  }
  return ids;
}
// Same as parseMentions but also returns the @tags that didn't match anyone
// — used by the comment box to warn "⚠ @miko didn't match anyone".
function parseMentionsDetail(text, profiles){
  const matched=[], unmatched=[]; let m; const re=/@([\p{L}\p{N}._-]+)/gu;
  while((m=re.exec(text||''))){
    const tag=m[1]; const tagL=tag.toLowerCase();
    const p=profiles.find(pp => profileHandle(pp) === tagL);
    if(p){ if(!matched.find(x=>x.id===p.id)) matched.push(p); }
    else { if(!unmatched.includes(tag)) unmatched.push(tag); }
  }
  return { matched, unmatched };
}
function renderCommentText(text, profiles){
  const parts=[]; const re=/(@[\p{L}\p{N}._-]+)/gu; let last=0,m,i=0;
  while((m=re.exec(text||''))){ if(m.index>last) parts.push(text.slice(last,m.index));
    const tag=m[0].slice(1).toLowerCase(); const p=profiles.find(pp => profileHandle(pp) === tag);
    if(p) parts.push(<span key={i++} className="bg-indigo-100 text-indigo-700 rounded px-1 font-medium">{m[0]}</span>); else parts.push(m[0]);
    last=re.lastIndex; }
  if(last<(text||'').length) parts.push(text.slice(last));
  return parts;
}

async function signedUrl(path){ const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600); if(error) throw error; return data.signedUrl; }
async function uploadFile(scope, file){
  const safe=file.name.replace(/[^\w.\-]/g,'_'); const path=`${scope}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false }); if(error) throw error;
  return { type: file.type==='application/pdf'?'pdf':(file.type.startsWith('image/')?'image':'file'), name:file.name, path, mime:file.type };
}

// Extract a pasted image (screenshot / Cmd+V) from a clipboard event.
// Returns a File ready to feed into uploadFile, or null if no image was pasted.
function getPastedImage(e){
  const items = e.clipboardData && e.clipboardData.items; if(!items) return null;
  for(let i=0;i<items.length;i++){
    const item=items[i];
    if(item.kind==='file' && (item.type||'').startsWith('image/')){
      const blob = item.getAsFile(); if(!blob) continue;
      const ext = ((item.type.split('/')[1]||'png').toLowerCase()).replace('jpeg','jpg');
      const fname = (blob.name && blob.name!=='image.png') ? blob.name : `pasted-${Date.now()}.${ext}`;
      return new File([blob], fname, { type: item.type });
    }
  }
  return null;
}

const AVA_COLORS=['bg-blue-500','bg-emerald-500','bg-amber-500','bg-purple-500','bg-rose-500','bg-cyan-500','bg-indigo-500','bg-pink-500','bg-teal-500','bg-orange-500'];
function avaColor(id){ if(!id) return 'bg-slate-400'; let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVA_COLORS[h%AVA_COLORS.length]; }

function MediaLightbox({ url, path, name, kind, onClose }){
  // kind: 'image' or 'pdf'
  useEffect(()=>{ const k=(e)=>{ if(e.key==='Escape') onClose(); }; window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[onClose]);
  const isPdf = kind === 'pdf';
  // PDFs come from two places:
  //   • Files uploaded INTO Steeze OS — stored in Supabase Storage (have `path`).
  //     Download via the SDK to bypass Content-Disposition: attachment, then
  //     embed via a blob: URL so the browser renders inline.
  //   • Legacy ClickUp attachments imported during migration (only `url`, no
  //     `path`). Their CDN doesn't send CORS headers, so JS fetch is blocked.
  //     For those, point the iframe at the URL directly and let the browser
  //     load it without going through our JS code.
  const [pdfSrc,setPdfSrc]=useState(null);
  const [pdfErr,setPdfErr]=useState('');
  const [pdfMode,setPdfMode]=useState(null); // 'blob' | 'direct'
  useEffect(()=>{
    if(!isPdf){ setPdfSrc(null); setPdfMode(null); return; }
    if(!path && !url){ setPdfErr('No PDF source.'); return; }
    setPdfSrc(null); setPdfErr(''); setPdfMode(null);
    // No Supabase path → external URL, embed it directly. No CORS issue,
    // browser handles loading. If the host returns Content-Disposition:
    // attachment, the iframe will be empty but the "Open original" link
    // still works.
    if(!path){
      setPdfSrc(url);
      setPdfMode('direct');
      return;
    }
    let cancelled=false; let objUrl=null;
    (async()=>{
      try{
        const { data, error } = await sb.storage.from(BUCKET).download(path);
        if(error) throw error;
        const raw = data;
        const pdfBlob = raw.type==='application/pdf' ? raw : new Blob([raw], { type:'application/pdf' });
        objUrl = URL.createObjectURL(pdfBlob);
        if(!cancelled){ setPdfSrc(objUrl); setPdfMode('blob'); }
      }catch(e){
        console.error('PDF inline-preview failed:', e);
        if(!cancelled) setPdfErr(e.message || String(e));
      }
    })();
    return ()=>{ cancelled=true; if(objUrl) URL.revokeObjectURL(objUrl); };
  },[isPdf, url, path]);
  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 text-white/80 hover:text-white text-2xl leading-none">✕</button>
      <div className="flex flex-col items-center" onClick={e=>e.stopPropagation()}>
        {isPdf ? (
          pdfSrc ? (
            <>
              {pdfMode==='direct' && (
                <div className="text-[11px] text-white/80 mb-2 bg-amber-900/70 border border-amber-700/50 px-3 py-1.5 rounded">
                  📂 Legacy attachment hosted on ClickUp. If preview doesn't load, click "Open original" below.
                </div>
              )}
              <iframe
                src={pdfSrc}
                title={name}
                className="bg-white rounded shadow-2xl"
                style={{ width:'min(92vw, 1100px)', height:'82vh', border:0 }}
              />
            </>
          ) : pdfErr ? (
            <div className="flex flex-col items-center justify-center bg-white rounded shadow-2xl p-6 text-sm text-slate-700" style={{ width:'min(92vw, 600px)', height:'40vh' }}>
              <div className="text-4xl mb-2">📄</div>
              <div className="font-semibold mb-1">{name}</div>
              <div className="text-xs text-slate-500 mb-2 text-center">Couldn't load PDF preview.</div>
              <div className="text-[10px] text-slate-400 mb-4 text-center max-w-xs break-words font-mono">{pdfErr}</div>
              <a href={url} target="_blank" rel="noopener" className="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Open PDF in new tab ↗</a>
            </div>
          ) : (
            <div className="flex flex-col items-center justify-center bg-white rounded shadow-2xl p-6 text-sm text-slate-500" style={{ width:'min(92vw, 600px)', height:'40vh' }}>
              <div className="text-4xl mb-2 opacity-50">📄</div>
              <div>Loading PDF…</div>
            </div>
          )
        ) : (
          <img src={url} alt={name} className="max-w-[92vw] max-h-[82vh] object-contain rounded shadow-2xl" />
        )}
        <div className="text-white text-xs mt-3 bg-black/40 px-3 py-1 rounded flex items-center gap-3">
          <span className="font-medium truncate max-w-[60vw]">{name}</span>
          <a href={url} target="_blank" rel="noopener" className="underline hover:text-white">Open original ↗</a>
          <span className="text-white/60">Esc to close</span>
        </div>
      </div>
    </div>
  );
}

// Pick the cover image for a board card. Honors an explicit cover flag on the
// attachment if one is set (admin/team-chosen "this is the hero photo"),
// otherwise falls back to the first image. Works for graphic + printing jobs.
function pickCover(atts){
  const list = atts||[];
  const isImageish = a => a && (a.type==='image' || /\.(jpe?g|png|gif|webp|bmp|svg|heic|heif)(?:$|\?)/i.test(String(a.url||a.name||a.path||'').toLowerCase()));
  const explicit = list.find(a=>a && a.is_cover && isImageish(a));
  if(explicit) return explicit;
  return list.find(isImageish);
}

function LoginScreen(){

  const [password,setPassword]=useState(''); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  async function submit(e){ e.preventDefault(); setBusy(true); setMsg('');
    try{

          throw new Error("Steeze OS is invite-only. Ask Kaira to send you an invite for this email, then try again.");
        }
        const {error}=await sb.auth.signUp({ email, password, options:{ data:{ full_name:name } } });
        if(error) throw error;
      } else {
        const {error}=await sb.auth.signInWithPassword({ email, password }); if(error) throw error;
      }
    }
    catch(err){ setMsg(err.message||String(err)); } finally{ setBusy(false); } }
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6">
        <div className="text-center mb-5">
          <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-900 shadow-lg mb-3">
            <SteezeBolt className="w-9 h-9" fill="white" />
          </div>
          <div className="text-2xl font-black tracking-tight text-slate-900">Steeze <span className="text-indigo-600">OS</span></div>
          <div className="text-sm text-slate-500 mt-1">{mode==='signup'?'Create your account':'Sign in to your account'}</div>
          {mode==='signup' && <div className="text-[11px] text-slate-400 mt-1.5">🔒 Invite-only · use the email Kaira sent you</div>}
        </div>
        <form onSubmit={submit} className="space-y-3">
          {mode==='signup' && <input className="input" placeholder="Your full name" value={name} onChange={e=>setName(e.target.value)} required />}
          <input className="input" type="email" placeholder="you@steeze.com" value={email} onChange={e=>setEmail(e.target.value)} required />
          <input className="input" type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6} />
          <button disabled={busy} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Please wait…':(mode==='signup'?'Create account':'Sign in')}</button>
        </form>
        {msg && <div className="mt-3 text-xs text-rose-600 text-center">{msg}</div>}
        <div className="mt-4 text-center text-xs text-slate-500">{mode==='signup'?'Already have an account? ':'New to Steeze OS? '}<button onClick={()=>{ setMode(mode==='signup'?'signin':'signup'); setMsg(''); }} className="text-indigo-600 font-semibold hover:underline">{mode==='signup'?'Sign in':'Create one'}</button></div>
      </div>
    </div>
  );
}

/* ----------------------- Generic activity thread (leads + dept jobs) ----------------------- */
function ThreadBody({ profile, profiles, table, match, scope, titleText, onBack, afterChange, onOpenSource, openSourceLabel, embedded, headerless }){
  const [rows,setRows]=useState(null); const [text,setText]=useState('');
  const [pending,setPending]=useState([]); // unposted attachments for the next comment
  const [reading,setReading]=useState(false); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  // Inline edit state — one comment at a time.
  const [editId,setEditId]=useState(null);
  const [editText,setEditText]=useState('');
  const [editAtts,setEditAtts]=useState([]);
  const [editBusy,setEditBusy]=useState(false);
  function startEdit(row){
    setEditId(row.id);
    setEditText(row.text||'');
    setEditAtts(Array.isArray(row.attachments)&&row.attachments.length>0 ? row.attachments : (row.attachment?[row.attachment]:[]));
  }
  function cancelEdit(){ setEditId(null); setEditText(''); setEditAtts([]); }
  function removeEditAtt(idx){ setEditAtts(a=>a.filter((_,i)=>i!==idx)); }
  async function saveEdit(row){
    setEditBusy(true);
    const newText = (editText||'').trim();
    const newMentions = parseMentions(newText, profiles);
    const newAtts = editAtts;
    const first = newAtts[0] || null;
    const { error } = await sb.from(table).update({
      text: newText,
      mentions: newMentions,
      attachments: newAtts,
      attachment: first,
    }).eq('id', row.id);
    setEditBusy(false);
    if(error){ alert('Edit failed: '+(error.message||error)); return; }
    cancelEdit();
    await load();
    afterChange && afterChange();
  }
  async function deleteComment(row){
    if(!confirm('Delete this comment? This cannot be undone.')) return;
    const { error } = await sb.from(table).delete().eq('id', row.id);
    if(error){ alert('Delete failed: '+(error.message||error)); return; }
    await load();
    afterChange && afterChange();
  }
  // Anyone can edit/delete their own comment; admins can do it on anyone's.
  function canModify(row){ return row.actor_id === profile.id || profile.role === 'admin'; }
  async function load(){
    let q = sb.from(table).select('*'); Object.entries(match).forEach(([k,v])=>{ q=q.eq(k,v); });
    const { data, error } = await q.order('created_at',{ ascending:true });
    if(error){ setErr(error.message); return; } setRows(data||[]);
    const unread=(data||[]).filter(r=>(r.mentions||[]).includes(profile.id) && !(r.read_by||[]).includes(profile.id));
    if(unread.length){ await Promise.all(unread.map(r=>sb.from(table).update({ read_by:[...(r.read_by||[]), profile.id] }).eq('id',r.id))); afterChange&&afterChange(); }
  }
  useEffect(()=>{ load(); },[JSON.stringify(match)]);
  async function pickFiles(e){
    const files=Array.from(e.target.files||[]); if(!files.length) return;
    setReading(true); setErr('');
    try{
      const metas=[]; for(const f of files){ metas.push(await uploadFile(scope, f)); }
      setPending(p=>[...p, ...metas]);
    } catch(er){ setErr('Upload failed: '+(er.message||er)); }
    finally{ setReading(false); e.target.value=''; }
  }
  async function onPasteImage(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault(); e.stopPropagation(); // prevent the bubbled wrapper handler from running too
    setReading(true); setErr('');
    try{ const meta=await uploadFile(scope, f); setPending(p=>[...p, meta]); }
    catch(er){ setErr('Upload failed: '+(er.message||er)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL:')||'').trim(); if(!url) return; const name=(prompt('Title (optional):')||url).trim(); setPending(p=>[...p,{ type:'link', name, url }]); }
  function removePending(idx){ setPending(p=>p.filter((_,i)=>i!==idx)); }
  async function post(){
    const t=text.trim(); if(!t && pending.length===0) return; setBusy(true); setErr('');
    try{ const mentions=parseMentions(t, profiles);
      // Keep `attachment` (legacy single) populated with the first item for backward read compatibility.
      const first = pending[0] || null;
      const { error } = await sb.from(table).insert({ ...match, actor_id:profile.id, type:'comment', text:t, mentions, attachment:first, attachments:pending });
      if(error) throw error;
      // Mirror any uploaded attachments onto the parent lead's main attachments
      // list so sales can find them next to the lead details without digging
      // through the activity thread. Only applies to lead activity (not dept
      // job activity, where attachments live on the dept job itself).
      // Deduped by path (for storage uploads) or url (for links), so re-posting
      // the same file doesn't create double entries on the lead.
      if(table === 'lead_activity' && match?.lead_id && pending.length > 0){
        try {
          const { data: leadRow } = await sb.from('leads').select('attachments').eq('id', match.lead_id).single();
          const existing = Array.isArray(leadRow?.attachments) ? leadRow.attachments : [];
          const keyOf = (a) => a?.path || a?.url || (a?.name||'') + (a?.mime||'');
          const seen = new Set(existing.map(keyOf));
          const toAdd = pending.filter(a => { const k = keyOf(a); if(seen.has(k)) return false; seen.add(k); return true; });
          if(toAdd.length){
            await sb.from('leads').update({ attachments: [...existing, ...toAdd] }).eq('id', match.lead_id);
          }
        } catch(mirrorErr){ console.warn('Mirror to lead.attachments failed:', mirrorErr?.message||mirrorErr); }
      }
      setText(''); setPending([]); await load(); afterChange&&afterChange(); }
    catch(er){ setErr(er.message||String(er)); } finally{ setBusy(false); } }
  // Show who WILL be notified, and warn loudly when an @tag matches nobody —
  // that's how a teammate silently misses pings (no profile name set, typo, etc.)
  const mentionDetail = parseMentionsDetail(text, profiles);
  const mentionPreview = mentionDetail.matched.map(p=>'@'+firstName(p)).join(', ');
  const mentionUnmatched = mentionDetail.unmatched.map(t=>'@'+t).join(', ');
  // For each row, normalize attachments: prefer `attachments` array, fall back to legacy `attachment` single.
  function normalizeAtts(row){ if(Array.isArray(row.attachments) && row.attachments.length>0) return row.attachments; if(row.attachment) return [row.attachment]; return []; }
  return (
    <div className={`space-y-4 ${embedded?'h-full flex flex-col':''}`}>
      {!headerless && (
        <div className="flex items-center justify-between gap-2">
          <div className="text-sm font-semibold truncate">{titleText}</div>
          <div className="flex items-center gap-2 shrink-0">
            {onOpenSource && <button onClick={onOpenSource} className="text-xs px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">→ {openSourceLabel||'Open'}</button>}
            {onBack && <button onClick={onBack} className="text-xs text-indigo-600 hover:underline">← Back</button>}
          </div>
        </div>
      )}
      <div className="border rounded-lg p-3 bg-slate-50" onPaste={onPasteImage}>
        <textarea className="input min-h-[70px]" value={text} onChange={e=>setText(e.target.value)} onPaste={onPasteImage} placeholder="Leave a note. Tag with @firstname. Paste a screenshot with ⌘V." />
        {pending.length>0 && (
          <div className="mt-2 grid grid-cols-2 sm:grid-cols-3 gap-2">{pending.map((a,i)=>(
            <div key={i} className="flex items-center gap-2 p-2 bg-white border rounded text-xs"><span>{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="flex-1 truncate" title={a.name}>{a.name}</span><button onClick={()=>removePending(i)} className="text-rose-400">✕</button></div>
          ))}</div>
        )}
        <div className="flex items-center justify-between mt-2 flex-wrap gap-2">
          <div className="flex items-center gap-2 flex-wrap">
            <label className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50 cursor-pointer">📎 {reading?'…':'Attach (multi)'}<input type="file" multiple accept="image/*,.pdf,application/pdf" className="hidden" onChange={pickFiles} disabled={reading} /></label>
            <button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50">🔗 Link</button>
            <span className="text-[10px] text-slate-400">or paste · ⌘V</span>
            <span className="text-[11px] text-slate-500">{mentionPreview?'Will notify: '+mentionPreview:'Tag with @firstname'}</span>
            {mentionUnmatched && <span className="text-[11px] text-rose-600 font-semibold" title="No teammate matches this @tag. They won't be notified.">⚠ no match: {mentionUnmatched}</span>}
          </div>
          <button onClick={post} disabled={busy||(!text.trim()&&pending.length===0)} className="text-xs px-3 py-1.5 rounded bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Posting…':'Post comment'}</button>
        </div>
      </div>
      {err && <div className="text-xs text-rose-600">{err}</div>}
      <div className={`space-y-2 ${embedded?'flex-1 overflow-y-auto':'max-h-96 overflow-y-auto'}`}>
        {rows===null && <div className="text-center text-sm text-slate-400 py-4">Loading…</div>}
        {rows && rows.length===0 && <div className="text-center text-sm text-slate-400 py-6 border rounded-lg border-dashed">No activity yet.</div>}
        {rows && rows.slice().reverse().map(a=>{ const actor=profiles.find(p=>p.id===a.actor_id); const atts=normalizeAtts(a);
          if(a.type==='system') return <div key={a.id} className="text-[11px] text-slate-400 italic px-2">{a.text} · {fmtTime(a.created_at)}</div>;
          const isEditing = editId === a.id;
          const mine = canModify(a);
          return (
            <div key={a.id} className="group flex items-start gap-3 p-3 rounded-lg bg-white border relative">
              <Avatar profile={actor} size="sm" />
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2">
                  <span className="font-medium text-sm">{actor?.name||'Unknown'}</span>
                  <span className="text-[11px] text-slate-500">{fmtTime(a.created_at)}</span>
                </div>
                {isEditing ? (
                  <div className="mt-2 space-y-2">
                    <textarea autoFocus className="input min-h-[70px]" value={editText} onChange={e=>setEditText(e.target.value)} placeholder="Edit your comment…" />
                    {editAtts.length>0 && (
                      <div className="flex flex-col gap-2 items-start">
                        {editAtts.map((att,i)=>(
                          <div key={i} className="flex items-center gap-2 group/att">
                            <InlineAttachment att={att} />
                            <button onClick={()=>removeEditAtt(i)} title="Remove attachment" className="text-rose-400 hover:text-rose-600 text-xs opacity-0 group-hover/att:opacity-100 transition">✕ remove</button>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex items-center gap-2">
                      <button disabled={editBusy} onClick={()=>saveEdit(a)} className="text-xs px-3 py-1.5 rounded bg-indigo-600 text-white font-semibold disabled:opacity-50 hover:bg-indigo-700">{editBusy?'Saving…':'Save'}</button>
                      <button onClick={cancelEdit} className="text-xs px-3 py-1.5 rounded text-slate-500 hover:bg-slate-100">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="mt-1 text-sm whitespace-pre-wrap">{renderCommentText(a.text, profiles)}</div>
                    {atts.length>0 && <div className="mt-2 flex flex-col gap-2 items-start">{atts.map((att,i)=><InlineAttachment key={i} att={att} />)}</div>}
                  </>
                )}
              </div>
              {/* Hover-reveal edit/delete buttons — only for the comment owner or admins */}
              {mine && !isEditing && (
                <div className="absolute top-2 right-2 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                  <button onClick={()=>startEdit(a)} title="Edit" className="text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 text-slate-500">✎ Edit</button>
                  <button onClick={()=>deleteComment(a)} title="Delete" className="text-[11px] px-2 py-1 rounded bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 text-slate-500">🗑 Delete</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function Thread(props){
  return (
    <Modal title="Activity" onClose={props.onClose}>
      <ThreadBody {...props} />
    </Modal>
  );
}

/* ----------------------- Lead form ----------------------- */
function LeadForm({ profile, profiles, clients, existing, onClose, onSaved }){
  const isEdit=!!existing;
  const [clientMode,setClientMode]=useState(isEdit?'existing':(clients.length?'existing':'new'));
  const [clientId,setClientId]=useState(existing?.client_id||clients[0]?.id||'');
  const [newCompany,setNewCompany]=useState(''); const [newContact,setNewContact]=useState('');
  const [title,setTitle]=useState(existing?.title||''); const [stage,setStage]=useState(existing?.stage||'new');
  const [expectedClose,setExpectedClose]=useState(existing?.expected_close||''); const [deliveryDate,setDeliveryDate]=useState(existing?.delivery_date||'');
  const [creationDate,setCreationDate]=useState(existing?.created_at ? String(existing.created_at).slice(0,10) : new Date().toISOString().slice(0,10));
  const [poNumber,setPoNumber]=useState(existing?.po_number||''); const [techpackNumber,setTechpackNumber]=useState(existing?.techpack_number||'');
  const [leadSource,setLeadSource]=useState(existing?.lead_source||'');
  const [notes,setNotes]=useState(existing?.notes||'');
  const [managerId,setManagerId]=useState(existing?.manager_id||profile.id);
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const [manualValue,setManualValue]=useState(isEdit&&(!existing.items||existing.items.length===0)?String(existing.value||''):'');
  const [items,setItems]=useState((existing?.items&&existing.items.length)?existing.items.map((it,i)=>({ id:'i'+i, itemType:it.itemType||'', category:it.category||'', quantity:String(it.quantity||''), pricePerItem:String(it.pricePerItem||''), withVat:!!it.withVat })):[{ id:'i0', itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]);
  const [attachments,setAttachments]=useState(existing?.attachments||[]); const [reading,setReading]=useState(false);
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const subtotal=items.reduce((s,it)=>s+(Number(it.quantity)||0)*(Number(it.pricePerItem)||0),0);
  const vat=items.reduce((s,it)=>{ const l=(Number(it.quantity)||0)*(Number(it.pricePerItem)||0); return s+(it.withVat?l*0.12:0); },0);
  const total=subtotal+vat; const hasItems=items.some(it=>(Number(it.quantity)||0)>0&&(Number(it.pricePerItem)||0)>0); const value=hasItems?total:(Number(manualValue)||0);
  function setItem(idx,k,v){ setItems(items.map((it,i)=>i===idx?{...it,[k]:v}:it)); }
  function addItem(){ setItems([...items,{ id:'i'+Date.now(), itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]); }
  function removeItem(idx){ setItems(items.length===1?[{ id:'i'+Date.now(), itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]:items.filter((_,i)=>i!==idx)); }
  // Accepts MULTIPLE files at once — paired with `multiple` on the <input> below.
  // Uploads them sequentially (so Supabase Storage doesn't see a thundering
  // herd) and appends all metas in a single state update at the end.
  async function addPhoto(e){
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    setReading(true); setMsg('');
    const scope = 'leads/'+(existing?.id||'misc');
    const newMetas = [];
    try{
      for(const file of files){
        const meta = await uploadFile(scope, file);
        newMetas.push(meta);
      }
      if(newMetas.length) setAttachments(a=>[...a, ...newMetas]);
    } catch(err){
      // Preserve any partial uploads that succeeded so the user doesn't lose them.
      if(newMetas.length) setAttachments(a=>[...a, ...newMetas]);
      setMsg('Upload failed after '+newMetas.length+' file(s): '+(err.message||err));
    } finally{
      setReading(false); e.target.value='';
    }
  }
  async function onPasteLead(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault();
    setReading(true); setMsg('');
    try{ const meta = await uploadFile('leads/'+(existing?.id||'misc'), f); setAttachments(a=>[...a, meta]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL (https://…):')||'').trim(); if(!url) return; const name=(prompt('Link title (optional):')||url).trim(); setAttachments(a=>[...a,{ type:'link', name, url }]); }
  function removeAtt(idx){ setAttachments(a=>a.filter((_,i)=>i!==idx)); }
  async function save(){ if(!title.trim()){ setMsg('Lead title is required.'); return; } setBusy(true); setMsg('');
    try{ let finalClientId=clientId;
      if(clientMode==='new'){ if(!newCompany.trim()){ setMsg('New client needs a company.'); setBusy(false); return; }
        const {data,error}=await sb.from('clients').insert({ company:newCompany.trim(), contact:newContact.trim(), manager_id:profile.id }).select().single(); if(error) throw error; finalClientId=data.id; }
      const finalItems=items.filter(it=>it.itemType&&(Number(it.quantity)||0)>0).map(it=>{ const qty=Number(it.quantity), price=Number(it.pricePerItem)||0, sub=qty*price, v=it.withVat?sub*0.12:0; return { itemType:it.itemType, category:it.category||'—', quantity:qty, pricePerItem:price, withVat:!!it.withVat, lineTotal:sub+v }; });
      const payload={ client_id:finalClientId||null, title:title.trim(), value, subtotal_amount:hasItems?subtotal:value, vat_amount:hasItems?vat:0, stage, expected_close:expectedClose||null, delivery_date:deliveryDate||null, po_number:poNumber.trim(), techpack_number:techpackNumber.trim(), items:finalItems, attachments, lead_source:leadSource||'', notes:notes||'', manager_id: managerId||null, created_at: creationDate ? new Date(creationDate+'T00:00:00').toISOString() : new Date().toISOString(), won_at: SOLD_STAGES.includes(stage) ? (existing?.won_at || new Date().toISOString().slice(0,10)) : (existing?.won_at||null) };
      // Detect transition INTO a sold/won stage so we can auto-create the PR.
      const wasSold = isEdit && SOLD_STAGES.includes(existing?.stage);
      const willBeSold = SOLD_STAGES.includes(stage);
      let savedLeadId = null;
      let savedLeadForPR = null;
      if(isEdit){
        const {error}=await sb.from('leads').update(payload).eq('id',existing.id); if(error) throw error;
        if(existing.stage!==stage){ await sb.from('lead_activity').insert({ lead_id:existing.id, actor_id:profile.id, type:'system', text:`Moved to "${stageMeta(stage).label}"` }); }
        savedLeadId = existing.id;
        savedLeadForPR = { ...existing, ...payload, id: existing.id };
      } else {
        const {data,error}=await sb.from('leads').insert(payload).select().single(); if(error) throw error;
        await sb.from('lead_activity').insert({ lead_id:data.id, actor_id:profile.id, type:'system', text:'Created the lead' });
        savedLeadId = data.id;
        savedLeadForPR = data;
      }
      // Auto-create PR (BOM) AND a production job on the transition into
      // Won/Delivered. For brand new leads created directly in a Won stage,
      // also create. Both helpers are idempotent — skip if a record already
      // exists for this lead.
      if(savedLeadForPR && willBeSold && (!isEdit || !wasSold)){
        const newPR = await maybeAutoCreatePRForLead(profile, savedLeadForPR);
        if(newPR){
          await sb.from('lead_activity').insert({ lead_id:savedLeadId, actor_id:profile.id, type:'system', text:`Auto-created Purchase Request ${newPR.number} (BOM) for purchasing` });
        }
        const newJob = await maybeAutoCreateProductionJobForLead(profile, savedLeadForPR, clients);
        if(newJob){
          await sb.from('lead_activity').insert({ lead_id:savedLeadId, actor_id:profile.id, type:'system', text:`Auto-created Production job ${newJob.number}` });
        }
        // Finance: auto-create the Sales Order so Finance can track DP/balance,
        // paste in the QB invoice once delivered, etc.
        const newSO = await maybeAutoCreateSalesOrderForLead(profile, savedLeadForPR, clients);
        if(newSO){
          await sb.from('lead_activity').insert({ lead_id:savedLeadId, actor_id:profile.id, type:'system', text:`Auto-created Sales Order ${newSO.number} for finance` });
        }
      }
      // 🎉 Celebrate when the deal lands in "Won" (and wasn't already Won).
      const justBecameWon = stage === 'won' && (!isEdit || existing?.stage !== 'won');
      if(justBecameWon){
        try { window.dispatchEvent(new CustomEvent('steeze:won', { detail: { lead: savedLeadForPR } })); } catch(_){}
      }
      onSaved();
    } catch(err){ setMsg(err.message||String(err)); setBusy(false); } }
  return (
    <Modal title={isEdit?'Edit lead':'New lead'} onClose={onClose}>
      <div className="space-y-3" onPaste={onPasteLead}>
        {!isEdit && (<div className="flex gap-2 text-xs"><button onClick={()=>setClientMode('existing')} disabled={!clients.length} className={`flex-1 py-2 rounded-lg border font-medium ${clientMode==='existing'?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600'} disabled:opacity-40`}>Existing client</button><button onClick={()=>setClientMode('new')} className={`flex-1 py-2 rounded-lg border font-medium ${clientMode==='new'?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600'}`}>+ New client</button></div>)}

          <div><label className="text-[10px] text-slate-500 uppercase">Techpack Number</label><input className="input mt-0.5" value={techpackNumber} onChange={e=>setTechpackNumber(e.target.value)} placeholder="Prod Form / Techpack #" /></div>

/* ----------------------- Send-to-Graphic chooser ----------------------- */
function SendToGraphicModal({ profile, lead, clients, onClose, onSent }){
  const [chosen,setChosen]=useState({}); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  // Pre-fill with the lead's existing notes — sales can edit before sending.
  const [includeNotes,setIncludeNotes]=useState(!!(lead.notes||'').trim());
  const [noteForGraphic,setNoteForGraphic]=useState(lead.notes||'');
  const atts=lead.attachments||[]; const client=clients.find(c=>c.id===lead.client_id);
  async function send(){ setBusy(true); setMsg('');
    try{ const chosenAtts=atts.filter((_,i)=>chosen[i]);
      const finalNote = includeNotes ? (noteForGraphic||'').trim() : '';
      const job={ number:'GD-'+Date.now().toString().slice(-5), source_lead_id:lead.id, lead_id:lead.id, client_name:client?.company||'', item:lead.title, items:lead.items||[], quantity:(lead.items||[]).reduce((a,b)=>a+(Number(b.quantity)||0),0), graphic_type:'', attachments:chosenAtts, status:'to do', due_date:lead.delivery_date||lead.expected_close||null, notes:finalNote };
      const {error}=await sb.from('graphic_design_jobs').insert(job); if(error) throw error; onSent(chosenAtts.length); }
    catch(err){ setMsg(err.message||String(err)); setBusy(false); } }
  return (
    <Modal title="Send to Graphic Design" onClose={onClose} wide>
      <div className="space-y-3">
        <div className="text-sm text-slate-600">Choose which attachments to send with <strong>{lead.title}</strong>:</div>
        {atts.length===0?<div className="text-xs text-slate-400">This lead has no attachments. It will still create a Graphic Design card.</div>:(
          <div className="space-y-1">
            <label className="flex items-center gap-2 text-xs text-slate-500 pb-1 border-b"><input type="checkbox" checked={atts.length>0&&atts.every((_,i)=>chosen[i])} onChange={e=>{ const all={}; if(e.target.checked) atts.forEach((_,i)=>all[i]=true); setChosen(all); }} />Select all</label>
            {atts.map((a,i)=>(<label key={i} className="flex items-center gap-2 text-sm bg-white border rounded px-2 py-1 cursor-pointer"><input type="checkbox" checked={!!chosen[i]} onChange={e=>setChosen(p=>({...p,[i]:e.target.checked}))} /><span>{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="truncate flex-1">{a.name}</span></label>))}
          </div>
        )}
        {/* Notes hand-off — start from the lead's own notes (editable) and send with the card */}
        <div className="border rounded-lg p-3 bg-amber-50/50 border-amber-200">
          <label className="flex items-center gap-2 text-xs font-semibold text-amber-700 mb-2 cursor-pointer">
            <input type="checkbox" checked={includeNotes} onChange={e=>setIncludeNotes(e.target.checked)} />
            📝 Include notes for the graphic team
          </label>
          {includeNotes && (
            <>
              <textarea className="w-full text-sm px-2 py-1.5 rounded border border-amber-200 bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 min-h-[80px]" value={noteForGraphic} onChange={e=>setNoteForGraphic(e.target.value)} placeholder="What does the graphic team need to know? Colour codes, layout preferences, deadlines, references…" />
              {(lead.notes||'').trim() && <div className="text-[10px] text-slate-500 mt-1 italic">Pre-filled from the lead's notes — edit anything you don't want shared.</div>}
            </>
          )}
        </div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={send} className="w-full py-2 rounded-lg bg-pink-600 text-white font-semibold disabled:opacity-50">{busy?'Sending…':'Send to Graphic Design'}</button>
      </div>
    </Modal>
  );
}

/* Pick which attachments from a sales lead (lead + its activity thread) to forward to Printing. */
function SendLeadToPrintingModal({ profile, lead, client, onClose, onSent }){
  const [available,setAvailable]=useState([]);
  const [picked,setPicked]=useState(new Set());
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [note,setNote]=useState('');

  useEffect(()=>{
    let on=true;
    (async()=>{
      try{
        const all=[];
        // 1) Lead-level attachments
        if(Array.isArray(lead.attachments)){
          lead.attachments.forEach((a,i)=>{ if(a) all.push({ ...a, _src:'Lead', _key:'lead-'+i }); });
        }
        // 2) Activity-thread attachments on this lead
        const { data:acts, error:aerr } = await sb.from('lead_activity')
          .select('id,text,attachments,attachment,created_at')
          .eq('lead_id', lead.id)
          .order('created_at',{ ascending:true });
        if(aerr) throw aerr;
        (acts||[]).forEach(a=>{
          const list = Array.isArray(a.attachments)&&a.attachments.length ? a.attachments : (a.attachment?[a.attachment]:[]);
          list.forEach((att,j)=>{ if(att) all.push({ ...att, _src:'Activity', _key:'act-'+a.id+'-'+j }); });
        });
        // Dedupe by url/path
        const seen=new Set(); const out=[];
        all.forEach(a=>{ const k=String(a.url||a.path||a.name||''); if(!k){ out.push(a); return; } if(!seen.has(k)){ seen.add(k); out.push(a); } });
        if(on){ setAvailable(out); setLoading(false); }
      }catch(e){ if(on){ setErr('Could not load attachments: '+(e.message||e)); setLoading(false); } }
    })();
    return ()=>{on=false;};
  },[lead.id]);

  function toggle(k){ setPicked(p=>{ const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n; }); }
  function pickAll(){ setPicked(new Set(available.map(a=>a._key))); }
  function pickNone(){ setPicked(new Set()); }

  async function send(){
    if(picked.size===0 && !confirm('No files selected. Send to Printing anyway?')) return;
    setBusy(true); setErr('');
    try{
      const atts = available.filter(a=>picked.has(a._key)).map(({ _src, _key, ...rest })=>rest);
      const qty = Array.isArray(lead.items)&&lead.items.length
        ? lead.items.reduce((s,it)=>s+(Number(it.quantity)||0),0)
        : 0;
      const payload = {
        number: 'PR-P-'+Date.now().toString().slice(-5),
        source_job_id: null,
        lead_id: lead.id,
        client_name: client?.company || lead.client_name || '',
        item: lead.title || '',
        items: lead.items || [],
        quantity: qty,
        attachments: atts,
        status: 'to do',
        due_date: lead.delivery_date || lead.expected_close || null,
        notes: (note? note+'\n\n':'')+'Sent from Sales Pipeline (Sampling stage) — lead: '+(lead.title||'')
      };
      const { error } = await sb.from('printing_jobs').insert(payload);
      if(error) throw error;
      setBusy(false);
      onSent(atts.length);
    }catch(e){ setBusy(false); setErr(e.message||String(e)); }
  }

  return (
    <Modal title="🖨 Send to Printing" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="rounded-lg bg-slate-50 border p-3 text-sm">
          <div className="font-semibold">{lead.title||'—'}</div>
          <div className="text-xs text-slate-500 mt-0.5">{client?.company||lead.client_name||'—'}{lead.delivery_date?` · sample due ${fmtDate(lead.delivery_date)}`:''}</div>
        </div>
        <div>
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
            <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
              Attachments to send {available.length>0 && <span className="text-slate-400">({picked.size}/{available.length} selected)</span>}
            </div>
            {available.length>0 && (
              <div className="flex gap-2 text-xs">
                <button type="button" onClick={pickAll} className="text-indigo-600 hover:underline">Select all</button>
                <span className="text-slate-300">·</span>
                <button type="button" onClick={pickNone} className="text-slate-500 hover:underline">Clear</button>
              </div>
            )}
          </div>
          {loading && <div className="text-sm text-slate-400 p-6 text-center border rounded-lg">Loading attachments…</div>}
          {!loading && available.length===0 && (
            <div className="text-sm text-slate-500 p-6 border rounded-lg text-center bg-slate-50">
              No attachments on this lead or its activity thread yet.<br/>
              <span className="text-xs">You can still send the card to Printing — it will arrive without files.</span>
            </div>
          )}
          {!loading && available.length>0 && (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-[55vh] overflow-y-auto pr-1">
              {available.map(a=>{
                const checked=picked.has(a._key);
                const srcColor = a._src==='Lead'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700';
                return (
                  <button type="button" key={a._key} onClick={()=>toggle(a._key)} className={`text-left border rounded-lg overflow-hidden bg-white hover:bg-slate-50 transition ${checked?'ring-2 ring-indigo-500 border-indigo-500':'border-slate-200'}`}>
                    <div className="relative">
                      <AttachmentChip att={a} />
                      <div className={`absolute top-1 left-1 w-5 h-5 rounded border-2 flex items-center justify-center text-xs font-bold ${checked?'bg-indigo-600 border-indigo-600 text-white':'bg-white/90 border-slate-300'}`}>{checked?'✓':''}</div>
                    </div>
                    <div className="p-2 text-[11px]">
                      <div className="font-medium truncate" title={a.name}>{a.name||'attachment'}</div>
                      <div className="mt-1"><span className={`inline-block text-[9px] uppercase px-1.5 py-0.5 rounded font-semibold ${srcColor}`}>{a._src}</span></div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        <div>
          <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Note for Printing (optional)</div>
          <textarea className="input min-h-[60px]" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Sublimation only, use Pantone 186C for red panels" />
        </div>
        {err && <div className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded p-2">{err}</div>}
        <div className="flex justify-end gap-2 pt-3 border-t">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-slate-600 text-sm">Cancel</button>
          <button disabled={busy||loading} onClick={send} className="px-4 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700 disabled:opacity-50">{busy?'Sending…':`🖨 Send ${picked.size} file${picked.size===1?'':'s'} to Printing`}</button>
        </div>
      </div>
    </Modal>
  );
}

            <div><div className="text-[10px] uppercase text-slate-400">Lead Source</div><div>{lead.lead_source||'—'}</div></div>

            <div><div className="text-[10px] uppercase text-slate-400">Sample Due Date</div><div>{fmtDate(lead.delivery_date)}</div></div>
            <div><div className="text-[10px] uppercase text-slate-400">Creation Date</div><div>{fmtDate(lead.created_at)}</div></div>

            <div><div className="text-[10px] uppercase text-slate-400">Techpack Number</div><div>{lead.techpack_number||'—'}</div></div>
          </div>
          {(lead.items||[]).length>0 && (<div><div className="text-[10px] uppercase text-slate-400 mb-1">Items</div><div className="border rounded-lg divide-y">{lead.items.map((it,i)=>(<div key={i} className="flex justify-between px-3 py-1.5 text-sm"><span>{it.itemType}{it.category?` · ${it.category}`:''} {it.withVat?<span className="text-[10px] text-emerald-600">+VAT</span>:''}</span><span className="font-medium">{it.quantity} × {peso(it.pricePerItem)}</span></div>))}</div></div>)}
