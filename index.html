function buildPRFromLead(profile, lead){
  const lines=(lead.items||[]).map(it=>({
    description: `${it.itemType||'Item'}${it.category?` (${it.category})`:''} — for "${lead.title}"`,
    sku:'', item_id:null,
    qty: Number(it.quantity)||0,
    est_cost: Number(it.pricePerItem)||0,
    link:'', notes:'',
  }));
  return {
    number:'PR-'+Date.now().toString().slice(-5),
    date:new Date().toISOString().slice(0,10),
    requested_by: profile.id,
    dept_id:null,
    urgency:'normal',
    status:'submitted',
    justification:`Materials for Closed Won deal "${lead.title}". Lead value ${peso(lead.value)}.`,
    approver_note:'',
    linked_lead_id: lead.id,
    lines: lines.length?lines:[{description:`Materials for "${lead.title}"`, sku:'', item_id:null, qty:1, est_cost:0, link:'', notes:''}],
  };
}

// Idempotent auto-create. Skips if a PR already exists for this lead. Used by
// every spot where a lead's stage transitions into a Won / Delivered status so
// purchasing automatically gets a draft BOM to work from. Returns the new PR
// row (or null if skipped / errored).
async function maybeAutoCreatePRForLead(profile, lead){
  if(!lead || !profile) return null;
  try {
    const { data: existing, error: lookupErr } = await sb.from('purchase_requests')
      .select('id').eq('linked_lead_id', lead.id).limit(1);
    if(lookupErr){ console.warn('PR auto-create lookup failed:', lookupErr.message); return null; }
    if(existing && existing.length > 0) return null; // already has a PR
    const payload = buildPRFromLead(profile, lead);
    const { data, error } = await sb.from('purchase_requests').insert(payload).select().single();
    if(error){ console.warn('PR auto-create insert failed:', error.message); return null; }
    return data;
  } catch(e){
    console.warn('PR auto-create unexpected error:', e);
    return null;
  }
}

// Same idempotent pattern, but for the production board. Auto-creates a
// production_jobs row on the transition into Won/Delivered so the production
// team sees the deal without needing anyone to click "Send to Production".
// Returns the new job row, or null if skipped / errored.
async function maybeAutoCreateProductionJobForLead(profile, lead, clients){
  if(!lead || !profile) return null;
  try {
    const { data: existing, error: lookupErr } = await sb.from('production_jobs')
      .select('id').eq('lead_id', lead.id).limit(1);
    if(lookupErr){ console.warn('Production auto-create lookup failed:', lookupErr.message); return null; }
    if(existing && existing.length > 0) return null; // already has a production job
    const client = (clients||[]).find(c=>c.id===lead.client_id);
    const items = (lead.items||[]).map(it=>({ itemType:it.itemType, category:it.category||'', quantity:Number(it.quantity)||0 }));
    const qty = items.reduce((s,it)=>s+(Number(it.quantity)||0), 0);
    const payload = {
      number: 'PROD-'+Date.now().toString().slice(-5),
      lead_id: lead.id,
      client_id: lead.client_id || null,
      client_name: client?.company || '',
      item: lead.title,
      items,
      quantity: qty,
      status: 'materials to purchase',
      // Prefer delivery_date (client's expected delivery). Fall back to
      // expected_close (sales's expected close date) so the production job
      // still has a working deadline even when sales hasn't filled in a
      // delivery_date on the lead. If both are null, leave null and rely
      // on the production team to set it manually.
      due_date: lead.delivery_date || lead.expected_close || null,
      sales_owner_id: lead.manager_id || null,
    };
    const { data, error } = await sb.from('production_jobs').insert(payload).select().single();
    if(error){ console.warn('Production auto-create insert failed:', error.message); return null; }
    return data;
  } catch(e){
    console.warn('Production auto-create unexpected error:', e);
    return null;
  }
}

// Idempotent auto-create: Sales Order when a lead hits Closed Won. The SO is
// the document Finance works off of (DP, balance, QB invoice link, payment
// status). If one already exists for the lead, this is a no-op.
async function maybeAutoCreateSalesOrderForLead(profile, lead, clients){
  if(!lead || !profile) return null;
  try {
    // Skip if SO already exists (either by lead_id linkage or via the lead.sales_order_id)
    if(lead.sales_order_id) return null;
    const { data: existing, error: lookupErr } = await sb.from('sales_orders')
      .select('id').eq('lead_id', lead.id).limit(1);
    if(lookupErr){ console.warn('SO auto-create lookup failed:', lookupErr.message); return null; }
    if(existing && existing.length > 0) return null;
    // Pull next SO number: SO-YYYY-MM-NNN (count within month)
    const today = new Date().toISOString().slice(0,10);
    const monthKey = today.slice(0,7); // YYYY-MM
    const { data: monthRows } = await sb.from('sales_orders').select('id,number').like('number', `SO-${monthKey}-%`);
    const seq = String((monthRows?.length||0) + 1).padStart(3,'0');
    const number = `SO-${monthKey}-${seq}`;
    const client = (clients||[]).find(c=>c.id===lead.client_id);
    const items = lead.items || [];
    const total = Number(lead.value)||0;
    const payload = {
      number,
      date: today,
      lead_id: lead.id,
      client_id: lead.client_id||null,
      client_name: client?.company||'',
      items,
      subtotal: total,
      total,
      amount_paid: 0,
      balance_due: total,
      status: 'open',
      expected_delivery: lead.delivery_date || lead.expected_close || null,
      techpack_number: lead.techpack_number||null,
      created_by: profile.id,
    };
    const { data, error } = await sb.from('sales_orders').insert(payload).select().single();
    if(error){ console.warn('SO auto-create insert failed:', error.message); return null; }
    // Link back on the lead so we can short-circuit future calls
    if(data && data.id){
      await sb.from('leads').update({ sales_order_id: data.id }).eq('id', lead.id);
    }
    return data;
  } catch(e){
    console.warn('SO auto-create unexpected error:', e);
    return null;
  }
}

              <td className="px-3 py-2 text-right font-medium">{totalQty || '—'}</td>
              <td className="px-3 py-2 text-xs font-mono">{tpNo || <span className="text-slate-400">—</span>}</td>
              <td className="px-3 py-2"><span className={`text-xs px-2 py-1 rounded font-medium ${meta.color}`}>{meta.label}</span></td>
              <td className="px-3 py-2 text-right whitespace-nowrap"><button onClick={(e)=>{ e.stopPropagation(); setPrinting(r); }} className="text-xs text-slate-500 hover:text-slate-800 mr-2" title="Print preview">🖨</button><button onClick={(e)=>{ e.stopPropagation(); setEditing(r); }} className="text-xs text-indigo-600 hover:underline">Open</button></td>
            </tr>
          );
        })}{rows.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No purchase requests yet. Click "+ New PR" to add one.</td></tr>}</tbody>
      </table></div></div>
      {(creating||editing) && <PurchaseRequestForm profile={profile} existing={editing} items={items} suppliers={suppliers} departments={departments} leads={leads} clients={clients} onClose={()=>{ setCreating(false); setEditing(null); }} onSaved={()=>{ setCreating(false); setEditing(null); reload(); }} onCreatePO={onCreatePO} onViewTechpack={onViewTechpack} onPrint={(pr)=>setPrinting(pr)} />}
      {printing && <PRPrintView pr={printing} leads={leads} profiles={profiles} profile={profile} onClose={()=>setPrinting(null)} />}
    </div>
  );
}

function PurchaseRequestForm({ profile, existing, items, suppliers, departments, leads, clients, onClose, onSaved, onCreatePO, onViewTechpack, onPrint }){
  const isEdit=!!existing;
  const isAdmin=profile.role==='admin';
  const [f,setF]=useState(existing?{...existing, lines:existing.lines||[]}:{ date:new Date().toISOString().slice(0,10), requested_by:profile.id, dept_id:null, urgency:'normal', status:'submitted', justification:'', approver_note:'', lines:[{item_id:null, sku:'', description:'', qty:1, est_cost:0}] });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const readOnly = f.status==='ordered' || (f.status==='rejected' && !isAdmin);
  // Resolve linked lead → client → techpack for the header banner.
  const linkedLead = existing&&existing.linked_lead_id ? (leads||[]).find(l=>l.id===existing.linked_lead_id) : null;
  const client = linkedLead && linkedLead.client_id ? (clients||[]).find(c=>c.id===linkedLead.client_id) : null;
  const techpackNumber = linkedLead?.techpack?.prodFormNo || linkedLead?.techpack_number || '';
  const styleName = linkedLead?.techpack?.styleName || linkedLead?.title || '';

  // Group inventory items by bucket so the picker shows them under labeled
  // optgroups (🧵 Fabrics / 🔗 Trims / 🖨 Printing / 📎 Office).
  const itemsByBucket = (()=>{
    const out = { fabrics:[], trims:[], printing:[], office:[], other:[] };
    (items||[]).forEach(i => {
      const b = (i.bucket||'').toLowerCase().trim();
      if(out[b]) out[b].push(i); else out.other.push(i);
    });
    Object.keys(out).forEach(k => out[k].sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
    return out;
  })();
  const BUCKET_META = { fabrics:{label:'Fabrics', icon:'🧵'}, trims:{label:'Trims', icon:'🔗'}, printing:{label:'Printing Supplies', icon:'🖨'}, office:{label:'Office Supplies', icon:'📎'}, other:{label:'Other / Unassigned', icon:'•'} };
  const itemById = (id)=> (items||[]).find(i=>i.id===id);
  const supplierName = (id)=> (suppliers||[]).find(s=>s.id===id)?.company || '';

  function up(k,v){ setF(p=>({...p,[k]:v})); }
  function setLine(i,patch){ setF(p=>({...p,lines:p.lines.map((l,j)=>j===i?{...l,...patch}:l)})); }
  // When user picks an inventory item, auto-fill cost from the item AND store
  // the supplier so the Materials Queue / PO can group by it without having
  // to look it up later.
  function pickItem(i, itemId){
    const it = itemId ? itemById(itemId) : null;
    setLine(i, {
      item_id: itemId || null,
      sku: it?.sku || '',
      description: it ? (it.name + (it.color ? ` - ${it.color}` : '')) : '',
      est_cost: it?.cost || 0,
      // Snapshot the supplier_id at line-add time so the PR carries the
      // source-of-truth supplier even if the inventory record is later edited.
      supplier_id: it?.supplier_id || null,
    });
  }
  function addLine(){ setF(p=>({...p,lines:[...p.lines,{item_id:null, sku:'', description:'', qty:1, est_cost:0}]})); }
  function removeLine(i){ setF(p=>({...p,lines:p.lines.filter((_,j)=>j!==i)})); }
  const total=f.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.est_cost)||0),0);
  async function save(){ if(!f.lines.some(l=>l.item_id||l.description)){ setMsg('Add at least one item line.'); return; } setBusy(true); setMsg('');
    const payload={ date:f.date, requested_by:f.requested_by||profile.id, dept_id:f.dept_id||null, urgency:f.urgency, status:f.status, justification:f.justification||'', approver_note:f.approver_note||'', lines:f.lines };
    if(!isEdit) payload.number='PR-'+Date.now().toString().slice(-5);
    const { error } = isEdit ? await sb.from('purchase_requests').update(payload).eq('id',existing.id) : await sb.from('purchase_requests').insert(payload);
    setBusy(false); if(error){ setMsg(error.message); return; } onSaved(); }
  async function setStatus(s){ if(!isEdit) return; setBusy(true); const {error}=await sb.from('purchase_requests').update({ status:s, approver_note:f.approver_note||'' }).eq('id',existing.id); setBusy(false); if(error){ alert(error.message); return; } onSaved(); }

  // Custom modal title that includes client + techpack info inline.
  const titleText = isEdit
    ? `PR ${existing.number||existing.id.slice(0,6)}${client?` — ${client.company}`:''}${techpackNumber?` · TP ${techpackNumber}`:''}`
    : `New purchase request${client?` — ${client.company}`:''}`;

  return (
    <Modal title={titleText} onClose={onClose} wide>
      <div className="space-y-3">
        {/* BOM header — make the connection to the deal obvious at a glance. */}
        {linkedLead && (
          <div className="bg-gradient-to-r from-indigo-50 to-teal-50 border border-indigo-200 rounded-lg p-3 flex items-start justify-between gap-3 flex-wrap">
            <div className="min-w-0 flex-1">
              <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Materials request (BOM) for</div>
              <div className="text-base font-bold text-slate-900 mt-0.5 truncate">{styleName}</div>
              <div className="text-xs text-slate-600 mt-0.5 flex flex-wrap gap-x-3">
                {client && <span>👤 Client: <strong>{client.company}</strong></span>}
                {techpackNumber && <span>📋 Techpack: <strong>{techpackNumber}</strong></span>}
                {linkedLead.value && <span>💰 Deal value: <strong>{peso(linkedLead.value)}</strong></span>}
              </div>
            </div>
            {linkedLead.techpack && onViewTechpack && (
              <button onClick={()=>onViewTechpack(linkedLead)} className="px-3 py-2 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700 shrink-0">📋 View techpack</button>
            )}
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Date"><input type="date" className="input" value={f.date} onChange={e=>up('date',e.target.value)} disabled={readOnly} /></TpLbl>
          <TpLbl t="Department"><select className="input" value={f.dept_id||''} onChange={e=>up('dept_id',e.target.value||null)} disabled={readOnly}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></TpLbl>
          <TpLbl t="Urgency"><select className="input" value={f.urgency} onChange={e=>up('urgency',e.target.value)} disabled={readOnly}>{PR_URGENCIES.map(u=><option key={u} value={u}>{u}</option>)}</select></TpLbl>
        </div>
        <TpLbl t="Justification / business reason"><textarea className="input min-h-[50px]" value={f.justification} onChange={e=>up('justification',e.target.value)} disabled={readOnly} placeholder="Why is this needed? (Auto-filled for closed-won deals.)" /></TpLbl>

        {/* Line items — BOM style. Each row is one inventory item with qty,
            unit cost, and the auto-derived supplier shown to the right. */}
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-slate-700">Materials needed ({f.lines.length} line{f.lines.length===1?'':'s'})</div>
            {!readOnly && <button onClick={addLine} className="text-xs text-indigo-600 font-semibold">+ Add line</button>}
          </div>
          <div className="grid grid-cols-12 gap-2 text-[10px] uppercase tracking-wide text-slate-500 px-2 mb-1">
            <div className="col-span-5">Inventory item</div>
            <div className="col-span-1 text-right">Qty</div>
            <div className="col-span-2 text-right">Unit ₱</div>
            <div className="col-span-2">Supplier</div>
            <div className="col-span-1 text-right">Subtotal</div>
            <div className="col-span-1"></div>
          </div>
          <div className="space-y-1.5">{f.lines.map((l,i)=>{
            const it = l.item_id ? itemById(l.item_id) : null;
            // Supplier display: prefer the snapshot stored on the line,
            // fall back to looking it up from the (current) inventory item.
            const suppId = l.supplier_id || it?.supplier_id || null;
            const suppText = suppId ? supplierName(suppId) : '';
            const hasLegacyDesc = !l.item_id && l.description;
            return (
              <div key={i} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-center">
                <div className="col-span-5">
                  <select className="input text-xs" value={l.item_id||''} onChange={e=>pickItem(i, e.target.value)} disabled={readOnly}>
                    <option value="">— pick an inventory item —</option>
                    {['fabrics','trims','printing','office','other'].map(bk => itemsByBucket[bk].length>0 && (
                      <optgroup key={bk} label={`${BUCKET_META[bk].icon} ${BUCKET_META[bk].label}`}>
                        {itemsByBucket[bk].map(it=>(<option key={it.id} value={it.id}>{it.name}{it.color?` - ${it.color}`:''}{it.sku?` · ${it.sku}`:''}</option>))}
                      </optgroup>
                    ))}
                  </select>
                  {hasLegacyDesc && <div className="text-[10px] text-amber-600 mt-1">⚠ Legacy: "{l.description}" — pick an inventory item to replace</div>}
                </div>
                <div className="col-span-1"><input type="number" className="input text-xs text-right" value={l.qty} onChange={e=>setLine(i,{qty:e.target.value})} disabled={readOnly} /></div>
                <div className="col-span-2"><input type="number" step="0.01" className="input text-xs text-right" value={l.est_cost} onChange={e=>setLine(i,{est_cost:e.target.value})} disabled={readOnly} /></div>
                <div className="col-span-2 text-xs">
                  {suppText ? <span className="font-medium text-slate-700">{suppText}</span> : <span className="text-amber-600">⚠ no supplier set</span>}
                </div>
                <div className="col-span-1 text-right text-xs font-semibold">{peso(Number(l.qty||0)*Number(l.est_cost||0))}</div>
                <div className="col-span-1 text-right">{!readOnly && <button onClick={()=>removeLine(i)} className="text-rose-400 text-sm">✕</button>}</div>
              </div>
            );
          })}</div>
          <div className="text-right mt-2 text-sm font-bold">Total: {peso(total)}</div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Status"><select className="input" value={f.status} onChange={e=>up('status',e.target.value)} disabled={!isAdmin}>{PR_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></TpLbl>
          <TpLbl t="Approver note"><input className="input" value={f.approver_note} onChange={e=>up('approver_note',e.target.value)} disabled={!isAdmin} /></TpLbl>
        </div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}

        <div className="flex gap-2 pt-2 border-t flex-wrap">
          {isEdit && onPrint && <button onClick={()=>onPrint(existing)} className="px-3 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">🖨 Print preview</button>}
          {isEdit && isAdmin && f.status==='submitted' && <button onClick={()=>setStatus('approved')} disabled={busy} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold disabled:opacity-50">✓ Approve</button>}
          {isEdit && isAdmin && f.status==='submitted' && <button onClick={()=>setStatus('rejected')} disabled={busy} className="px-3 py-2 rounded-lg bg-rose-600 text-white text-sm font-semibold disabled:opacity-50">✕ Reject</button>}
          {isEdit && f.status==='approved' && onCreatePO && <button onClick={()=>onCreatePO(existing)} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">→ Create PO</button>}
          {!readOnly && <button onClick={save} disabled={busy} className="flex-1 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save':'Create PR')}</button>}
          {readOnly && <div className="flex-1 text-xs text-slate-500 self-center text-center">This PR is {f.status} and locked.</div>}
        </div>
      </div>
    </Modal>
  );
}

/* ====================== MATERIALS QUEUE ======================
   The materials queue shows every unfulfilled PR line across all open
   Purchase Requests, grouped by which supplier we'll buy it from.

   How supplier is determined for each line (in order):
     1. If the line points to an inventory item AND that item has a
        supplier_id set, use that supplier.
     2. Otherwise the line is parked in the "Unassigned" bucket; the
        purchaser either sets supplier_id on the inventory item or routes
        the line manually via "+ New PO".

   How "fulfilled" is tracked:
     We add a `linked_po_id` field to each PR line (stored inline on the
     JSON `lines` array). When the queue creates a PO, every line that
     went into that PO gets stamped with the PO's id. The queue filters
     out any line whose linked_po_id is set. PRs whose lines are ALL
     stamped flip to status='ordered' automatically.
   ============================================================ */

function MaterialsQueueView({ profile, requests, items, suppliers, leads, reload, onOpenPO }){
  const [expanded,setExpanded]=useState(()=>new Set());
  const [busy,setBusy]=useState(null); // bucket id currently being processed

  // Build per-supplier buckets of unfulfilled PR lines.
  const buckets = (()=>{
    const map = new Map();
    const openPRs = (requests||[]).filter(r => r.status==='submitted' || r.status==='approved');
    openPRs.forEach(pr => {
      const lead = pr.linked_lead_id ? (leads||[]).find(l=>l.id===pr.linked_lead_id) : null;
      (pr.lines||[]).forEach((line, idx) => {
        if(line.linked_po_id) return; // already in a PO
        // Figure out supplier — prefer the snapshot stored on the PR line
        // (set when the user picked the inventory item) over a fresh lookup,
        // so a supplier change in Inventory doesn't retroactively re-route
        // existing PR lines.
        const inventoryItem = line.item_id ? (items||[]).find(i=>i.id===line.item_id) : null;
        const supplierId = line.supplier_id || inventoryItem?.supplier_id || '__unassigned__';
        if(!map.has(supplierId)){
          map.set(supplierId,{
            supplierId,
            supplier: supplierId === '__unassigned__' ? null : (suppliers||[]).find(s=>s.id===supplierId),
            items:[],
            total:0,
            prIds:new Set(),
          });
        }
        const b = map.get(supplierId);
        b.items.push({ pr, lineIdx:idx, line, lead, inventoryItem });
        b.total += (Number(line.qty)||0) * (Number(line.est_cost)||0);
        b.prIds.add(pr.id);
      });
    });
    return Array.from(map.values()).sort((a,b)=>{
      if(a.supplierId === '__unassigned__') return 1;
      if(b.supplierId === '__unassigned__') return -1;
      return (a.supplier?.company||'').localeCompare(b.supplier?.company||'');
    });
  })();

  const grandTotal = buckets.reduce((s,b)=>s+b.total, 0);
  const totalItems = buckets.reduce((s,b)=>s+b.items.length, 0);
  const totalSuppliers = buckets.filter(b=>b.supplierId!=='__unassigned__').length;

  function toggleExpand(key){ setExpanded(prev=>{ const n=new Set(prev); if(n.has(key)) n.delete(key); else n.add(key); return n; }); }

  async function createBulkPO(bucket){
    if(bucket.supplierId === '__unassigned__'){
      alert('These items have no preferred supplier set in Inventory. Open Inventory, edit each item, and set its Supplier. Then come back — they\'ll appear under the right supplier here.');
      return;
    }
    if(!confirm(`Create a draft PO for ${bucket.supplier?.company}?\n\n${bucket.items.length} item(s) consolidated from ${bucket.prIds.size} PR(s)\nEstimated total: ${peso(bucket.total)}\n\nThe draft PO will be saved and you can edit / finalize it from Purchase Orders.`)) return;
    setBusy(bucket.supplierId);
    try {
      // Build the date-based PO number using today's existing POs.
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const { data: todayPOs } = await sb.from('purchase_orders').select('id').eq('date', todayStr);
      const seq = String(((todayPOs||[]).length)+1).padStart(3,'0');
      const number = `PO-${todayStr}-${seq}`;

      const lines = bucket.items.map(({ line, lead })=>({
        item_id: line.item_id || null,
        description: line.description + (lead?` — for "${lead.title}"`:''),
        qty: Number(line.qty)||0,
        qty_received: 0,
        unit_cost: Number(line.est_cost)||0,
      }));

      const payload = {
        number,
        date: todayStr,
        supplier_id: bucket.supplierId,
        status: 'draft',
        notes: `Auto-built from Materials Queue · ${bucket.prIds.size} PR(s) consolidated`,
        total: bucket.total,
        lines,
      };

      const { data: po, error } = await sb.from('purchase_orders').insert(payload).select().single();
      if(error){ alert('PO insert failed: '+error.message); setBusy(null); return; }

      // Stamp linked_po_id on the source PR lines and update each PR.
      // Group items by source PR so we issue one update per PR.
      const byPR = new Map();
      bucket.items.forEach(({ pr, lineIdx })=>{
        if(!byPR.has(pr.id)) byPR.set(pr.id, { pr, indices:[] });
        byPR.get(pr.id).indices.push(lineIdx);
      });
      for(const { pr, indices } of byPR.values()){
        const newLines = (pr.lines||[]).map((l,i)=> indices.includes(i) ? { ...l, linked_po_id: po.id } : l);
        const allFulfilled = newLines.every(l => l.linked_po_id);
        const update = { lines: newLines };
        if(allFulfilled) { update.status = 'ordered'; update.linked_po_id = po.id; }
        const { error: prErr } = await sb.from('purchase_requests').update(update).eq('id', pr.id);
        if(prErr) console.warn('PR update failed for', pr.id, prErr.message);
      }

      setBusy(null);
      reload();
      if(onOpenPO) onOpenPO(po);
      else alert(`Draft ${number} created. Open Purchase Orders to review and finalize.`);
    } catch(e){
      console.error(e);
      alert('Unexpected error: '+(e.message||String(e)));
      setBusy(null);
    }
  }

  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl font-bold">📥 Materials Queue</h1>
            <p className="text-slate-500 text-sm">{totalItems} item{totalItems===1?'':'s'} across {totalSuppliers} supplier{totalSuppliers===1?'':'s'} · {peso(grandTotal)} estimated</p>
          </div>
        </div>
      </div>

      <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-xs text-indigo-900 mb-4">
        <strong>🛒 Bulk purchasing day workflow:</strong> Each card below is one supplier's consolidated shopping list from your open Purchase Requests. Tap <strong>"Create draft PO"</strong> to generate a draft PO with all that supplier's items in one click. Edit / finalize the PO when you confirm prices and availability at the supplier.
      </div>

      {buckets.length === 0 && (
        <div className="bg-white border rounded-xl p-12 text-center text-slate-400">
          <div className="text-5xl mb-3">✅</div>
          <div className="font-semibold text-slate-700">All caught up</div>
          <div className="text-sm mt-1">No unfulfilled PR lines right now. Materials needs from new Purchase Requests will show up here.</div>
        </div>
      )}

      <div className="space-y-3">{buckets.map(b => {
        const isOpen = expanded.has(b.supplierId);
        const isUnassigned = b.supplierId === '__unassigned__';
        return (
          <div key={b.supplierId} className={`bg-white border rounded-xl overflow-hidden ${isUnassigned?'border-amber-300':'border-slate-200'}`}>
            <div className={`p-4 flex items-center justify-between gap-3 flex-wrap ${isUnassigned?'bg-amber-50':'bg-slate-50'}`}>
              <button onClick={()=>toggleExpand(b.supplierId)} className="flex-1 text-left flex items-center gap-3 min-w-0">
                <span className="text-slate-400 text-sm">{isOpen?'▾':'▸'}</span>
                <div className="min-w-0">
                  <div className="font-bold text-slate-900 truncate">{isUnassigned ? '⚠ Unassigned (no supplier set in Inventory)' : `🏭 ${b.supplier?.company||'(unknown supplier)'}`}</div>
                  <div className="text-xs text-slate-600">{b.items.length} item{b.items.length===1?'':'s'} · from {b.prIds.size} PR{b.prIds.size===1?'':'s'} · est. <strong className="text-emerald-700">{peso(b.total)}</strong></div>
                </div>
              </button>
              <div className="flex items-center gap-2">
                {!isUnassigned && (
                  <button onClick={()=>createBulkPO(b)} disabled={busy===b.supplierId} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">
                    {busy===b.supplierId ? 'Creating…' : '+ Create draft PO'}
                  </button>
                )}
                {isUnassigned && (
                  <span className="text-[11px] text-amber-700 font-semibold">Set supplier in Inventory →</span>
                )}
              </div>
            </div>

            {isOpen && (
              <div className="border-t divide-y">
                {b.items.map(({ pr, line, lead, inventoryItem }, i) => (
                  <div key={i} className="px-4 py-2.5 grid grid-cols-12 gap-2 items-center text-sm">
                    <div className="col-span-5">
                      <div className="font-medium">{line.description||'—'}</div>
                      {inventoryItem && <div className="text-[10px] text-slate-500">{inventoryItem.sku} · {inventoryItem.name}{inventoryItem.color?` · ${inventoryItem.color}`:''}</div>}
                    </div>
                    <div className="col-span-2 text-right text-slate-700"><strong>{line.qty}</strong></div>
                    <div className="col-span-2 text-right text-xs text-slate-600">{peso(line.est_cost)}</div>
                    <div className="col-span-2 text-right font-semibold">{peso((Number(line.qty)||0)*(Number(line.est_cost)||0))}</div>
                    <div className="col-span-1 text-right text-[10px] text-slate-400" title={lead?`Lead: ${lead.title}`:''}>{lead?lead.title.slice(0,18):'—'}{(pr.number?` · ${pr.number}`:'')}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}</div>
    </div>
  );
}

/* ====================== PURCHASE ORDERS ====================== */
const PO_STATUSES=[
  { key:'draft',     label:'Draft',     color:'bg-slate-200 text-slate-700' },
  { key:'open',      label:'Placed',    color:'bg-amber-100 text-amber-700' },
  { key:'partial',   label:'Partial',   color:'bg-blue-100 text-blue-700' },
  { key:'received',  label:'Received',  color:'bg-emerald-100 text-emerald-700' },
  { key:'cancelled', label:'Cancelled', color:'bg-slate-200 text-slate-600' },
];
function poMeta(k){ return PO_STATUSES.find(s=>s.key===k)||PO_STATUSES[0]; }
// A PO is "locked" once finalized — line items become read-only and totals
// can't drift. Only Draft POs are fully editable.
function isPOEditable(po){ return !po || po.status === 'draft'; }
// Build a date-based PO number like PO-2026-06-09-003 by counting how many
// POs already exist for this date string.
function nextPONumber(allOrders, dateStr){
  const sameDay = (allOrders||[]).filter(o=> (o.date||'') === dateStr);
  const n = sameDay.length + 1;
  return `PO-${dateStr}-${String(n).padStart(3,'0')}`;
}

function PurchaseOrdersView({ profile, profiles, orders, items, suppliers, reload, openFromPR, onClearPR }){
  const [filter,setFilter]=useState(''); const [editing,setEditing]=useState(null); const [creating,setCreating]=useState(false); const [receiving,setReceiving]=useState(null); const [printing,setPrinting]=useState(null); const [search,setSearch]=useState('');

  const rows=orders.filter(o=>(!filter||o.status===filter)&&(!search||`${o.number}`.toLowerCase().includes(search.toLowerCase())));
  const suppName=(id)=>suppliers.find(s=>s.id===id)?.company||'—';
  return (

      <div className="grid grid-cols-5 gap-3 mb-4">{PO_STATUSES.map(s=>(<button key={s.key} onClick={()=>setFilter(filter===s.key?'':s.key)} className={`rounded-xl border p-4 text-left ${filter===s.key?'bg-indigo-600 border-indigo-600 text-white':'bg-white hover:border-indigo-300'}`}><div className={`text-[11px] uppercase ${filter===s.key?'text-indigo-100':'text-slate-400'}`}>{s.label}</div><div className="text-2xl font-bold">{counts[s.key]||0}</div></button>))}</div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search PO#…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-72 mb-4" />
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">PO#</th><th className="text-left px-3 py-2">Date</th><th className="text-left px-3 py-2">Supplier</th><th className="text-right px-3 py-2">Lines</th><th className="text-right px-3 py-2">Total</th><th className="text-left px-3 py-2">Status</th><th className="text-left px-3 py-2">Payment</th><th></th></tr></thead>
        <tbody>{rows.map(o=>{ const meta=poMeta(o.status); const isFinalized=o.status!=='draft' && o.status!=='cancelled'; const isPaid=o.payment_status==='paid'; return (
          <tr key={o.id} className="border-t hover:bg-slate-50 cursor-pointer" onClick={()=>setEditing(o)}>
            <td className="px-3 py-2 font-mono text-xs">{o.number||o.id.slice(0,6)}</td>
            <td className="px-3 py-2 text-xs">{fmtDate(o.date)}</td>
            <td className="px-3 py-2">{suppName(o.supplier_id)}</td>
            <td className="px-3 py-2 text-right">{(o.lines||[]).length}</td>
            <td className="px-3 py-2 text-right font-semibold">{peso(o.total)}</td>
            <td className="px-3 py-2"><span className={`text-xs px-2 py-1 rounded font-medium ${meta.color}`}>{meta.label}</span></td>
            <td className="px-3 py-2">
              {isFinalized ? (
                isPaid
                  ? <span className="text-xs px-2 py-1 rounded font-semibold bg-emerald-100 text-emerald-700">✅ Paid</span>
                  : <span className="text-xs px-2 py-1 rounded font-semibold bg-rose-100 text-rose-700">⏳ Unpaid</span>
              ) : <span className="text-xs text-slate-300">—</span>}
            </td>
            <td className="px-3 py-2 text-right whitespace-nowrap"><button onClick={(e)=>{e.stopPropagation(); setPrinting(o);}} className="text-xs text-slate-500 hover:text-slate-800 mr-2" title="Print preview">🖨</button><button onClick={(e)=>{e.stopPropagation(); setEditing(o);}} className="text-xs text-indigo-600 hover:underline mr-2">Open</button>{(o.status==='open'||o.status==='partial') && <button onClick={(e)=>{e.stopPropagation(); setReceiving(o);}} className="text-xs text-emerald-600 hover:underline">↓ Receive</button>}</td>
          </tr>
        ); })}{rows.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No purchase orders yet. Click "+ New PO" or convert an approved PR.</td></tr>}</tbody>
      </table></div></div>
      {(creating||editing) && <PurchaseOrderForm profile={profile} profiles={profiles} allOrders={orders} existing={editing} fromPR={creating?openFromPR:null} items={items} suppliers={suppliers} onClose={()=>{ setCreating(false); setEditing(null); onClearPR&&onClearPR(); }} onSaved={()=>{ setCreating(false); setEditing(null); onClearPR&&onClearPR(); reload(); }} onPrint={(po)=>setPrinting(po)} />}
      {receiving && <PurchaseOrderReceive po={receiving} items={items} profile={profile} onClose={()=>setReceiving(null)} onSaved={()=>{ setReceiving(null); reload(); }} />}
      {printing && <POPrintView po={printing} suppliers={suppliers} profile={profile} profiles={profiles} onClose={()=>setPrinting(null)} />}
    </div>
  );
}

// Payment methods supported on POs. Each one drives a different conditional
// "detail" input below the dropdown (check #, gcash #, etc.).
const PO_PAYMENT_METHODS = [
  { key:'',              label:'— Select —' },
  { key:'check',         label:'Check' },
  { key:'bank_transfer', label:'Bank Transfer' },
  { key:'cash',          label:'Cash' },
  { key:'gcash',         label:'GCash' },
  { key:'others',        label:'Others' },
];
function PurchaseOrderForm({ profile, profiles, allOrders, existing, fromPR, items, suppliers, onClose, onSaved, onPrint }){
  const isEdit=!!existing;
  const initLines = isEdit ? (existing.lines||[]) : (fromPR ? (fromPR.lines||[]).map(l=>({ item_id:l.item_id||null, description:l.description||'', qty:Number(l.qty)||1, qty_received:0, unit_cost:Number(l.est_cost)||0 })) : [{ item_id:null, description:'', qty:1, qty_received:0, unit_cost:0 }]);
  const [f,setF]=useState({
    date: isEdit?existing.date:new Date().toISOString().slice(0,10),
    supplier_id: isEdit?existing.supplier_id:null,
    pr_id: isEdit?existing.pr_id:(fromPR?fromPR.id:null),
    status: isEdit?existing.status:'draft',
    notes: isEdit?existing.notes:'',
    lines: initLines,
    payment_method: isEdit?(existing.payment_method||''):'',
    payment_method_detail: isEdit?(existing.payment_method_detail||''):'',
    payment_terms: isEdit?(existing.payment_terms||''):'',
    vat_enabled: isEdit?!!existing.vat_enabled:false,
    withholding_tax_enabled: isEdit?!!existing.withholding_tax_enabled:false,
    withholding_tax_rate: isEdit?(Number(existing.withholding_tax_rate)||2):2,
  });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  // Determines whether the user can still tweak qty/lines. Drafts are fully
  // editable; once finalized (Placed/Partial/Received/Cancelled) the lines lock.
  const locked = isEdit && existing.status !== 'draft';
  const finalizedBy = existing && existing.finalized_by ? (profiles||[]).find(p=>p.id===existing.finalized_by) : null;
  function up(k,v){ if(locked && !['payment_method','payment_method_detail','payment_terms','vat_enabled','withholding_tax_enabled','withholding_tax_rate'].includes(k)) return; setF(p=>({...p,[k]:v})); }
  function setLine(i,patch){ if(locked) return; setF(p=>({...p,lines:p.lines.map((l,j)=>j===i?{...l,...patch}:l)})); }
  function addLine(){ if(locked) return; setF(p=>({...p,lines:[...p.lines,{item_id:null, description:'', qty:1, qty_received:0, unit_cost:0}]})); }
  function removeLine(i){ if(locked) return; setF(p=>({...p,lines:p.lines.filter((_,j)=>j!==i)})); }
  // Total math:
  //   subtotal     = Σ qty × unit_cost
  //   VAT 12%      = subtotal × 0.12 (only if vat_enabled)
  //   gross        = subtotal + VAT  ← this is what we OWE the supplier on the invoice
  //   WHT          = subtotal × WHT% (only if withholding_tax_enabled). PH expanded WHT
  //                  is computed on the VAT-exclusive amount (i.e. the subtotal), and we
  //                  deduct it from what we pay the supplier (we remit it to BIR instead).
  //   net payable  = gross − WHT  ← this is what we ACTUALLY pay the supplier
  const subtotal = f.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unit_cost)||0),0);
  const vatAmount = f.vat_enabled ? subtotal * 0.12 : 0;
  const gross = subtotal + vatAmount;
  const whtAmount = f.withholding_tax_enabled ? subtotal * (Number(f.withholding_tax_rate)||0)/100 : 0;
  const netPayable = gross - whtAmount;
  const total = gross; // PO "total" we save = the gross (what the supplier invoices)
  // Auto-pull supplier's saved bank info + payment terms when the user picks
  // a supplier. The bank rows display read-only inside the Bank Transfer panel.
  const supplier = (suppliers||[]).find(s=>s.id===f.supplier_id);
  useEffect(()=>{
    if(!supplier) return;
    // Only auto-fill payment_terms if user hasn't typed one yet — don't clobber edits.
    if(!f.payment_terms && supplier.payment_terms){ setF(p=>({...p, payment_terms: supplier.payment_terms })); }
  // eslint-disable-next-line
  },[f.supplier_id]);
  // Save without finalizing — stays in current status (draft drafts stay draft).
  async function saveDraft(){
    if(!f.supplier_id){ setMsg('Pick a supplier.'); return; }
    if(!f.lines.length){ setMsg('Add at least one line.'); return; }
    setBusy(true); setMsg('');
    const payload={ date:f.date, supplier_id:f.supplier_id, pr_id:f.pr_id||null, status:f.status, notes:f.notes||'', total, lines:f.lines,
      payment_method:f.payment_method||null, payment_method_detail:f.payment_method_detail||null, payment_terms:f.payment_terms||null,
      vat_enabled:!!f.vat_enabled, withholding_tax_enabled:!!f.withholding_tax_enabled, withholding_tax_rate:Number(f.withholding_tax_rate)||0 };
    if(!isEdit) payload.number = nextPONumber(allOrders, f.date);
    const { data, error } = isEdit ? await sb.from('purchase_orders').update(payload).eq('id',existing.id).select().single() : await sb.from('purchase_orders').insert(payload).select().single();
    if(error){ setBusy(false); setMsg(error.message); return; }
    if(!isEdit && fromPR){ await sb.from('purchase_requests').update({ status:'ordered', linked_po_id: data.id }).eq('id', fromPR.id); }
    setBusy(false); onSaved();
  }
  // Finalize: locks the PO. Status moves to 'open' (Placed), stamps
  // finalized_at + finalized_by, and the line items become read-only.
  async function finalize(){
    if(!f.supplier_id){ setMsg('Pick a supplier.'); return; }
    if(!f.lines.length){ setMsg('Add at least one line.'); return; }
    if(!confirm('Finalize this PO?\n\nOnce finalized:\n• Lines are locked for editing\n• The total goes to finance\n• Use the Receive button later to record deliveries\n\nMake sure quantities match what you actually bought.')) return;
    setBusy(true); setMsg('');
    const payload={ date:f.date, supplier_id:f.supplier_id, pr_id:f.pr_id||null, status:'open', notes:f.notes||'', total, lines:f.lines, finalized_at: new Date().toISOString(), finalized_by: profile.id,
      payment_method:f.payment_method||null, payment_method_detail:f.payment_method_detail||null, payment_terms:f.payment_terms||null,
      vat_enabled:!!f.vat_enabled, withholding_tax_enabled:!!f.withholding_tax_enabled, withholding_tax_rate:Number(f.withholding_tax_rate)||0,
      payment_status: existing?.payment_status || 'unpaid' };
    if(!isEdit) payload.number = nextPONumber(allOrders, f.date);
    const { data, error } = isEdit ? await sb.from('purchase_orders').update(payload).eq('id',existing.id).select().single() : await sb.from('purchase_orders').insert(payload).select().single();
    if(error){ setBusy(false); setMsg(error.message); return; }
    if(!isEdit && fromPR){ await sb.from('purchase_requests').update({ status:'ordered', linked_po_id: data.id }).eq('id', fromPR.id); }
    setBusy(false); onSaved();
  }
  // Mark a finalized PO as Paid / Unpaid. Stamps actor + timestamp. Visible
  // only after the PO is finalized so we don't track payments on drafts.
  async function markPaid(){
    if(!isEdit) return;
    if(!confirm(`Mark this PO as PAID?\n\nNet payable: ${peso(netPayable)}\nMethod: ${f.payment_method||'(unspecified)'}\n\nFinance will see this immediately on the PO list.`)) return;
    setBusy(true);
    const { error } = await sb.from('purchase_orders').update({ payment_status:'paid', paid_at:new Date().toISOString(), paid_by:profile.id, amount_paid:netPayable }).eq('id', existing.id);
    setBusy(false);
    if(error){ setMsg(error.message); return; }
    onSaved();
  }
  async function markUnpaid(){
    if(!isEdit) return;
    if(!confirm('Mark this PO back to UNPAID?\n\nThis clears the paid date and who marked it paid.')) return;
    setBusy(true);
    const { error } = await sb.from('purchase_orders').update({ payment_status:'unpaid', paid_at:null, paid_by:null, amount_paid:null }).eq('id', existing.id);
    setBusy(false);
    if(error){ setMsg(error.message); return; }
    onSaved();
  }
  // "Request for Payment" — sends the finalized PO to Finance for processing.
  // Creates an RFP row in status 'pending_finance', stamps the PO with rfp_id
  // so we don't double-request. Finance picks it up from the RFP queue, then
  // it flows: Finance approves → Admin (Kaira) approves → Finance disburses CV.
  async function requestPayment(){
    if(!isEdit) return;
    if(existing.rfp_id){ setMsg('This PO already has a Request for Payment. Check the RFP queue.'); return; }
    if(!confirm(`Send this PO to Finance for payment processing?\n\nAmount: ${peso(netPayable)}\nSupplier: ${supplier?.company||'(none)'}\n\nFinance will review, then Admin (Kaira) approves, then Finance creates the Check/Cash Voucher.`)) return;
    setBusy(true); setMsg('');
    try {
      const today = new Date().toISOString().slice(0,10);
      const monthKey = today.slice(0,7);
      const { data: monthRows } = await sb.from('rfps').select('id,number').like('number', `RFP-${monthKey}-%`);
      const seq = String((monthRows?.length||0)+1).padStart(3,'0');
      const number = `RFP-${monthKey}-${seq}`;
      const particulars = `Payment for PO ${existing.number||''} · ${f.lines.map(l=>l.description||'').filter(Boolean).slice(0,3).join(', ')}`;
      const { data: rfpData, error: rErr } = await sb.from('rfps').insert({
        number, date: today, po_id: existing.id,
        supplier_id: existing.supplier_id, supplier_name: supplier?.company||'',
        amount: netPayable, particulars,
        payment_method: f.payment_method||null, payment_method_detail: f.payment_method_detail||null,
        payment_terms: f.payment_terms||null,
        status: 'pending_finance', requested_by: profile.id,
      }).select().single();
      if(rErr) throw rErr;
      // Stamp PO with rfp_id
      await sb.from('purchase_orders').update({ rfp_id: rfpData.id }).eq('id', existing.id);
      setBusy(false);
      alert(`✅ ${number} created and sent to Finance. They'll process the Check/Cash Voucher after Admin approval.`);
      onSaved();
    } catch(e){ setBusy(false); setMsg(e.message||String(e)); }
  }
  // Reopen an already-finalized PO back to draft (admin / purchaser only).
  // Stamps audit info clear so the next finalize is a fresh action.
  async function reopen(){
    if(!isEdit) return;
    if(!confirm('Reopen this PO as a draft?\n\nThe lines will become editable again. Use this if you need to correct what was finalized.')) return;
    setBusy(true);
    const { error } = await sb.from('purchase_orders').update({ status:'draft', finalized_at:null, finalized_by:null }).eq('id', existing.id);
    setBusy(false); if(error){ setMsg(error.message); return; }
    onSaved();
  }
  const lineCount = f.lines.filter(l=>l.description||l.item_id).length;
  return (
    <Modal title={isEdit ? `PO ${existing.number||existing.id.slice(0,6)}` : 'New purchase order'} onClose={onClose} wide>
      <div className="space-y-3">
        {/* Status banner: tells the user immediately whether they're editing
            a Draft or looking at a finalized read-only PO. */}
        {!locked
          ? <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-xs text-amber-800 flex items-center justify-between"><span><strong>📝 Draft</strong> · Edit qty / lines freely. Click <strong>Finalize</strong> when this matches what you actually bought.</span>{isEdit && <span className="text-amber-600">Auto-numbered: {existing.number||'(on save)'}</span>}</div>
          : <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 text-xs text-emerald-800 flex items-center justify-between gap-2 flex-wrap">
              <span><strong>🔒 Finalized</strong> · Locked for line edits.{existing.finalized_at && <> Finalized {fmtTime(existing.finalized_at)}{finalizedBy?` by ${firstName(finalizedBy)}`:''}.</>}</span>
              <button onClick={reopen} className="text-xs text-emerald-700 hover:underline font-semibold">↺ Reopen as draft</button>
            </div>
        }

        <div className="grid grid-cols-3 gap-2">
          <TpLbl t="Purchasing date"><input type="date" className="input" value={f.date} onChange={e=>up('date',e.target.value)} disabled={locked} /></TpLbl>
          <TpLbl t="Supplier *"><select className="input" value={f.supplier_id||''} onChange={e=>up('supplier_id',e.target.value||null)} disabled={locked}><option value="">—</option>{suppliers.map(s=><option key={s.id} value={s.id}>{s.company}</option>)}</select></TpLbl>
          <TpLbl t="Status"><select className="input" value={f.status} onChange={e=>up('status',e.target.value)}>{PO_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></TpLbl>
        </div>

        <div className={`border rounded-lg p-3 ${locked?'bg-slate-100':'bg-slate-50'}`}>
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-slate-700">Line items {lineCount>0 && <span className="text-slate-400 font-normal">· {lineCount} line{lineCount===1?'':'s'}</span>}</div>
            {!locked && <button onClick={addLine} className="text-xs text-indigo-600 font-semibold">+ Add line</button>}
          </div>
          <div className="space-y-2">{f.lines.map((l,i)=>(
            <div key={i} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-end">
              <div className="col-span-4"><label className="text-[10px] text-slate-500 uppercase">Inventory item</label><select className="input mt-0.5 text-xs" value={l.item_id||''} disabled={locked} onChange={e=>{ const it=items.find(x=>x.id===e.target.value); setLine(i,{ item_id:e.target.value||null, description:it?.name||l.description, unit_cost:l.unit_cost||it?.cost||0 }); }}><option value="">— optional —</option>{items.map(it=><option key={it.id} value={it.id}>{it.name}{it.sku?' · '+it.sku:''}</option>)}</select></div>
              <div className="col-span-3"><label className="text-[10px] text-slate-500 uppercase">Description</label><input className="input mt-0.5 text-xs" value={l.description} onChange={e=>setLine(i,{description:e.target.value})} disabled={locked} /></div>
              <div className="col-span-1"><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5 text-xs" value={l.qty} onChange={e=>setLine(i,{qty:e.target.value})} disabled={locked} /></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Unit ₱</label><input type="number" className="input mt-0.5 text-xs" value={l.unit_cost} onChange={e=>setLine(i,{unit_cost:e.target.value})} disabled={locked} /></div>
              <div className="col-span-1 text-right text-xs"><div className="text-[10px] uppercase text-slate-500">Total</div><div className="font-semibold">{peso(Number(l.qty||0)*Number(l.unit_cost||0))}</div></div>
              <div className="col-span-1 text-right">{!locked && <button onClick={()=>removeLine(i)} className="text-rose-400 text-sm">✕</button>}</div>
            </div>
          ))}</div>

          {/* Totals breakdown — subtotal, optional VAT, optional withholding tax, net payable */}
          <div className="mt-3 bg-white border rounded p-3 max-w-md ml-auto text-sm">
            <div className="flex justify-between py-0.5"><span className="text-slate-500">Subtotal</span><span className="font-semibold">{peso(subtotal)}</span></div>
            <div className="flex items-center justify-between py-0.5">
              <label className="flex items-center gap-2 text-slate-500 cursor-pointer">
                <input type="checkbox" checked={!!f.vat_enabled} onChange={e=>up('vat_enabled', e.target.checked)} />
                <span>+ VAT 12% <span className="text-[10px] text-slate-400">(supplier adds VAT)</span></span>
              </label>
              <span className={f.vat_enabled?'font-semibold':'text-slate-300'}>{peso(vatAmount)}</span>
            </div>
            <div className="flex justify-between py-0.5 border-t mt-1 pt-1"><span className="text-slate-700 font-medium">Gross (supplier invoice)</span><span className="font-bold">{peso(gross)}</span></div>
            <div className="flex items-center justify-between py-0.5">
              <label className="flex items-center gap-2 text-slate-500 cursor-pointer">
                <input type="checkbox" checked={!!f.withholding_tax_enabled} onChange={e=>up('withholding_tax_enabled', e.target.checked)} />
                <span>− Withholding tax</span>
                <input type="number" step="0.1" className="input text-xs w-14 py-0.5 px-1 inline-block" disabled={!f.withholding_tax_enabled} value={f.withholding_tax_rate} onChange={e=>up('withholding_tax_rate', e.target.value)} />
                <span className="text-[10px] text-slate-400">%</span>
              </label>

function PurchaseOrderReceive({ po, items, profile, onClose, onSaved }){
  const [rec,setRec]=useState((po.lines||[]).map(l=>({ ...l, receive_now:0 })));
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(i,v){ setRec(rec.map((r,j)=>j===i?{...r,receive_now:v}:r)); }
  async function save(){ const toPost=rec.filter(r=>Number(r.receive_now)>0); if(!toPost.length){ setMsg('Enter at least one quantity to receive.'); return; } setBusy(true); setMsg('');
    try{
      for(const r of toPost){
        // Update inventory qty (if linked)
        if(r.item_id){
          const it=items.find(x=>x.id===r.item_id); const newQty=Number(it?.qty||0)+Number(r.receive_now);
          const {error}=await sb.from('items').update({ qty:newQty }).eq('id',r.item_id); if(error) throw error;
        }
        // Stock movement
        await sb.from('stock_movements').insert({ item_id:r.item_id||null, type:'in', qty:Number(r.receive_now), reason:'PO receive', ref_type:'po', ref_id:po.id, actor_id:profile.id });
      }
      // Update PO lines + status
      const newLines=rec.map(r=>({ ...r, qty_received:(Number(r.qty_received)||0)+Number(r.receive_now||0), receive_now:undefined }));
      const fully=newLines.every(l=>Number(l.qty_received||0)>=Number(l.qty||0));
      const any=newLines.some(l=>Number(l.qty_received||0)>0);
      const status = fully?'received':(any?'partial':'open');
      const {error}=await sb.from('purchase_orders').update({ lines:newLines.map(({receive_now,...rest})=>rest), status, received_at: fully?new Date().toISOString().slice(0,10):po.received_at }).eq('id',po.id); if(error) throw error;
      onSaved();
    } catch(err){ setBusy(false); setMsg(err.message||String(err)); }
  }
  return (
    <Modal title={`Receive PO ${po.number||''}`} onClose={onClose} wide>
      <div className="space-y-3">
        <div className="text-xs text-slate-500">Enter the qty received for each line. Received items add to Inventory and log a stock movement.</div>
        <div className="bg-white border rounded-lg overflow-hidden"><table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Ordered</th><th className="text-right px-3 py-2">Already received</th><th className="text-right px-3 py-2">Receive now</th></tr></thead>
          <tbody>{rec.map((r,i)=>{ const it=items.find(x=>x.id===r.item_id); const remaining=Number(r.qty||0)-Number(r.qty_received||0); return (
            <tr key={i} className="border-t">
              <td className="px-3 py-2">{it?.name||r.description}{r.item_id ? '' : <span className="text-[10px] text-amber-600 ml-1">(no inventory link)</span>}</td>
              <td className="px-3 py-2 text-right">{r.qty}</td>
              <td className="px-3 py-2 text-right">{r.qty_received||0}</td>
              <td className="px-3 py-2 text-right"><input type="number" min="0" max={remaining} className="input text-xs text-right w-24" value={r.receive_now} onChange={e=>up(i,e.target.value)} /></td>
            </tr>
          ); })}</tbody>
        </table></div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button onClick={save} disabled={busy} className="w-full py-2 rounded-lg bg-emerald-600 text-white font-semibold disabled:opacity-50">{busy?'Posting…':'Confirm receive'}</button>
      </div>
    </Modal>
  );
}

/* ====================== FINANCE MODULE — Sprint 1 ====================== */
// All the finance views live here. Sprint 1 ships:
//   • Sales Orders & Collections (with QB invoice linkage)
//   • Customer Ledger (per-client AR)
//   • Bank Accounts (4 banks with running balance)
//   • RFP queue (Purchasing → Finance → Admin → Pay)
//   • Check / Cash Vouchers (Finance disburses)
//
// All views are admin/accounting/purchasing-aware. The bank picker on payments
// is the glue that keeps bank balances honest — every payment in/out records a
// matching bank_transactions row, so each bank's balance is always the sum of
// its txns plus opening balance.

// Date-based numbering for finance documents. Format: PREFIX-YYYY-MM-NNN where
// NNN is the next sequential number within the same month.
function nextFinanceNumber(rows, prefix, monthKey){
  const sameMonth = (rows||[]).filter(r => (r.number||'').startsWith(prefix+'-'+monthKey+'-'));
  const n = sameMonth.length + 1;
  return `${prefix}-${monthKey}-${String(n).padStart(3,'0')}`;
}
function ymdToMonthKey(d){ const x = d ? new Date(d) : new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); }

// Compute running balance for a bank account from opening + all in/out txns.
function bankBalance(bank, txns){
  const opening = Number(bank?.opening_balance)||0;
  return (txns||[]).filter(t=>t.bank_id===bank.id).reduce((s,t)=>{
    const amt = Number(t.amount)||0;
    return s + (t.direction==='in' ? amt : -amt);
  }, opening);
}

// SO totals helper — sums of SO.balance_due and sum of all unpaid balances
function soOpen(sos){ return (sos||[]).filter(s=>s.status!=='paid' && s.status!=='cancelled'); }

function SalesOrderPaymentModal({ so, profile, bankAccounts, onClose, onSaved }){
  const [f,setF]=useState({
    date: new Date().toISOString().slice(0,10),
    amount: so.balance_due || 0,
    method: 'bank_transfer',
    bank_id: bankAccounts[0]?.id||null,
    reference: '',
    notes: '',
  });
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  async function save(){
    const amt = Number(f.amount)||0;
    if(amt<=0){ setMsg('Enter a payment amount.'); return; }
    if(amt > Number(so.balance_due||0) + 0.01){ if(!confirm(`Amount (${peso(amt)}) is more than the balance due (${peso(so.balance_due)}). Save anyway?`)) return; }
    if(f.method!=='cash' && !f.bank_id){ setMsg('Pick a bank.'); return; }
    setBusy(true); setMsg('');
    try {
      // 1. Create bank_transaction (if not cash)
      let bankTxId = null;
      if(f.method !== 'cash' && f.bank_id){
        const { data: btx, error: btErr } = await sb.from('bank_transactions').insert({
          bank_id: f.bank_id, date: f.date, direction: 'in', amount: amt,
          description: `Payment from ${so.client_name||''} for ${so.number}`,
          ref_type: 'sales_order', ref_id: so.id,
          reference_number: f.reference||null, created_by: profile.id,
        }).select('id').single();
        if(btErr) throw btErr;
        bankTxId = btx.id;
      }
      // 2. Create the SO payment row
      const { error: pErr } = await sb.from('sales_order_payments').insert({
        sales_order_id: so.id, date: f.date, amount: amt,
        method: f.method, bank_id: (f.method==='cash'?null:f.bank_id),
        reference: f.reference||null, notes: f.notes||null,
        bank_transaction_id: bankTxId, received_by: profile.id,
      });
      if(pErr) throw pErr;
      // 3. Update SO totals
      const newPaid = Number(so.amount_paid||0) + amt;
      const newBal = Number(so.total||0) - newPaid;
      const newStatus = newBal <= 0.01 ? 'paid' : (newPaid > 0.01 ? 'partial' : 'open');
      const { error: uErr } = await sb.from('sales_orders').update({ amount_paid: newPaid, balance_due: Math.max(0,newBal), status: newStatus }).eq('id', so.id);
      if(uErr) throw uErr;
      setBusy(false); onSaved();
    } catch(e){ setBusy(false); setMsg(e.message||String(e)); }
  }
  return (
    <Modal title={`Record payment — ${so.number}`} onClose={onClose}>
      <div className="space-y-3">
        <div className="bg-amber-50 border border-amber-200 rounded p-2 text-xs text-amber-800">
          <strong>{so.client_name}</strong> · Total {peso(so.total)} · Already paid {peso(so.amount_paid)} · <strong className="text-rose-700">Balance due {peso(so.balance_due)}</strong>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <TpLbl t="Date received"><input type="date" className="input" value={f.date} onChange={e=>up('date',e.target.value)} /></TpLbl>
          <TpLbl t="Amount *"><input type="number" className="input" value={f.amount} onChange={e=>up('amount',e.target.value)} /></TpLbl>
          <TpLbl t="Method">
            <select className="input" value={f.method} onChange={e=>up('method',e.target.value)}>
              <option value="bank_transfer">Bank Transfer</option>
              <option value="check">Check</option>
              <option value="cash">Cash</option>
              <option value="gcash">GCash</option>
              <option value="others">Others</option>
            </select>
          </TpLbl>
          <TpLbl t={`Bank ${f.method==='cash'?'(N/A for cash)':'*'}`}>
            <select className="input" value={f.bank_id||''} disabled={f.method==='cash'} onChange={e=>up('bank_id',e.target.value||null)}>
              <option value="">—</option>
              {bankAccounts.map(b => <option key={b.id} value={b.id}>{b.bank_name}</option>)}
            </select>
          </TpLbl>
        </div>
        <TpLbl t="Reference"><input className="input" placeholder={f.method==='check'?'Check #':f.method==='gcash'?'GCash ref #':'Deposit slip # / Ref #'} value={f.reference} onChange={e=>up('reference',e.target.value)} /></TpLbl>
        <TpLbl t="Notes"><textarea className="input min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></TpLbl>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button onClick={save} disabled={busy} className="w-full py-2 rounded-lg bg-emerald-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':'💰 Record payment'}</button>
      </div>
    </Modal>
  );
}


/* ─────────── CUSTOMER LEDGER ─────────── */
function CustomerLedgerView({ clients, salesOrders, soPayments }){
  const [search,setSearch]=useState('');
  const [openClient,setOpenClient]=useState(null);
  // Roll up per client: how many SOs, total invoiced, total paid, balance, last activity.
  const rows = (clients||[]).map(c => {
    const soForClient = salesOrders.filter(s => s.client_id===c.id && s.status!=='cancelled');
    const totalInvoiced = soForClient.reduce((s,o)=>s+Number(o.total||0), 0);
    const totalPaid = soForClient.reduce((s,o)=>s+Number(o.amount_paid||0), 0);
    const balance = totalInvoiced - totalPaid;
    const lastDate = soForClient.map(o=>o.date).sort().reverse()[0]||null;
    return { client: c, soCount: soForClient.length, totalInvoiced, totalPaid, balance, lastDate };
  }).filter(r => r.soCount>0 || r.balance!==0);
  const filtered = rows.filter(r => !search || (r.client.company||'').toLowerCase().includes(search.toLowerCase()));
  const sorted = filtered.sort((a,b)=>b.balance-a.balance);
  const totalAR = sorted.reduce((s,r)=>s+r.balance, 0);
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl font-bold">👥 Customer Ledger</h1>
            <p className="text-slate-500 text-sm">{sorted.length} client{sorted.length===1?'':'s'} with activity · Total AR: <strong className="text-rose-700">{peso(totalAR)}</strong></p>
          </div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search client…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
        </div>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Client</th><th className="text-right px-3 py-2">SOs</th><th className="text-right px-3 py-2">Total Invoiced</th><th className="text-right px-3 py-2">Total Paid</th><th className="text-right px-3 py-2">Balance</th><th className="text-left px-3 py-2">Last SO</th><th></th></tr></thead>
        <tbody>{sorted.map(r => (
          <tr key={r.client.id} className="border-t hover:bg-slate-50 cursor-pointer" onClick={()=>setOpenClient(r.client)}>
            <td className="px-3 py-2 font-medium">{r.client.company}</td>
            <td className="px-3 py-2 text-right">{r.soCount}</td>
            <td className="px-3 py-2 text-right">{peso(r.totalInvoiced)}</td>
            <td className="px-3 py-2 text-right text-emerald-700">{peso(r.totalPaid)}</td>
            <td className={`px-3 py-2 text-right font-bold ${r.balance>0.01?'text-rose-700':'text-emerald-700'}`}>{peso(r.balance)}</td>
            <td className="px-3 py-2 text-xs">{r.lastDate?fmtDate(r.lastDate):'—'}</td>
            <td className="px-3 py-2 text-right"><button onClick={(e)=>{e.stopPropagation(); setOpenClient(r.client);}} className="text-xs text-indigo-600 hover:underline">View ledger</button></td>
          </tr>
        ))}{sorted.length===0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">No client activity yet. SOs appear here once leads hit Closed Won.</td></tr>}</tbody>
      </table></div></div>
      {openClient && <CustomerLedgerDetailModal client={openClient} sos={salesOrders.filter(s=>s.client_id===openClient.id)} payments={soPayments.filter(p=>salesOrders.find(s=>s.id===p.sales_order_id && s.client_id===openClient.id))} onClose={()=>setOpenClient(null)} />}
    </div>
  );
}

function CustomerLedgerDetailModal({ client, sos, payments, onClose }){
  // Build a unified ledger: every SO (debit) and every payment (credit) sorted by date.
  const ledger = [];
  sos.filter(s=>s.status!=='cancelled').forEach(s => ledger.push({ date:s.date, type:'so', ref:s.number, debit:Number(s.total||0), credit:0, raw:s }));
  payments.forEach(p => { const s = sos.find(x=>x.id===p.sales_order_id); ledger.push({ date:p.date, type:'payment', ref:`Payment · ${s?.number||''}`, debit:0, credit:Number(p.amount||0), raw:p }); });
  ledger.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  // Running balance: + debit, − credit.
  let running = 0;
  const withRunning = ledger.map(row => { running += row.debit - row.credit; return { ...row, running }; });
  const totalDebit = ledger.reduce((s,r)=>s+r.debit,0);
  const totalCredit = ledger.reduce((s,r)=>s+r.credit,0);
  return (
    <Modal title={`Customer Ledger — ${client.company}`} onClose={onClose} xwide>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-2">
          <div className="bg-slate-50 border rounded p-2 text-center"><div className="text-[10px] uppercase text-slate-500">Total Invoiced</div><div className="font-bold">{peso(totalDebit)}</div></div>

              <td className="px-3 py-2 text-right">{r.debit?peso(r.debit):''}</td>
              <td className="px-3 py-2 text-right text-emerald-700">{r.credit?peso(r.credit):''}</td>

        </table></div></div>
