          <div className="flex gap-2 pt-2 border-t flex-wrap">
            {canEdit && <button onClick={onEdit} className="py-2 px-3 rounded-lg border text-sm hover:bg-slate-50">✎ Edit</button>}
            <button onClick={onOpenTechpack} className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 {lead.techpack?'Techpack':'Create techpack'}</button>
            <button onClick={onSendGraphic} className="py-2 px-3 rounded-lg bg-pink-600 text-white text-sm font-semibold hover:bg-pink-700">🎨 Send to Graphic</button>
            {lead.stage==='sampling' && <button onClick={onSendSampling} className="py-2 px-3 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">🧵 Send to Sampling</button>}
            {lead.stage==='sampling' && <button onClick={onSendPrinting} className="py-2 px-3 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700">🖨 Send to Printing</button>}
            {SOLD_STAGES.includes(lead.stage) && <button onClick={onSendProduction} className="py-2 px-3 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">⚙ Send to Production</button>}
            {SOLD_STAGES.includes(lead.stage) && <button onClick={onSendToPR} className="py-2 px-3 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">📝 Send to PR</button>}
            <button onClick={onClose} className="py-2 px-3 rounded-lg text-slate-500 text-sm hover:text-slate-800">Close</button>
          </div>
        </div>
        {/* Right: live activity */}
        <div className="md:col-span-2 border-l md:pl-5 -mr-2 md:-mr-0 min-h-0">
          <div className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3">💬 Activity{activityCount?` · ${activityCount}`:''}</div>
          <ThreadBody profile={profile} profiles={profiles} table="lead_activity" match={{ lead_id: lead.id }} scope={'activity/'+lead.id} titleText={lead.title} afterChange={reload} headerless embedded />
        </div>
      </div>
    </Modal>
  );
}

/* Read-only lead info shown to the Graphic Design / Printing teams when they
   click "Open lead" on a dept-board card.
   Deliberately omits the sales-side things:
     • NO value / VAT / lead source
     • NO lead-level attachments — only what's on this dept job (the files
       the sales team approved and forwarded)
     • NO lead-activity chat — only the dept job's own chat thread so the
       graphic/printing team can collaborate
     • NO edit / send-to-graphic / send-to-sampling buttons
   Buttons left: View techpack (if any) and Send to Printing (from graphic).
*/
function LeadInfoModal({ profile, profiles, lead, client, job, jobType, canSendToPrinting, onClose, onOpenTechpack, onSendToPrinting, reload }){
  const mgr = lead.manager_id ? (profiles||[]).find(p=>p.id===lead.manager_id) : null;
  const items = lead.items || [];
  // Editable state — attachments + notes live on the dept job (not the lead).
  // Graphic Design / Printing can add files, links, paste screenshots, and leave notes.
  const [atts,setAtts]=useState(()=>(job && Array.isArray(job.attachments)) ? job.attachments : []);
  const [note,setNote]=useState(()=>(job && job.notes) ? job.notes : '');
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  const [reading,setReading]=useState(false);
  const deptTable = jobType==='printing' ? 'printing_jobs' : 'graphic_design_jobs';
  const scope = job ? ('dept/'+job.id) : 'dept/new';

  async function addPhoto(e){
    const file = e.target.files && e.target.files[0]; if(!file) return;
    setReading(true); setMsg('');
    try{ const meta = await uploadFile(scope, file); setAtts(a=>[...a, meta]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); e.target.value=''; }
  }
  async function onPasteAtt(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault(); e.stopPropagation();
    setReading(true); setMsg('');
    try{ const meta = await uploadFile(scope, f); setAtts(a=>[...a, meta]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); }
  }
  function addLink(){
    const url=(prompt('Link URL:')||'').trim(); if(!url) return;
    const name=(prompt('Title (optional):')||url).trim();
    setAtts(a=>[...a, { type:'link', name, url }]);
  }
  function removeAtt(idx){ if(!confirm('Remove this attachment?')) return; setAtts(a=>a.filter((_,i)=>i!==idx)); }
  async function save(){
    if(!job){ setMsg('No job to save to.'); return; }
    setBusy(true); setMsg('');
    const { error } = await sb.from(deptTable).update({ attachments: atts, notes: note }).eq('id', job.id);
    setBusy(false);
    if(error){ setMsg('Save failed: '+(error.message||error)); return; }
    reload && reload();
    setMsg('Saved.');
    setTimeout(()=>setMsg(''), 2000);
  }
  const dirty = job ? (JSON.stringify(atts)!==JSON.stringify(job.attachments||[]) || note!==(job.notes||'')) : false;

  return (
    <Modal title="Lead info" onClose={onClose} xwide>
      <div className="grid md:grid-cols-5 gap-5" onPaste={onPasteAtt}>
        {/* Left: order info (3/5) */}
        <div className="md:col-span-3 space-y-4">
          <div>
            <div className="text-lg font-bold truncate" title={lead.title}>{lead.title||'—'}</div>
            <div className="text-sm text-slate-500 truncate">{client?.company||lead.client_name||'—'}</div>
          </div>
          <div className="grid grid-cols-2 gap-3 text-sm">
            <div><div className="text-[10px] uppercase text-slate-400">Sales Manager</div><div>{mgr ? (mgr.name||mgr.email) : '—'}</div></div>
            <div><div className="text-[10px] uppercase text-slate-400">Techpack No.</div><div>{lead.techpack_number||'—'}</div></div>
            <div><div className="text-[10px] uppercase text-slate-400">Due Date</div><div>{fmtDate(lead.expected_close)||'—'}</div></div>
            <div><div className="text-[10px] uppercase text-slate-400">Sample Due Date</div><div>{fmtDate(lead.delivery_date)||'—'}</div></div>
          </div>
          {items.length>0 && (
            <div>
              <div className="text-[10px] uppercase text-slate-400 mb-1">Items</div>
              <div className="border rounded-lg divide-y">
                {items.map((it,i)=>(
                  <div key={i} className="flex justify-between px-3 py-1.5 text-sm">
                    <span>{it.itemType||'—'}{it.category?` · ${it.category}`:''}</span>
                    <span className="font-medium">{it.quantity||0} pcs</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {/* Editable attachments — files the dept team can add to this job */}
          <div className="border rounded-lg p-3 bg-slate-50">
            <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
              <div className="text-[10px] uppercase text-slate-500 font-semibold">Attachments {atts.length>0?`(${atts.length})`:''}</div>
              {job && (
                <div className="flex items-center gap-1">
                  <label className="text-xs px-2 py-1 rounded border bg-white cursor-pointer hover:bg-slate-50">📎 {reading?'Uploading…':'Photo / PDF'}<input type="file" accept="image/*,.pdf,application/pdf" className="hidden" onChange={addPhoto} disabled={reading} /></label>
                  <button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50">🔗 Link</button>
                  <span className="text-[10px] text-slate-400 ml-1">or paste ⌘V</span>
                </div>
              )}
            </div>
            {atts.length===0 ? (
              <div className="text-xs text-slate-400 italic">No files yet. Sales team may not have forwarded anything — you can add files here.</div>
            ) : (
              <div className="flex flex-wrap gap-2">
                {atts.map((a,i)=>(
                  <div key={i} className="relative group">
                    <AttachmentChip att={a} small />
                    {job && <button onClick={()=>removeAtt(i)} title="Remove" className="absolute -top-1 -right-1 bg-rose-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] opacity-0 group-hover:opacity-100 transition">✕</button>}
                  </div>
                ))}
              </div>
            )}
          </div>
          {/* Editable notes */}
          <div>
            <div className="text-[10px] uppercase text-slate-500 font-semibold mb-1">📝 Notes</div>
            <textarea className="input min-h-[80px]" value={note} onChange={e=>setNote(e.target.value)} placeholder={job ? "Add notes about this job — colour codes, special instructions, fabric concerns, etc." : "Open the job from your board to add notes."} disabled={!job} />
          </div>
          {msg && <div className={`text-xs ${/fail|error/i.test(msg)?'text-rose-600':'text-emerald-600'}`}>{msg}</div>}
          <div className="flex flex-wrap gap-2 pt-3 border-t">
            {job && <button disabled={busy||!dirty} onClick={save} className="py-2 px-3 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">{busy?'Saving…':(dirty?'💾 Save changes':'✓ Saved')}</button>}
            {lead.techpack && onOpenTechpack && <button onClick={()=>{ onClose(); onOpenTechpack(lead); }} className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 View techpack</button>}
            {canSendToPrinting && job && onSendToPrinting && <button onClick={async ()=>{
              // Persist any pending attachments / notes to the dept job first so
              // the printing card receives the LATEST state, not stale data.
              if(dirty){
                setBusy(true); setMsg('');
                const { error } = await sb.from(deptTable).update({ attachments: atts, notes: note }).eq('id', job.id);
                setBusy(false);
                if(error){ setMsg('Save failed before sending: '+(error.message||error)); return; }
              }
              await onSendToPrinting({ ...job, attachments: atts, notes: note });
              onClose();
            }} className="py-2 px-3 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700">🖨 Send to Printing</button>}
            <button onClick={onClose} className="py-2 px-3 rounded-lg text-slate-500 text-sm hover:text-slate-800">Close</button>
          </div>
        </div>
        {/* Right: dept-team conversation (2/5) */}
        <div className="md:col-span-2 border-l md:pl-5 -mr-2 md:-mr-0 min-h-0">
          <div className="mb-3">
            <div className="text-xs uppercase tracking-wider text-slate-500 font-semibold">💬 Team conversation</div>
            <div className="text-[10px] text-slate-400 mt-0.5">Chat with your team — the sales pipeline chat is not shown here.</div>
          </div>
          {job ? (
            <ThreadBody profile={profile} profiles={profiles} table="dept_job_activity" match={{ job_id: job.id, job_type: jobType }} scope={'dept/'+job.id} titleText={`${job.item||lead.title} · ${job.client_name||client?.company||''}`} afterChange={reload} headerless embedded />
          ) : (
            <div className="text-xs text-slate-400 italic p-4 border rounded-lg">No team conversation available — this lead isn't linked to a current graphic/printing job.</div>
          )}
        </div>
      </div>
    </Modal>
  );
}

/* ----------------------- Dept job form ----------------------- */
function DeptJobForm({ profile, table, statuses, graphicTypes, existing, onClose, onSaved }){
  const isEdit=!!existing;
  const [f,setF]=useState(existing?{ ...existing, attachments:existing.attachments||[] }:{ client_name:'', item:'', quantity:0, status:statuses[0].key, graphic_type:'', due_date:'', notes:'', attachments:[] });
  const [reading,setReading]=useState(false); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  async function addPhoto(e){ const file=e.target.files[0]; if(!file) return; setReading(true); setMsg('');
    try{ up('attachments',[...(f.attachments||[]), await uploadFile('dept/'+(existing?.id||'new'), file)]); } catch(err){ setMsg('Upload failed: '+(err.message||err)); } finally{ setReading(false); e.target.value=''; } }
  async function onPasteDept(e){
    const file = getPastedImage(e); if(!file) return;
    e.preventDefault();
    setReading(true); setMsg('');
    try{ up('attachments',[...(f.attachments||[]), await uploadFile('dept/'+(existing?.id||'new'), file)]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL:')||'').trim(); if(!url) return; const name=(prompt('Title (optional):')||url).trim(); up('attachments',[...(f.attachments||[]),{ type:'link', name, url }]); }
  function removeAtt(idx){ up('attachments',(f.attachments||[]).filter((_,i)=>i!==idx)); }
  async function save(){ if(!f.client_name&&!f.item){ setMsg('Client or item required.'); return; } setBusy(true); setMsg('');
    try{ const payload={ client_name:f.client_name, item:f.item, quantity:Number(f.quantity)||0, status:f.status, graphic_type:f.graphic_type||'', due_date:f.due_date||null, notes:f.notes||'', attachments:f.attachments||[] };
      if(isEdit){ const {error}=await sb.from(table).update(payload).eq('id',existing.id); if(error) throw error; }
      else { const {error}=await sb.from(table).insert({ ...payload, number:(table==='printing_jobs'?'PR-P-':'GD-')+Date.now().toString().slice(-5) }); if(error) throw error; }
      onSaved(); } catch(err){ setMsg(err.message||String(err)); setBusy(false); } }
  return (
    <Modal title={isEdit?'Edit job':'New job'} onClose={onClose}>
      <div className="space-y-3" onPaste={onPasteDept}>
        <div className="grid grid-cols-2 gap-2"><div><label className="text-[10px] text-slate-500 uppercase">Client</label><input className="input mt-0.5" value={f.client_name} onChange={e=>up('client_name',e.target.value)} /></div><div><label className="text-[10px] text-slate-500 uppercase">Item</label><input className="input mt-0.5" value={f.item} onChange={e=>up('item',e.target.value)} /></div></div>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5" value={f.quantity} onChange={e=>up('quantity',e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Due date</label><input type="date" className="input mt-0.5" value={f.due_date||''} onChange={e=>up('due_date',e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Status</label><select className="input mt-0.5" value={f.status} onChange={e=>up('status',e.target.value)}>{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></div>
        </div>
        {graphicTypes && (<div><label className="text-[10px] text-slate-500 uppercase">Graphic request</label><select className="input mt-0.5" value={f.graphic_type} onChange={e=>up('graphic_type',e.target.value)}><option value="">—</option>{graphicTypes.map(t=><option key={t} value={t}>{t}</option>)}</select></div>)}
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Attachments</div><div className="flex gap-1"><label className="text-xs px-2 py-1 rounded border bg-white cursor-pointer">📎 {reading?'…':'Photo / PDF'}<input type="file" accept="image/*,.pdf,application/pdf" className="hidden" onChange={addPhoto} disabled={reading} /></label><button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white">🔗 Link</button></div></div>
          {(f.attachments||[]).length===0?<div className="text-xs text-slate-400">No attachments.</div>:(<div className="grid grid-cols-3 gap-2">{f.attachments.map((a,i)=>(<div key={i} className="bg-white border rounded p-1.5 flex items-center gap-2"><span className="text-lg">{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="flex-1 min-w-0 text-xs truncate">{a.name}</span><button onClick={()=>removeAtt(i)} className="text-rose-400 text-xs">✕</button></div>))}</div>)}
        </div>
        <div><label className="text-[10px] text-slate-500 uppercase">Notes</label><textarea className="input mt-0.5 min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save':'Create')}</button>
      </div>
    </Modal>
  );
}

/* ----------------------- Dept board (Graphic / Printing) ----------------------- */
function DeptBoard({ profile, profiles, title, icon, table, jobType, statuses, doneStatuses, jobs, leads, graphicTypes, canSendToPrinting, reload, openActivity, openTechpack, openLead }){
  const [layout,setLayout]=useState('board'); const [editing,setEditing]=useState(null); const [creating,setCreating]=useState(false);
  const [detail,setDetail]=useState(null); const [search,setSearch]=useState('');
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  const canDelete = isAdmin || !isAssistant; // admin + managers
  const filtered=jobs.filter(j=>!search||`${j.number} ${j.client_name} ${j.item}`.toLowerCase().includes(search.toLowerCase()));
  async function move(j,st){ const {error}=await sb.from(table).update({ status:st }).eq('id',j.id); if(error){ alert(error.message); return; } reload(); }
  async function del(id){ if(!confirm('Send this job to Trash?\n\nIt\'ll be recoverable from Settings → Trash by the admin.')) return; const {error}=await sb.from(table).update({ deleted_at: new Date().toISOString(), deleted_by: profile.id }).eq('id',id); if(error){ alert(error.message); return; } reload(); }
  async function sendToPrinting(j){
    const atts = j.attachments||[];
    if(!confirm(`Send ${j.number||''} to Printing with ${atts.length} attachment${atts.length===1?'':'s'}?`)) return;
    const row = { number:'PR-P-'+Date.now().toString().slice(-5), source_job_id:j.id, lead_id:j.lead_id||null, client_name:j.client_name, item:j.item, items:j.items||[], quantity:j.quantity||0, graphic_type:j.graphic_type||'', attachments:atts, status:'to do', due_date:j.due_date||null, notes:j.notes||'' };
    const { data:inserted, error } = await sb.from('printing_jobs').insert(row).select('id,number').single();
    if(error){ console.error('Send-to-Printing failed:', error); alert('Could not send to Printing.\n\n'+(error.message||error)); return; }
    await reload();
    alert('Sent to Printing as '+(inserted?.number||j.number||'(new card)')+'. Switch to the Printing board to find it in the "To Do" column.');
  }
  // Mark a specific attachment as the cover image for the board card.
  // Stored as `is_cover: true` on the chosen attachment inside the same
  // JSON column — no schema change required. Only one cover per job.
  async function setCover(jobObj, attIndex){
    const next = (jobObj.attachments||[]).map((a,i)=>{ const copy={...a}; if(i===attIndex){ copy.is_cover=true; } else { delete copy.is_cover; } return copy; });
    const { error } = await sb.from(table).update({ attachments: next }).eq('id', jobObj.id);
    if(error){ alert('Could not set cover: '+error.message); return; }
    reload();
  }
  async function clearCover(jobObj){
    const next = (jobObj.attachments||[]).map(a=>{ const copy={...a}; delete copy.is_cover; return copy; });
    const { error } = await sb.from(table).update({ attachments: next }).eq('id', jobObj.id);
    if(error){ alert('Could not clear cover: '+error.message); return; }
    reload();
  }
  const liveDetail = detail ? (jobs.find(x=>x.id===detail.id)||detail) : null;
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">{icon} {title}</h1><p className="text-slate-500 text-sm">{jobs.length} job{jobs.length===1?'':'s'} · live</p></div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setLayout('board')} className={`px-3 py-1.5 rounded-md ${layout==='board'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>▦ Board</button><button onClick={()=>setLayout('table')} className={`px-3 py-1.5 rounded-md ${layout==='table'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>☰ Table</button></div>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-48" />
            <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 whitespace-nowrap">+ New</button>
          </div>
        </div>
      </div>

      {layout==='board' && (
        <div className="flex gap-3 overflow-x-auto pb-4">
          {statuses.map(st=>{ const col=filtered.filter(j=>j.status===st.key); return (
            <div key={st.key} className="flex-shrink-0 w-64">
              <div className={`rounded-t-lg px-3 py-2 text-xs font-bold ${st.color}`}>{st.label} <span className="opacity-70">({col.length})</span></div>
              <div className="bg-slate-200/60 rounded-b-lg p-2 space-y-2 min-h-[120px]">
                {col.map(j=>{ const img=pickCover(j.attachments); const di=deadlineInfo(j.due_date, doneStatuses.includes(j.status)); const lead=j.lead_id?(leads||[]).find(l=>l.id===j.lead_id):null; const hasTp=lead&&lead.techpack; return (
                  <div key={j.id} className="bg-white border rounded-lg shadow-sm overflow-hidden relative group">
                    {canDelete && (
                      <button
                        onClick={(e)=>{ e.stopPropagation(); del(j.id); }}
                        title="Delete this job"
                        className="absolute top-1.5 right-1.5 z-10 w-6 h-6 rounded-full bg-white border border-slate-200 text-slate-400 hover:bg-rose-500 hover:text-white hover:border-rose-500 text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow-sm"
                      >✕</button>
                    )}
                    {img ? <button onClick={()=>setDetail(j)} className="block w-full"><AttachmentChip att={img} /></button> : <button onClick={()=>setDetail(j)} className="w-full h-12 bg-slate-50 flex items-center justify-center text-slate-300 text-xl">🖼️</button>}
                    <div className="p-2">
                      <div className="font-semibold text-sm leading-tight">{j.item||'—'}</div>
                      <div className="text-xs text-slate-500 truncate">{j.client_name}</div>
                      <div className="flex items-center gap-1 mt-1 flex-wrap">
                        {j.graphic_type && <span className="inline-block text-[9px] uppercase px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 font-semibold">{j.graphic_type}</span>}
                        {hasTp && openTechpack && <button onClick={(e)=>{e.stopPropagation(); openTechpack(lead);}} className="inline-flex items-center gap-1 text-[9px] uppercase px-1.5 py-0.5 rounded bg-teal-100 text-teal-700 font-semibold hover:bg-teal-200" title={'View techpack '+(lead.techpack_number||'')}>📋 Techpack</button>}
                      </div>
                      <div className="flex items-center justify-between mt-1 text-[11px]"><span className="text-slate-600">{j.quantity?j.quantity+' pcs':''}{(j.attachments||[]).length?` · 📎${j.attachments.length}`:''}</span><span className={di.cls}>{di.label}</span></div>
                      <div className="flex items-center gap-1 mt-2">
                        <select value={j.status} onChange={e=>move(j,e.target.value)} className="text-[11px] border rounded px-1 py-0.5 flex-1 bg-slate-50">{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
                        {canSendToPrinting && <button onClick={()=>sendToPrinting(j)} title="Send to Printing" className="text-purple-600 text-xs px-1">🖨</button>}
                      </div>
                      {openLead && (
                        lead
                          ? <button onClick={(e)=>{e.stopPropagation(); openLead({ lead, job:j, jobType, canSendToPrinting });}} className="w-full mt-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium">Open lead</button>
                          : <div className="w-full mt-2 py-1.5 rounded-lg bg-slate-50 text-slate-300 text-xs font-medium text-center cursor-not-allowed" title="This job isn't linked to a sales lead">No linked lead</div>
                      )}
                    </div>
                  </div>
                ); })}
                {col.length===0 && <div className="text-[10px] text-slate-400 text-center py-3">—</div>}
              </div>
            </div>
          ); })}
        </div>
      )}

      {layout==='table' && (
        <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Ref</th><th className="text-left px-3 py-2">Client</th><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Qty</th><th className="text-left px-3 py-2">Status</th><th className="text-left px-3 py-2">Deadline</th><th></th></tr></thead>
          <tbody>{filtered.map(j=>{ const di=deadlineInfo(j.due_date, doneStatuses.includes(j.status)); const meta=metaFrom(statuses,j.status); const lead=j.lead_id?(leads||[]).find(l=>l.id===j.lead_id):null; return (
            <tr key={j.id} className={`border-t hover:bg-slate-50 ${di.overdue?'bg-rose-50/40':''}`}>
              <td className="px-3 py-2 font-mono text-xs">{j.number}</td><td className="px-3 py-2">{j.client_name}</td>
              <td className="px-3 py-2 font-medium">{j.item}{j.graphic_type && <span className="ml-1 text-[9px] uppercase px-1 py-0.5 rounded bg-indigo-100 text-indigo-700">{j.graphic_type}</span>}{(j.attachments||[]).length?<span className="text-[10px] text-slate-400"> 📎{j.attachments.length}</span>:''}</td>
              <td className="px-3 py-2 text-right">{j.quantity||'—'}</td>
              <td className="px-3 py-2"><select value={j.status} onChange={e=>move(j,e.target.value)} className={`text-xs px-2 py-1 rounded font-medium border-0 ${meta.color}`}>{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></td>
              <td className="px-3 py-2"><span className={`text-xs ${di.cls}`}>{di.label || (j.due_date ? fmtDate(j.due_date) : '—')}</span></td>
              <td className="px-3 py-2 text-right whitespace-nowrap">
                <button onClick={()=>setEditing(j)} className="text-xs text-indigo-600 hover:underline mr-2">Edit</button>
                {lead && openLead && <button onClick={()=>openLead({ lead, job:j, jobType, canSendToPrinting })} className="text-xs text-indigo-600 hover:underline mr-2">↗ Open lead</button>}
                {lead && lead.techpack && openTechpack && <button onClick={()=>openTechpack(lead)} className="text-xs text-teal-700 hover:underline mr-2">📋 Techpack</button>}
                {canSendToPrinting && <button onClick={()=>sendToPrinting(j)} className="text-xs text-purple-700 hover:underline mr-2">🖨 Printing</button>}
                {canDelete && <button onClick={()=>del(j.id)} className="text-xs text-rose-500 hover:underline">Delete</button>}
              </td>
            </tr>
          ); })}
          {filtered.length===0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">Nothing here yet. Click + New, or items arrive via Send-to handoffs.</td></tr>}
          </tbody></table></div></div>
      )}

      {(creating||editing) && <DeptJobForm profile={profile} table={table} statuses={statuses} graphicTypes={graphicTypes} existing={editing} onClose={()=>{ setCreating(false); setEditing(null); }} onSaved={()=>{ setCreating(false); setEditing(null); reload(); }} />}
      {liveDetail && (() => { const detailLead=liveDetail.lead_id?(leads||[]).find(l=>l.id===liveDetail.lead_id):null; const hasTechpack=detailLead && detailLead.techpack; const statusMeta=metaFrom(statuses,liveDetail.status); return (
        <Modal title={`${title} — ${liveDetail.number||''}`} onClose={()=>setDetail(null)} xwide>
          <div className="grid md:grid-cols-5 gap-5">
            {/* Left: job info + actions (3 cols) */}
            <div className="md:col-span-3 space-y-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-lg font-bold truncate">{liveDetail.item||'—'}</div>
                  <div className="text-sm text-slate-500 truncate">{liveDetail.client_name||'—'}</div>
                </div>
                <span className={`text-xs px-2 py-1 rounded font-medium ${statusMeta.color}`}>{statusMeta.label}</span>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm">
                <div><div className="text-[10px] uppercase text-slate-400">Qty</div><div>{liveDetail.quantity||'—'}</div></div>
                <div><div className="text-[10px] uppercase text-slate-400">Deadline</div><div>{fmtDate(liveDetail.due_date)||'—'}</div></div>
                {liveDetail.graphic_type && <div><div className="text-[10px] uppercase text-slate-400">Graphic request</div><div>{liveDetail.graphic_type}</div></div>}
                <div><div className="text-[10px] uppercase text-slate-400">Ref</div><div className="font-mono text-xs">{liveDetail.number||'—'}</div></div>
              </div>
              {/* Techpack section */}
              {openTechpack && (
                <div className={`border rounded-lg p-3 ${hasTechpack?'bg-teal-50 border-teal-200':'bg-slate-50 border-slate-200'}`}>
                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-[10px] uppercase text-slate-400">Techpack</div>
                      {detailLead ? (
                        hasTechpack ? (
                          <div className="text-sm font-semibold text-teal-700 mt-0.5">📋 {detailLead.techpack_number||'Techpack ready'} · {detailLead.title}</div>
                        ) : (
                          <div className="text-sm text-slate-500 mt-0.5">Linked lead "<span className="font-medium">{detailLead.title}</span>" has no techpack yet.</div>
                        )
                      ) : (
                        <div className="text-sm text-slate-400 mt-0.5">This job isn't linked to a sales lead — no techpack to view.</div>
                      )}
                    </div>
                    {hasTechpack && <button onClick={()=>openTechpack(detailLead)} className="shrink-0 py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 View techpack</button>}
                  </div>
                </div>
              )}
              {(liveDetail.attachments||[]).length>0 && (() => {
                const atts = liveDetail.attachments;
                const isImageish = a => a && (a.type==='image' || /\.(jpe?g|png|gif|webp|bmp|svg|heic|heif)(?:$|\?)/i.test(String(a.url||a.name||a.path||'').toLowerCase()));
                const coverIdx = atts.findIndex(a=>a&&a.is_cover&&isImageish(a));
                const effectiveCoverIdx = coverIdx>=0 ? coverIdx : atts.findIndex(isImageish);
                const hasAnyImage = atts.some(isImageish);
                return (
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <div className="text-[10px] uppercase text-slate-400">Attachments</div>
                      {hasAnyImage && <div className="text-[10px] text-slate-400">Click ⭐ on any photo to make it the cover</div>}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {atts.map((a,i)=>{
                        const img = isImageish(a);
                        const isCover = i===effectiveCoverIdx && img;
                        const explicit = i===coverIdx;
                        return (
                          <div key={i} className={`relative ${isCover?'ring-2 ring-amber-400 rounded-lg':''}`}>
                            <AttachmentChip att={a} small />
                            {img && (
                              <button
                                type="button"
                                onClick={()=> explicit ? clearCover(liveDetail) : setCover(liveDetail, i)}
                                title={explicit?'Currently the cover · click to clear':(isCover?'Default cover (first image) · click to lock this one as cover':'Make this the cover photo')}
                                className={`absolute -top-1 -right-1 w-6 h-6 rounded-full text-xs flex items-center justify-center shadow-md border transition ${isCover?'bg-amber-400 text-white border-amber-500':'bg-white text-slate-400 border-slate-200 hover:bg-amber-50 hover:text-amber-500 hover:border-amber-300'}`}
                              >★</button>
                            )}
                            {isCover && <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-amber-400 text-white shadow">Cover</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
              {liveDetail.notes && <div><div className="text-[10px] uppercase text-slate-400 mb-1">Notes</div><div className="text-sm bg-slate-50 border rounded p-2 whitespace-pre-wrap">{liveDetail.notes}</div></div>}
              <div className="flex gap-2 pt-2 border-t flex-wrap">
                {hasTechpack && <button onClick={()=>openTechpack(detailLead)} className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 Techpack</button>}
                <button onClick={()=>{ setEditing(liveDetail); setDetail(null); }} className="py-2 px-3 rounded-lg border text-sm hover:bg-slate-50">✎ Edit</button>
                {canSendToPrinting && <button onClick={()=>{ sendToPrinting(liveDetail); setDetail(null); }} className="py-2 px-3 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700">🖨 Send to Printing</button>}
                <button onClick={()=>setDetail(null)} className="py-2 px-3 rounded-lg text-slate-500 text-sm hover:text-slate-800">Close</button>
              </div>
            </div>
            {/* Right: live activity (2 cols) — scoped to THIS dept job; no lead chatter bleeds in */}
            <div className="md:col-span-2 border-l md:pl-5 -mr-2 md:-mr-0 min-h-0">
              <div className="mb-3">
                <div className="text-xs uppercase tracking-wider text-slate-500 font-semibold">💬 {title} conversation</div>
                <div className="text-[10px] text-slate-400 mt-0.5">Private to the {title.toLowerCase()} team — the sales lead's chat is not shown here.</div>
              </div>
              <ThreadBody profile={profile} profiles={profiles} table="dept_job_activity" match={{ job_id: liveDetail.id, job_type: jobType }} scope={'dept/'+liveDetail.id} titleText={`${liveDetail.item} · ${liveDetail.client_name}`} afterChange={reload} headerless embedded />
            </div>
          </div>
        </Modal>
      ); })()}
    </div>
  );
}

/* ----------------------- Production board ----------------------- */
function ProductionBoard({ profile, profiles, jobs, leads, activityCounts, reload, openActivity, openTechpack }){
  const [viewMode,setViewMode]=useState('active'); const [search,setSearch]=useState('');
  const [filterStatus,setFilterStatus]=useState(''); const [filterDeadline,setFilterDeadline]=useState('');
  const [filterOwner,setFilterOwner]=useState('');
  const [sortBy,setSortBy]=useState(()=>{ try{ return localStorage.getItem('prodSort')||'due_asc'; }catch(e){ return 'due_asc'; } });
  function changeSort(v){ setSortBy(v); try{ localStorage.setItem('prodSort',v); }catch(e){} }
  const [layout,setLayout]=useState(()=>{ try{ return localStorage.getItem('prodLayout')||'table'; }catch(e){ return 'table'; } });
  function changeLayout(v){ setLayout(v); try{ localStorage.setItem('prodLayout',v); }catch(e){} }
  const [collapsed,setCollapsed]=useState({}); // status.key -> true if collapsed
  function toggleCollapsed(k){ setCollapsed(p=>({...p,[k]:!p[k]})); }
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  // Production board delete is now admin-only. Managers can still edit /
  // move jobs, but only admin can send to Trash. Recover from Settings → Trash.
  const canDelete=isAdmin;
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  async function changeOwner(j, ownerId){ const { error } = await sb.from('production_jobs').update({ sales_owner_id: ownerId||null }).eq('id', j.id); if(error){ alert(error.message); return; } reload(); }
  // Inline deadline editor: saves to production_jobs.due_date so the
  // production team can adjust deadlines without leaving the board.
  async function changeDueDate(j, newDate){
    const due = newDate || null;
    const { error } = await sb.from('production_jobs').update({ due_date: due }).eq('id', j.id);
    if(error){ alert(error.message); return; }
    reload();
  }
  // Derive the sales owner: prefer the job's own sales_owner_id, fall back to
  // the linked lead's manager_id so jobs created before the column existed
  // (or jobs where the column was cleared) still show the right person.
  function ownerOf(j, lead){
    if(j.sales_owner_id) return (profiles||[]).find(p=>p.id===j.sales_owner_id) || null;
    if(lead && lead.manager_id) return (profiles||[]).find(p=>p.id===lead.manager_id) || null;
    return null;
  }
  // Deadline resolution order:
  //   1. The production job's own due_date (what the team set here)
  //   2. The linked lead's delivery_date (client's expected delivery)
  //   3. The linked lead's expected_close (sales's expected close)
  // This three-level chain means jobs created before the fallback fix below
  // still show SOMETHING in the deadline column without requiring a re-save.
  function deadlineOf(j, lead){ return j.due_date || lead?.delivery_date || lead?.expected_close || ''; }
  async function del(j){ if(!confirm(`Send production job ${j.number||''} — ${j.item||''} for ${j.client_name||''} to Trash?\n\nIt'll be recoverable from Settings → Trash.`)) return; const { error } = await sb.from('production_jobs').update({ deleted_at: new Date().toISOString(), deleted_by: profile.id }).eq('id', j.id); if(error){ alert(error.message); return; } reload(); }
  const daysUntil=(due)=>{ if(!due) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(due+'T00:00:00')-t)/86400000); };
  const active=jobs.filter(j=>!PRODUCTION_DONE.includes(j.status));
  const overdue=active.filter(j=>deadlineInfo(j.due_date,false).overdue).length;
  const dueThisWeek=active.filter(j=>{ const d=daysUntil(j.due_date); return d!==null && d>=0 && d<=7; }).length;
  const awaiting=active.filter(j=>j.status==='materials to purchase').length;
  function compareJobs(a,b){
    if(sortBy==='due_asc' || sortBy==='due_desc'){
      // Treat missing due_date as "infinity" so it always sinks to the bottom in asc,
      // and to the top in desc (but we apply the same rule and just invert otherwise).
      const aT = a.due_date ? new Date(a.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      const bT = b.due_date ? new Date(b.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      if(aT!==bT) return sortBy==='due_asc' ? (aT-bT) : (bT-aT);
      return 0;
    }
    if(sortBy==='created_desc' || sortBy==='created_asc'){
      const aC = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bC = b.created_at ? new Date(b.created_at).getTime() : 0;
      return sortBy==='created_desc' ? (bC-aC) : (aC-bC);
    }
    return 0;
  }
  const shown=(viewMode==='active'?active:jobs.filter(j=>PRODUCTION_DONE.includes(j.status)))
    .filter(j=>!filterStatus||j.status===filterStatus)
    .filter(j=>{ if(filterDeadline==='overdue') return deadlineInfo(j.due_date,false).overdue; if(filterDeadline==='week'){ const d=daysUntil(j.due_date); return d!==null&&d>=0&&d<=7; } return true; })
    .filter(j=>{ if(filterOwner==='__mine') return j.sales_owner_id===profile.id; if(filterOwner==='__unassigned') return !j.sales_owner_id; if(filterOwner) return j.sales_owner_id===filterOwner; return true; })
    .filter(j=>!search||`${j.number} ${j.client_name} ${j.item}`.toLowerCase().includes(search.toLowerCase()))
    .slice() // don't mutate the prop
    .sort(compareJobs);
  async function move(j,st){ const {error}=await sb.from('production_jobs').update({ status:st }).eq('id',j.id); if(error){ alert(error.message); return; } reload(); }
  async function sendTo(j, table, status, label){ if(!confirm(`Send ${j.number||''} to ${label}?`)) return;
    const row={ number:(table==='printing_jobs'?'PR-P-':'GD-')+Date.now().toString().slice(-5), source_job_id:j.id, lead_id:j.lead_id||null, client_name:j.client_name, item:j.item, items:j.items||[], quantity:j.quantity||0, attachments:[], status, due_date:j.due_date||null, notes:'' };
    const {error}=await sb.from(table).insert(row); if(error){ alert(error.message); return; } alert(`Sent to ${label}.`); }
  const tile=(label,value,sub,active2,onClick)=>(
    <button onClick={onClick} className={`text-left rounded-xl border p-4 transition ${active2?'bg-indigo-600 border-indigo-600 text-white':'bg-white hover:border-indigo-300'}`}>
      <div className={`text-[11px] uppercase tracking-wide ${active2?'text-indigo-100':'text-slate-400'}`}>{label}</div>
      <div className="text-2xl font-bold mt-1">{value}</div>
      <div className={`text-xs mt-0.5 ${active2?'text-indigo-100':'text-slate-500'}`}>{sub}</div>
    </button>
  );
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">⚙ Production Board</h1><p className="text-slate-500 text-sm">Live production tracking — every confirmed order flows through your real production stages. Monitor status and deadlines.</p></div>
          <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setViewMode('active')} className={`px-3 py-1.5 rounded-md ${viewMode==='active'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Active ({active.length})</button><button onClick={()=>setViewMode('delivered')} className={`px-3 py-1.5 rounded-md ${viewMode==='delivered'?'bg-white shadow-sm font-semibold text-emerald-700':'text-slate-600'}`}>✓ Delivered ({jobs.length-active.length})</button></div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        {tile('Active jobs', active.length, `${jobs.length-active.length} delivered`, false, ()=>{ setViewMode('active'); setFilterStatus(''); setFilterDeadline(''); })}
        {tile('Overdue', overdue, 'past due date', filterDeadline==='overdue', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='overdue'?'':'overdue'); setFilterStatus(''); })}
        {tile('Due this week', dueThisWeek, 'next 7 days', filterDeadline==='week', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='week'?'':'week'); setFilterStatus(''); })}
        {tile('Awaiting materials', awaiting, 'materials to purchase', filterStatus==='materials to purchase', ()=>{ setViewMode('active'); setFilterStatus(filterStatus==='materials to purchase'?'':'materials to purchase'); setFilterDeadline(''); })}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search job#, client, item…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All statuses</option>{PRODUCTION_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
        <select value={filterOwner} onChange={e=>setFilterOwner(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300">
          <option value="">All sales owners</option>
          <option value="__mine">My jobs only</option>
          <option value="__unassigned">Unassigned</option>
          <option disabled>──────────</option>
          {salesPeople.map(p=><option key={p.id} value={p.id}>{p.name||p.email}</option>)}
        </select>
        <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-xs">
          <button onClick={()=>setFilterDeadline('')} className={`px-3 py-1.5 rounded-md ${filterDeadline===''?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>All</button>
          <button onClick={()=>setFilterDeadline('overdue')} className={`px-3 py-1.5 rounded-md ${filterDeadline==='overdue'?'bg-white shadow-sm font-semibold text-rose-600':'text-slate-600'}`}>Overdue</button>
          <button onClick={()=>setFilterDeadline('week')} className={`px-3 py-1.5 rounded-md ${filterDeadline==='week'?'bg-white shadow-sm font-semibold text-amber-600':'text-slate-600'}`}>This week</button>
        </div>
        <select value={sortBy} onChange={e=>changeSort(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300 bg-white" title="Sort jobs">
          <option value="due_asc">⬆ Most urgent first (earliest due)</option>
          <option value="due_desc">⬇ Latest due first</option>
          <option value="created_desc">🆕 Newest job first</option>
          <option value="created_asc">🕒 Oldest job first</option>
        </select>
        <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm" title="View style">
          <button onClick={()=>changeLayout('table')} className={`px-3 py-1.5 rounded-md ${layout==='table'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>☰ Table</button>
          <button onClick={()=>changeLayout('list')} className={`px-3 py-1.5 rounded-md ${layout==='list'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>≡ Group by status</button>
        </div>
      </div>

      {layout==='table' && (
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Ref</th><th className="text-left px-3 py-2">Client</th><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Qty</th><th className="text-left px-3 py-2">Status</th><th className={`text-left px-3 py-2 ${sortBy==='due_asc'||sortBy==='due_desc'?'text-indigo-600':''}`}>Deadline{(sortBy==='due_asc'||sortBy==='due_desc')&&<span className="ml-1">{sortBy==='due_asc'?'⬆':'⬇'}</span>}</th><th className="text-left px-3 py-2">Sales Owner</th><th></th></tr></thead>
        <tbody>{shown.map(j=>{
          const lead = j.lead_id ? (leads||[]).find(l=>l.id===j.lead_id) : null;
          const effectiveDue = deadlineOf(j, lead);
          const di = deadlineInfo(effectiveDue, PRODUCTION_DONE.includes(j.status));
          const meta = metaFrom(PRODUCTION_STATUSES, j.status);
          const owner = ownerOf(j, lead);
          const cmtCount = (activityCounts||{})[j.id] || 0;
          // When the production job's own due_date is null but the lead has a
          // delivery_date, we display the lead's date as a faint hint; saving
          // a new date promotes it onto the job itself.
          const dueIsFromLead = !j.due_date && !!lead?.delivery_date;

              <span className={`inline-flex items-center px-2.5 py-0.5 rounded-md ${st.color} text-xs font-bold uppercase tracking-wide`}>{st.label}</span>

                      <th className="text-left px-3 py-2 font-medium">Sales Owner</th>

                    </tr>
                  </thead>
                  <tbody>
                    {col.map(j=>{

                      const effectiveDue = deadlineOf(j, lead);

                        <td className="px-3 py-2.5 font-medium">{j.item}{(j.items||[]).length>0 && <div className="text-[10px] text-slate-500">{j.items.map(it=>`${it.quantity} ${it.itemType}`).join(' · ')}</div>}</td>
                        <td className="px-3 py-2.5 text-right">{j.quantity||'—'}</td>
                        <td className="px-3 py-2.5">
                          <div className="flex flex-col gap-0.5">
                            <input type="date" value={effectiveDue||''} onChange={e=>changeDueDate(j,e.target.value)} className={`text-xs px-1.5 py-0.5 rounded border border-slate-300 bg-white ${di.overdue?'text-rose-700 font-semibold':''}`} title={dueIsFromLead?'Inherited from the lead\'s delivery date — save here to override':'Production deadline'} />
                            {di.label && <span className={`text-[10px] ${di.cls}`}>{di.label}{dueIsFromLead?' · from lead':''}</span>}
                          </div>
                        </td>
                        <td className="px-3 py-2.5">{owner ? <div className="flex items-center gap-1.5 min-w-0" title={`Sales owner: ${owner.name||owner.email} (locked from the lead)`}><Avatar profile={owner} size="sm" /><span className="text-xs text-slate-700 truncate max-w-[8rem]">{owner.name||owner.email}</span></div> : <span className="text-xs text-slate-300">— unassigned —</span>}</td>
                        <td className="px-3 py-2.5"><select value={j.status} onChange={e=>move(j,e.target.value)} className="text-xs border rounded px-2 py-1 bg-white">{PRODUCTION_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></td>
                        <td className="px-3 py-2.5 text-right whitespace-nowrap">
                          <button onClick={()=>openActivity({ job:j, jobType:'production', title:`${j.item} · ${j.client_name}` })} className={`text-xs mr-2 inline-flex items-center gap-1 ${cmtCount>0?'text-indigo-700 font-semibold':'text-slate-400 hover:text-indigo-600'}`} title={cmtCount>0?`${cmtCount} comment${cmtCount===1?'':'s'}`:'Open activity'}>
                            <span>💬</span>{cmtCount>0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-semibold">{cmtCount}</span>}
                          </button>
                          {lead && lead.techpack && openTechpack && <button onClick={()=>openTechpack(lead)} className="text-xs text-teal-700 hover:underline mr-2">📋</button>}

                        </td>
                      </tr>
                      );
                    })}
                    {col.length===0 && (
                      <tr><td colSpan="8" className="text-center text-slate-300 text-xs py-3">— nothing in this status —</td></tr>

      )}
    </div>
  );
}

/* ----------------------- Sampling board ----------------------- */
function SamplingBoard({ profile, profiles, jobs, leads, reload, openActivity, openTechpack }){
  const [viewMode,setViewMode]=useState('active'); const [search,setSearch]=useState('');
  const [filterStatus,setFilterStatus]=useState(''); const [filterDeadline,setFilterDeadline]=useState('');
  const [filterOwner,setFilterOwner]=useState('');
  const [creating,setCreating]=useState(false);
  const [sortBy,setSortBy]=useState(()=>{ try{ return localStorage.getItem('sampleSort')||'due_asc'; }catch(e){ return 'due_asc'; } });
  function changeSort(v){ setSortBy(v); try{ localStorage.setItem('sampleSort',v); }catch(e){} }
  const [layout,setLayout]=useState(()=>{ try{ return localStorage.getItem('sampleLayout')||'table'; }catch(e){ return 'table'; } });
  function changeLayout(v){ setLayout(v); try{ localStorage.setItem('sampleLayout',v); }catch(e){} }
  const [collapsed,setCollapsed]=useState({});
  function toggleCollapsed(k){ setCollapsed(p=>({...p,[k]:!p[k]})); }
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  const canDelete=isAdmin || !isAssistant;
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  // Sampling jobs don't carry their own sales_owner_id — derive it from the linked lead.
  const ownerIdFor=(j)=>{ const lead=j.lead_id?leads.find(l=>l.id===j.lead_id):null; return lead?lead.manager_id||null:null; };
  const daysUntil=(due)=>{ if(!due) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(due+'T00:00:00')-t)/86400000); };
  const active=jobs.filter(j=>!SAMPLING_DONE.includes(j.status));
  const overdue=active.filter(j=>deadlineInfo(j.due_date,false).overdue).length;
  const dueThisWeek=active.filter(j=>{ const d=daysUntil(j.due_date); return d!==null && d>=0 && d<=7; }).length;
  const endorsed=active.filter(j=>j.status==='endorsed').length;
  function compareJobs(a,b){
    if(sortBy==='due_asc' || sortBy==='due_desc'){
      const aT = a.due_date ? new Date(a.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      const bT = b.due_date ? new Date(b.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      if(aT!==bT) return sortBy==='due_asc' ? (aT-bT) : (bT-aT);
      return 0;
    }
    if(sortBy==='created_desc' || sortBy==='created_asc'){
      const aC = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bC = b.created_at ? new Date(b.created_at).getTime() : 0;
      return sortBy==='created_desc' ? (bC-aC) : (aC-bC);
    }
    return 0;
  }
  const shown=(viewMode==='active'?active:jobs.filter(j=>SAMPLING_DONE.includes(j.status)))
    .filter(j=>!filterStatus||j.status===filterStatus)
    .filter(j=>{ if(filterDeadline==='overdue') return deadlineInfo(j.due_date,false).overdue; if(filterDeadline==='week'){ const d=daysUntil(j.due_date); return d!==null&&d>=0&&d<=7; } return true; })
    .filter(j=>{ if(filterOwner==='__mine') return ownerIdFor(j)===profile.id; if(filterOwner==='__unassigned') return !ownerIdFor(j); if(filterOwner) return ownerIdFor(j)===filterOwner; return true; })
    .filter(j=>!search||`${j.number} ${j.client_name} ${j.item}`.toLowerCase().includes(search.toLowerCase()))
    .slice()
    .sort(compareJobs);
  async function move(j,st){ const {error}=await sb.from('sampling_jobs').update({ status:st }).eq('id',j.id); if(error){ alert(error.message); return; } reload(); }
  async function del(id){ if(!confirm('Send this sampling job to Trash?\n\nIt\'ll be recoverable from Settings → Trash.')) return; const {error}=await sb.from('sampling_jobs').update({ deleted_at: new Date().toISOString(), deleted_by: profile.id }).eq('id',id); if(error){ alert(error.message); return; } reload(); }
  const tile=(label,value,sub,active2,onClick)=>(
    <button onClick={onClick} className={`text-left rounded-xl border p-4 transition ${active2?'bg-indigo-600 border-indigo-600 text-white':'bg-white hover:border-indigo-300'}`}>
      <div className={`text-[11px] uppercase tracking-wide ${active2?'text-indigo-100':'text-slate-400'}`}>{label}</div>
      <div className="text-2xl font-bold mt-1">{value}</div>
      <div className={`text-xs mt-0.5 ${active2?'text-indigo-100':'text-slate-500'}`}>{sub}</div>
    </button>
  );
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">🧵 Sampling Board</h1><p className="text-slate-500 text-sm">Live sample tracking — every sample job flows through endorsed → material request → on going → for delivery → delivered.</p></div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setViewMode('active')} className={`px-3 py-1.5 rounded-md ${viewMode==='active'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Active ({active.length})</button><button onClick={()=>setViewMode('delivered')} className={`px-3 py-1.5 rounded-md ${viewMode==='delivered'?'bg-white shadow-sm font-semibold text-emerald-700':'text-slate-600'}`}>✓ Delivered ({jobs.length-active.length})</button></div>
            <button onClick={()=>setCreating(true)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 whitespace-nowrap">+ New sample</button>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        {tile('Active samples', active.length, `${jobs.length-active.length} delivered`, false, ()=>{ setViewMode('active'); setFilterStatus(''); setFilterDeadline(''); })}
        {tile('Overdue', overdue, 'past due date', filterDeadline==='overdue', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='overdue'?'':'overdue'); setFilterStatus(''); })}
        {tile('Due this week', dueThisWeek, 'next 7 days', filterDeadline==='week', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='week'?'':'week'); setFilterStatus(''); })}
        {tile('Endorsed', endorsed, 'awaiting kickoff', filterStatus==='endorsed', ()=>{ setViewMode('active'); setFilterStatus(filterStatus==='endorsed'?'':'endorsed'); setFilterDeadline(''); })}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search ref, client, item…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All statuses</option>{SAMPLING_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>

        <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm" title="View style">

        </div>

      {layout==='table' && (

        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Ref</th><th className="text-left px-3 py-2">Client</th><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Qty</th><th className="text-left px-3 py-2">Status</th><th className={`text-left px-3 py-2 ${sortBy==='due_asc'||sortBy==='due_desc'?'text-indigo-600':''}`}>Deadline{(sortBy==='due_asc'||sortBy==='due_desc')&&<span className="ml-1">{sortBy==='due_asc'?'⬆':'⬇'}</span>}</th><th className="text-left px-3 py-2">Sales Owner</th><th></th></tr></thead>
        <tbody>{shown.map(j=>{ const di=deadlineInfo(j.due_date, SAMPLING_DONE.includes(j.status)); const meta=metaFrom(SAMPLING_STATUSES,j.status); const lead=j.lead_id?leads.find(l=>l.id===j.lead_id):null; const ownerId=lead?lead.manager_id:null; const owner=ownerId?(profiles||[]).find(p=>p.id===ownerId):null; return (

            </td>
          </tr>
        ); })}
        {shown.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No sample jobs here. Click "+ New sample" or send from a lead in Sampling stage.</td></tr>}
        </tbody></table></div></div>
      )}

      {layout==='list' && (
      <div className="space-y-4">{SAMPLING_STATUSES.map(st=>{
