// Trash view — admin-only recovery panel. Fetches soft-deleted rows from the
// 5 supported tables, lets the admin Restore (clear deleted_at) or Delete
// forever (real DELETE). One section per source table.
function TrashView({ profile, profiles, reload }){
  const [buckets,setBuckets]=useState({ leads:[], production_jobs:[], graphic_design_jobs:[], printing_jobs:[], sampling_jobs:[] });
  const [busy,setBusy]=useState(false);
  const [loadErr,setLoadErr]=useState('');
  const TABLES = [
    { key:'leads',                table:'leads',                icon:'💼', label:'Leads',         titleOf: r=>r.title || '(no title)',                              metaOf: r=>r.client_id?'Client: '+(r.client_id.slice(0,8)+'…'):'' },
    { key:'production_jobs',      table:'production_jobs',      icon:'⚙',  label:'Production',     titleOf: r=>`${r.number||''} · ${r.item||''}`,                    metaOf: r=>r.client_name||'' },
    { key:'graphic_design_jobs',  table:'graphic_design_jobs',  icon:'🎨', label:'Graphic Design', titleOf: r=>`${r.number||''} · ${r.item||''}`,                    metaOf: r=>r.client_name||'' },
    { key:'printing_jobs',        table:'printing_jobs',        icon:'🖨', label:'Printing',       titleOf: r=>`${r.number||''} · ${r.item||''}`,                    metaOf: r=>r.client_name||'' },
    { key:'sampling_jobs',        table:'sampling_jobs',        icon:'🧵', label:'Sampling',       titleOf: r=>`${r.number||''} · ${r.item||''}`,                    metaOf: r=>r.client_name||'' },
  ];

  async function loadTrash(){
    setLoadErr('');
    try {
      const results = await Promise.all(TABLES.map(t =>
        sb.from(t.table).select('*').not('deleted_at','is', null).order('deleted_at', { ascending:false }).limit(500)
      ));
      const next = {};
      results.forEach((r,i)=>{
        if(r.error){ console.warn('Trash load failed for', TABLES[i].table, r.error.message); next[TABLES[i].key]=[]; return; }
        next[TABLES[i].key] = r.data||[];
      });
      setBuckets(next);
    } catch(e){ setLoadErr(String(e.message||e)); }
  }
  useEffect(()=>{ loadTrash(); },[]);

  function whoDeleted(r){ const p = (profiles||[]).find(x=>x.id===r.deleted_by); return p? (p.name||p.email) : 'someone'; }
  function fmtWhen(iso){ if(!iso) return ''; try { return new Date(iso).toLocaleString('en-PH', { timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' }); } catch(_){ return iso; } }

  async function restore(t, r){
    if(busy) return;
    if(!confirm(`Restore "${t.titleOf(r)}"?\n\nIt'll return to its board / list as if it was never deleted.`)) return;
    setBusy(true);
    const { error } = await sb.from(t.table).update({ deleted_at:null, deleted_by:null }).eq('id', r.id);
    setBusy(false);
    if(error){ alert('Restore failed: '+error.message); return; }
    await loadTrash();
    reload && reload();
  }
  async function purge(t, r){
    if(busy) return;
    if(!confirm(`⚠ PERMANENTLY delete "${t.titleOf(r)}"?\n\nThis cannot be undone. The row will be wiped from the database for good.`)) return;
    setBusy(true);
    const { error } = await sb.from(t.table).delete().eq('id', r.id);
    setBusy(false);
    if(error){ alert('Permanent delete failed: '+error.message); return; }
    await loadTrash();
    reload && reload();
  }
  async function emptyAll(t){
    const rows = buckets[t.key]||[];
    if(rows.length===0) return;
    if(!confirm(`⚠ Permanently delete ALL ${rows.length} item${rows.length===1?'':'s'} in ${t.label} trash?\n\nThis cannot be undone.`)) return;
    setBusy(true);
    const { error } = await sb.from(t.table).delete().in('id', rows.map(r=>r.id));
    setBusy(false);
    if(error){ alert('Empty trash failed: '+error.message); return; }
    await loadTrash();
    reload && reload();
  }

  const totalCount = TABLES.reduce((s,t)=>s+(buckets[t.key]||[]).length, 0);
  return (
    <div className="space-y-4">
      <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900">
        <strong>🗑 Trash</strong> · Items deleted from Leads, Production, Graphic, Printing, and Sampling boards land here so you can recover them.
        Items are kept until you Permanently delete them or run a future cleanup. Total in trash: <strong>{totalCount}</strong>.
        {loadErr && <div className="mt-2 text-rose-700 font-semibold">Failed to load: {loadErr}</div>}
      </div>
      {TABLES.map(t => {
        const rows = buckets[t.key]||[];
        return (
          <div key={t.key} className="bg-white border rounded-xl overflow-hidden">
            <div className="px-4 py-2.5 flex items-center justify-between border-b bg-slate-50">
              <div className="font-semibold text-slate-700">{t.icon} {t.label} <span className="text-slate-400 font-normal text-xs ml-1">({rows.length})</span></div>
              {rows.length>0 && <button onClick={()=>emptyAll(t)} disabled={busy} className="text-xs text-rose-600 hover:underline disabled:opacity-50">Empty this trash →</button>}
            </div>
            {rows.length===0 ? (
              <div className="px-4 py-4 text-xs text-slate-400">No deleted {t.label.toLowerCase()} items.</div>
            ) : (
              <div className="divide-y">
                {rows.map(r=>(
                  <div key={r.id} className="px-4 py-2.5 flex items-center justify-between gap-3">
                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-slate-800 truncate">{t.titleOf(r)}</div>
                      <div className="text-[11px] text-slate-500">{t.metaOf(r)}{t.metaOf(r)?' · ':''}Deleted {fmtWhen(r.deleted_at)} by {whoDeleted(r)}</div>
                    </div>
                    <div className="flex gap-2 shrink-0">
                      <button onClick={()=>restore(t,r)} disabled={busy} className="text-xs px-2.5 py-1 rounded border border-emerald-300 bg-emerald-50 text-emerald-700 font-semibold hover:bg-emerald-100 disabled:opacity-50">↺ Restore</button>
                      <button onClick={()=>purge(t,r)} disabled={busy} className="text-xs px-2.5 py-1 rounded border border-rose-300 bg-white text-rose-600 font-semibold hover:bg-rose-50 disabled:opacity-50">🗑 Delete forever</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function MemberProfileModal({ member, leads, clients, onClose }){
  const mine=leads.filter(l=>l.manager_id===member.id);
  const won=mine.filter(l=>SOLD_STAGES.includes(l.stage));
  const open=mine.filter(l=>!CLOSED_STAGES.includes(l.stage));
  const wonVal=won.reduce((s,l)=>s+(Number(l.value)||0),0);
  const openVal=open.reduce((s,l)=>s+(Number(l.value)||0),0);
  const _now=new Date();
  const wonThisMonth=won.filter(l=>{ if(!l.won_at) return false; const d=new Date(l.won_at+'T00:00:00'); return d.getMonth()===_now.getMonth()&&d.getFullYear()===_now.getFullYear(); });
  const wonMonthVal=wonThisMonth.reduce((s,l)=>s+(Number(l.value)||0),0);
  const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(_now.getFullYear(), _now.getMonth()-i, 1); months.push({ key:d.getMonth()+'-'+d.getFullYear(), label:d.toLocaleString('en-PH',{ month:'short' }), m:d.getMonth(), y:d.getFullYear(), total:0 }); }
  won.forEach(l=>{ if(!l.won_at) return; const d=new Date(l.won_at+'T00:00:00'); const slot=months.find(x=>x.m===d.getMonth()&&x.y===d.getFullYear()); if(slot) slot.total+=Number(l.value)||0; });
  const maxM=Math.max(1,...months.map(m=>m.total));
  const clientName=(id)=>(clients||[]).find(c=>c.id===id)?.company||'—';
  const roleLbl = member.role==='admin'?'Administrator' : member.role==='assistant'?'Sales Assistant' : 'Sales Manager';
  const recentWon=won.slice().sort((a,b)=>(b.won_at||'').localeCompare(a.won_at||'')).slice(0,8);
  return (
    <Modal title="Team member" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex items-center gap-3"><Avatar profile={member} />
          <div>
            <div className="text-xl font-bold text-slate-900">{member.name||member.email}</div>
            <div className="text-xs text-slate-500">{roleLbl} · {member.email}</div>
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Open pipeline</div><div className="text-xl font-bold mt-0.5">{peso(openVal)}</div><div className="text-[11px] text-slate-500">{open.length} lead{open.length===1?'':'s'}</div></div>
          <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3"><div className="text-[10px] uppercase text-emerald-700">Won this month</div><div className="text-xl font-bold mt-0.5 text-emerald-800">{peso(wonMonthVal)}</div><div className="text-[11px] text-emerald-600">{wonThisMonth.length} deal{wonThisMonth.length===1?'':'s'}</div></div>
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Won (all-time)</div><div className="text-xl font-bold mt-0.5 text-emerald-700">{peso(wonVal)}</div><div className="text-[11px] text-slate-500">{won.length} deal{won.length===1?'':'s'}</div></div>
          <div className="bg-slate-50 border rounded-lg p-3"><div className="text-[10px] uppercase text-slate-400">Win rate</div><div className="text-xl font-bold mt-0.5">{mine.length?Math.round(won.length/mine.length*100):0}%</div><div className="text-[11px] text-slate-500">{mine.length} total leads</div></div>
        </div>
        <div className="bg-slate-50 border rounded-lg p-3">
          <div className="text-[10px] uppercase text-slate-500 font-semibold mb-2">Closed Won — last 6 months</div>
          <div className="flex items-end gap-2 h-28">{months.map(m=>(
            <div key={m.key} className="flex-1 flex flex-col items-center justify-end gap-1">
              <div className="text-[9px] text-slate-500">{m.total?peso(m.total).replace('₱',''):''}</div>
              <div className="w-full bg-emerald-500 rounded-t" style={{ height:Math.max(2,(m.total/maxM*100))+'%', minHeight:m.total?'4px':'2px' }}></div>
              <div className="text-[10px] text-slate-500">{m.label}</div>
            </div>
          ))}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase text-slate-500 font-semibold mb-2">Most recent Closed Won</div>
          {recentWon.length===0 ? <div className="text-xs text-slate-400 py-2">No won deals yet.</div> :
            <div className="border rounded-lg overflow-hidden"><table className="w-full text-sm">
              <thead className="bg-slate-50 text-[10px] uppercase text-slate-500"><tr><th className="text-left px-2 py-1.5">Date</th><th className="text-left px-2 py-1.5">Client</th><th className="text-left px-2 py-1.5">Lead</th><th className="text-right px-2 py-1.5">Value</th></tr></thead>
              <tbody>{recentWon.map(l=>(
                <tr key={l.id} className="border-t">
                  <td className="px-2 py-1 text-xs text-slate-500">{fmtDate(l.won_at)}</td>
                  <td className="px-2 py-1">{clientName(l.client_id)}</td>
                  <td className="px-2 py-1 text-slate-700">{l.title}</td>
                  <td className="px-2 py-1 text-right font-semibold">{peso(l.value)}</td>
                </tr>
              ))}</tbody>
            </table></div>
          }
        </div>
      </div>
    </Modal>
  );
}

function mergeTechpack(existing, lead, client, profile){
  const blank=blankTechpack(lead, client, profile);
  if(!existing||typeof existing!=='object') return blank;
  const out={ ...blank, ...existing };
  TECHPACK_SECTIONS.forEach(s=>{ out[s.key]={ ...blank[s.key], ...(existing[s.key]||{}) }; });
  out.extraPages = Array.isArray(out.extraPages) ? out.extraPages : [];
  return out;
}

let __cropperLibPromise=null;
function loadCropperLib(){ if(window.Cropper) return Promise.resolve(); if(__cropperLibPromise) return __cropperLibPromise;
  __cropperLibPromise=new Promise((resolve,reject)=>{ if(!document.querySelector('link[data-cropper-css]')){ const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css'; css.setAttribute('data-cropper-css','1'); document.head.appendChild(css); } const js=document.createElement('script'); js.src='https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js'; js.onload=()=>resolve(); js.onerror=()=>reject(new Error('Failed to load Cropper.js — check your network.')); document.head.appendChild(js); });
  return __cropperLibPromise;
}
let __bgState=null;
async function loadBgRemover(onProgress){ if(__bgState) return __bgState; if(onProgress) onProgress('Loading AI library…');
  const transformers=await (new Function('return import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0")'))();
  const { AutoModel, AutoProcessor, RawImage, env }=transformers; env.allowRemoteModels=true; env.allowLocalModels=false;
  if(onProgress) onProgress('Downloading model (first run ~50MB)…');
  const model=await AutoModel.from_pretrained('briaai/RMBG-1.4', { config:{ model_type:'custom' } });
  const processor=await AutoProcessor.from_pretrained('briaai/RMBG-1.4', { config:{ do_normalize:true, do_pad:false, do_rescale:true, do_resize:true, image_mean:[0.5,0.5,0.5], feature_extractor_type:'ImageFeatureExtractor', image_std:[1,1,1], resample:2, rescale_factor:0.00392156862745098, size:{ width:1024, height:1024 } } });
  __bgState={ model, processor, RawImage }; return __bgState;
}
async function removeImageBackground(srcDataUrl, onProgress){
  const { model, processor, RawImage }=await loadBgRemover(onProgress); if(onProgress) onProgress('Analyzing image…');
  const image=await RawImage.fromURL(srcDataUrl); const { pixel_values }=await processor(image); const { output }=await model({ input:pixel_values });
  const mask=await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(image.width, image.height);
  const canvas=document.createElement('canvas'); canvas.width=image.width; canvas.height=image.height; const ctx=canvas.getContext('2d');
  ctx.drawImage(image.toCanvas(),0,0); const imageData=ctx.getImageData(0,0,image.width,image.height);
  for(let i=0;i<mask.data.length;i++){ imageData.data[4*i+3]=mask.data[i]; }
  ctx.putImageData(imageData,0,0); return canvas.toDataURL('image/png');
}

function CropModal({ src, onClose, onApply }){
  const imgRef=useRef(); const cropperRef=useRef(null); const [loading,setLoading]=useState(true); const [aspect,setAspect]=useState('Free');
  useEffect(()=>{ let cancelled=false; setLoading(true);
    loadCropperLib().then(()=>{ if(cancelled||!imgRef.current) return; setTimeout(()=>{ if(cancelled||!imgRef.current) return; cropperRef.current=new window.Cropper(imgRef.current,{ viewMode:1, autoCropArea:0.9, background:false, movable:true, zoomable:true, rotatable:true, ready(){ setLoading(false); } }); },50); }).catch(err=>{ alert('Failed to load cropper: '+err.message); onClose(); });
    return ()=>{ cancelled=true; if(cropperRef.current){ try{ cropperRef.current.destroy(); }catch(_){} cropperRef.current=null; } };
  },[]);
  function setRatio(label,v){ setAspect(label); if(cropperRef.current) cropperRef.current.setAspectRatio(v); }
  function apply(){ if(!cropperRef.current) return; const canvas=cropperRef.current.getCroppedCanvas({ maxWidth:2000, maxHeight:2000, imageSmoothingQuality:'high' }); if(!canvas) return; onApply(canvas.toDataURL('image/png')); }
  return (<Modal title="Crop photo" onClose={onClose} wide>
    <div className="space-y-3">
      <div className="bg-slate-900 rounded p-2" style={{minHeight:'320px', maxHeight:'55vh'}}>{loading && <div className="text-slate-300 text-sm text-center py-20">Loading cropper…</div>}<img ref={imgRef} src={src} alt="" style={{maxWidth:'100%', maxHeight:'50vh', display:'block', margin:'0 auto', visibility:loading?'hidden':'visible'}} /></div>
      <div className="flex flex-wrap items-center gap-2 text-xs"><span className="text-slate-500 mr-1">Aspect:</span>{[{label:'Free',v:NaN},{label:'1:1',v:1},{label:'4:3',v:4/3},{label:'3:4',v:3/4},{label:'16:9',v:16/9}].map(a=>(<button key={a.label} onClick={()=>setRatio(a.label,a.v)} className={`px-2.5 py-1 rounded border ${aspect===a.label?'bg-indigo-600 text-white border-indigo-600':'bg-white hover:bg-slate-50'}`}>{a.label}</button>))}<span className="mx-1 text-slate-300">|</span><button onClick={()=>cropperRef.current&&cropperRef.current.rotate(90)} className="px-2.5 py-1 rounded border bg-white hover:bg-slate-50">↻ Rotate</button><button onClick={()=>cropperRef.current&&cropperRef.current.reset()} className="px-2.5 py-1 rounded border bg-white hover:bg-slate-50">Reset</button></div>
      <div className="flex justify-end gap-2 pt-2 border-t"><button onClick={onClose} className="px-4 py-2 rounded border bg-white text-sm">Cancel</button><button onClick={apply} disabled={loading} className="px-4 py-2 rounded bg-emerald-600 text-white text-sm font-semibold disabled:opacity-50">✓ Apply crop</button></div>
    </div>
  </Modal>);
}

function TpImage({ scope, value, onChange, label, h }){
  const [url,setUrl]=useState(''); const [working,setWorking]=useState(null); const [busy,setBusy]=useState('');
  const [showCrop,setShowCrop]=useState(false);
  const [loadErr,setLoadErr]=useState(false);
  useEffect(()=>{ let on=true; setLoadErr(false); setUrl('');
    if(value){ signedUrl(value).then(u=>{ if(on) setUrl(u); }).catch(()=>{ if(on) setLoadErr(true); }); }
    return ()=>{on=false;};
  },[value]);
  async function pick(e){ const f=e.target.files[0]; if(!f) return; try{ setWorking(await readFileAsDataUrl(f)); }catch(err){ alert('Could not read file.'); } e.target.value=''; }
  async function onPaste(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault();
    try{ setWorking(await readFileAsDataUrl(f)); }
    catch(err){ alert('Could not read pasted image.'); }
  }
  async function editExisting(){ if(!url) return; try{ const blob=await (await fetch(url)).blob(); setWorking(await readFileAsDataUrl(blob)); }catch(err){ alert('Could not load image for editing.'); } }
  async function removeBg(){ if(!working) return; setBusy('Starting…'); try{ const data=await removeImageBackground(working, m=>setBusy(m)); setWorking(data); setBusy(''); }catch(err){ setBusy(''); alert('Background removal failed: '+(err.message||err)+'\n\nThe AI model loads from a CDN; if your network blocks it, this will not work.'); } }
  async function saveWorking(){ setBusy('Saving…'); try{ const path=await uploadDataUrl(scope, working); onChange(path); setWorking(null); setBusy(''); }catch(err){ setBusy(''); alert('Upload failed: '+(err.message||err)+'\n\nIf this keeps happening, ask your admin to verify the Attachments storage policies are set up (see steeze-erp-storage-policies.sql).'); } }
  return (<div onPaste={onPaste} tabIndex={0}>{label && <div className="text-[10px] uppercase text-slate-400 mb-1">{label}</div>}
    {working ? (
      <div>
        <div className={`border-2 border-dashed rounded-lg overflow-hidden bg-slate-100 ${h||'h-32'} flex items-center justify-center`} style={{backgroundImage:'linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%)',backgroundSize:'16px 16px',backgroundPosition:'0 0,8px 8px'}}><img src={working} className="w-full h-full object-contain" /></div>
        <div className="flex gap-1 mt-1 no-print flex-wrap">
          <button onClick={()=>setShowCrop(true)} className="text-xs px-2 py-1 rounded bg-emerald-600 text-white hover:bg-emerald-700 font-semibold">✂ Crop</button>
          <button onClick={removeBg} disabled={!!busy} className="text-xs px-2 py-1 rounded bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 font-semibold">{busy && busy!=='Saving…'?'⟳ '+busy:'🪄 Remove BG'}</button>
          <button onClick={saveWorking} disabled={!!busy} className="text-xs px-2 py-1 rounded bg-slate-900 text-white disabled:opacity-50 font-semibold flex-1">{busy==='Saving…'?'Saving…':'Save'}</button>
          <button onClick={()=>setWorking(null)} className="text-xs px-2 py-1 rounded border bg-white">Cancel</button>
        </div>
      </div>
    ) : (
      <div>
        <div className={`border-2 border-dashed rounded-lg overflow-hidden bg-slate-50 ${h||'h-32'} flex flex-col items-center justify-center`}>
          {url ? <img src={url} className="w-full h-full object-contain" /> :
           (value && loadErr) ? <span className="text-rose-500 text-xs text-center px-2">⚠ Image not available<div className="text-[10px] text-rose-400 mt-0.5">Storage may not be accessible. Re-upload or contact admin.</div></span> :
           value ? <span className="text-slate-400 text-xs">Loading…</span> :
           <span className="text-slate-300 text-xs">No image · paste with ⌘V</span>}
        </div>
        <div className="flex gap-1 mt-1 no-print"><label className="text-xs px-2 py-1 rounded border bg-white cursor-pointer flex-1 text-center hover:bg-slate-50">📎 {value?'Replace':'Upload'}<input type="file" accept="image/*" className="hidden" onChange={pick} /></label>{value && !loadErr && <button onClick={editExisting} className="text-xs px-2 py-1 rounded border bg-white" title="Crop / remove background">✎</button>}{value && <button onClick={()=>onChange('')} className="text-xs px-2 py-1 rounded border bg-white text-rose-500">✕</button>}</div>
      </div>
    )}
    {showCrop && <CropModal src={working} onClose={()=>setShowCrop(false)} onApply={(d)=>{ setWorking(d); setShowCrop(false); }} />}
  </div>);
}

/* ============================================================================
   SEWING PAYROLL MODULE
   Six internal tabs: Dashboard · Daily Entry · Payroll · Sewers · Garments · Settings
   All data lives in Supabase tables: payroll_sewers / payroll_garments /
   payroll_entries / payroll_settings. RLS restricts access to admin /
   accounting / sewing_lead.
   ============================================================================ */
function SewingPayroll({ profile }){
  const [tab,setTab]=useState('dashboard');
  const [sewers,setSewers]=useState([]);
  const [garments,setGarments]=useState([]);
  const [entries,setEntries]=useState([]);
  const [pSettings,setPSettings]=useState({ currency:'₱', ot_multiplier:1 });
  const [loading,setLoading]=useState(true);
  const [loadErr,setLoadErr]=useState('');

  async function loadAll(){
    setLoading(true); setLoadErr('');
    try{
      const [sRes, gRes, eRes, setRes] = await Promise.all([
        sb.from('payroll_sewers').select('*').order('name',{ascending:true}),
        sb.from('payroll_garments').select('*').order('name',{ascending:true}),
        sb.from('payroll_entries').select('*').order('date',{ascending:false}),
        sb.from('payroll_settings').select('*').eq('id',1).maybeSingle(),
      ]);
      if(sRes.error)   throw sRes.error;
      if(gRes.error)   throw gRes.error;
      if(eRes.error)   throw eRes.error;
      setSewers(sRes.data||[]);
      setGarments(gRes.data||[]);
      setEntries(eRes.data||[]);
      if(setRes.data) setPSettings(setRes.data);
    }catch(e){
      console.error('Payroll load failed:', e);
      setLoadErr(e.message||String(e));
    } finally { setLoading(false); }
  }
  useEffect(()=>{ loadAll(); },[]);

  const money = (v) => (pSettings.currency||'₱') + Number(v||0).toLocaleString('en-PH', { minimumFractionDigits:2, maximumFractionDigits:2 });

  function entryEarnings(e){
    const g = garments.find(x=>x.id===e.garment_id); if(!g) return 0;
    const op = (g.operations||[]).find(x=>x.id===e.operation_id); if(!op) return 0;
    const base = (Number(op.price)||0) * (Number(e.quantity)||0);
    if(e.time_slot==='overtime') return base * (Number(pSettings.ot_multiplier)||1);
    return base;
  }
  function entryDescribe(e){
    const g = garments.find(x=>x.id===e.garment_id);
    const op = g && (g.operations||[]).find(x=>x.id===e.operation_id);
    return { garment: g?g.name:'(deleted garment)', operation: op?op.name:'(deleted operation)', price: op?(Number(op.price)||0):0 };
  }
  // ---- date helpers (Monday-start ISO weeks) ----
  function todayISOd(){ return new Date().toISOString().slice(0,10); }
  function addDaysISO(d, n){ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
  function getWeekStart(d){ const x=new Date(d+'T00:00:00'); const day=x.getDay(); const diff = day===0 ? -6 : 1-day; x.setDate(x.getDate()+diff); return x.toISOString().slice(0,10); }
  function fmtPayrollDate(d){ if(!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' }); }

  const TABS = [
    { key:'dashboard', label:'Dashboard',  icon:'📊' },
    { key:'entry',     label:'Daily Entry', icon:'✍️' },
    { key:'payroll',   label:'Payroll',    icon:'💰' },
    { key:'sewers',    label:'Sewers',     icon:'👥' },
    { key:'garments',  label:'Garments',   icon:'👕' },
    { key:'settings',  label:'Settings',   icon:'⚙' },
  ];

  // -------- CRUD helpers --------
  async function addSewer(name){
    if(!name.trim()) return alert('Enter a name.');
    if(sewers.some(s=>s.name.toLowerCase()===name.trim().toLowerCase())) return alert('That sewer already exists.');
    const { error } = await sb.from('payroll_sewers').insert({ name:name.trim(), active:true });
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function toggleSewerActive(s){
    const { error } = await sb.from('payroll_sewers').update({ active: !s.active }).eq('id', s.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function renameSewer(s){
    const n=(prompt('Rename sewer:', s.name)||'').trim(); if(!n) return;
    const { error } = await sb.from('payroll_sewers').update({ name:n }).eq('id', s.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function deleteSewer(s){
    const linked = entries.filter(e=>e.sewer_id===s.id).length;
    if(!confirm(`Delete "${s.name}"? This will also delete ${linked} associated entries.`)) return;
    const { error } = await sb.from('payroll_sewers').delete().eq('id', s.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function addGarment(name){
    if(!name.trim()) return alert('Enter a garment name.');
    const { error } = await sb.from('payroll_garments').insert({ name:name.trim(), operations:[] });
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function updateGarmentOps(g, ops){
    const { error } = await sb.from('payroll_garments').update({ operations: ops }).eq('id', g.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function renameGarment(g){
    const n=(prompt('Rename garment:', g.name)||'').trim(); if(!n) return;
    const { error } = await sb.from('payroll_garments').update({ name:n }).eq('id', g.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function deleteGarment(g){
    const linked = entries.filter(e=>e.garment_id===g.id).length;
    if(!confirm(`Delete "${g.name}"? This will also delete ${linked} associated entries.`)) return;
    const { error } = await sb.from('payroll_garments').delete().eq('id', g.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function deleteEntry(e){
    if(!confirm('Delete this entry?')) return;
    const { error } = await sb.from('payroll_entries').delete().eq('id', e.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function toggleEntryStatus(e){
    const next = e.status==='done' ? 'pending' : 'done';
    const { error } = await sb.from('payroll_entries').update({ status: next }).eq('id', e.id);
    if(error){ alert(error.message); return; }
    await loadAll();
  }
  async function updateSettings(patch){
    const { error } = await sb.from('payroll_settings').update(patch).eq('id', 1);
    if(error){ alert(error.message); return; }
    await loadAll();
  }

  if(loading){
    return <div className="p-6"><h1 className="text-2xl font-bold mb-2">✂ Sewing Payroll</h1><div className="text-sm text-slate-400">Loading…</div></div>;
  }
  if(loadErr){
    return <div className="p-6"><h1 className="text-2xl font-bold mb-2">✂ Sewing Payroll</h1><div className="text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded p-3">Failed to load: {loadErr}<br/><span className="text-xs text-slate-500">If this is the first time, make sure you ran steeze-erp-payroll-module.sql in Supabase.</span></div></div>;
  }

  return (
    <div className="p-6 max-w-6xl mx-auto">
      <div className="mb-4">
        <h1 className="text-2xl font-bold">✂ Sewing Production Payroll</h1>
        <p className="text-slate-500 text-sm">Piece-rate · Regular + Overtime · Pending → Done · Weekly payslips</p>
      </div>
      <div className="border-b mb-5 -mx-1 px-1 flex gap-1 overflow-x-auto">
        {TABS.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} className={`px-4 py-2 text-sm font-medium border-b-2 whitespace-nowrap ${tab===t.key?'border-rose-600 text-rose-700':'border-transparent text-slate-500 hover:text-slate-800'}`}>{t.icon} {t.label}</button>
        ))}
      </div>
      {tab==='dashboard' && <PayrollDashboard sewers={sewers} entries={entries} money={money} entryEarnings={entryEarnings} entryDescribe={entryDescribe} pSettings={pSettings} todayISOd={todayISOd} getWeekStart={getWeekStart} addDaysISO={addDaysISO} fmtPayrollDate={fmtPayrollDate} toggleEntryStatus={toggleEntryStatus} />}
      {tab==='entry' && <PayrollDailyEntry sewers={sewers} garments={garments} entries={entries} money={money} entryEarnings={entryEarnings} entryDescribe={entryDescribe} pSettings={pSettings} todayISOd={todayISOd} getWeekStart={getWeekStart} addDaysISO={addDaysISO} fmtPayrollDate={fmtPayrollDate} reload={loadAll} toggleEntryStatus={toggleEntryStatus} deleteEntry={deleteEntry} />}
      {tab==='payroll' && <PayrollPayslips sewers={sewers} entries={entries} money={money} entryEarnings={entryEarnings} entryDescribe={entryDescribe} pSettings={pSettings} todayISOd={todayISOd} getWeekStart={getWeekStart} addDaysISO={addDaysISO} fmtPayrollDate={fmtPayrollDate} />}
      {tab==='sewers' && <PayrollSewers sewers={sewers} entries={entries} money={money} entryEarnings={entryEarnings} addSewer={addSewer} toggleSewerActive={toggleSewerActive} renameSewer={renameSewer} deleteSewer={deleteSewer} />}
      {tab==='garments' && <PayrollGarments garments={garments} money={money} addGarment={addGarment} updateGarmentOps={updateGarmentOps} renameGarment={renameGarment} deleteGarment={deleteGarment} />}
      {tab==='settings' && <PayrollSettings pSettings={pSettings} updateSettings={updateSettings} />}
    </div>
  );
}

function PayrollDashboard({ sewers, entries, money, entryEarnings, entryDescribe, pSettings, todayISOd, getWeekStart, addDaysISO, fmtPayrollDate, toggleEntryStatus }){
  const t = todayISOd();
  const ws = getWeekStart(t);
  const weekDates = Array.from({length:7},(_,i)=>addDaysISO(ws,i));
  const todayDone = entries.filter(e=>e.date===t && e.status==='done');
  const weekDone  = entries.filter(e=>weekDates.includes(e.date) && e.status==='done');
  const weekOt    = weekDone.filter(e=>e.time_slot==='overtime');
  const allPending = entries.filter(e=>e.status==='pending');
  const todayTotal = todayDone.reduce((s,e)=>s+entryEarnings(e),0);
  const weekTotal  = weekDone.reduce((s,e)=>s+entryEarnings(e),0);
  const weekOtTotal= weekOt.reduce((s,e)=>s+entryEarnings(e),0);
  const pendingTotal = allPending.reduce((s,e)=>s+entryEarnings(e),0);
  const bySewer = {};
  weekDone.forEach(e=>{ if(!bySewer[e.sewer_id]) bySewer[e.sewer_id]={reg:0,ot:0,count:0}; bySewer[e.sewer_id][e.time_slot==='overtime'?'ot':'reg']+=entryEarnings(e); bySewer[e.sewer_id].count++; });
  const rows = Object.entries(bySewer).map(([sid,v])=>{ const s=sewers.find(x=>x.id===sid); return { name:s?s.name:'(deleted)', ...v, total:v.reg+v.ot }; }).sort((a,b)=>b.total-a.total);
  const pendingShown = allPending.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="bg-white border rounded-xl p-4"><div className="text-[10px] uppercase tracking-wide text-slate-500">Today (Done)</div><div className="text-2xl font-bold mt-1">{money(todayTotal)}</div><div className="text-xs text-slate-400 mt-0.5">{todayDone.length} entries · {fmtPayrollDate(t)}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[10px] uppercase tracking-wide text-slate-500">This week (Done)</div><div className="text-2xl font-bold mt-1">{money(weekTotal)}</div><div className="text-xs text-slate-400 mt-0.5">{weekDone.length} entries · wk of {fmtPayrollDate(ws)}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[10px] uppercase tracking-wide text-slate-500">OT this week</div><div className="text-2xl font-bold mt-1 text-violet-600">{money(weekOtTotal)}</div><div className="text-xs text-slate-400 mt-0.5">{weekOt.length} OT entries{Number(pSettings.ot_multiplier)!==1?` · ×${Number(pSettings.ot_multiplier).toFixed(2)}`:''}</div></div>
        <div className="bg-white border rounded-xl p-4"><div className="text-[10px] uppercase tracking-wide text-slate-500">Pending</div><div className="text-2xl font-bold mt-1 text-amber-600">{money(pendingTotal)}</div><div className="text-xs text-slate-400 mt-0.5">{allPending.length} awaiting Done</div></div>
      </div>
      <div className="bg-white border rounded-xl p-4">
        <div className="font-semibold text-sm mb-3">This week's earnings by sewer <span className="text-xs text-slate-400 font-normal">(approved/done only)</span></div>
        {rows.length===0 ? <div className="text-center text-sm text-slate-400 py-6">No approved entries this week yet.</div> : (
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1.5">Sewer</th><th className="text-right py-1.5">Entries</th><th className="text-right py-1.5">Regular</th><th className="text-right py-1.5">Overtime</th><th className="text-right py-1.5">Total</th></tr></thead>
            <tbody>{rows.map(r=><tr key={r.name} className="border-t"><td className="py-1.5">{r.name}</td><td className="text-right">{r.count}</td><td className="text-right">{money(r.reg)}</td><td className="text-right text-violet-700">{r.ot>0?money(r.ot):'—'}</td><td className="text-right font-semibold">{money(r.total)}</td></tr>)}</tbody>
          </table></div>
        )}
      </div>
      <div className="bg-white border rounded-xl p-4">
        <div className="font-semibold text-sm mb-3">Pending operations</div>
        {pendingShown.length===0 ? <div className="text-center text-sm text-slate-400 py-6">No pending operations 🎉</div> : (
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1.5">Date</th><th className="text-left py-1.5">Slot</th><th className="text-left py-1.5">Sewer</th><th className="text-left py-1.5">Operation</th><th className="text-right py-1.5">Qty</th><th className="text-right py-1.5">Worth</th><th></th></tr></thead>
            <tbody>{pendingShown.map(e=>{ const s=sewers.find(x=>x.id===e.sewer_id); const d=entryDescribe(e); const isOt=e.time_slot==='overtime'; return (
              <tr key={e.id} className="border-t bg-amber-50/30">
                <td className="py-1.5 whitespace-nowrap">{fmtPayrollDate(e.date)}</td>
                <td>{isOt?<span className="text-[9px] px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 font-semibold">OT</span>:<span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Reg</span>}</td>
                <td>{s?s.name:'(deleted)'}</td>
                <td>{d.operation} <span className="text-xs text-slate-400">— {d.garment}</span></td>
                <td className="text-right">{e.quantity}</td>
                <td className="text-right font-semibold">{money(entryEarnings(e))}</td>
                <td className="text-right"><button onClick={()=>toggleEntryStatus(e)} className="text-xs px-2 py-1 rounded bg-emerald-600 text-white font-semibold hover:bg-emerald-700">Mark done</button></td>
              </tr>
            ); })}</tbody>
          </table></div>
        )}
      </div>
    </div>
  );
}

function PayrollDailyEntry({ sewers, garments, entries, money, entryEarnings, entryDescribe, pSettings, todayISOd, getWeekStart, addDaysISO, fmtPayrollDate, reload, toggleEntryStatus, deleteEntry }){
  const [date,setDate]=useState(todayISOd());
  const [client,setClient]=useState('');
  const [sewerId,setSewerId]=useState('');
  const [garmentId,setGarmentId]=useState('');
  const [note,setNote]=useState('');
  const [opRows,setOpRows]=useState({ regular:[{opId:'',qty:1}], overtime:[] });
  const [busy,setBusy]=useState(false);
  const [filterFrom,setFilterFrom]=useState(todayISOd());
  const [filterTo,setFilterTo]=useState(todayISOd());
  const [filterSewer,setFilterSewer]=useState('');
  const [filterStatus,setFilterStatus]=useState('');
  const [filterSlot,setFilterSlot]=useState('');
  const activeSewers = sewers.filter(s=>s.active);
  const selectedGarment = garments.find(g=>g.id===garmentId);
  function setEntryRange(preset){
    const t = todayISOd();
    if(preset==='today'){ setFilterFrom(t); setFilterTo(t); }
    else if(preset==='yesterday'){ const y=addDaysISO(t,-1); setFilterFrom(y); setFilterTo(y); }
    else if(preset==='thisWeek'){ const f=getWeekStart(t); setFilterFrom(f); setFilterTo(addDaysISO(f,6)); }
    else if(preset==='lastWeek'){ const f=addDaysISO(getWeekStart(t),-7); setFilterFrom(f); setFilterTo(addDaysISO(f,6)); }
    else if(preset==='last7'){ setFilterFrom(addDaysISO(t,-6)); setFilterTo(t); }
    else if(preset==='all'){ setFilterFrom(''); setFilterTo(''); }
  }
  async function addEntries(){
    if(!date) return alert('Pick a date.');
    if(!sewerId) return alert('Pick a sewer.');
    if(!garmentId) return alert('Pick a garment.');
    const validReg = opRows.regular.filter(r=>r.opId && Number(r.qty)>0);
    const validOt  = opRows.overtime.filter(r=>r.opId && Number(r.qty)>0);
    if(validReg.length+validOt.length===0) return alert('Add at least one operation with quantity.');
    setBusy(true);
    const rows = [
      ...validReg.map(r=>({ date, client, sewer_id:sewerId, garment_id:garmentId, operation_id:r.opId, quantity:Number(r.qty), note, status:'pending', time_slot:'regular' })),
      ...validOt.map(r=>({  date, client, sewer_id:sewerId, garment_id:garmentId, operation_id:r.opId, quantity:Number(r.qty), note, status:'pending', time_slot:'overtime' })),
    ];
    const { error } = await sb.from('payroll_entries').insert(rows);
    setBusy(false);
    if(error){ alert(error.message); return; }
    setOpRows({ regular:[{opId:'',qty:1}], overtime:[] }); setNote('');
    await reload();
  }
  async function markAllVisibleDone(){
    const list = getFiltered().filter(e=>e.status==='pending');
    if(list.length===0) return alert('No pending entries in current filter.');
    if(!confirm(`Mark ${list.length} pending entries as Done?`)) return;
    const ids = list.map(e=>e.id);
    const { error } = await sb.from('payroll_entries').update({ status:'done' }).in('id', ids);
    if(error){ alert(error.message); return; }
    await reload();
  }
  function getFiltered(){
    let list = entries.slice().sort((a,b)=>b.date.localeCompare(a.date));
    if(filterFrom) list = list.filter(e=>e.date>=filterFrom);
    if(filterTo)   list = list.filter(e=>e.date<=filterTo);
    if(filterSewer) list = list.filter(e=>e.sewer_id===filterSewer);
    if(filterStatus) list = list.filter(e=>e.status===filterStatus);
    if(filterSlot) list = list.filter(e=>e.time_slot===filterSlot);
    return list;
  }
  const visible = getFiltered();
  const visibleDone = visible.filter(e=>e.status==='done');
  const visiblePending = visible.filter(e=>e.status==='pending');
  return (
    <div className="space-y-4">
      <div className="bg-white border rounded-xl p-4">
        <div className="font-semibold text-sm mb-3">Assign work</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          <TpLbl t="Date"><input type="date" className="input" value={date} onChange={e=>setDate(e.target.value)} /></TpLbl>
          <TpLbl t="Client"><input type="text" className="input" placeholder="e.g. ABC Apparel" value={client} onChange={e=>setClient(e.target.value)} /></TpLbl>
          <TpLbl t="Sewer"><select className="input" value={sewerId} onChange={e=>setSewerId(e.target.value)}><option value="">— Select sewer —</option>{activeSewers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></TpLbl>
          <TpLbl t="Garment / Project"><select className="input" value={garmentId} onChange={e=>setGarmentId(e.target.value)}><option value="">— Select garment —</option>{garments.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></TpLbl>
        </div>
        {/* Regular section */}
        <div className="mt-4 border rounded-lg p-3 bg-slate-50">
          <div className="text-sm font-semibold mb-2">⏰ Regular hours <span className="text-[10px] uppercase tracking-wide bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">Standard rate</span></div>
          <PayrollOpRows slot="regular" rows={opRows.regular} garment={selectedGarment} money={money} onChange={(rows)=>setOpRows(p=>({...p,regular:rows}))} />
          <button onClick={()=>setOpRows(p=>({...p,regular:[...p.regular,{opId:'',qty:1}]}))} className="mt-2 text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">+ Add operation (Regular)</button>
        </div>
        <div className="mt-3 border rounded-lg p-3 bg-violet-50/50">
          <div className="text-sm font-semibold mb-2">🌙 Overtime <span className="text-[10px] uppercase tracking-wide bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded">{Number(pSettings.ot_multiplier)===1?'Same rate':'× '+Number(pSettings.ot_multiplier).toFixed(2)+' rate'}</span></div>
          <PayrollOpRows slot="overtime" rows={opRows.overtime} garment={selectedGarment} money={money} onChange={(rows)=>setOpRows(p=>({...p,overtime:rows}))} />
          <button onClick={()=>setOpRows(p=>({...p,overtime:[...p.overtime,{opId:'',qty:1}]}))} className="mt-2 text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50 text-violet-700">+ Add operation (Overtime)</button>
        </div>
        <TpLbl t="Note (applies to all operations above)"><input className="input" placeholder="e.g. Bundle #14, Color: navy" value={note} onChange={e=>setNote(e.target.value)} /></TpLbl>
        <div className="mt-3 flex items-center gap-2 flex-wrap">
          <button disabled={busy} onClick={addEntries} className="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-semibold hover:bg-rose-700 disabled:opacity-50">{busy?'Saving…':'Assign as pending'}</button>
          <span className="text-xs text-slate-500">All operations will be saved as Pending. Mark them done in the list below when completed.</span>
        </div>
      </div>
      <div className="bg-white border rounded-xl p-4">
        <div className="font-semibold text-sm mb-3">Entries</div>
        <div className="flex flex-wrap gap-2 mb-3">
          <input type="date" className="input max-w-[10rem]" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)} placeholder="From" />
          <input type="date" className="input max-w-[10rem]" value={filterTo} onChange={e=>setFilterTo(e.target.value)} placeholder="To" />
          <select className="input max-w-[10rem]" value={filterSewer} onChange={e=>setFilterSewer(e.target.value)}><option value="">All sewers</option>{sewers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
          <select className="input max-w-[8rem]" value={filterSlot} onChange={e=>setFilterSlot(e.target.value)}><option value="">All slots</option><option value="regular">Regular only</option><option value="overtime">Overtime only</option></select>
          <select className="input max-w-[8rem]" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="">All</option><option value="pending">Pending only</option><option value="done">Done only</option></select>
          <div className="flex-1"></div>
          {visiblePending.length>0 && <button onClick={markAllVisibleDone} className="text-xs px-3 py-1.5 rounded bg-emerald-600 text-white font-semibold hover:bg-emerald-700">Mark all visible as Done ({visiblePending.length})</button>}
        </div>
        <div className="flex flex-wrap gap-1 text-xs mb-3 text-slate-500"><span className="self-center">Quick:</span>
          {[['today','Today'],['yesterday','Yesterday'],['thisWeek','This week'],['lastWeek','Last week'],['last7','Last 7 days'],['all','All']].map(([k,l])=><button key={k} onClick={()=>setEntryRange(k)} className="px-2 py-0.5 rounded hover:bg-slate-100">{l}</button>)}
        </div>
        {visible.length===0 ? <div className="text-center text-sm text-slate-400 py-8">No entries for this filter.</div> : (
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead className="text-xs uppercase text-slate-500"><tr><th className="text-left py-1.5">Date</th><th>Slot</th><th>Client</th><th>Sewer</th><th>Garment / Operation</th><th className="text-right">Qty</th><th className="text-right">Rate</th><th className="text-right">Earned</th><th>Status</th><th></th></tr></thead>
            <tbody>{visible.map(e=>{ const s=sewers.find(x=>x.id===e.sewer_id); const d=entryDescribe(e); const isOt=e.time_slot==='overtime'; const isPending=e.status==='pending'; return (
              <tr key={e.id} className={`border-t ${isPending?'bg-amber-50/40':(isOt?'bg-violet-50/30':'')}`}>
                <td className="py-1.5 whitespace-nowrap">{fmtPayrollDate(e.date)}</td>
                <td>{isOt?<span className="text-[9px] px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 font-semibold">OT</span>:<span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">Reg</span>}</td>
                <td>{e.client||''}</td>
                <td>{s?s.name:'(deleted)'}</td>
                <td><div>{d.operation}</div><div className="text-[10px] text-slate-400">{d.garment}{e.note?` · ${e.note}`:''}</div></td>
                <td className="text-right">{e.quantity}</td>
                <td className="text-right">{money(d.price)}{isOt && Number(pSettings.ot_multiplier)!==1 && <div className="text-[10px] text-slate-500">×{Number(pSettings.ot_multiplier).toFixed(2)}</div>}</td>
                <td className="text-right font-semibold">{money(entryEarnings(e))}</td>
                <td>{isPending?<span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-semibold">Pending</span>:<span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold">Done</span>}</td>
                <td className="text-right whitespace-nowrap">
                  {isPending?<button onClick={()=>toggleEntryStatus(e)} className="text-xs px-2 py-1 rounded bg-emerald-600 text-white font-semibold mr-1">Mark done</button>:<button onClick={()=>toggleEntryStatus(e)} className="text-xs px-2 py-1 rounded bg-amber-100 text-amber-700 mr-1">Unmark</button>}
                  <button onClick={()=>deleteEntry(e)} className="text-xs text-rose-500 hover:underline">Delete</button>
                </td>
              </tr>
            ); })}
            </tbody>
          </table></div>
        )}
        {visible.length>0 && (
          <div className="mt-3 grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
            <div className="bg-slate-50 border rounded-lg p-2"><div className="text-[10px] uppercase text-slate-500">Done — Regular</div><div className="font-bold">{money(visibleDone.filter(e=>e.time_slot==='regular').reduce((s,e)=>s+entryEarnings(e),0))}</div></div>
            <div className="bg-violet-50 border rounded-lg p-2"><div className="text-[10px] uppercase text-slate-500">Done — Overtime</div><div className="font-bold text-violet-700">{money(visibleDone.filter(e=>e.time_slot==='overtime').reduce((s,e)=>s+entryEarnings(e),0))}</div></div>
            <div className="bg-amber-50 border rounded-lg p-2"><div className="text-[10px] uppercase text-slate-500">Pending</div><div className="font-bold text-amber-700">{money(visiblePending.reduce((s,e)=>s+entryEarnings(e),0))}</div></div>
          </div>
        )}
      </div>
    </div>
  );
}

function PayrollOpRows({ slot, rows, garment, money, onChange }){
  function setRow(i, patch){ onChange(rows.map((r,idx)=>idx===i?{...r,...patch}:r)); }
  function removeRow(i){ onChange(rows.filter((_,idx)=>idx!==i)); }
  if(rows.length===0) return <div className="text-xs text-slate-400 italic">No {slot} operations added.</div>;
  return (
    <div className="space-y-2">
      {rows.map((r,i)=>(
        <div key={i} className="grid grid-cols-12 gap-2 items-center">
          <select className="input col-span-7" value={r.opId} onChange={e=>setRow(i,{opId:e.target.value})}>
            {garment ? <>
              <option value="">— Select operation —</option>
              {(garment.operations||[]).map(o=><option key={o.id} value={o.id}>{o.name||'(unnamed)'} — {money(o.price)}</option>)}
            </> : <option value="">— First select a garment —</option>}
          </select>
          <input type="number" min="1" className="input col-span-3" value={r.qty} onChange={e=>setRow(i,{qty:e.target.value})} placeholder="Qty" />
          <div className="col-span-2 text-right"><button onClick={()=>removeRow(i)} className="text-rose-400 text-lg" title="Remove">✕</button></div>
        </div>
      ))}
    </div>
  );
}

function PayrollPayslips({ sewers, entries, money, entryEarnings, entryDescribe, pSettings, todayISOd, getWeekStart, addDaysISO, fmtPayrollDate }){
  const [from,setFrom]=useState(getWeekStart(todayISOd()));
  const [to,setTo]=useState(addDaysISO(getWeekStart(todayISOd()),6));
  const [sewerFilter,setSewerFilter]=useState('');
  function setRange(preset){
    const t = todayISOd();
    if(preset==='thisWeek'){ const f=getWeekStart(t); setFrom(f); setTo(addDaysISO(f,6)); }
    else if(preset==='lastWeek'){ const f=addDaysISO(getWeekStart(t),-7); setFrom(f); setTo(addDaysISO(f,6)); }
    else if(preset==='last2Weeks'){ setFrom(addDaysISO(getWeekStart(t),-7)); setTo(addDaysISO(getWeekStart(t),6)); }
    else if(preset==='last30'){ setFrom(addDaysISO(t,-29)); setTo(t); }
  }
  function shift(direction){
    if(!from||!to) return;
    const days = Math.round((new Date(to+'T00:00:00')-new Date(from+'T00:00:00'))/86400000)+1;
    setFrom(addDaysISO(from, direction*days));
    setTo(addDaysISO(to, direction*days));
  }
  const inRange = e => e.date>=from && e.date<=to;
  const sewersToShow = sewerFilter ? sewers.filter(s=>s.id===sewerFilter) : sewers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  let grandTotal=0, grandReg=0, grandOt=0, anyEntries=false;

          <div className="flex-1"></div>
          <button onClick={()=>window.print()} className="text-xs px-3 py-2 rounded bg-rose-600 text-white font-semibold hover:bg-rose-700">🖨 Print payslip(s)</button>
        </div>
        <div className="flex flex-wrap gap-1 text-xs mt-3 text-slate-500"><span className="self-center">Quick:</span>
          {[['thisWeek','This week'],['lastWeek','Last week'],['last2Weeks','Last 2 weeks'],['last30','Last 30 days']].map(([k,l])=><button key={k} onClick={()=>setRange(k)} className="px-2 py-0.5 rounded hover:bg-slate-100">{l}</button>)}
        </div>
      </div>
      {pendingBanner && <div className="no-print bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded text-sm">{pendingBanner}</div>}
      <div>
        {sewersToShow.map(s=>{
          const sewerEntries = entries.filter(e=>e.sewer_id===s.id && inRange(e) && e.status==='done');
          if(sewerEntries.length===0 && !sewerFilter && !s.active) return null;
          const totalReg = sewerEntries.filter(e=>e.time_slot==='regular').reduce((sum,e)=>sum+entryEarnings(e),0);
          const totalOt  = sewerEntries.filter(e=>e.time_slot==='overtime').reduce((sum,e)=>sum+entryEarnings(e),0);
          const total = totalReg+totalOt;
          if(sewerEntries.length>0) anyEntries=true;

                const dayReg = dayEntries.filter(e=>e.time_slot==='regular').reduce((s,e)=>s+entryEarnings(e),0);
                const dayOt  = dayEntries.filter(e=>e.time_slot==='overtime').reduce((s,e)=>s+entryEarnings(e),0);
                const dayTotal = dayReg+dayOt;
                return (

                    <summary className="cursor-pointer px-3 py-2 bg-slate-50 border rounded text-sm font-semibold flex justify-between"><span>{fmtPayrollDate(date)}</span><span>{dayOt>0?<><span className="text-emerald-700">{money(dayReg)}</span> + <span className="text-violet-700">OT {money(dayOt)}</span> · </>:''}<strong>{money(dayTotal)}</strong></span></summary>
                    <div className="border border-t-0 rounded-b">
                      <table className="w-full text-xs">
                        <thead className="bg-slate-50"><tr><th className="text-left p-2">Slot</th><th className="text-left p-2">Client</th><th className="text-left p-2">Garment</th><th className="text-left p-2">Operation</th><th className="text-right p-2">Qty</th><th className="text-right p-2">Rate</th><th className="text-right p-2">Earned</th></tr></thead>

                            <td className="p-2">{e.client||''}</td>
                            <td className="p-2">{d.garment}</td>
                            <td className="p-2">{d.operation}{e.note?<div className="text-[10px] text-slate-400">{e.note}</div>:''}</td>
                            <td className="p-2 text-right">{e.quantity}</td>
                            <td className="p-2 text-right">{money(d.price)}{isOt&&Number(pSettings.ot_multiplier)!==1?<div className="text-[10px] text-slate-500">×{Number(pSettings.ot_multiplier).toFixed(2)}</div>:''}</td>
                            <td className="p-2 text-right font-semibold">{money(entryEarnings(e))}</td>
                          </tr>
                        ); })}
                        </tbody>
                      </table>
                    </div>
                  </details>
                );
              })}
              <div className="grid grid-cols-2 gap-3 mt-4">
                <div className="bg-slate-50 border rounded p-3"><div className="text-[10px] uppercase text-slate-500">Regular hours total</div><div className="text-lg font-bold">{money(totalReg)}</div></div>
                <div className="bg-violet-50 border rounded p-3"><div className="text-[10px] uppercase text-slate-500">Overtime total{Number(pSettings.ot_multiplier)!==1?` (×${Number(pSettings.ot_multiplier).toFixed(2)})`:''}</div><div className="text-lg font-bold text-violet-700">{money(totalOt)}</div></div>
              </div>
              <div className="mt-3 bg-slate-900 text-white rounded p-4 flex justify-between items-center"><div className="font-semibold">Total earnings for the {periodLabel.toLowerCase()}</div><div className="text-2xl font-bold">{money(total)}</div></div>
            </div>
          );
        })}
        {!anyEntries && <div className="text-center text-sm text-slate-400 py-8">No approved entries in this period.</div>}
        {sewersToShow.length>1 && anyEntries && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 no-print">
            <div className="flex justify-between flex-wrap gap-3">
              <div><div className="text-[10px] uppercase text-slate-500">{periodLabel} of {fmtPayrollDate(from)} – {fmtPayrollDate(to)}</div><div>{sewersToShow.length} sewers</div></div>
              <div className="text-right"><div className="text-[10px] uppercase text-slate-500">Regular</div><div className="text-lg font-bold text-emerald-700">{money(grandReg)}</div></div>

              <div className="text-right"><div className="text-[10px] uppercase text-slate-500">Total payroll</div><div className="text-xl font-bold text-emerald-800">{money(grandTotal)}</div></div>

    </div>
  );
}

// One row inside a garment's operations list. Uses UNCONTROLLED inputs (refs
// + defaultValue) so React never touches the input value while you type —
// the browser handles every keystroke natively, no re-renders, no race with
// Supabase. We only read the values on blur / Enter and commit the diff.
function PayrollOpRow({ op, onCommit, onRemove }){
  const nameRef = useRef(null);
  const priceRef = useRef(null);
  function commit(){
    if(!nameRef.current || !priceRef.current) return;
    const newName = nameRef.current.value.trim();
    const newPrice = Number(priceRef.current.value)||0;
    if(newName === (op.name||'').trim() && newPrice === (Number(op.price)||0)) return;
    onCommit({ ...op, name: newName, price: newPrice });
  }
  return (
    <div className="grid grid-cols-12 gap-2 items-center">
      <input
        key={'name-'+op.id}
        ref={nameRef}
        className="input col-span-7"
        placeholder="e.g. Attach collar"
        defaultValue={op.name||''}
        onBlur={commit}
        onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }} />
      <input
        key={'price-'+op.id}
        ref={priceRef}
        type="number" step="0.01" min="0"
        className="input col-span-4"
        defaultValue={op.price==null ? '' : String(op.price)}
        onBlur={commit}
        onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }} />
      <div className="col-span-1 text-right">
        <button onClick={onRemove} className="text-rose-400 text-lg" title="Remove">✕</button>
      </div>
    </div>
  );
}

function PayrollGarments({ garments, money, addGarment, updateGarmentOps, renameGarment, deleteGarment }){
  const [newName,setNewName]=useState('');
  function submit(){ if(!newName.trim()) return; addGarment(newName).then(()=>setNewName('')); }
  function addOp(g){
    const newOp = { id:'op'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:'', price:0 };
    updateGarmentOps(g, [...(g.operations||[]), newOp]);
  }
  // Same id-normalization the render uses so commits / removes match the
  // synthetic legacy-* ids correctly even on rows that arrived without ids.
  function normOps(g){
    return (g.operations||[]).map((o,i)=> o.id ? o : { ...o, id:'legacy-'+g.id+'-'+i });
  }
  function commitOp(g, updatedOp){
    const ops = normOps(g).map(o => o.id===updatedOp.id ? updatedOp : o);
    updateGarmentOps(g, ops);
  }
  function removeOp(g, opId){
    if(!confirm('Remove this operation?')) return;
    const ops = normOps(g).filter(o=>o.id!==opId);
    updateGarmentOps(g, ops);
  }
  return (
    <div className="space-y-4">
      <div className="bg-white border rounded-xl p-4">
        <div className="flex gap-2 items-end">
          <div className="flex-1"><TpLbl t="New garment / project name"><input className="input" placeholder="e.g. Long-sleeve blouse — Style 1042" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }} /></TpLbl></div>
          <button onClick={submit} className="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-semibold hover:bg-rose-700">Add garment</button>
        </div>
      </div>
      {garments.length===0 ? <div className="bg-white border rounded-xl p-8 text-center text-sm text-slate-400">No garments yet. Add one above.</div> : garments.map(g=>{
        // Make sure every operation has a stable id — older rows saved before
        // id was tracked end up with `undefined`, which made React treat all
        // rows as the same key and lose typing state on re-render.
        const operations = (g.operations||[]).map((o,i)=> o.id ? o : { ...o, id:'legacy-'+g.id+'-'+i });
        const total = operations.reduce((s,o)=>s+(Number(o.price)||0),0);
        return (
          <div key={g.id} className="bg-white border rounded-xl p-4">
            <div className="flex justify-between items-start mb-3">
              <div><div className="font-bold">{g.name}</div><div className="text-xs text-slate-500">{(g.operations||[]).length} operation{(g.operations||[]).length===1?'':'s'} · Total per garment: <strong>{money(total)}</strong></div></div>
              <div><button onClick={()=>renameGarment(g)} className="text-xs text-slate-500 hover:underline mr-2">Rename</button><button onClick={()=>deleteGarment(g)} className="text-xs text-rose-500 hover:underline">Delete</button></div>
            </div>
            <div className="space-y-2">
              <div className="grid grid-cols-12 gap-2 text-[10px] uppercase tracking-wide text-slate-500"><div className="col-span-7">Operation</div><div className="col-span-4">Price per piece</div><div></div></div>
              {operations.map(op=>(
                <PayrollOpRow key={op.id} op={op} onCommit={(u)=>commitOp(g,u)} onRemove={()=>removeOp(g, op.id)} />
              ))}
              <button onClick={()=>addOp(g)} className="text-xs px-3 py-1.5 rounded border bg-white hover:bg-slate-50">+ Add operation</button>
              <div className="text-[10px] text-slate-400 mt-1">💾 Changes save when you click out of the field or press Enter.</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
