<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steeze OS</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- PWA: installable app metadata + icons. Browsers / iOS / Android use these
       to render the install prompt and home-screen icon. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Steeze OS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Steeze OS" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="description" content="Steeze OS — internal operations system for sales, production, logistics, and payroll." />
  <!-- ────────────────────────────────────────────────────────────────
       PERFORMANCE: preload the four heaviest CDN scripts in parallel.
       Without these hints the browser only discovers them when it
       reaches the <script> tag in document order. On mobile this turns
       a serial waterfall into a parallel one and shaves real seconds
       off cold-start time.
       ──────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preload" as="script" href="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin />
  <link rel="preload" as="script" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin />
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Confetti for "Closed Won" celebrations. ~10KB, zero deps. Exposes
       window.confetti(opts). https://github.com/catdad/canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- OneSignal Web SDK for real push notifications (Layer 2). Init runs as
       soon as the page loads; users still need to grant permission via the
       Enable notifications button before they'll start receiving pushes. The
       SW work is delegated to our existing /sw.js (it imports OneSignal's SW
       script). -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "3de42243-f8d2-43a8-8d7c-3d60f3044cf0",
          serviceWorkerPath: "/sw.js",
          serviceWorkerParam: { scope: "/" },
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
          // We trigger the prompt ourselves from the "Enable phone
          // notifications" button — don't auto-prompt on load.
          promptOptions: { slidedown: { prompts: [{ type: "push", autoPrompt: false }] } }
        });
      } catch(err){ console.warn('OneSignal init failed:', err); }
    });
  </script>
  <style>
    .input { width:100%; border:1px solid #cbd5e1; border-radius:0.5rem; padding:0.5rem 0.75rem; font-size:0.875rem; }
    .tp-page { width:11in; min-height:8.5in; background:#fff; margin:0 auto 1.25rem; padding:0.4in; box-shadow:0 1px 6px rgba(0,0,0,.12); display:flex; flex-direction:column; }
    /* Portrait Letter page — used for purchase docs (PR / PO). Same flex
       column structure as .tp-page so the existing layout logic carries over,
       just narrower and taller. */
    .po-page { width:8in; min-height:10.5in; background:#fff; margin:0 auto 1.25rem; padding:0.5in; box-shadow:0 1px 6px rgba(0,0,0,.12); display:flex; flex-direction:column; }
    /* Default print page = Letter LANDSCAPE for the techpack. PR/PO modals
       inject their own portrait @page override at mount time so the page
       orientation actually switches when those modals are open. */
    @page { size: 11in 8.5in; margin: 0.4in; }
    @page :first { size: 11in 8.5in; margin: 0.4in; }
    @media print {
      html, body { background:#fff; margin:0; padding:0; height:auto !important; overflow:visible !important; }
      .no-print { display:none !important; }
      .app-root { min-height:0 !important; background:#fff !important; }
      .tp-root { position:static !important; inset:auto !important; overflow:visible !important; height:auto !important; z-index:auto !important; }
      /* Strip Tailwind's py-6 from the print wrapper — that 1.5rem top/bottom
         padding was spilling onto a blank second PDF page. */
      .tp-print { margin:0 !important; padding:0 !important; max-width:none !important; }
      /* Make the printed page match the on-screen preview exactly.
         Letter landscape (11in × 8.5in) minus the 0.4in @page margin on each
         side leaves a printable area of 10.2in × 7.7in — same usable size as
         the preview's 11in page with 0.4in padding. Using inches (not vh)
         keeps proportions stable across browsers/printers. */
      .tp-page { width:10.2in; height:7.6in; min-height:0; box-shadow:none; border:none; margin:0; padding:0; overflow:hidden; display:flex; flex-direction:column; page-break-after: always; break-after: page; page-break-inside: avoid; break-inside: avoid; }
      /* The last page must NOT force a page break — otherwise the print
         engine emits a blank final page. !important beats inherited rules. */
      .tp-page:last-child { page-break-after: avoid !important; break-after: avoid !important; }
      /* Portrait Letter (8.5in × 11in) minus 0.4in @page margin all sides
         leaves 7.7in × 10.2in of usable area. PR/PO modals inject a portrait
         @page override at runtime so this size is what actually fits. */
      .po-page { width:7.7in; height:10.2in; min-height:0; box-shadow:none; border:none; margin:0; padding:0; overflow:hidden; display:flex; flex-direction:column; page-break-after: always; break-after: page; page-break-inside: avoid; break-inside: avoid; }
      .po-page:last-child { page-break-after: avoid !important; break-after: avoid !important; }
      /* Let images respect their inline maxH (e.g. 6in for cover shots) so
         we don't blow them up beyond the design intent. The previous
         !important override was stripping the inline cap. */
      .tp-page img { max-width:100%; max-height:100%; object-fit:contain; }
      /* Force red titles, gray header bars, and colored cells to print as
         shown on screen — Chrome / Safari otherwise wash colors out. */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

      /* ───── MODAL-AWARE PRINT ─────
         When the user prints while a modal is open (Voucher view, PO view,
         PR view, etc.), we want ONLY the modal contents to appear on the
         printout — not the dark backdrop, not the sidebar, not the page
         underneath, not the modal title bar.
         The Modal component uses ReactDOM.createPortal to render into
         document.body, so the backdrop is a SIBLING of #root. We gate
         everything with body:has(.steeze-modal-backdrop) so non-modal
         prints (payslips, techpacks rendered inline) are not affected. */
      body:has(.steeze-modal-backdrop):not(:has(.tp-root)) > #root { display: none !important; }
      body:has(.steeze-modal-backdrop) .steeze-modal-backdrop {
        position: static !important;
        background: transparent !important;
        padding: 0 !important; margin: 0 !important;
        overflow: visible !important;
        display: block !important;
        inset: auto !important;
        height: auto !important; width: 100% !important;
      }
      body:has(.steeze-modal-backdrop) .steeze-modal-card {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        max-height: none !important;
        max-width: none !important;
        width: 100% !important;
        overflow: visible !important;
        display: block !important;
      }
      body:has(.steeze-modal-backdrop) .steeze-modal-body {
        padding: 0 !important;
        overflow: visible !important;
        max-height: none !important;
      }
      body:has(.steeze-modal-backdrop) .steeze-modal-header { display: none !important; }

      /* ───── PO / TECHPACK PRINT (tp-root) ─────
         When the user clicks Print inside a tp-root preview (PO, PR, Techpack,
         BIR 2307), only tp-root contents should print. tp-root often opens
         on top of a Modal (e.g. PO print preview launched from inside the PO
         form modal). In that case we must HIDE the underlying modal AND the
         sidebar so the printout is clean. Approach:
           • Hide modal backdrop (so the Modal-aware print rules don't kick in)
           • Hide every #root direct child that does NOT contain a tp-root
           • tp-root already escapes its `fixed inset-0` positioning via the
             existing .tp-root reset above. */
      body:has(.tp-root) .steeze-modal-backdrop { display: none !important; }
      body:has(.tp-root) #root > *:not(:has(.tp-root)):not(.tp-root) { display: none !important; }
    }
  </style>
  <script>
  // On-screen fatal-error panel. Only surfaces TRULY fatal errors:
  //   • thrown JS errors (window.error) — usually means the React tree crashed
  //   • unhandled promise rejections that look like app bugs
  // Library noise like Supabase Realtime "Failed to fetch" retries is ignored.
  (function(){
    function box(){ var d=document.getElementById('fatal'); if(!d){ d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:#fee2e2;color:#991b1b;font:12px/1.5 monospace;padding:12px;z-index:99999;white-space:pre-wrap;border-top:3px solid #991b1b;';
      (document.body||document.documentElement).appendChild(d); d.textContent='⚠ ERROR — screenshot this and send it:\n'; } return d; }
    window.__err=function(m){ try{ box().textContent += '\n'+m; }catch(_){}};
    // Patterns we want to silence (transient network / realtime / browser noise).
    var IGNORE=[/Failed to fetch/i, /NetworkError/i, /Load failed/i, /WebSocket/i, /realtime/i, /Channel error/i, /AbortError/i, /ResizeObserver/i];
    function isNoise(s){ s=String(s||''); return IGNORE.some(function(re){ return re.test(s); }); }
    window.addEventListener('error', function(e){ var msg=(e.message||e.error||e); if(isNoise(msg)) return; window.__err('JS: '+msg+(e.filename?'  ['+e.filename+':'+e.lineno+']':'')); });
    window.addEventListener('unhandledrejection', function(e){ var msg=(e.reason&&e.reason.message)||JSON.stringify(e.reason); if(isNoise(msg)) return; window.__err('PROMISE: '+msg); });
  })();
  </script>
</head>
<body class="bg-slate-100">
  <!-- ──────────────────────────────────────────────────────────────────
       SPLASH SCREEN — visible IMMEDIATELY on page load. React replaces
       #root contents on first render, so this auto-disappears the moment
       the app is interactive. Critical on mobile because Babel-standalone
       can take 3–6 seconds to transpile the script on a phone, and a
       blank white screen during that wait feels like a broken app.
       Pure HTML/CSS — zero JS dependency, so it renders during the
       Babel pause. ────────────────────────────────────────────────── -->
  <div id="root">
    <div id="steeze-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b 0%,#1e3a8a 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:1;">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
        <svg width="46" height="46" viewBox="0 0 1350 2050" style="filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));">
          <path d="M 1228 1 L 1213 27 L 1219 17 Z M 824 832 L 124 2046 L 1338 949 L 1336 871 Z" fill="#fbbf24"></path>
        </svg>
        <div style="font-size:30px;font-weight:800;letter-spacing:-0.02em;">Steeze OS</div>
      </div>
      <div style="font-size:13px;opacity:0.7;margin-bottom:22px;">Loading your workspace…</div>
      <div style="width:42px;height:42px;border:3px solid rgba(255,255,255,.18);border-top-color:#fbbf24;border-radius:50%;animation:steezeSpin 0.8s linear infinite;"></div>
      <div style="position:absolute;bottom:24px;font-size:10px;opacity:0.4;letter-spacing:0.08em;text-transform:uppercase;">Steeze Corporation</div>
    </div>
    <style>@keyframes steezeSpin{to{transform:rotate(360deg);}}</style>
  </div>


  <!-- App code is precompiled from src/app.jsx -> /app.js by esbuild on deploy
       (see package.json + vercel.json). Removes the in-browser Babel pass that
       used to transpile ~1.5MB of JSX on every cold load. defer = run after the
       DOM (so #root exists) and after the React / Supabase CDN scripts above. -->
  <script src="/app.js" defer></script>
</body>
</html>
