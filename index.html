  <script>
  // On-screen fatal-error panel. Only surfaces TRULY fatal errors:
  //   • thrown JS errors (window.error) — usually means the React tree crashed
  //   • unhandled promise rejections that look like app bugs
  // Library noise like Supabase Realtime "Failed to fetch" retries is ignored.
  (function(){
    function box(){ var d=document.getElementById('fatal'); if(!d){ d=document.createElement('div'); d.id='fatal';
      d.style.cssText='position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:#fee2e2;color:#991b1b;font:12px/1.5 monospace;padding:12px;z-index:99999;white-space:pre-wrap;border-top:3px solid #991b1b;';
      (document.body||document.documentElement).appendChild(d); d.textContent='⚠ ERROR — screenshot this and send it:\n'; } return d; }
    window.__err=function(m){ try{ box().textContent += '\n'+m; }catch(_){}};
    // Patterns we want to silence (transient network / realtime / browser noise).
    var IGNORE=[/Failed to fetch/i, /NetworkError/i, /Load failed/i, /WebSocket/i, /realtime/i, /Channel error/i, /AbortError/i, /ResizeObserver/i];
    function isNoise(s){ s=String(s||''); return IGNORE.some(function(re){ return re.test(s); }); }
    window.addEventListener('error', function(e){ var msg=(e.message||e.error||e); if(isNoise(msg)) return; window.__err('JS: '+msg+(e.filename?'  ['+e.filename+':'+e.lineno+']':'')); });
    window.addEventListener('unhandledrejection', function(e){ var msg=(e.reason&&e.reason.message)||JSON.stringify(e.reason); if(isNoise(msg)) return; window.__err('PROMISE: '+msg); });
  })();
  </script>

// Minimal RFC-4180 CSV parser: handles quoted fields, doubled-quote escapes, CRLF.
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  const s=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inQ){
      if(c==='"'){ if(s[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>(v||'').trim()!==''));
}

// Gentle two-tone ping for @mention notifications. Web Audio (no asset needed).
function playPing(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(); const now = ctx.currentTime;
    [880, 1320].forEach((freq,i)=>{
      const t = now + i*0.13;
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, t+0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+0.4);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(_){} }, 900);
  } catch(_) {}
}

function deadlineInfo(due, done){
  if(done) return { label:'', cls:'text-slate-400', overdue:false };
  if(!due) return { label:'', cls:'text-slate-400', overdue:false };
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due+'T00:00:00');
  const days = Math.round((d - today)/86400000);
  if(days < 0) return { label:`${-days}d overdue`, cls:'text-rose-600 font-semibold', overdue:true };
  if(days === 0) return { label:'due today', cls:'text-amber-600 font-semibold', overdue:false };
  if(days <= 3) return { label:`in ${days}d`, cls:'text-amber-600', overdue:false };
  return { label:`in ${days}d`, cls:'text-slate-400', overdue:false };
}

function parseMentions(text, profiles){
  const ids=[]; const re=/@(\w+)/g; let m;
  while((m=re.exec(text||''))){ const fn=m[1].toLowerCase(); const p=profiles.find(pp=>((pp.name||'').split(' ')[0].toLowerCase())===fn); if(p && !ids.includes(p.id)) ids.push(p.id); }
  return ids;
}
function renderCommentText(text, profiles){
  const parts=[]; const re=/(@\w+)/g; let last=0,m,i=0;
  while((m=re.exec(text||''))){ if(m.index>last) parts.push(text.slice(last,m.index));
    const fn=m[0].slice(1).toLowerCase(); const p=profiles.find(pp=>((pp.name||'').split(' ')[0].toLowerCase())===fn);
    if(p) parts.push(<span key={i++} className="bg-indigo-100 text-indigo-700 rounded px-1 font-medium">{m[0]}</span>); else parts.push(m[0]);
    last=re.lastIndex; }
  if(last<(text||'').length) parts.push(text.slice(last));
  return parts;
}

async function signedUrl(path){ const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600); if(error) throw error; return data.signedUrl; }
async function uploadFile(scope, file){
  const safe=file.name.replace(/[^\w.\-]/g,'_'); const path=`${scope}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false }); if(error) throw error;
  return { type: file.type==='application/pdf'?'pdf':(file.type.startsWith('image/')?'image':'file'), name:file.name, path, mime:file.type };
}

// Extract a pasted image (screenshot / Cmd+V) from a clipboard event.
// Returns a File ready to feed into uploadFile, or null if no image was pasted.
function getPastedImage(e){
  const items = e.clipboardData && e.clipboardData.items; if(!items) return null;
  for(let i=0;i<items.length;i++){
    const item=items[i];
    if(item.kind==='file' && (item.type||'').startsWith('image/')){
      const blob = item.getAsFile(); if(!blob) continue;
      const ext = ((item.type.split('/')[1]||'png').toLowerCase()).replace('jpeg','jpg');
      const fname = (blob.name && blob.name!=='image.png') ? blob.name : `pasted-${Date.now()}.${ext}`;
      return new File([blob], fname, { type: item.type });
    }
  }
  return null;
}

const AVA_COLORS=['bg-blue-500','bg-emerald-500','bg-amber-500','bg-purple-500','bg-rose-500','bg-cyan-500','bg-indigo-500','bg-pink-500','bg-teal-500','bg-orange-500'];
function avaColor(id){ if(!id) return 'bg-slate-400'; let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVA_COLORS[h%AVA_COLORS.length]; }
function Avatar({ profile, size='md' }){

  return <div className={`${cls} rounded-full ${avaColor(profile&&profile.id)} text-white flex items-center justify-center font-bold shrink-0`}>{initials}</div>;
}
function MediaLightbox({ url, name, kind, onClose }){
  // kind: 'image' or 'pdf'
  useEffect(()=>{ const k=(e)=>{ if(e.key==='Escape') onClose(); }; window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[onClose]);
  const isPdf = kind === 'pdf';
  // Render PDFs through Google's docs viewer so they preview inline regardless of the source
  // CDN's Content-Disposition header (which would otherwise force a download).
  const pdfSrc = isPdf ? `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true` : null;
  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 text-white/80 hover:text-white text-2xl leading-none">✕</button>
      <div className="flex flex-col items-center" onClick={e=>e.stopPropagation()}>
        {isPdf
          ? <iframe src={pdfSrc} title={name} className="bg-white rounded shadow-2xl" style={{ width:'min(92vw, 1100px)', height:'82vh', border:0 }} />
          : <img src={url} alt={name} className="max-w-[92vw] max-h-[82vh] object-contain rounded shadow-2xl" />}
        <div className="text-white text-xs mt-3 bg-black/40 px-3 py-1 rounded flex items-center gap-3">
          <span className="font-medium truncate max-w-[60vw]">{name}</span>
          <a href={url} target="_blank" rel="noopener" className="underline hover:text-white">Open original ↗</a>
          <span className="text-white/60">Esc to close</span>
        </div>
      </div>
    </div>
  );
}

    <div className="fixed inset-0 bg-black/40 flex items-start justify-center p-4 z-50 overflow-y-auto" onClick={onClose}>
      <div className={`bg-white rounded-2xl shadow-xl w-full ${widthCls} my-8 flex flex-col max-h-[calc(100vh-4rem)]`} onClick={e=>e.stopPropagation()}>

/* ----------------------- Login ----------------------- */
function LoginScreen(){

/* ----------------------- Generic activity thread (leads + dept jobs) ----------------------- */
function ThreadBody({ profile, profiles, table, match, scope, titleText, onBack, afterChange, onOpenSource, openSourceLabel, embedded, headerless }){
  const [rows,setRows]=useState(null); const [text,setText]=useState('');
  const [pending,setPending]=useState([]); // unposted attachments for the next comment
  const [reading,setReading]=useState(false); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  async function load(){
    let q = sb.from(table).select('*'); Object.entries(match).forEach(([k,v])=>{ q=q.eq(k,v); });
    const { data, error } = await q.order('created_at',{ ascending:true });
    if(error){ setErr(error.message); return; } setRows(data||[]);
    const unread=(data||[]).filter(r=>(r.mentions||[]).includes(profile.id) && !(r.read_by||[]).includes(profile.id));
    if(unread.length){ await Promise.all(unread.map(r=>sb.from(table).update({ read_by:[...(r.read_by||[]), profile.id] }).eq('id',r.id))); afterChange&&afterChange(); }
  }
  useEffect(()=>{ load(); },[JSON.stringify(match)]);
  async function pickFiles(e){
    const files=Array.from(e.target.files||[]); if(!files.length) return;
    setReading(true); setErr('');
    try{
      const metas=[]; for(const f of files){ metas.push(await uploadFile(scope, f)); }
      setPending(p=>[...p, ...metas]);
    } catch(er){ setErr('Upload failed: '+(er.message||er)); }
    finally{ setReading(false); e.target.value=''; }
  }
  async function onPasteImage(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault(); e.stopPropagation(); // prevent the bubbled wrapper handler from running too
    setReading(true); setErr('');
    try{ const meta=await uploadFile(scope, f); setPending(p=>[...p, meta]); }
    catch(er){ setErr('Upload failed: '+(er.message||er)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL:')||'').trim(); if(!url) return; const name=(prompt('Title (optional):')||url).trim(); setPending(p=>[...p,{ type:'link', name, url }]); }
  function removePending(idx){ setPending(p=>p.filter((_,i)=>i!==idx)); }
  async function post(){
    const t=text.trim(); if(!t && pending.length===0) return; setBusy(true); setErr('');
    try{ const mentions=parseMentions(t, profiles);
      // Keep `attachment` (legacy single) populated with the first item for backward read compatibility.
      const first = pending[0] || null;
      const { error } = await sb.from(table).insert({ ...match, actor_id:profile.id, type:'comment', text:t, mentions, attachment:first, attachments:pending });
      if(error) throw error; setText(''); setPending([]); await load(); afterChange&&afterChange(); }
    catch(er){ setErr(er.message||String(er)); } finally{ setBusy(false); } }
  const mentionPreview = parseMentions(text, profiles).map(id=>'@'+firstName(profiles.find(p=>p.id===id))).join(', ');
  // For each row, normalize attachments: prefer `attachments` array, fall back to legacy `attachment` single.
  function normalizeAtts(row){ if(Array.isArray(row.attachments) && row.attachments.length>0) return row.attachments; if(row.attachment) return [row.attachment]; return []; }
  return (
    <div className={`space-y-4 ${embedded?'h-full flex flex-col':''}`}>
      {!headerless && (
        <div className="flex items-center justify-between gap-2">
          <div className="text-sm font-semibold truncate">{titleText}</div>
          <div className="flex items-center gap-2 shrink-0">
            {onOpenSource && <button onClick={onOpenSource} className="text-xs px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">→ {openSourceLabel||'Open'}</button>}
            {onBack && <button onClick={onBack} className="text-xs text-indigo-600 hover:underline">← Back</button>}
          </div>
        </div>
      )}
      <div className="border rounded-lg p-3 bg-slate-50" onPaste={onPasteImage}>
        <textarea className="input min-h-[70px]" value={text} onChange={e=>setText(e.target.value)} onPaste={onPasteImage} placeholder="Leave a note. Tag with @firstname. Paste a screenshot with ⌘V." />
        {pending.length>0 && (
          <div className="mt-2 grid grid-cols-2 sm:grid-cols-3 gap-2">{pending.map((a,i)=>(
            <div key={i} className="flex items-center gap-2 p-2 bg-white border rounded text-xs"><span>{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="flex-1 truncate" title={a.name}>{a.name}</span><button onClick={()=>removePending(i)} className="text-rose-400">✕</button></div>
          ))}</div>
        )}
        <div className="flex items-center justify-between mt-2 flex-wrap gap-2">
          <div className="flex items-center gap-2 flex-wrap">
            <label className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50 cursor-pointer">📎 {reading?'…':'Attach (multi)'}<input type="file" multiple accept="image/*,.pdf,application/pdf" className="hidden" onChange={pickFiles} disabled={reading} /></label>
            <button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50">🔗 Link</button>
            <span className="text-[10px] text-slate-400">or paste · ⌘V</span>
            <span className="text-[11px] text-slate-500">{mentionPreview?'Will notify: '+mentionPreview:'Tag with @firstname'}</span>
          </div>
          <button onClick={post} disabled={busy||(!text.trim()&&pending.length===0)} className="text-xs px-3 py-1.5 rounded bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Posting…':'Post comment'}</button>
        </div>
      </div>
      {err && <div className="text-xs text-rose-600">{err}</div>}
      <div className={`space-y-2 ${embedded?'flex-1 overflow-y-auto':'max-h-96 overflow-y-auto'}`}>
        {rows===null && <div className="text-center text-sm text-slate-400 py-4">Loading…</div>}
        {rows && rows.length===0 && <div className="text-center text-sm text-slate-400 py-6 border rounded-lg border-dashed">No activity yet.</div>}
        {rows && rows.slice().reverse().map(a=>{ const actor=profiles.find(p=>p.id===a.actor_id); const atts=normalizeAtts(a);
          if(a.type==='system') return <div key={a.id} className="text-[11px] text-slate-400 italic px-2">{a.text} · {fmtTime(a.created_at)}</div>;
          return (<div key={a.id} className="flex items-start gap-3 p-3 rounded-lg bg-white border"><Avatar profile={actor} size="sm" /><div className="flex-1 min-w-0"><div className="flex items-baseline gap-2"><span className="font-medium text-sm">{actor?.name||'Unknown'}</span><span className="text-[11px] text-slate-500">{fmtTime(a.created_at)}</span></div><div className="mt-1 text-sm whitespace-pre-wrap">{renderCommentText(a.text, profiles)}</div>{atts.length>0 && <div className="mt-2 flex flex-col gap-2 items-start">{atts.map((att,i)=><InlineAttachment key={i} att={att} />)}</div>}</div></div>);
        })}
      </div>
    </div>
  );
}
function Thread(props){
  return (
    <Modal title="Activity" onClose={props.onClose}>
      <ThreadBody {...props} />
    </Modal>
  );
}

/* ----------------------- Lead form ----------------------- */
function LeadForm({ profile, profiles, clients, existing, onClose, onSaved }){
  const isEdit=!!existing;
  const [clientMode,setClientMode]=useState(isEdit?'existing':(clients.length?'existing':'new'));
  const [clientId,setClientId]=useState(existing?.client_id||clients[0]?.id||'');
  const [newCompany,setNewCompany]=useState(''); const [newContact,setNewContact]=useState('');
  const [title,setTitle]=useState(existing?.title||''); const [stage,setStage]=useState(existing?.stage||'new');
  const [expectedClose,setExpectedClose]=useState(existing?.expected_close||''); const [deliveryDate,setDeliveryDate]=useState(existing?.delivery_date||'');
  const [creationDate,setCreationDate]=useState(existing?.created_at ? String(existing.created_at).slice(0,10) : new Date().toISOString().slice(0,10));
  const [poNumber,setPoNumber]=useState(existing?.po_number||''); const [techpackNumber,setTechpackNumber]=useState(existing?.techpack_number||'');
  const [leadSource,setLeadSource]=useState(existing?.lead_source||'');
  const [managerId,setManagerId]=useState(existing?.manager_id||profile.id);
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const [manualValue,setManualValue]=useState(isEdit&&(!existing.items||existing.items.length===0)?String(existing.value||''):'');
  const [items,setItems]=useState((existing?.items&&existing.items.length)?existing.items.map((it,i)=>({ id:'i'+i, itemType:it.itemType||'', category:it.category||'', quantity:String(it.quantity||''), pricePerItem:String(it.pricePerItem||''), withVat:!!it.withVat })):[{ id:'i0', itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]);
  const [attachments,setAttachments]=useState(existing?.attachments||[]); const [reading,setReading]=useState(false);
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const subtotal=items.reduce((s,it)=>s+(Number(it.quantity)||0)*(Number(it.pricePerItem)||0),0);
  const vat=items.reduce((s,it)=>{ const l=(Number(it.quantity)||0)*(Number(it.pricePerItem)||0); return s+(it.withVat?l*0.12:0); },0);
  const total=subtotal+vat; const hasItems=items.some(it=>(Number(it.quantity)||0)>0&&(Number(it.pricePerItem)||0)>0); const value=hasItems?total:(Number(manualValue)||0);
  function setItem(idx,k,v){ setItems(items.map((it,i)=>i===idx?{...it,[k]:v}:it)); }
  function addItem(){ setItems([...items,{ id:'i'+Date.now(), itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]); }
  function removeItem(idx){ setItems(items.length===1?[{ id:'i'+Date.now(), itemType:'', category:'', quantity:'', pricePerItem:'', withVat:false }]:items.filter((_,i)=>i!==idx)); }
  async function addPhoto(e){ const file=e.target.files[0]; if(!file) return; setReading(true); setMsg('');
    try{ const meta = await uploadFile('leads/'+(existing?.id||'misc'), file); setAttachments(a=>[...a, meta]); } catch(err){ setMsg('Upload failed: '+(err.message||err)); } finally{ setReading(false); e.target.value=''; } }
  async function onPasteLead(e){
    const f = getPastedImage(e); if(!f) return;
    e.preventDefault();
    setReading(true); setMsg('');
    try{ const meta = await uploadFile('leads/'+(existing?.id||'misc'), f); setAttachments(a=>[...a, meta]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL (https://…):')||'').trim(); if(!url) return; const name=(prompt('Link title (optional):')||url).trim(); setAttachments(a=>[...a,{ type:'link', name, url }]); }
  function removeAtt(idx){ setAttachments(a=>a.filter((_,i)=>i!==idx)); }
  async function save(){ if(!title.trim()){ setMsg('Lead title is required.'); return; } setBusy(true); setMsg('');
    try{ let finalClientId=clientId;
      if(clientMode==='new'){ if(!newCompany.trim()){ setMsg('New client needs a company.'); setBusy(false); return; }
        const {data,error}=await sb.from('clients').insert({ company:newCompany.trim(), contact:newContact.trim(), manager_id:profile.id }).select().single(); if(error) throw error; finalClientId=data.id; }
      const finalItems=items.filter(it=>it.itemType&&(Number(it.quantity)||0)>0).map(it=>{ const qty=Number(it.quantity), price=Number(it.pricePerItem)||0, sub=qty*price, v=it.withVat?sub*0.12:0; return { itemType:it.itemType, category:it.category||'—', quantity:qty, pricePerItem:price, withVat:!!it.withVat, lineTotal:sub+v }; });
      const payload={ client_id:finalClientId||null, title:title.trim(), value, subtotal_amount:hasItems?subtotal:value, vat_amount:hasItems?vat:0, stage, expected_close:expectedClose||null, delivery_date:deliveryDate||null, po_number:poNumber.trim(), techpack_number:techpackNumber.trim(), items:finalItems, attachments, lead_source:leadSource||'', manager_id: managerId||null, created_at: creationDate ? new Date(creationDate+'T00:00:00').toISOString() : new Date().toISOString(), won_at: SOLD_STAGES.includes(stage) ? (existing?.won_at || new Date().toISOString().slice(0,10)) : (existing?.won_at||null) };
      if(isEdit){ const {error}=await sb.from('leads').update(payload).eq('id',existing.id); if(error) throw error;
        if(existing.stage!==stage){ await sb.from('lead_activity').insert({ lead_id:existing.id, actor_id:profile.id, type:'system', text:`Moved to "${stageMeta(stage).label}"` }); } }
      else { const {data,error}=await sb.from('leads').insert(payload).select().single(); if(error) throw error;
        await sb.from('lead_activity').insert({ lead_id:data.id, actor_id:profile.id, type:'system', text:'Created the lead' }); }
      onSaved();
    } catch(err){ setMsg(err.message||String(err)); setBusy(false); } }
  return (
    <Modal title={isEdit?'Edit lead':'New lead'} onClose={onClose}>
      <div className="space-y-3" onPaste={onPasteLead}>
        {!isEdit && (<div className="flex gap-2 text-xs"><button onClick={()=>setClientMode('existing')} disabled={!clients.length} className={`flex-1 py-2 rounded-lg border font-medium ${clientMode==='existing'?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600'} disabled:opacity-40`}>Existing client</button><button onClick={()=>setClientMode('new')} className={`flex-1 py-2 rounded-lg border font-medium ${clientMode==='new'?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600'}`}>+ New client</button></div>)}
        {clientMode==='existing' ? (<select className="input" value={clientId} onChange={e=>setClientId(e.target.value)}>{clients.map(c=><option key={c.id} value={c.id}>{c.company}</option>)}</select>) : (<div className="grid grid-cols-2 gap-2"><input className="input" placeholder="Company" value={newCompany} onChange={e=>setNewCompany(e.target.value)} /><input className="input" placeholder="Contact name" value={newContact} onChange={e=>setNewContact(e.target.value)} /></div>)}
        <input className="input" placeholder="Lead title" value={title} onChange={e=>setTitle(e.target.value)} />
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Line items</div><button onClick={addItem} className="text-xs text-indigo-600 hover:underline font-medium">+ Add item</button></div>
          <div className="space-y-2">{items.map((it,idx)=>(
            <div key={it.id} className="bg-white border rounded p-2 grid grid-cols-12 gap-2 items-end">
              <div className="col-span-4"><label className="text-[10px] text-slate-500 uppercase">Item</label><input className="input mt-0.5" value={it.itemType} onChange={e=>setItem(idx,'itemType',e.target.value)} placeholder="e.g. Jacket" /></div>
              <div className="col-span-3"><label className="text-[10px] text-slate-500 uppercase">Category</label><select className="input mt-0.5" value={it.category} onChange={e=>setItem(idx,'category',e.target.value)}><option value="">—</option>{ITEM_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5" value={it.quantity} onChange={e=>setItem(idx,'quantity',e.target.value)} /></div>
              <div className="col-span-2"><label className="text-[10px] text-slate-500 uppercase">Price ₱</label><input type="number" className="input mt-0.5" value={it.pricePerItem} onChange={e=>setItem(idx,'pricePerItem',e.target.value)} /></div>
              <div className="col-span-1 text-right"><button onClick={()=>removeItem(idx)} className="text-rose-400 text-sm">✕</button></div>
              <div className="col-span-12"><label className="flex items-center gap-1.5 text-[11px] cursor-pointer"><input type="checkbox" checked={it.withVat} onChange={e=>setItem(idx,'withVat',e.target.checked)} /><span className={it.withVat?'text-emerald-700':'text-slate-500'}>With VAT 12%</span></label></div>
            </div>))}
          </div>
          {hasItems && (<div className="mt-3 pt-2 border-t text-sm space-y-1"><div className="flex justify-between text-slate-500"><span>Subtotal</span><span>{peso(subtotal)}</span></div><div className="flex justify-between text-slate-500"><span>VAT 12%</span><span>{peso(vat)}</span></div><div className="flex justify-between font-bold pt-1 border-t"><span>Total</span><span>{peso(total)}</span></div></div>)}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-[10px] text-slate-500 uppercase">{hasItems?'Value (auto)':'Value ₱ (manual)'}</label><input className={`input mt-0.5 ${hasItems?'bg-slate-100 text-slate-500':''}`} type="number" disabled={hasItems} value={hasItems?total:manualValue} onChange={e=>setManualValue(e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Stage</label><select className="input mt-0.5" value={stage} onChange={e=>setStage(e.target.value)}>{STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Due Date</label><input type="date" className="input mt-0.5" value={expectedClose||''} onChange={e=>setExpectedClose(e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Sample Due Date</label><input type="date" className="input mt-0.5" value={deliveryDate||''} onChange={e=>setDeliveryDate(e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Creation Date</label><input type="date" className="input mt-0.5" value={creationDate||''} onChange={e=>setCreationDate(e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">PO Number</label><input className="input mt-0.5" value={poNumber} onChange={e=>setPoNumber(e.target.value)} placeholder="Client's PO #" /></div>

            <select className="input mt-0.5" value={leadSource} onChange={e=>setLeadSource(e.target.value)}>

              {LEAD_SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>

            <label className="text-[10px] text-slate-500 uppercase">Sales Manager</label>

              <option value="">— Unassigned —</option>

            </select>
          </div>
        </div>
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Attachments <span className="text-slate-400 font-normal">· paste screenshots with ⌘V</span></div><div className="flex gap-1"><label className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50 cursor-pointer">📎 {reading?'Uploading…':'Photo / PDF'}<input type="file" accept="image/*,.pdf,application/pdf" className="hidden" onChange={addPhoto} disabled={reading} /></label><button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white hover:bg-slate-50">🔗 Link</button></div></div>
          {attachments.length===0?<div className="text-xs text-slate-400">No attachments yet — drop or paste an image here.</div>:(<div className="grid grid-cols-3 gap-2">{attachments.map((a,i)=>(<div key={i} className="bg-white border rounded p-1.5 flex items-center gap-2"><span className="text-lg">{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="flex-1 min-w-0 text-xs truncate" title={a.name}>{a.name}</span><button onClick={()=>removeAtt(i)} className="text-rose-400 text-xs">✕</button></div>))}</div>)}
        </div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save changes':'Create lead')}</button>
      </div>
    </Modal>
  );
}

/* ----------------------- Send-to-Graphic chooser ----------------------- */
function SendToGraphicModal({ profile, lead, clients, onClose, onSent }){
  const [chosen,setChosen]=useState({}); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const atts=lead.attachments||[]; const client=clients.find(c=>c.id===lead.client_id);
  async function send(){ setBusy(true); setMsg('');
    try{ const chosenAtts=atts.filter((_,i)=>chosen[i]);

/* Pick which attachments from a sales lead (lead + its activity thread) to forward to Printing. */
function SendLeadToPrintingModal({ profile, lead, client, onClose, onSent }){
  const [available,setAvailable]=useState([]);
  const [picked,setPicked]=useState(new Set());
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [note,setNote]=useState('');

  useEffect(()=>{
    let on=true;
    (async()=>{
      try{
        const all=[];
        // 1) Lead-level attachments
        if(Array.isArray(lead.attachments)){
          lead.attachments.forEach((a,i)=>{ if(a) all.push({ ...a, _src:'Lead', _key:'lead-'+i }); });
        }
        // 2) Activity-thread attachments on this lead
        const { data:acts, error:aerr } = await sb.from('lead_activity')
          .select('id,text,attachments,attachment,created_at')
          .eq('lead_id', lead.id)
          .order('created_at',{ ascending:true });
        if(aerr) throw aerr;
        (acts||[]).forEach(a=>{
          const list = Array.isArray(a.attachments)&&a.attachments.length ? a.attachments : (a.attachment?[a.attachment]:[]);
          list.forEach((att,j)=>{ if(att) all.push({ ...att, _src:'Activity', _key:'act-'+a.id+'-'+j }); });
        });
        // Dedupe by url/path
        const seen=new Set(); const out=[];
        all.forEach(a=>{ const k=String(a.url||a.path||a.name||''); if(!k){ out.push(a); return; } if(!seen.has(k)){ seen.add(k); out.push(a); } });
        if(on){ setAvailable(out); setLoading(false); }
      }catch(e){ if(on){ setErr('Could not load attachments: '+(e.message||e)); setLoading(false); } }
    })();
    return ()=>{on=false;};
  },[lead.id]);

  function toggle(k){ setPicked(p=>{ const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n; }); }
  function pickAll(){ setPicked(new Set(available.map(a=>a._key))); }
  function pickNone(){ setPicked(new Set()); }

  async function send(){
    if(picked.size===0 && !confirm('No files selected. Send to Printing anyway?')) return;
    setBusy(true); setErr('');
    try{
      const atts = available.filter(a=>picked.has(a._key)).map(({ _src, _key, ...rest })=>rest);
      const qty = Array.isArray(lead.items)&&lead.items.length
        ? lead.items.reduce((s,it)=>s+(Number(it.quantity)||0),0)
        : 0;
      const payload = {
        number: 'PR-P-'+Date.now().toString().slice(-5),
        source_job_id: null,
        lead_id: lead.id,
        client_name: client?.company || lead.client_name || '',
        item: lead.title || '',
        items: lead.items || [],
        quantity: qty,
        attachments: atts,
        status: 'to do',
        due_date: lead.delivery_date || lead.expected_close || null,
        notes: (note? note+'\n\n':'')+'Sent from Sales Pipeline (Sampling stage) — lead: '+(lead.title||'')
      };
      const { error } = await sb.from('printing_jobs').insert(payload);
      if(error) throw error;
      setBusy(false);
      onSent(atts.length);
    }catch(e){ setBusy(false); setErr(e.message||String(e)); }
  }

  return (
    <Modal title="🖨 Send to Printing" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="rounded-lg bg-slate-50 border p-3 text-sm">
          <div className="font-semibold">{lead.title||'—'}</div>
          <div className="text-xs text-slate-500 mt-0.5">{client?.company||lead.client_name||'—'}{lead.delivery_date?` · sample due ${fmtDate(lead.delivery_date)}`:''}</div>
        </div>
        <div>
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
            <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider">
              Attachments to send {available.length>0 && <span className="text-slate-400">({picked.size}/{available.length} selected)</span>}
            </div>
            {available.length>0 && (
              <div className="flex gap-2 text-xs">
                <button type="button" onClick={pickAll} className="text-indigo-600 hover:underline">Select all</button>
                <span className="text-slate-300">·</span>
                <button type="button" onClick={pickNone} className="text-slate-500 hover:underline">Clear</button>
              </div>
            )}
          </div>
          {loading && <div className="text-sm text-slate-400 p-6 text-center border rounded-lg">Loading attachments…</div>}
          {!loading && available.length===0 && (
            <div className="text-sm text-slate-500 p-6 border rounded-lg text-center bg-slate-50">
              No attachments on this lead or its activity thread yet.<br/>
              <span className="text-xs">You can still send the card to Printing — it will arrive without files.</span>
            </div>
          )}
          {!loading && available.length>0 && (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-[55vh] overflow-y-auto pr-1">
              {available.map(a=>{
                const checked=picked.has(a._key);
                const srcColor = a._src==='Lead'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700';
                return (
                  <button type="button" key={a._key} onClick={()=>toggle(a._key)} className={`text-left border rounded-lg overflow-hidden bg-white hover:bg-slate-50 transition ${checked?'ring-2 ring-indigo-500 border-indigo-500':'border-slate-200'}`}>
                    <div className="relative">
                      <AttachmentChip att={a} />
                      <div className={`absolute top-1 left-1 w-5 h-5 rounded border-2 flex items-center justify-center text-xs font-bold ${checked?'bg-indigo-600 border-indigo-600 text-white':'bg-white/90 border-slate-300'}`}>{checked?'✓':''}</div>
                    </div>
                    <div className="p-2 text-[11px]">
                      <div className="font-medium truncate" title={a.name}>{a.name||'attachment'}</div>
                      <div className="mt-1"><span className={`inline-block text-[9px] uppercase px-1.5 py-0.5 rounded font-semibold ${srcColor}`}>{a._src}</span></div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        <div>
          <div className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Note for Printing (optional)</div>
          <textarea className="input min-h-[60px]" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Sublimation only, use Pantone 186C for red panels" />
        </div>
        {err && <div className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded p-2">{err}</div>}
        <div className="flex justify-end gap-2 pt-3 border-t">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-slate-600 text-sm">Cancel</button>
          <button disabled={busy||loading} onClick={send} className="px-4 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700 disabled:opacity-50">{busy?'Sending…':`🖨 Send ${picked.size} file${picked.size===1?'':'s'} to Printing`}</button>
        </div>
      </div>
    </Modal>
  );
}

/* ----------------------- Dept job form ----------------------- */
function DeptJobForm({ profile, table, statuses, graphicTypes, existing, onClose, onSaved }){
  const isEdit=!!existing;
  const [f,setF]=useState(existing?{ ...existing, attachments:existing.attachments||[] }:{ client_name:'', item:'', quantity:0, status:statuses[0].key, graphic_type:'', due_date:'', notes:'', attachments:[] });
  const [reading,setReading]=useState(false); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  function up(k,v){ setF(p=>({...p,[k]:v})); }
  async function addPhoto(e){ const file=e.target.files[0]; if(!file) return; setReading(true); setMsg('');
    try{ up('attachments',[...(f.attachments||[]), await uploadFile('dept/'+(existing?.id||'new'), file)]); } catch(err){ setMsg('Upload failed: '+(err.message||err)); } finally{ setReading(false); e.target.value=''; } }
  async function onPasteDept(e){
    const file = getPastedImage(e); if(!file) return;
    e.preventDefault();
    setReading(true); setMsg('');
    try{ up('attachments',[...(f.attachments||[]), await uploadFile('dept/'+(existing?.id||'new'), file)]); }
    catch(err){ setMsg('Upload failed: '+(err.message||err)); }
    finally{ setReading(false); }
  }
  function addLink(){ const url=(prompt('Link URL:')||'').trim(); if(!url) return; const name=(prompt('Title (optional):')||url).trim(); up('attachments',[...(f.attachments||[]),{ type:'link', name, url }]); }
  function removeAtt(idx){ up('attachments',(f.attachments||[]).filter((_,i)=>i!==idx)); }
  async function save(){ if(!f.client_name&&!f.item){ setMsg('Client or item required.'); return; } setBusy(true); setMsg('');
    try{ const payload={ client_name:f.client_name, item:f.item, quantity:Number(f.quantity)||0, status:f.status, graphic_type:f.graphic_type||'', due_date:f.due_date||null, notes:f.notes||'', attachments:f.attachments||[] };
      if(isEdit){ const {error}=await sb.from(table).update(payload).eq('id',existing.id); if(error) throw error; }
      else { const {error}=await sb.from(table).insert({ ...payload, number:(table==='printing_jobs'?'PR-P-':'GD-')+Date.now().toString().slice(-5) }); if(error) throw error; }
      onSaved(); } catch(err){ setMsg(err.message||String(err)); setBusy(false); } }
  return (
    <Modal title={isEdit?'Edit job':'New job'} onClose={onClose}>
      <div className="space-y-3" onPaste={onPasteDept}>
        <div className="grid grid-cols-2 gap-2"><div><label className="text-[10px] text-slate-500 uppercase">Client</label><input className="input mt-0.5" value={f.client_name} onChange={e=>up('client_name',e.target.value)} /></div><div><label className="text-[10px] text-slate-500 uppercase">Item</label><input className="input mt-0.5" value={f.item} onChange={e=>up('item',e.target.value)} /></div></div>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="text-[10px] text-slate-500 uppercase">Qty</label><input type="number" className="input mt-0.5" value={f.quantity} onChange={e=>up('quantity',e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Due date</label><input type="date" className="input mt-0.5" value={f.due_date||''} onChange={e=>up('due_date',e.target.value)} /></div>
          <div><label className="text-[10px] text-slate-500 uppercase">Status</label><select className="input mt-0.5" value={f.status} onChange={e=>up('status',e.target.value)}>{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></div>
        </div>
        {graphicTypes && (<div><label className="text-[10px] text-slate-500 uppercase">Graphic request</label><select className="input mt-0.5" value={f.graphic_type} onChange={e=>up('graphic_type',e.target.value)}><option value="">—</option>{graphicTypes.map(t=><option key={t} value={t}>{t}</option>)}</select></div>)}
        <div className="border rounded-lg p-3 bg-slate-50">
          <div className="flex items-center justify-between mb-2"><div className="text-xs font-semibold text-slate-700">Attachments</div><div className="flex gap-1"><label className="text-xs px-2 py-1 rounded border bg-white cursor-pointer">📎 {reading?'…':'Photo / PDF'}<input type="file" accept="image/*,.pdf,application/pdf" className="hidden" onChange={addPhoto} disabled={reading} /></label><button onClick={addLink} className="text-xs px-2 py-1 rounded border bg-white">🔗 Link</button></div></div>
          {(f.attachments||[]).length===0?<div className="text-xs text-slate-400">No attachments.</div>:(<div className="grid grid-cols-3 gap-2">{f.attachments.map((a,i)=>(<div key={i} className="bg-white border rounded p-1.5 flex items-center gap-2"><span className="text-lg">{a.type==='image'?'🖼️':a.type==='pdf'?'📄':'🔗'}</span><span className="flex-1 min-w-0 text-xs truncate">{a.name}</span><button onClick={()=>removeAtt(i)} className="text-rose-400 text-xs">✕</button></div>))}</div>)}
        </div>
        <div><label className="text-[10px] text-slate-500 uppercase">Notes</label><textarea className="input mt-0.5 min-h-[50px]" value={f.notes} onChange={e=>up('notes',e.target.value)} /></div>
        {msg && <div className="text-xs text-rose-600">{msg}</div>}
        <button disabled={busy} onClick={save} className="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-50">{busy?'Saving…':(isEdit?'Save':'Create')}</button>
      </div>
    </Modal>
  );
}

                    {img ? <button onClick={()=>setDetail(j)} className="block w-full"><AttachmentChip att={img} /></button> : <button onClick={()=>setDetail(j)} className="w-full h-12 bg-slate-50 flex items-center justify-center text-slate-300 text-xl">🖼️</button>}
                    <div className="p-2">
                      <div className="font-semibold text-sm leading-tight">{j.item||'—'}</div>
                      <div className="text-xs text-slate-500 truncate">{j.client_name}</div>
                      <div className="flex items-center gap-1 mt-1 flex-wrap">
                        {j.graphic_type && <span className="inline-block text-[9px] uppercase px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 font-semibold">{j.graphic_type}</span>}
                        {hasTp && openTechpack && <button onClick={(e)=>{e.stopPropagation(); openTechpack(lead);}} className="inline-flex items-center gap-1 text-[9px] uppercase px-1.5 py-0.5 rounded bg-teal-100 text-teal-700 font-semibold hover:bg-teal-200" title={'View techpack '+(lead.techpack_number||'')}>📋 Techpack</button>}
                      </div>
                      <div className="flex items-center justify-between mt-1 text-[11px]"><span className="text-slate-600">{j.quantity?j.quantity+' pcs':''}{(j.attachments||[]).length?` · 📎${j.attachments.length}`:''}</span><span className={di.cls}>{di.label}</span></div>
                      <div className="flex items-center gap-1 mt-2">
                        <select value={j.status} onChange={e=>move(j,e.target.value)} className="text-[11px] border rounded px-1 py-0.5 flex-1 bg-slate-50">{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
                        {canSendToPrinting && <button onClick={()=>sendToPrinting(j)} title="Send to Printing" className="text-purple-600 text-xs px-1">🖨</button>}
                      </div>
                      {openLead && (
                        lead
                          ? <button onClick={(e)=>{e.stopPropagation(); openLead(lead);}} className="w-full mt-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium">Open lead</button>
                          : <div className="w-full mt-2 py-1.5 rounded-lg bg-slate-50 text-slate-300 text-xs font-medium text-center cursor-not-allowed" title="This job isn't linked to a sales lead">No linked lead</div>
                      )}
                    </div>
                  </div>
                ); })}
                {col.length===0 && <div className="text-[10px] text-slate-400 text-center py-3">—</div>}
              </div>
            </div>
          ); })}
        </div>
      )}

      {layout==='table' && (
        <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Ref</th><th className="text-left px-3 py-2">Client</th><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Qty</th><th className="text-left px-3 py-2">Status</th><th className="text-left px-3 py-2">Deadline</th><th></th></tr></thead>
          <tbody>{filtered.map(j=>{ const di=deadlineInfo(j.due_date, doneStatuses.includes(j.status)); const meta=metaFrom(statuses,j.status); const lead=j.lead_id?(leads||[]).find(l=>l.id===j.lead_id):null; return (
            <tr key={j.id} className={`border-t hover:bg-slate-50 ${di.overdue?'bg-rose-50/40':''}`}>
              <td className="px-3 py-2 font-mono text-xs">{j.number}</td><td className="px-3 py-2">{j.client_name}</td>
              <td className="px-3 py-2 font-medium">{j.item}{j.graphic_type && <span className="ml-1 text-[9px] uppercase px-1 py-0.5 rounded bg-indigo-100 text-indigo-700">{j.graphic_type}</span>}{(j.attachments||[]).length?<span className="text-[10px] text-slate-400"> 📎{j.attachments.length}</span>:''}</td>
              <td className="px-3 py-2 text-right">{j.quantity||'—'}</td>
              <td className="px-3 py-2"><select value={j.status} onChange={e=>move(j,e.target.value)} className={`text-xs px-2 py-1 rounded font-medium border-0 ${meta.color}`}>{statuses.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></td>
              <td className="px-3 py-2"><span className={`text-xs ${di.cls}`}>{di.label||fmtDate(j.due_date)}</span></td>
              <td className="px-3 py-2 text-right whitespace-nowrap">
                <button onClick={()=>setEditing(j)} className="text-xs text-indigo-600 hover:underline mr-2">Edit</button>
                {lead && openLead && <button onClick={()=>openLead(lead)} className="text-xs text-indigo-600 hover:underline mr-2">↗ Open lead</button>}
                {lead && lead.techpack && openTechpack && <button onClick={()=>openTechpack(lead)} className="text-xs text-teal-700 hover:underline mr-2">📋 Techpack</button>}
                {canSendToPrinting && <button onClick={()=>sendToPrinting(j)} className="text-xs text-purple-700 hover:underline mr-2">🖨 Printing</button>}
                <button onClick={()=>del(j.id)} className="text-xs text-rose-500 hover:underline">Delete</button>
              </td>
            </tr>
          ); })}
          {filtered.length===0 && <tr><td colSpan="7" className="text-center text-slate-400 py-8">Nothing here yet. Click + New, or items arrive via Send-to handoffs.</td></tr>}
          </tbody></table></div></div>
      )}

      {(creating||editing) && <DeptJobForm profile={profile} table={table} statuses={statuses} graphicTypes={graphicTypes} existing={editing} onClose={()=>{ setCreating(false); setEditing(null); }} onSaved={()=>{ setCreating(false); setEditing(null); reload(); }} />}
      {liveDetail && (() => { const detailLead=liveDetail.lead_id?(leads||[]).find(l=>l.id===liveDetail.lead_id):null; const hasTechpack=detailLead && detailLead.techpack; const statusMeta=metaFrom(statuses,liveDetail.status); return (
        <Modal title={`${title} — ${liveDetail.number||''}`} onClose={()=>setDetail(null)} xwide>
          <div className="grid md:grid-cols-5 gap-5">
            {/* Left: job info + actions (3 cols) */}
            <div className="md:col-span-3 space-y-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-lg font-bold truncate">{liveDetail.item||'—'}</div>
                  <div className="text-sm text-slate-500 truncate">{liveDetail.client_name||'—'}</div>
                </div>
                <span className={`text-xs px-2 py-1 rounded font-medium ${statusMeta.color}`}>{statusMeta.label}</span>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm">
                <div><div className="text-[10px] uppercase text-slate-400">Qty</div><div>{liveDetail.quantity||'—'}</div></div>
                <div><div className="text-[10px] uppercase text-slate-400">Deadline</div><div>{fmtDate(liveDetail.due_date)||'—'}</div></div>
                {liveDetail.graphic_type && <div><div className="text-[10px] uppercase text-slate-400">Graphic request</div><div>{liveDetail.graphic_type}</div></div>}
                <div><div className="text-[10px] uppercase text-slate-400">Ref</div><div className="font-mono text-xs">{liveDetail.number||'—'}</div></div>
              </div>
              {/* Techpack section */}
              {openTechpack && (
                <div className={`border rounded-lg p-3 ${hasTechpack?'bg-teal-50 border-teal-200':'bg-slate-50 border-slate-200'}`}>
                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-[10px] uppercase text-slate-400">Techpack</div>
                      {detailLead ? (
                        hasTechpack ? (
                          <div className="text-sm font-semibold text-teal-700 mt-0.5">📋 {detailLead.techpack_number||'Techpack ready'} · {detailLead.title}</div>
                        ) : (
                          <div className="text-sm text-slate-500 mt-0.5">Linked lead "<span className="font-medium">{detailLead.title}</span>" has no techpack yet.</div>
                        )
                      ) : (
                        <div className="text-sm text-slate-400 mt-0.5">This job isn't linked to a sales lead — no techpack to view.</div>
                      )}
                    </div>
                    {hasTechpack && <button onClick={()=>openTechpack(detailLead)} className="shrink-0 py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 View techpack</button>}
                  </div>
                </div>
              )}
              {(liveDetail.attachments||[]).length>0 && <div><div className="text-[10px] uppercase text-slate-400 mb-1">Attachments</div><div className="flex flex-wrap gap-2">{liveDetail.attachments.map((a,i)=><AttachmentChip key={i} att={a} small />)}</div></div>}
              {liveDetail.notes && <div><div className="text-[10px] uppercase text-slate-400 mb-1">Notes</div><div className="text-sm bg-slate-50 border rounded p-2 whitespace-pre-wrap">{liveDetail.notes}</div></div>}
              <div className="flex gap-2 pt-2 border-t flex-wrap">
                {hasTechpack && <button onClick={()=>openTechpack(detailLead)} className="py-2 px-3 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700">📋 Techpack</button>}
                <button onClick={()=>{ setEditing(liveDetail); setDetail(null); }} className="py-2 px-3 rounded-lg border text-sm hover:bg-slate-50">✎ Edit</button>
                {canSendToPrinting && <button onClick={()=>{ sendToPrinting(liveDetail); setDetail(null); }} className="py-2 px-3 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700">🖨 Send to Printing</button>}
                <button onClick={()=>setDetail(null)} className="py-2 px-3 rounded-lg text-slate-500 text-sm hover:text-slate-800">Close</button>
              </div>
            </div>
            {/* Right: live activity (2 cols) — scoped to THIS dept job; no lead chatter bleeds in */}
            <div className="md:col-span-2 border-l md:pl-5 -mr-2 md:-mr-0 min-h-0">
              <div className="mb-3">
                <div className="text-xs uppercase tracking-wider text-slate-500 font-semibold">💬 {title} conversation</div>
                <div className="text-[10px] text-slate-400 mt-0.5">Private to the {title.toLowerCase()} team — the sales lead's chat is not shown here.</div>
              </div>
              <ThreadBody profile={profile} profiles={profiles} table="dept_job_activity" match={{ job_id: liveDetail.id, job_type: jobType }} scope={'dept/'+liveDetail.id} titleText={`${liveDetail.item} · ${liveDetail.client_name}`} afterChange={reload} headerless embedded />
            </div>
          </div>
        </Modal>
      ); })()}
    </div>
  );
}

/* ----------------------- Production board ----------------------- */
function ProductionBoard({ profile, profiles, jobs, leads, reload, openActivity, openTechpack }){
  const [viewMode,setViewMode]=useState('active'); const [search,setSearch]=useState('');
  const [filterStatus,setFilterStatus]=useState(''); const [filterDeadline,setFilterDeadline]=useState('');
  const [filterOwner,setFilterOwner]=useState('');
  const [sortBy,setSortBy]=useState(()=>{ try{ return localStorage.getItem('prodSort')||'due_asc'; }catch(e){ return 'due_asc'; } });
  function changeSort(v){ setSortBy(v); try{ localStorage.setItem('prodSort',v); }catch(e){} }
  const [layout,setLayout]=useState(()=>{ try{ return localStorage.getItem('prodLayout')||'table'; }catch(e){ return 'table'; } });
  function changeLayout(v){ setLayout(v); try{ localStorage.setItem('prodLayout',v); }catch(e){} }
  const [collapsed,setCollapsed]=useState({}); // status.key -> true if collapsed
  function toggleCollapsed(k){ setCollapsed(p=>({...p,[k]:!p[k]})); }
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  const canDelete=isAdmin || !isAssistant; // admin + managers can delete; assistants cannot
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  async function changeOwner(j, ownerId){ const { error } = await sb.from('production_jobs').update({ sales_owner_id: ownerId||null }).eq('id', j.id); if(error){ alert(error.message); return; } reload(); }
  async function del(j){ if(!confirm(`Delete production job ${j.number||''} — ${j.item||''} for ${j.client_name||''}?`)) return; const { error } = await sb.from('production_jobs').delete().eq('id', j.id); if(error){ alert(error.message); return; } reload(); }
  const daysUntil=(due)=>{ if(!due) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(due+'T00:00:00')-t)/86400000); };
  const active=jobs.filter(j=>!PRODUCTION_DONE.includes(j.status));
  const overdue=active.filter(j=>deadlineInfo(j.due_date,false).overdue).length;
  const dueThisWeek=active.filter(j=>{ const d=daysUntil(j.due_date); return d!==null && d>=0 && d<=7; }).length;
  const awaiting=active.filter(j=>j.status==='materials to purchase').length;
  function compareJobs(a,b){
    if(sortBy==='due_asc' || sortBy==='due_desc'){
      // Treat missing due_date as "infinity" so it always sinks to the bottom in asc,
      // and to the top in desc (but we apply the same rule and just invert otherwise).
      const aT = a.due_date ? new Date(a.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      const bT = b.due_date ? new Date(b.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      if(aT!==bT) return sortBy==='due_asc' ? (aT-bT) : (bT-aT);
      return 0;
    }
    if(sortBy==='created_desc' || sortBy==='created_asc'){
      const aC = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bC = b.created_at ? new Date(b.created_at).getTime() : 0;
      return sortBy==='created_desc' ? (bC-aC) : (aC-bC);
    }
    return 0;
  }
  const shown=(viewMode==='active'?active:jobs.filter(j=>PRODUCTION_DONE.includes(j.status)))
    .filter(j=>!filterStatus||j.status===filterStatus)
    .filter(j=>{ if(filterDeadline==='overdue') return deadlineInfo(j.due_date,false).overdue; if(filterDeadline==='week'){ const d=daysUntil(j.due_date); return d!==null&&d>=0&&d<=7; } return true; })
    .filter(j=>{ if(filterOwner==='__mine') return j.sales_owner_id===profile.id; if(filterOwner==='__unassigned') return !j.sales_owner_id; if(filterOwner) return j.sales_owner_id===filterOwner; return true; })
    .filter(j=>!search||`${j.number} ${j.client_name} ${j.item}`.toLowerCase().includes(search.toLowerCase()))
    .slice() // don't mutate the prop
    .sort(compareJobs);
  async function move(j,st){ const {error}=await sb.from('production_jobs').update({ status:st }).eq('id',j.id); if(error){ alert(error.message); return; } reload(); }
  async function sendTo(j, table, status, label){ if(!confirm(`Send ${j.number||''} to ${label}?`)) return;
    const row={ number:(table==='printing_jobs'?'PR-P-':'GD-')+Date.now().toString().slice(-5), source_job_id:j.id, lead_id:j.lead_id||null, client_name:j.client_name, item:j.item, items:j.items||[], quantity:j.quantity||0, attachments:[], status, due_date:j.due_date||null, notes:'' };
    const {error}=await sb.from(table).insert(row); if(error){ alert(error.message); return; } alert(`Sent to ${label}.`); }
  const tile=(label,value,sub,active2,onClick)=>(
    <button onClick={onClick} className={`text-left rounded-xl border p-4 transition ${active2?'bg-indigo-600 border-indigo-600 text-white':'bg-white hover:border-indigo-300'}`}>
      <div className={`text-[11px] uppercase tracking-wide ${active2?'text-indigo-100':'text-slate-400'}`}>{label}</div>
      <div className="text-2xl font-bold mt-1">{value}</div>
      <div className={`text-xs mt-0.5 ${active2?'text-indigo-100':'text-slate-500'}`}>{sub}</div>
    </button>
  );
  return (
    <div className="p-6">
      <div className="sticky top-0 z-20 -mx-6 -mt-6 px-6 pt-5 pb-3 mb-4 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div><h1 className="text-2xl font-bold">⚙ Production Board</h1><p className="text-slate-500 text-sm">Live production tracking — every confirmed order flows through your real production stages. Monitor status and deadlines.</p></div>
          <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm"><button onClick={()=>setViewMode('active')} className={`px-3 py-1.5 rounded-md ${viewMode==='active'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>Active ({active.length})</button><button onClick={()=>setViewMode('delivered')} className={`px-3 py-1.5 rounded-md ${viewMode==='delivered'?'bg-white shadow-sm font-semibold text-emerald-700':'text-slate-600'}`}>✓ Delivered ({jobs.length-active.length})</button></div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        {tile('Active jobs', active.length, `${jobs.length-active.length} delivered`, false, ()=>{ setViewMode('active'); setFilterStatus(''); setFilterDeadline(''); })}
        {tile('Overdue', overdue, 'past due date', filterDeadline==='overdue', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='overdue'?'':'overdue'); setFilterStatus(''); })}
        {tile('Due this week', dueThisWeek, 'next 7 days', filterDeadline==='week', ()=>{ setViewMode('active'); setFilterDeadline(filterDeadline==='week'?'':'week'); setFilterStatus(''); })}
        {tile('Awaiting materials', awaiting, 'materials to purchase', filterStatus==='materials to purchase', ()=>{ setViewMode('active'); setFilterStatus(filterStatus==='materials to purchase'?'':'materials to purchase'); setFilterDeadline(''); })}
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search job#, client, item…" className="px-3 py-2 text-sm rounded-lg border border-slate-300 w-60" />
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300"><option value="">All statuses</option>{PRODUCTION_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>
        <select value={filterOwner} onChange={e=>setFilterOwner(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300">
          <option value="">All sales owners</option>
          <option value="__mine">My jobs only</option>
          <option value="__unassigned">Unassigned</option>
          <option disabled>──────────</option>
          {salesPeople.map(p=><option key={p.id} value={p.id}>{p.name||p.email}</option>)}
        </select>
        <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-xs">
          <button onClick={()=>setFilterDeadline('')} className={`px-3 py-1.5 rounded-md ${filterDeadline===''?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>All</button>
          <button onClick={()=>setFilterDeadline('overdue')} className={`px-3 py-1.5 rounded-md ${filterDeadline==='overdue'?'bg-white shadow-sm font-semibold text-rose-600':'text-slate-600'}`}>Overdue</button>
          <button onClick={()=>setFilterDeadline('week')} className={`px-3 py-1.5 rounded-md ${filterDeadline==='week'?'bg-white shadow-sm font-semibold text-amber-600':'text-slate-600'}`}>This week</button>
        </div>
        <select value={sortBy} onChange={e=>changeSort(e.target.value)} className="px-3 py-2 text-sm rounded-lg border border-slate-300 bg-white" title="Sort jobs">
          <option value="due_asc">⬆ Most urgent first (earliest due)</option>
          <option value="due_desc">⬇ Latest due first</option>
          <option value="created_desc">🆕 Newest job first</option>
          <option value="created_asc">🕒 Oldest job first</option>
        </select>
        <div className="inline-flex rounded-lg border bg-slate-100 p-0.5 text-sm" title="View style">
          <button onClick={()=>changeLayout('table')} className={`px-3 py-1.5 rounded-md ${layout==='table'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>☰ Table</button>
          <button onClick={()=>changeLayout('list')} className={`px-3 py-1.5 rounded-md ${layout==='list'?'bg-white shadow-sm font-semibold':'text-slate-600'}`}>≡ Group by status</button>
        </div>
      </div>

      {layout==='table' && (
      <div className="bg-white rounded-xl border overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-slate-50 text-xs uppercase text-slate-500"><tr><th className="text-left px-3 py-2">Ref</th><th className="text-left px-3 py-2">Client</th><th className="text-left px-3 py-2">Item</th><th className="text-right px-3 py-2">Qty</th><th className="text-left px-3 py-2">Status</th><th className={`text-left px-3 py-2 ${sortBy==='due_asc'||sortBy==='due_desc'?'text-indigo-600':''}`}>Deadline{(sortBy==='due_asc'||sortBy==='due_desc')&&<span className="ml-1">{sortBy==='due_asc'?'⬆':'⬇'}</span>}</th><th className="text-left px-3 py-2">Sales Owner</th><th></th></tr></thead>
        <tbody>{shown.map(j=>{ const di=deadlineInfo(j.due_date, PRODUCTION_DONE.includes(j.status)); const meta=metaFrom(PRODUCTION_STATUSES,j.status); const lead=j.lead_id?(leads||[]).find(l=>l.id===j.lead_id):null; const owner=j.sales_owner_id?(profiles||[]).find(p=>p.id===j.sales_owner_id):null; return (
          <tr key={j.id} className={`border-t hover:bg-slate-50 group ${di.overdue?'bg-rose-50/40':''}`}>
            <td className="px-3 py-2 font-mono text-xs">{j.number}</td><td className="px-3 py-2">{j.client_name}</td>
            <td className="px-3 py-2 font-medium">{j.item}{(j.items||[]).length>0 && <div className="text-[10px] text-slate-500">{j.items.map(it=>`${it.quantity} ${it.itemType}`).join(' · ')}</div>}</td>
            <td className="px-3 py-2 text-right">{j.quantity||'—'}</td>
            <td className="px-3 py-2"><select value={j.status} onChange={e=>move(j,e.target.value)} className={`text-xs px-2 py-1 rounded font-medium border-0 ${meta.color}`}>{PRODUCTION_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select></td>
            <td className="px-3 py-2"><span className={`text-xs ${di.cls}`}>{di.label||fmtDate(j.due_date)}</span></td>
            <td className="px-3 py-2">
              <select value={j.sales_owner_id||''} onChange={e=>changeOwner(j,e.target.value)} className="text-xs px-2 py-1 rounded border border-slate-300 bg-white max-w-[10rem]">
                <option value="">— unassigned —</option>
                {salesPeople.map(p=><option key={p.id} value={p.id}>{p.name||p.email}</option>)}
              </select>
            </td>
            <td className="px-3 py-2 text-right whitespace-nowrap">
              <button onClick={()=>openActivity({ job:j, jobType:'production', title:`${j.item} · ${j.client_name}` })} className="text-xs text-indigo-600 hover:underline mr-2">💬</button>
              {lead && lead.techpack && openTechpack && <button onClick={()=>openTechpack(lead)} className="text-xs text-teal-700 hover:underline mr-2">📋 Techpack</button>}
              {canDelete && <button onClick={()=>del(j)} className="text-xs text-rose-500 hover:underline opacity-0 group-hover:opacity-100" title="Delete production job">Delete</button>}
            </td>
          </tr>
        ); })}
        {shown.length===0 && <tr><td colSpan="8" className="text-center text-slate-400 py-8">No jobs here. Won leads arrive via "Send to Production".</td></tr>}
        </tbody></table></div></div>

/* ----------------------- Sampling board ----------------------- */
function SamplingBoard({ profile, profiles, jobs, leads, reload, openActivity, openTechpack }){
  const [viewMode,setViewMode]=useState('active'); const [search,setSearch]=useState('');
  const [filterStatus,setFilterStatus]=useState(''); const [filterDeadline,setFilterDeadline]=useState('');
  const [filterOwner,setFilterOwner]=useState('');
  const [creating,setCreating]=useState(false);
  const [sortBy,setSortBy]=useState(()=>{ try{ return localStorage.getItem('sampleSort')||'due_asc'; }catch(e){ return 'due_asc'; } });
  function changeSort(v){ setSortBy(v); try{ localStorage.setItem('sampleSort',v); }catch(e){} }
  const [layout,setLayout]=useState(()=>{ try{ return localStorage.getItem('sampleLayout')||'table'; }catch(e){ return 'table'; } });
  function changeLayout(v){ setLayout(v); try{ localStorage.setItem('sampleLayout',v); }catch(e){} }
  const [collapsed,setCollapsed]=useState({});
  function toggleCollapsed(k){ setCollapsed(p=>({...p,[k]:!p[k]})); }
  const isAdmin=profile.role==='admin';
  const isAssistant=profile.role==='assistant';
  const canDelete=isAdmin || !isAssistant;
  const salesPeople = (profiles||[]).filter(p=>p.role!=='assistant').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  // Sampling jobs don't carry their own sales_owner_id — derive it from the linked lead.
  const ownerIdFor=(j)=>{ const lead=j.lead_id?leads.find(l=>l.id===j.lead_id):null; return lead?lead.manager_id||null:null; };
  const daysUntil=(due)=>{ if(!due) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(due+'T00:00:00')-t)/86400000); };
  const active=jobs.filter(j=>!SAMPLING_DONE.includes(j.status));
  const overdue=active.filter(j=>deadlineInfo(j.due_date,false).overdue).length;
  const dueThisWeek=active.filter(j=>{ const d=daysUntil(j.due_date); return d!==null && d>=0 && d<=7; }).length;
  const endorsed=active.filter(j=>j.status==='endorsed').length;
  function compareJobs(a,b){
    if(sortBy==='due_asc' || sortBy==='due_desc'){
      const aT = a.due_date ? new Date(a.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      const bT = b.due_date ? new Date(b.due_date+'T00:00:00').getTime() : Number.POSITIVE_INFINITY;
      if(aT!==bT) return sortBy==='due_asc' ? (aT-bT) : (bT-aT);
      return 0;
    }
    if(sortBy==='created_desc' || sortBy==='created_asc'){
      const aC = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bC = b.created_at ? new Date(b.created_at).getTime() : 0;
      return sortBy==='created_desc' ? (bC-aC) : (aC-bC);
    }
    return 0;
  }

    .filter(j=>{ if(filterOwner==='__mine') return ownerIdFor(j)===profile.id; if(filterOwner==='__unassigned') return !ownerIdFor(j); if(filterOwner) return ownerIdFor(j)===filterOwner; return true; })

    .slice()
